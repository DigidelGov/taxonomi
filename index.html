tater avser att tillämpa grundläggande rättigheter i digitala sammanhang."},{"title":"Teoretisk utgångspunkt","text":"Digitala system är inte neutrala verktyg. De är resultatet av förhandlingar där vissa behov värderas, prioriteras och byggs in, medan andra faller bort. Designval avgör vilka som exkluderas, ofta utan att det synliggörs eller ifrågasätts. Denna insikt har teoretisk förankring.\n\nAkrich (1992) introducerar begreppet inskription för att beskriva hur designers skriver in antaganden i tekniska artefakter: föreställningar om vilka användarna är, vad de kan och hur de förväntas agera. Tekniken delegerar därigenom roller och handlingsutrymme till dem som möter den. Akrich visar att när den verkliga användaren inte motsvarar den föreställda uppstår förskjutning (displacement): artefaktens inbyggda scenario och den faktiska användningssituationen går isär. Rose och Blume (2003) fördjupar detta och visar att inskriptioner konfigurerar alla som möter tekniken. De val och prioriteringar som redan gjorts begränsar handlingsutrymmet, och den enskilde har inte alltid möjlighet att kompensera för det som byggts in.\n\nWinner (1980) visar att sådana designval kan ha politiska konsekvenser långt bortom den enskilda artefakten: tekniska system kan ordna mänskliga relationer på sätt som gynnar vissa grupper och utestänger andra. Feenberg (1992) argumenterar för att denna ordning inte är given. Teknikens utformning kan demokratiseras genom att de som berörs ges möjlighet att påverka designprocessen. Hedström (2004) bekräftar detta empiriskt i studier av datorisering i äldreomsorg, där hon visar hur värden som effektivitet och kontroll skrevs in i system medan omsorgspersonalens och de äldres behov fick stå tillbaka."},{"title":"Rättighetsbärare och skyldighetsbärare","text":"I människorättslig terminologi innebär denna förskjutning att ansvaret i praktiken flyttas från skyldighetsbäraren till rättighetsbäraren. Formell tillgång till teknik och digitala tjänster är inte tillräcklig. Avgörande är om systemen är utformade så att rättigheter och skyldigheter faktiskt kan utövas. En rättighet som inte kan utövas i praktiken, eller en skyldighet som inte rimligen kan fullgöras, är en systembrist.\n\nRamverket utgår från den distinktion som är grundläggande i internationell människorätt: den mellan rättighetsbärare och skyldighetsbärare. Rättighetsbärare är den enskilde – den som har rätt att utöva sina rättigheter och fullgöra sina skyldigheter. Skyldighetsbärare är det allmänna – staten, kommunen, regionen och i vissa fall privata aktörer med offentliga uppdrag – som ansvarar för att denna rätt kan utövas i praktiken.\n\nNär digitala samhällsfunktioner utformas utan att beakta den enskildes förutsättningar förskjuts ansvaret i praktiken från skyldighetsbäraren till rättighetsbäraren. Det är rättighetsbäraren som förväntas anpassa sig, skaffa teknik, lära sig systemet, hitta stöd. Ramverket synliggör var denna förskjutning sker och pekar tillbaka ansvaret dit det hör hemma."},{"title":"Globala leveranskedjor","text":"Digitala system bär också spår av de villkor under vilka de producerats. AI-modeller som används i offentlig sektor vilar till exempel på globala leveranskedjor vars arbetsförhållanden inte alltid motsvarar de rättighetskrav som systemen förväntas uppfylla. Denna version av ramverket hanterar emellertid inte den globala dimensionen."},{"title":"Ramverkets struktur","text":"Ramverket är uppdelat i tre huvudsektioner som tillsammans belyser hur systemutformning, livsvillkor och stödstrukturer samverkar.\n\n1. Systembarriärer – Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.\n\n2. Ojämlikhetsfaktorer – Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.\n\n3. Bildning, egenmakt och delaktighet – Det allmännas ansvar att upprätthålla förutsättningarna för att den enskilde ska kunna förstå, agera och delta i en digitaliserad välfärdsstat."}];
var CAT_DATA = {"1.1": {"namn": "Fragmenterad grundinfrastruktur", "ingress": "Bristande digital infrastruktur skapar ojämlika villkor och underminerar det allmännas ansvar för jämlik delaktighet.", "beskrivning": "Denna kategori omfattar fysisk och teknisk infrastruktur, där brister i utbyggnad, interoperabilitet eller marknadstillgång försvårar för det allmännas ansvar att verka för delaktighet och jämlikhet. Ramverket identifierar de strukturella konsekvenser som uppstår när marknaden inte levererar och det offentliga inte kompenserar.<br><br>Digital infrastruktur har också en energi- och resursdimension som påverkar förutsättningarna för samhällsfunktioner. Digg och PTS bedömer att det inom en snar framtid blir aktuellt att räkna på klimat- och miljöeffekter i alla nyetableringar och nya digitala projekt (Digg, PTS 2026).", "lagstod": "**Regeringsformen (RF 1 kap. 2 §)** fastställer det allmännas ansvar för att främja jämlikhet, vilket förutsätter digital infrastruktur som omfattar alla.<br>**Förvaltningslagen (2017:900)** 7 § kräver att myndigheter ska vara tillgängliga.<br>**Konsumentköplagen (2022:260)** 1 kap. 7 § omfattar digitala tjänster, även när konsumenten betalar med sina personuppgifter.", "eu": "EU-förklaringen om digitala rättigheter och principer för det digitala decenniet (2023) fastställer att alla i EU ska ha tillgång till konnektivitet med hög hastighet och till rimligt pris, inklusive personer med låga inkomster (artikel 3). Den digitala omställningen ska gagna alla och i synnerhet innefatta människor i landsbygdsområden, personer med funktionsnedsättning och marginaliserade grupper (artikel 2c). Marknadsaktörer som drar nytta av den digitala omställningen ska bidra till kostnaderna för kollektiva nyttigheter och offentliga infrastrukturer (artikel 2c). Digitala produkter och tjänster ska utformas med hänsyn till miljöpåverkan och hållbarhet (artikel 23).", "politikomraden": "Infrastrukturpolitik, regionalpolitik och konsumentpolitik."}, "1.2": {"namn": "Villkorad digital åtkomst", "ingress": "När digitala samhällsfunktioner kräver särskilda tekniska resurser riskerar tillgången att bli ojämlik.", "beskrivning": "Rättsliga, tekniska och administrativa barriärer – som krav på e-legitimation, kontokoppling eller teknisk utrustning – kan begränsa möjligheten att utöva rättigheter och fullgöra skyldigheter. Resultatet hindrar det allmänna från att uppfylla sitt ansvar för delaktighet och jämlikhet.", "lagstod": "**Regeringsformen (RF 1 kap. 2 §)** fastställer det allmännas ansvar för delaktighet och jämlikhet.<br>**Förvaltningslagen (2017:900)** 6 § kräver begriplig information, 7 § tillgänglighet och 8 § samverkan mellan myndigheter.<br>**Hälso- och sjukvårdslagen (2017:30)** 13a kap. 1 § kräver att primärvården ska vara lätt tillgänglig.<br>**Diskrimineringslagen (2008:567)** 1 kap. 4 § förbjuder indirekt diskriminering, vilket kan uppstå när teknikvillkor missgynnar vissa grupper.<br>**Lagen om tillgänglighet till digital offentlig service (2018:1937)** ställer krav på att digital offentlig service ska vara möjlig att uppfatta, hantera, begripa och robust.<br>**Europaparlamentets och rådets förordning (EU) 2022/2065 om digitala tjänster** ställer krav på transparens, ansvarsskyldighet och insyn i algoritmiska system för plattformar som förmedlar samhällsinformation.", "eu": "Alla bör erbjudas möjlighet att använda en tillgänglig, frivillig, säker och tillförlitlig digital identitet som ger tillgång till ett brett utbud av onlinetjänster (artikel 7a). Utformning, utveckling och användning av tekniska lösningar ska respektera de grundläggande rättigheterna och göra det möjligt att utöva dessa (artikel 2a). Den digitala omställningen ska i synnerhet innefatta äldre, personer med funktionsnedsättning och marginaliserade grupper, ingen ska lämnas utanför (artikel 2b). Digitala offentliga tjänster ska vara sömlösa, säkra och interoperabla, i synnerhet digitala hälso- och sjukvårdstjänster (artikel 7c).", "politikomraden": "Förvaltningspolitik och socialpolitik."}, "1.3": {"namn": "Digitalt som enda val", "ingress": "När samhällsfunktioner enbart erbjuds digitalt utan att beakta människors olika förutsättningar riskerar det digitala att bli ett filter snarare än en bro.", "beskrivning": "", "lagstod": "**Regeringsformen (RF 1 kap. 2 §)** fastställer det allmännas ansvar för delaktighet och jämlikhet.<br>**Förvaltningslagen (2017:900)** 6 § kräver begriplig information, 7 § tillgänglighet och 8 § rätt till biträde när det behövs.<br>**Hälso- och sjukvårdslagen (2017:30)** 3 kap. 1 § fastställer vård på lika villkor och behovsbaserad prioritering, 13a kap. 1 § kräver att primärvården ska vara lätt tillgänglig.<br>**Socialtjänstlagen (2025:400)** 8 kap. 10 § fastställer att personer med funktionsnedsättning ska ges möjlighet att delta i samhällets gemenskap.<br>**Lagen om tillgänglighet till digital offentlig service (2018:1937)** ställer krav på att digital offentlig service ska vara möjlig att uppfatta, hantera, begripa och robust.", "eu": "Den digitala omställningen bör inte innebära en tillbakagång vad gäller rättigheter, och förklaringen påverkar inte rätten till tillgång till viktiga offentliga samhällsfunktioner offline (ingressen, punkt 3). Alla bör ha tillgång online till viktiga offentliga tjänster i hela EU (artikel 7).", "politikomraden": "Förvaltningspolitik och socialpolitik."}, "1.4": {"namn": "Digital otrygghet och otydlighet", "ingress": "Otransparenta tekniska miljöer underminerar den enskildes rätt till förståelse och självbestämmande.", "beskrivning": "När digitala system inte tydligt visar vad som händer med information, vem som har tillgång till uppgifter eller vilka konsekvenser ett val kan få, skapas en osäkerhet som det allmänna inte kan lämna åt individen att hantera ensam. Otrygghet är inte bara ett upplevt problem. Det är en systembrist när förutsättningarna för informerat handlande saknas. Bristerna tar sig olika uttryck beroende på arena – från välfärdsteknik och uppkopplade enheter i hemmet till appar som spårar rörelse – men grundproblemet är detsamma: den enskilde saknar insyn i vad som sker med deras uppgifter.", "lagstod": "**Regeringsformen (RF 1 kap. 2 §)** fastställer det allmännas ansvar för delaktighet och jämlikhet och 2 kap. 6 § skyddar mot betydande intrång i den personliga integriteten.<br>**Förvaltningslagen (2017:900)** 6 § kräver begriplig information, 7 § tillgänglighet och 10 § fastställer rätten att ta del av uppgifter.<br>**Hälso- och sjukvårdslagen (2017:30)** 3 kap. 1 § fastställer vård på lika villkor.<br>**Diskrimineringslagen (2008:567)** 1 kap. 4 § förbjuder diskriminering genom bristande tillgänglighet.<br>**Europaparlamentets och rådets förordning (EU) 2022/2065 om digitala tjänster** ställer krav på transparens, ansvarsskyldighet och insyn i algoritmiska system för plattformar som förmedlar samhällsinformation.", "eu": "Tekniska lösningar ska utformas så att de respekterar grundläggande rättigheter och möjliggör utövandet av dessa (artikel 2a). Alla ska ha kontroll över sina egna data (artikel 5). AI bör fungera som verktyg för människor med det slutliga målet att öka välbefinnande (artikel 8). Alla bör skyddas mot risker och negativa konsekvenser för hälsa, säkerhet och grundläggande rättigheter från algoritmiska system (artikel 9). Digitala offentliga tjänster, i synnerhet hälso- och sjukvårdstjänster, ska vara sömlösa, säkra och begripliga (artikel 7c). Alla har rätt till integritet och skydd av sina personuppgifter (artikel 17). Ingen ska utsättas för olaglig övervakning eller spårning online (artikel 18).", "politikomraden": "Förvaltningspolitik, rättspolitik samt hälso- och sjukvårdspolitik."}, "1.5": {"namn": "Diskriminerande systemdesign", "ingress": "Designbeslut som förbiser mångfald i behov och förutsättningar skapar strukturell exkludering.", "beskrivning": "Digitala gränssnitt, språkval, navigationslogik eller funktioner som utgår från stereotypa antaganden kan systematiskt missgynna vissa grupper. Resultatet är inte bara ett funktionsproblem utan faktisk rättighetsförlust. Grupper utestängs, felbedöms eller osynliggörs – inte för att de saknar digital kompetens, utan för att systemen aldrig var designade med deras behov i åtanke.", "lagstod": "**Regeringsformen (RF 1 kap. 2 §)** fastställer det allmännas ansvar för delaktighet och jämlikhet. Diskrimineringslagen (2008:567) 1 kap. 4 § fastställer att bristande tillgänglighet kan utgöra diskriminering.<br>**FN:s funktionsrättskonvention** kräver universell utformning.<br>**Förvaltningslagen (2017:900)** 6 § kräver begriplig information och 13 § kräver tillgänglighet för den som inte behärskar svenska eller har funktionsnedsättning.<br>**Lagen om tillgänglighet till digital offentlig service (2018:1937)** ställer krav på att digital offentlig service ska vara möjlig att uppfatta, hantera, begripa och robust.<br>**Lagen om vissa produkters och tjänsters tillgänglighet (2023:254)** ställer tillgänglighetskrav på digitala produkter och tjänster på marknaden, med sanktionsavgifter vid bristande efterlevnad.", "eu": "Tekniska lösningar ska utformas så att de respekterar grundläggande rättigheter och möjliggör utövandet av dessa (artikel 2a). Den digitala omställningen ska i synnerhet innefatta äldre, personer med funktionsnedsättning och marginaliserade grupper, och bör främja kulturell och språklig mångfald (artikel 2b). Alla bör skyddas mot risker och negativa konsekvenser för hälsa, säkerhet och grundläggande rättigheter från algoritmiska system (artikel 9).", "politikomraden": "Förvaltningspolitik, funktionsrättspolitik och demokratipolitik."}, "1.6": {"namn": "Ansvar för användbarhet", "ingress": "Den aktör som tillhandahåller en digital samhällsfunktion ansvarar för att den enskilde kan förstå och använda lösningen.", "beskrivning": "Teknisk tillgänglighet är inte detsamma som användbarhet. En tjänst som finns men inte kan förstås, en process som förändras utan att användaren vägleds eller en rättighet som inte kommuniceras är brister i aktörens ansvar – inte brister hos användaren. När det som tidigare sköttes i ett möte med en handläggare ersätts av digital självbetjäning förskjuts utförandeansvaret till den enskilde. Den förskjutningen förutsätter att aktören tar ett motsvarande ansvar för att den enskilde klarar det som förväntas. Detta ansvar är inte en ambition om god service utan en rättslig skyldighet som följer av Förvaltningslagens krav på begriplighet, tillgänglighet och service i mötet med den enskilde.<br><br>Ansvaret är odelbart. Det kan inte delegeras till folkbildning, bibliotek, anhöriga eller den enskilde själv. Det gäller även när tjänsten upphandlas från en extern leverantör. Den aktör som inför en digital samhällsfunktion äger hela kedjan – från utformning och lansering, under löpande förvaltning samt eventuell kris, fram till avveckling.", "lagstod": "**Förvaltningslagen (2017:900)** 6 § kräver att kontakterna med enskilda blir smidiga och enkla, 7 § kräver tillgänglighet, 8 § kräver att myndigheten i rimlig utsträckning underlättar för den enskilde, 13 § kräver att information är begriplig även för den som inte behärskar svenska eller har funktionsnedsättning.<br>**Diskrimineringslagen (2008:567)** 1 kap. 4 § fastställer att bristande tillgänglighet kan utgöra diskriminering.<br>**Lagen om tillgänglighet till digital offentlig service (2018:1937)** ställer krav på att digital offentlig service ska vara möjlig att uppfatta, hantera, begripa och robust.", "eu": "Utformning, utveckling och användning av tekniska lösningar ska respektera de grundläggande rättigheterna och göra det möjligt att utöva dessa (artikel 2a). Digitala offentliga tjänster ska vara sömlösa, säkra och interoperabla (artikel 7c). Ingen ska lämnas utanför den digitala omställningen (artikel 2b).", "politikomraden": "Förvaltningspolitik, funktionsrättspolitik och konsumentpolitik."}, "1.7": {"namn": "Ansvarsluckor och bristande styrning", "ingress": "Många digitala system är inte exkluderande i sig men blir det i mötet med andra system. Problemet är att ingen har ansvar för helheten.", "beskrivning": "Myndigheter och leverantörer fokuserar ofta på sin del i kedjan, men inte på hur den samverkar med andra eller vilka barriärer det skapar för den enskilde. Resultatet är styrningsluckor där ingen fullt ut ansvarar för delaktighet, tillgång eller alternativ. Den enskilde skickas vidare utan att någon äger övergången.<br><br>I praktiken faller ansvaret för övergångarna på aktörer som aldrig fick det. DIK:s biblioteksrapport (2025) visar att var tredje folkbibliotekarie uppskattar att mer än hälften av arbetstiden går åt till samhällsservice som myndighetskontakter och blanketter. Folkbibliotek, folkbildning, civilsamhälle och gatubyråkrater fungerar som samhällslotsar utan formellt uppdrag, resurser eller löpande kompetensutveckling (se vidare 3.1 Bildningens förutsättningar).", "lagstod": "**Regeringsformen (RF 1 kap. 2 §)** fastställer det allmännas ansvar för delaktighet och jämlikhet.<br>**Förvaltningslagen (2017:900)** 6 § kräver begriplig information, 7 § tillgänglighet och 8 § att myndigheter samverkar med varandra.<br>**Hälso- och sjukvårdslagen (2017:30)** 13 kap. 8 § kräver individuell plan när den enskilde behöver insatser från både socialtjänsten och hälso- och sjukvården.<br>**Socialtjänstlagen (2025:400)** 7 kap. 1–2 §§ kräver att kommunen planerar insatser och ingår samverkansöverenskommelser med regionen.<br>**Konsekvensutredningsförordningen (SFS 2024:183)** 6–7 §§ kräver analys av kostnader och intäkter (men inte av exkluderingseffekter eller tillgänglighetskonsekvenser).", "eu": "Tekniska lösningar ska utformas så att de respekterar grundläggande rättigheter och möjliggör utövandet av dessa (artikel 2a). Digitala offentliga tjänster ska vara sömlösa, säkra och interoperabla (artikel 7c). Omfattande tillgång till och vidareutnyttjande av information från den offentliga sektorn ska säkerställas (artikel 7b). Marknadsaktörer som drar nytta av den digitala omställningen ska bidra till kostnaderna för kollektiva nyttigheter och offentliga infrastrukturer (artikel 2c).", "politikomraden": "Förvaltningspolitik och socialpolitik."}, "1.8": {"namn": "Digital beredskap", "ingress": "Den enskildes integritet, trygghet och möjlighet att utöva rättigheter förutsätter att den digitala infrastrukturen fungerar säkert och kontinuerligt.", "beskrivning": "I en digitaliserad välfärdsstat utgör personlig integritet och informationssäkerhet förutsättningar för andra rättigheter. Leverantörsberoenden, jurisdiktion och nationell handlingsförmåga blir samhällskritiska frågor i och med ökad digitalisering och förändrade geopolitiska förhållanden. Robusthet och kontinuitet är inte enbart tekniska kvalitetsfrågor utan förutsättningar för demokratisk delaktighet, rättssäkerhet och totalförsvar.", "lagstod": "**Regeringsformen (RF 1 kap. 2 §)** fastställer det allmännas ansvar för delaktighet och jämlikhet och 2 kap. 6 § skyddar mot betydande intrång i den personliga integriteten.<br>**Förvaltningslagen (2017:900)** 6–7 §§ ställer krav på service och tillgänglighet.<br>**Hälso- och sjukvårdslagen (2017:30)** 3 kap. 1 § fastställer rätten till god vård på lika villkor.<br>**GDPR (förordning (EU) 2016/679)** artiklarna 32–34 ställer krav på säkerhet i behandlingen och ger den enskilde rätt att informeras vid personuppgiftsincidenter.<br>Robusthet, kontinuitet och informationssäkerhet regleras genom **säkerhetsskyddslagen (2018:585)**, **cybersäkerhetslagen (2025:1506)** som genomför **NIS2-direktivet (EU 2022/2555)**, **förordningen (2022:524) om statliga myndigheters beredskap**, **lagen (2006:544) om kommuners och regioners åtgärder inför och vid extraordinära händelser** samt **instruktionen för Myndigheten för civilt försvar (förordning 2008:1002)**. <br>**CER-direktivet (EU 2022/2557) om kritiska entiteters motståndskraft** bereds (SOU 2024:26).", "eu": "Tekniska lösningar ska utformas så att de respekterar grundläggande rättigheter och möjliggör utövandet av dessa (artikel 2a). Digitala offentliga tjänster ska vara sömlösa, säkra och interoperabla (artikel 7c). Alla bör ha tillgång till hög konnektivitet, säkerhet och tillgänglig digital teknik (artikel 11).", "politikomraden": "Förvaltningspolitik, beredskapspolitik och informationssäkerhetspolitik."}, "2.1": {"namn": "Ekonomisk utsatthet", "ingress": "När digitala samhällsfunktioner förutsätter köpkraft blir tillgången villkorad av ekonomiska resurser.", "beskrivning": "Digitala samhällsfunktioner förutsätter ofta att den enskilde har råd med utrustning, abonnemang, datatrafik och underhåll. Det allmänna kompenserar sällan för dessa kostnader. Ekonomisk utsatthet förvandlas till digital utestängning.", "lagstod": "**Regeringsformen (RF 1 kap. 2 §)** fastställer det allmännas ansvar för att motverka ekonomisk och social utsatthet.<br>**Socialtjänstlagen (2025:400)** 12 kap. reglerar rätten till ekonomiskt bistånd för en skälig levnadsnivå.", "eu": "Alla i EU ska ha tillgång till konnektivitet till rimligt pris, inklusive personer med låga inkomster (artikel 3). Ingen ska lämnas utanför den digitala omställningen (artikel 2b).", "politikomraden": "Socialpolitik och ekonomisk spolitik."}, "2.2": {"namn": "Funktionsrelaterad exkludering", "ingress": "Digitala system som inte utformas för mänsklig mångfald förvandlar funktionsnedsättning till utestängning", "beskrivning": "Kognitiva, sensoriska, motoriska och psykosociala förutsättningar varierar i befolkningen. Det är känt, dokumenterat och rättsligt reglerat. Ändå utformas digitala samhällsfunktioner rutinmässigt utifrån en snäv uppsättning antaganden om hur människor ser, hör, tänker och rör sig. Exkluderingen uppstår inte hos personen utan i systemets designval.", "lagstod": "**Regeringsformen (RF 1 kap. 2 §)** fastställer det allmännas ansvar för delaktighet och jämlikhet.<br>**Diskrimineringslagen (2008:567)** 1 kap. 4 § fastställer att bristande tillgänglighet kan utgöra diskriminering.<br>**FN:s funktionsrättskonvention** kräver universell utformning.<br>**Lagen om tillgänglighet till digital offentlig service (2018:1937)** ställer krav på att digital offentlig service ska vara möjlig att uppfatta, hantera, begripa och robust.<br>**Lagen om vissa produkters och tjänsters tillgänglighet (2023:254)** ställer tillgänglighetskrav på ett brett spektrum av digitala produkter och tjänster på marknaden, med sanktionsavgifter vid bristande efterlevnad.", "eu": "Den digitala omställningen ska i synnerhet innefatta personer med funktionsnedsättning (artikel 2b). Tekniska lösningar ska utformas så att de respekterar grundläggande rättigheter och möjliggör utövandet av dessa (artikel 2a).", "politikomraden": "Funktionsrättspolitik och socialpolitik."}, "2.3": {"namn": "Beroendeposition och digital kontroll", "ingress": "Den som lever i en beroendeposition – gentemot en institution, en vårdgivare eller en partner – är särskilt utsatt för att digital tillgång begränsas eller att digital teknik används som kontrollverktyg.", "beskrivning": "Det allmänna har ansvar för att digitala system varken underlåter att säkerställa tillgång eller möjliggör kontroll.", "lagstod": "**Regeringsformen (RF 1 kap. 2 §)** fastställer det allmännas ansvar för alla människors frihet och värdighet.<br>**LSS (1993:387)** 5–6 §§ fastställer rätten till självbestämmande, delaktighet och inflytande över insatsers utformning.<br>**Socialtjänstlagen (2025:400)** 2 kap. 1 § fastställer att socialtjänsten ska främja jämlika levnadsvillkor och aktivt deltagande.<br>**FN:s funktionsrättskonvention (CRPD)** artiklarna 14 (frihet och säkerhet), 19 (rätten att leva självständigt) och 22 (rätten till privatliv) ger konventionsgrund.", "eu": "Den digitala omställningen ska i synnerhet innefatta personer med funktionsnedsättning (artikel 2b). Alla har rätt till integritet och skydd av sina personuppgifter (artikel 17). Ingen ska utsättas för olaglig övervakning (artikel 18).", "politikomraden": "Funktionsrättspolitik, jämställdhetspolitik, socialpolitik och rättspolitik."}, "2.4": {"namn": "Livskris och instabilitet", "ingress": "Digitala samhällsfunktioner förutsätter stabilitet, kontinuitet och förmåga att agera i rätt tid. Livskriser bryter alla tre.", "beskrivning": "Sjukdom, sorg, separation, våld eller plötslig ekonomisk förändring påverkar förmågan att hantera komplexa system. Det är förutsägbart och väldokumenterat. Ändå saknar digitala samhällsfunktioner rutinmässigt anpassning för tillfälligt förändrade förutsättningar.", "lagstod": "**Regeringsformen (RF 1 kap. 2 §)** fastställer det allmännas ansvar för delaktighet och jämlikhet.<br>**Förvaltningslagen (2017:900)** 6 § fastställer myndigheters skyldighet att hjälpa den enskilde att ta till vara sina intressen och 7 § kräver tillgänglighet.<br>**Socialtjänstlagen (2025:400)** 2 kap. 4 § fastställer att socialtjänsten ska vara lätt tillgänglig.", "eu": "Ingen ska lämnas utanför den digitala omställningen, i synnerhet marginaliserade och utsatta människor (artikel 2b). Tekniska lösningar ska möjliggöra utövandet av grundläggande rättigheter (artikel 2a).", "politikomraden": "Socialpolitik och förvaltningspolitik."}, "2.5": {"namn": "Barn och unga", "ingress": "Barn och unga under 18 år saknar rättshandlingsförmåga och är beroende av vuxna som ombud i digitala system.", "beskrivning": "Digitala samhällsfunktioner är utformade för myndiga individer med egen identitet, eget konto och egen beslutsrätt. Barn och unga faller strukturellt utanför detta antagande, inte på grund av bristande förmåga utan på grund av hur systemen är konstruerade. Det allmännas ansvar för barns rättigheter och välbefinnande kvarstår oavsett om fungerande vuxet ombud finns, och kvarstår även när barn befinner sig i situationer där sådant ombud saknas eller är den som utgör hotet.", "lagstod": "**Regeringsformen (RF 1 kap. 2 §)** fastställer det allmännas ansvar för barns uppväxtvillkor.<br>**Förvaltningslagen (2017:900)** 6 § reglerar parts rättsliga handlingsförmåga.<br>**Socialtjänstlagen (2025:400)** 18 kap. 1–7 §§ fastställer socialnämndens ansvar för barns uppväxtförhållanden.<br>**Patientlagen (2014:821)** 3 kap. skapar ett otydligt gränsland för barn 13–18 år.<br>**Barnkonventionen (CRC)** art. 3 och 12, inkorporerad i svensk rätt genom **lag (2018:1197)**, fastställer barnets bästa och rätt att komma till tals i alla processer som rör dem.", "eu": "Barn och ungdomar ska kunna göra säkra och välgrundade val i den digitala miljön (punkt 20). Åldersanpassade tjänster ska förbättra barns erfarenheter och välbefinnande (punkt 21). Barn ska skyddas mot olaglig spårning, profilering och riktade åtgärder (punkt 22d).", "politikomraden": "Barnsrättspolitik, socialpolitik, förvaltningspolitik samt hälso- och sjukvårdspolitik."}, "2.6": {"namn": "Migrationsstatus och rättsligt skydd", "ingress": "Det svenska digitala välfärdssystemet är konstruerat kring förutsättningen att den enskilde har en registrerad identitet och ett etablerat administrativt förhållande till det offentliga.", "beskrivning": "Asylsökande, papperslösa och statslösa faller utanför detta antagande. Deras behov av kontakt med vård, skola och myndigheter kvarstår.<br><br>Digital exkludering blir i dessa fall inte enbart ojämlik tillgång till välfärd utan ett hinder mot rättigheter som Sverige är folkrättsligt förpliktat att skydda.<br><br>FN:s konvention om ekonomiska, sociala och kulturella rättigheter (ICESCR), artiklarna 12–13, fastslår att rätten till hälsa och utbildning gäller alla på ett lands territorium utan diskriminering – ESK-kommittén har specifikt uppmanat Sverige att säkerställa detta för asylsökande. FN:s konvention om rättigheter för personer med funktionsnedsättning (CRPD), artiklarna 5 och 19, tillämpas utan undantag för migrationsstatus – CRPD-kommittén har uttryckt oro över att migranter med funktionsnedsättning i Sverige systematiskt saknar tillgång till stöd och välfärdstjänster. FN:s barnkonvention (CRC), artiklarna 3, 22 och 37, kräver att barnets bästa beaktas i alla asylprocesser – barnrättskommittén har rekommenderat Sverige att förbjuda förvar av barn på grund av migrationsstatus. 1951 års flyktingkonvention och non-refoulement-principen ger folkrättslig grund åt rädsla för digital spårning.", "lagstod": "**Regeringsformen (RF 1 kap. 2 §)** fastställer det allmännas ansvar för delaktighet och jämlikhet.<br>**Socialtjänstlagen (2025:400)** 1 kap. 1 § och **Hälso- och sjukvårdslagen (2017:30)** 3 kap. 1 § gäller som grundläggande värden oberoende av migrationsstatus.", "eu": "Ingen ska lämnas utanför den digitala omställningen, i synnerhet marginaliserade och utsatta grupper (artikel 2b). Tekniska lösningar ska möjliggöra utövandet av grundläggande rättigheter (artikel 2a).", "politikomraden": "Migrationspolitik, socialpolitik, funktionsrättspolitik och barnrättspolitik."}, "2.7": {"namn": "Plattformsstyrt arbete", "ingress": "Digitala plattformar ersätter arbetsgivarfunktioner med algoritmisk styrning och förskjuter ansvaret för arbetsmiljö och social trygghet till den som utför arbetet.", "beskrivning": "En app förmedlar, styr och övervakar arbete utan att ta det arbetsgivaransvar som normalt följer med en anställning. Den som utför arbetet klassas som uppdragstagare och bär själv ansvar för arbetsmiljö, sjukfrånvaro, försäkringar och pension. Algoritmer fördelar uppdrag, sätter priser, mäter prestation och kan stänga av den som inte uppfyller systemets kriterier. Modellen sprider sig till offentlig verksamhet när myndigheter och kommuner upphandlar välfärdstjänster från plattformsföretag.", "lagstod": "**Socialförsäkringsbalken (2010:110)** villkorar rätten till sjukpenning, föräldrapenning och pension mot anställningsförhållanden som plattformsmodellen kringgår.<br>**EU:s plattformsdirektiv (2024/2831)** introducerar en presumtion om anställningsförhållande i syfte att förbättra arbetsvillkoren för plattformsarbetare.", "eu": "Alla har rätt till rättvisa, hälsosamma och säkra arbetsvillkor, också i den digitala miljön (punkt 12). Arbetstagare har rätt att inte bli föremål för övervakning eller algoritmisk styrning som undergräver deras värdighet (punkt 13).", "politikomraden": "Arbetsmarknadspolitik, arbetsmiljöpolitik, socialpolitik och upphandlingspolitik."}, "3.1": {"namn": "Bildningens förutsättningar", "ingress": "Det allmänna har ansvar för att de professioner som bär det vardagsnära bildningsansvaret har förutsättningar att fullgöra det.", "beskrivning": "Bildningsuppdraget tillhör de institutioner och professioner som alltid burit det: bibliotekarier, pedagoger, folkbildare och gatubyråkrater (med flera). Med gatubyråkrater avses offentliganställda med direktkontakt med invånare. Deras professionella praktik behöver idag integrera förmågan att stödja den enskilde i förändrade informationsmiljöer. Detta bildningsansvar är skilt från den enskilda aktörens ansvar för sin tjänst (se 1.6). Det handlar inte om att kompensera för bristande tjänsteutformning utan om att stärka den enskildes självständiga förståelse av samhället.<br><br>Systematiskt arbete förutsätter ett gemensamt språk. Unescos ramverk för medie- och informationskunnighet (MIK) beskriver den professionella kompetens som krävs för att stödja den enskildes förmåga att orientera sig i informationsmiljöer. För att MIK ska kunna fungera som professionell kärna behöver den vara organisatoriskt buren och ingå i ett sammanhållet ekosystem av aktörer.", "lagstod": "**Regeringsformen (RF 1 kap. 2 §)** fastställer det allmännas ansvar för delaktighet och jämlikhet.<br>**Bibliotekslagen (2013:801)** 2 § fastställer att biblioteken ska verka för det demokratiska samhällets utveckling genom kunskapsförmedling och fri åsiktsbildning, 4 § kräver särskild uppmärksamhet åt personer med funktionsnedsättning och 7 § fastställer att biblioteken ska öka kunskapen om hur informationsteknik kan användas för kunskapsinhämtning, lärande och delaktighet.<br>**Skollagen (2010:800)** 1 kap. 4–5 §§ fastställer att utbildningen ska främja barns och elevers allsidiga personliga utveckling och förmedla kunskaper och värden.", "eu": "Utbildning och fortbildning bör anpassas för att säkerställa att alla kan dra nytta av den digitala omställningen (artikel 4). Insatser bör stödjas som gör det möjligt för alla studerande och lärare att förvärva och förmedla de digitala färdigheter och kompetenser som behövs, inbegripet mediekunnighet och kritiskt tänkande, för ett aktivt deltagande i ekonomin, samhällslivet och de demokratiska processerna (artikel 4b).", "politikomraden": "Kulturpolitik, utbildningspolitik och folkbildningspolitik."}, "3.2": {"namn": "Egenmakt och samhällsförståelse", "ingress": "Den enskilde behöver förstå samhället för att kunna delta i det. I en digitaliserad välfärdsstat förutsätter det en kombination av medborgerlig kompetens, informationskunnighet och digital kompetens. ", "beskrivning": "EU:s ramverk för nyckelkompetenser för livslångt lärande (2018/C 189/01) identifierar medborgerlig kompetens och digital kompetens som två av åtta kompetenser av lika vikt. Unescos ramverk för medie- och informationskunnighet kompletterar dessa med den informationskritiska förmåga som krävs i en miljö där information medieras digitalt. I den enskildes vardag är dessa förmågor inte separerade utan utövas tillsammans i konkreta situationer. Att överklaga ett beslut förutsätter att alla tre samverkar: samhällskunskap för att förstå rättigheten, informationskunnighet för att hitta och värdera underlag, digital kompetens för att navigera systemet. Avsaknad av någon av delarna gör att möjligheten att utöva sin rätt fallerar.<br><br>Enligt Ellström (1992) uppstår kompetens i mötet mellan individens resurser och de krav och handlingsutrymmen som omgivningen skapar. I digitala samhällsfunktioner är handlingsutrymmet inte öppet utan inskriberat i teknikens utformning (Akrich 1992). Förståelse är därför inte enbart en egenskap hos individen utan också en fråga om huruvida systemen är utformade så att de går att förstå. Rättigheter som inte kommuniceras kan inte utövas oavsett den enskildes kompetens. Administration som inte är utformad för att navigeras förblir obegriplig oavsett utbildningsnivå.", "lagstod": "**Regeringsformen (RF 1 kap. 2 §)** fastställer det allmännas ansvar för delaktighet och jämlikhet, RF 2 kap. 1 § skyddar yttrandefrihet och informationsfrihet.<br>**Förvaltningslagen (2017:900)** 6 § kräver att kontakterna med enskilda blir smidiga och enkla, 13 § kräver att information är begriplig.<br>**Europaparlamentets och rådets förordning (EU) 2022/2065 om digitala tjänster** ställer krav på transparens i algoritmiska system.", "eu": "Alla bör ha möjlighet att förvärva grundläggande digitala färdigheter (artikel 4). Alla bör ha tillgång till tillförlitlig, mångsidig och flerspråkig information online (artikel 6a). Alla bör kunna göra välgrundade val och vara medvetna om hur algoritmer kan påverka dem (artikel 6a).", "politikomraden": "Demokratipolitik, utbildningspolitik, beredskapspolitik, socialpolitik och förvaltningspolitik."}, "3.3": {"namn": "Inflytande och demokratisk insyn", "ingress": "Det allmänna har ansvar för att den enskilde kan påverka, granska och i efterhand förstå de strukturer och beslut som villkorar rättigheter och skyldigheter.", "beskrivning": "Digitala system bär inbyggda maktstrukturer. Designval avgör vilka som inkluderas, vilken information som syns och hur beslut fattas. Den enskilde har rätt att förstå dessa val, ifrågasätta dem och delta i att förändra dem. Det förutsätter att beslutsspår bevaras, att offentlig information förblir tillgänglig och att det allmänna skapar förutsättningar för ett aktivt medborgarskap även i digitala miljöer.", "lagstod": "**Regeringsformen (RF 1 kap. 1 §)** fastställer att all offentlig makt utgår från folket, RF 1 kap. 2 § fastställer det allmännas ansvar för delaktighet och möjlighet till inflytande.<br>**Tryckfrihetsförordningen (TF 2 kap.)** fastställer offentlighetsprincipen: allmänna handlingar ska vara tillgängliga för var och en.<br>**Arkivlagen (1990:782)** reglerar bevarande av allmänna handlingar.<br>**Förvaltningslagen (2017:900)** 6 § kräver begriplig information, 7 § tillgänglighet, 27 § dokumentationsplikt vid handläggning, 32 § motivering av beslut.<br>**FN:s konvention om ekonomiska, sociala och kulturella rättigheter (ICESCR)** fastslår att rätten till delaktighet gäller alla på ett lands territorium utan diskriminering.<br>**FN:s konvention om rättigheter för personer med funktionsnedsättning (CRPD)** artikel 4.3 fastställer att konventionsstaterna aktivt ska involvera personer med funktionsnedsättning i beslutsprocesser som rör dem.", "eu": "Tekniska lösningar ska utformas så att de respekterar grundläggande rättigheter och möjliggör utövandet av dessa (artikel 2a). Alla bör kunna göra välgrundade val och vara medvetna om hur algoritmer kan påverka dem (artikel 6a). Omfattande tillgång till och vidareutnyttjande av information från den offentliga sektorn ska säkerställas (artikel 7b).", "politikomraden": "Demokratipolitik, förvaltningspolitik och beredskapspolitik."}};

function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function escMd(s){
  // Escapa först allt, sedan tolka **bold** och <br> som HTML
  var safe=esc(s);
  // <br><br> → stycke-mellanrum (med extra margin)
  safe=safe.replace(/(?:&lt;br\s*\/?&gt;\s*){2,}/gi,'</p><p style="margin:0 0 0.9em">');
  // Enkel <br> → radbrytning
  safe=safe.replace(/&lt;br\s*\/?&gt;/gi,'<br>');
  // **bold** → <strong>
  safe=safe.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  // Slå in i <p> om vi använt </p><p>
  if(safe.indexOf('</p><p')>-1){
    safe='<p style="margin:0 0 0.9em">'+safe+'</p>';
    // Sista paragraf utan margin
    safe=safe.replace(/<p style="margin:0 0 0\.9em">([^<]*(?:<(?!\/p>)[^<]*)*)$/,'<p style="margin:0">$1');
  }
  return safe;
}

function renderUnderkatDetail(idx){

  if(d.tillsynsskydd_finns){
    html+='<div class="uk-block '+dSn+'">';
    html+='<div class="uk-block-t">I praktiken</div>';
    html+='<div class="uk-block-c">'+escMd(d.tillsynsskydd_finns)+'</div>';
    html+='</div>';
  }

  // Tunn linje
  html+='<hr class="uk-line">';

  // 4. Rådgivning enskild + Rådgivning utförare (två ramar sida vid sida)
  if(d.radgivning_enskild||d.radgivning_utforare){
    html+='<div class="uk-grid-2">';
    if(d.radgivning_enskild){
      html+='<div class="uk-block '+dSn+'">';

      html+='<div class="uk-block-c">'+escMd(d.radgivning_enskild)+'</div>';
      html+='</div>';
    }
    if(d.radgivning_utforare){
      html+='<div class="uk-block '+dSn+'">';
      html+='<div class="uk-block-t">V\u00e4gledning f\u00f6r utf\u00f6rare</div>';
      html+='<div class="uk-block-c">'+escMd(d.radgivning_utforare)+'</div>';
      html+='</div>';
    }
    html+='</div>';
  }

  // 5. Granskande aktörer / Uppdrag och ansvar (egen ram)
  if(d.tillsynsmyndighet){
    var aktorLabel = (d.taxonomi_id && d.taxonomi_id.indexOf('3.')===0) ? 'Uppdrag och ansvar' : 'Granskande akt\u00f6rer';
    html+='<div class="uk-block '+dSn+'">';
    html+='<div class="uk-block-t">'+aktorLabel+'</div>';
    html+='<div class="uk-block-c">'+escMd(d.tillsynsmyndighet)+'</div>';
    html+='</div>';
  }

  // Tunn linje
  html+='<hr class="uk-line">';

  // 6. Bakgrund och fakta (utan ram)
  if(d.empirisk_kalla){
    html+='<div class="uk-empiri">';
    html+='<div class="uk-block-t">Bakgrund och fakta</div>';
    var sources=d.empirisk_kalla.split('|').map(function(s){return s.trim()}).filter(function(s){return s});
    sources.forEach(function(src){
      var dblColonIdx=src.indexOf('::');
      var titleHtml,bodyHtml='';
      if(dblColonIdx>0){
        titleHtml=esc(src.substring(0,dblColonIdx).trim());
        bodyHtml=esc(src.substring(dblColonIdx+2).trim());
      } else {
        titleHtml=esc(src);
      }
      html+='<div class="uk-empiri-row">';
      html+='<div class="uk-empiri-title">'+titleHtml+'</div>';
      if(bodyHtml){
        html+='<div class="uk-empiri-body">'+bodyHtml+'</div>';
      }
      html+='</div>';
    });
    html+='</div>';
  }

  // 7. Länklista i botten
  if(d.lankar&&d.lankar.length){
    html+='<div class="uk-links">';
    html+='<div class="uk-block-t">L\u00e4nkar</div>';
    d.lankar.forEach(function(l){
      html+='<div class="uk-link-row"><a href="'+esc(l)+'" target="_blank" rel="noopener">'+esc(l)+'</a></div>';
    });
    html+='</div>';
  }

  return html;
}

function render(){

    html+=renderOverview();

  document.getElementById('app').innerHTML=html;
  attachEvents();

function attachEvents(){
  var si=document.getElementById('si');
  if(si) si.addEventListener('input',function(){state.search=this.value;render();var el=document.getElementById('si');el.focus();el.setSelectionRange(state.search.length,state.search.length)});
  document.querySelectorAll('.sec-btn').forEach(function(b){b.addEventListener('click',function(){
    var s=this.getAttribute('data-sec');
    if(state.sectionFilter===s){state.sectionFilter=null;state.viewMode='none';state.viewKey=null}
    else{state.sectionFilter=s;state.viewMode='section';state.viewKey=s}
    state.selectedIdx=null;render();
  })});
  document.querySelectorAll('[data-lucka]').forEach(function(b){b.addEventListener('click',function(){
    var v=this.getAttribute('data-lucka');
    state.luckaFilter=state.luckaFilter===v?null:v;state.selectedIdx=null;state.viewMode='none';render();
  })});
  document.querySelectorAll('.sec-divider').forEach(function(b){b.addEventListener('click',function(){
    var sec=this.getAttribute('data-sec-nav');
    state.viewMode='section';state.viewKey=sec;state.selectedIdx=null;state.expandedKat=null;render();
    document.querySelector('.detail').scrollTop=0;
  })});
  document.querySelectorAll('.grp-hdr').forEach(function(b){b.addEventListener('click',function(){
    var kat=this.getAttribute('data-kat');
    if(state.expandedKat===kat){
      state.expandedKat=null;state.viewMode='none';state.viewKey=null;
    } else {
      state.expandedKat=kat;state.viewMode='kategori';state.viewKey=kat;
    }
    state.selectedIdx=null;render();
    document.querySelector('.detail').scrollTop=0;
  })});
  document.querySelectorAll('.cat-item[data-idx]').forEach(function(b){b.addEventListener('click',function(e){
    e.stopPropagation();
    state.viewMode='underkat';state.selectedIdx=parseInt(this.getAttribute('data-idx'));render();
    document.querySelector('.detail').scrollTop=0;
  })});
  document.querySelectorAll('[data-kat-click]').forEach(function(b){b.addEventListener('click',function(){
    var kat=this.getAttribute('data-kat-click');
    state.viewMode='kategori';state.viewKey=kat;state.expandedKat=kat;state.selectedIdx=null;render();
    document.querySelector('.detail').scrollTop=0;
  })});
  document.querySelectorAll('[data-nav-kat]').forEach(function(b){b.addEventListener('click',function(){
    var kat=this.getAttribute('data-nav-kat');
    state.viewMode='kategori';state.viewKey=kat;state.expandedKat=kat;state.selectedIdx=null;render();
    document.querySelector('.detail').scrollTop=0;
  })});
  var homeLink=document.getElementById('homeLink');
  if(homeLink) homeLink.addEventListener('click',function(){
    state.viewMode='home';state.viewKey=null;state.selectedIdx=null;state.sectionFilter=null;state.luckaFilter=null;state.expandedKat=null;state.ovFilter=null;
    render();var d=document.querySelector('.detail');if(d)d.scrollTop=0;
  });
  var aboutBtn=document.getElementById('aboutBtn');
  if(aboutBtn) aboutBtn.addEventListener('click',function(){
    if(state.viewMode==='about'){state.viewMode='none';state.viewKey=null}
    else{state.viewMode='about';state.viewKey=null;state.selectedIdx=null;state.sectionFilter=null;state.luckaFilter=null}
    render();var d=document.querySelector('.detail');if(d)d.scrollTop=0;
  });
  var overviewBtn=document.getElementById('overviewBtn');
  if(overviewBtn) overviewBtn.addEventListener('click',function(){
    if(state.viewMode==='overview'){state.viewMode='about';state.viewKey=null}
    else{state.viewMode='overview';state.viewKey=null;state.selectedIdx=null;state.sectionFilter=null;state.luckaFilter=null;state.expandedKat=null;state.ovFilter=null}
    render();window.scrollTo(0,0);
  });
  var useBtn=document.getElementById('useBtn');
  if(useBtn) useBtn.addEventListener('click',function(){
    if(state.viewMode==='use'){state.viewMode='none';state.viewKey=null}
    else{state.viewMode='use';state.viewKey=null;state.selectedIdx=null}
    render();var d=document.querySelector('.detail');if(d)d.scrollTop=0;
  });
  var sourcesBtn=document.getElementById('sourcesBtn');
  if(sourcesBtn) sourcesBtn.addEventListener('click',function(){
    if(state.viewMode==='sources'){state.viewMode='none';state.viewKey=null}
    else{state.viewMode='sources';state.viewKey=null;state.selectedIdx=null}
    render();var d=document.querySelector('.detail');if(d)d.scrollTop=0;
  });
  var digidelBtn=document.getElementById('digidelBtn');
  if(digidelBtn) digidelBtn.addEventListener('click',function(){
    if(state.viewMode==='digidel'){state.viewMode='none';state.viewKey=null}
    else{state.viewMode='digidel';state.viewKey=null;state.selectedIdx=null}
    render();var d=document.querySelector('.detail');if(d)d.scrollTop=0;
  });
  var digidelHomeLink=document.getElementById('digidelHomeLink');
  if(digidelHomeLink) digidelHomeLink.addEventListener('click',function(e){
    e.preventDefault();
    state.viewMode='digidel';state.viewKey=null;state.selectedIdx=null;
    render();var d=document.querySelector('.detail');if(d)d.scrollTop=0;
  });
  document.querySelectorAll('.digidel-link').forEach(function(b){b.addEventListener('click',function(e){
    e.preventDefault();
    state.viewMode='digidel';state.viewKey=null;state.selectedIdx=null;
    render();var d=document.querySelector('.detail');if(d)d.scrollTop=0;
  })});
  document.querySelectorAll('[data-sec-ov]').forEach(function(b){b.addEventListener('click',function(){
    state.viewMode='section';state.viewKey=this.getAttribute('data-sec-ov');state.selectedIdx=null;state.expandedKat=null;state.ovFilter=null;render();
    var d=document.querySelector('.detail');if(d)d.scrollTop=0;
  })});
  document.querySelectorAll('[data-ov-lucka]').forEach(function(b){b.addEventListener('click',function(){
    var v=this.getAttribute('data-ov-lucka');
    state.ovFilter=state.ovFilter===v?null:v;render();
  })});
  document.querySelectorAll('[data-kat-ov]').forEach(function(b){b.addEventListener('click',function(){
    var kat=this.querySelector('.ov-kat-hdr').textContent;
    state.viewMode='kategori';state.viewKey=kat;state.expandedKat=kat;state.selectedIdx=null;render();
    var d=document.querySelector('.detail');if(d)d.scrollTop=0;
  })});
  document.querySelectorAll('[data-idx-ov]').forEach(function(b){b.addEventListener('click',function(e){
    e.stopPropagation();
    var idx=parseInt(this.getAttribute('data-idx-ov'));
    state.viewMode='underkat';state.selectedIdx=idx;state.expandedKat=DATA[idx].tax_kat;render();
    var d=document.querySelector('.detail');if(d)d.scrollTop=0;
  })});
}

render();
</script>
</body>
</html>
