t har rättsliga följder eller på liknande sätt i betydande grad påverkar hen. Art. 13.2 f och 14.2 g anger att den personuppgiftsansvarige ska informera den registrerade om förekomsten av automatiserat beslutsfattande och meningsfull information om logiken bakom.<br>**Förvaltningslagen (2017:900)** 32 § anger att ett beslut som kan antas påverka någons situation på ett inte obetydligt sätt ska innehålla en klargörande motivering, om det inte är uppenbart obehövligt.<br>**Diskrimineringslagen (2008:567)** 1 kap. 4 § anger att direkt och indirekt diskriminering är förbjuden. Indirekt diskriminering föreligger när en bestämmelse, ett kriterium eller ett förfaringssätt som framstår som neutralt särskilt missgynnar personer med viss tillhörighet, om inte bestämmelsen, kriteriet eller förfaringssättet har ett berättigat syfte och de medel som används är lämpliga och nödvändiga.<br>**EU:s AI-förordning (2024/1689)** art. 6 anger att vissa AI-system används inom områden som klassificeras som högrisk. Art. 9 anger krav på riskhanteringssystem för högrisk-AI. Art. 10 anger krav på datakvalitet och hantering av bias i träningsdata. Art. 13 anger krav på transparens och information till användaren.", "lucka_status": "Nej", "empirisk_kalla": "Institutet för mänskliga rättigheter (2026) Årsrapport 2026::AI-tekniken innebär nya risker för att mänskliga rättigheter kränks. Bristande transparens, felaktiga underlag och begränsade möjligheter till ansvarsutkrävande kan leda till att enskilda drabbas av felaktiga eller godtyckliga beslut (s. 58). | Svenska Dagbladet (2025) Pekade ut mammor – nu slopas AI-systemet::Försäkringskassans hemliga bot skulle stoppa fusk – men pekade i stället ut oskyldiga mammor och föräldrar i utsatta grupper. Ett år efter SvD:s granskning avvecklar myndigheten AI-systemet. | IMY (2025) Avslutad tillsyn efter att Försäkringskassan tagit AI-system ur bruk::I juni 2025 inledde Integritetsskyddsmyndigheten (IMY) en tillsyn mot Försäkringskassan. Bakgrunden var rapportering om deras användning av AI vid urval för riktade vab-kontroller. Försäkringskassan tog därefter AI-systemet ur bruk och ärendet är nu avslutat.", "beskrivning": "Digitala samhällsfunktioner designas ofta utifrån en antagen norm. Den som faller utanför normen utestängs. Samma mekanism uppstår när AI-system tränas på data som speglar befintliga ojämlikheter eftersom systemet ärver och förstärker dem", "lankar": ["https://mrinstitutet.se/download/18.234277b219d0483f491b63a/1774331817101/Rapport-Arsrapport-2026.pdf", "https://www.svd.se/a/d45KKB/forsakringskassans-ai-slopas-efter-svd-s-granskning", "https://www.imy.se/nyheter/avslutad-tillsyn-efter-att-forsakringskassan-tagit-ai-system-ur-bruk/"], "tillsynsskydd_finns": "Granskning av om ett system är normbaserat eller diskriminerande kräver tillgång till systemets logik och träningsdata. Den indirekta diskrimineringen är ofta osynlig för den drabbade."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.5 Diskriminerande systemdesign", "taxonomi_id": "1.5.2", "kategori": "Språkliga barriärer", "situation_exempel": "Myndighetens e-tjänst finns bara på svenska – jag förstår inte vad jag ska göra.", "radgivning_enskild": "Respektive myndighet (begära tolk eller översättning enligt förvaltningslagen 13 §)<br>Statens servicecenter (hjälp vid besök på servicekontor)", "radgivning_utforare": "Institutet för språk och folkminnen (vägledning om klarspråk och språklagens tillämpning)", "tvist": "Saknas – det finns inget överklagbart beslut när en e-tjänst inte är översatt", "tillsynsmyndighet": "Justitieombudsmannen (granskar enskilda fall av myndighetsutövning)", "lagstod": "**Förvaltningslagen (2017:900)** 13 § anger att en myndighet ska använda tolk och se till att översätta handlingar om det behövs för att den enskilde ska kunna ta till vara sin rätt när myndigheten har kontakt med någon som inte behärskar svenska.<br>**Språklagen (2009:600)** 11 § anger att språket i offentlig verksamhet ska vara vårdat, enkelt och begripligt.<br>**Regeringsformen (RF)** 1 kap. 2 § anger att det allmänna ska verka för att alla människor ska kunna uppnå delaktighet och jämlikhet i samhället.", "lucka_status": "Delvis", "empirisk_kalla": "Riksrevisionen (RiR 2023:6) Digitala tjänster till privatpersoner – stora utvecklingsmöjligheter för statliga myndigheter::De flesta digitala tjänster, som får anses vara grundläggande, saknar översättning. Det gäller till exempel Skatteverkets digitala deklarationstjänst, anmäla ny adress eller skriva in sig hos Arbetsförmedlingen. Vi ser också att vissa tjänster där en betydande del av målgruppen kan antas tala andra språk än svenska inte heller är översatta. Det gäller de tjänster som man kan använda när man är ny i Sverige, till exempel att bli inskriven i Försäkringskassan, vilket man behöver bli innan man har rätt att söka stöd. Enligt de servicehandläggare vid Statens servicecenter som vi har intervjuat är bristande kunskap i svenska en vanlig anledning till att personer besöker servicekontoren för att få hjälp (s. 34–35).", "beskrivning": "Digitala samhällsfunktioner som bara erbjuds på vissa språk eller som använder juridiskt, tekniskt eller byråkratiskt språk utestänger den som inte behärskar det.", "lankar": ["https://www.riksrevisionen.se/download/18.1e0fa62b19047f61fcc9553/1719239329567/RiR_2023_6_master.pdf"], "tillsynsskydd_finns": "Riksrevisionen konstaterar i RiR 2023:6 att de flesta digitala tjänster som får anses grundläggande saknar översättning, även tjänster där en betydande del av målgruppen kan antas tala andra språk än svenska."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.5 Diskriminerande systemdesign", "taxonomi_id": "1.5.3", "kategori": "Systemlogik", "situation_exempel": "Jag hittar inte rätt blankett på myndighetens hemsida (allt är organiserat efter deras avdelningar, inte efter mitt behov).", "radgivning_enskild": "Respektive myndighet (telefon eller besök)<br>Statens servicecenter (hjälp vid besök på servicekontor)", "radgivning_utforare": "Myndigheten för digital förvaltning (vägledning om tillgänglighet till digital offentlig service)<br>Institutet för språk och folkminnen (vägledning om klarspråk)", "tvist": "Saknas – ologisk informationsarkitektur är inte ett överklagbart beslut", "tillsynsmyndighet": "Myndigheten för digital förvaltning (tillsyn enligt lagen om tillgänglighet till digital offentlig service)<br>Justitieombudsmannen (granskar enskilda fall av myndighetsutövning)", "lagstod": "**Förvaltningslagen (2017:900)** 6 § anger att myndigheter ska se till att kontakterna med enskilda blir smidiga och enkla, och lämna den enskilde sådan hjälp att hen kan ta till vara sina intressen. 7 § anger att myndigheter ska vara tillgängliga för kontakter och informera allmänheten om hur och när sådana kan tas.<br>**Språklagen (2009:600)** 11 § anger att språket i offentlig verksamhet ska vara vårdat, enkelt och begripligt.<br>**Lagen om tillgänglighet till digital offentlig service (2018:1937)** anger att digital offentlig service ska vara möjlig att uppfatta, hanterbar, begriplig och robust.<br>**Regeringsformen (RF)** 1 kap. 2 § anger att det allmänna ska verka för att alla människor ska kunna uppnå delaktighet och jämlikhet i samhället.", "lucka_status": "Delvis", "empirisk_kalla": "Riksrevisionen (RiR 2023:6) Digitala tjänster till privatpersoner – stora utvecklingsmöjligheter för statliga myndigheter::I de öppna svaren framkommer vissa återkommande problem. Dessa handlar bland annat om att det är svårt att hitta i de digitala tjänsterna, eller att det är svårt att förstå tjänsterna och informationen i dem (s. 30). | Svenskarna med funktionsnedsättning och internet 2025::Sedan 2017 har personer med funktionsnedsättning rapporterat att de har stora svårigheter att söka information, att navigera sig fram till information och att förstå den information de till slut hittar. Det är till exempel en återkommande kritik som riktats mot samhällsviktiga tjänster som 1177.se och Försäkringskassan. Här går det inte att se några tydliga förbättringar (s. 17). | Digg/PTS (2026) Redovisning av uppdraget att stödja genomförandet av Sveriges Digitaliseringsstrategi::Endast en dryg femtedel av de svarande kommunerna följer  regelbundet upp enkelheten i kommunens digitala tjänster för invånare. Knappt två tredjedelar av kommunerna följer upp detta sporadiskt (s. 36). | Digg (2026) Uppdrag att analysera och beskriva möjligheter och utmaningar kopplade till att etablera en digital ingång till det offentliga. Slutrapport i regeringsuppdraget Fi2025/02066::Etableringen av en gemensam digital ingång är inte i första hand en teknisk fråga. Den handlar i hög grad om styrning, ansvar och arbetssätt. För att lyckas behöver offentlig förvaltning i större utsträckning agera samlat utifrån människors behov, snarare än utifrån enskilda organisationers uppdrag. En gemensam digital ingång leder inte i sig till sammanhängande tjänster, utan förutsätter att processer, ansvar och datadelning fungerar samordnat över organisationsgränser, och att ansvar ligger hos de aktörer som har ansvar över data, regelverk och processer (s. 2). På kort och medellång sikt handlar arbetet med en gemensam digital ingång i stor utsträckning om att skapa sammanhang, vägledning och integration – snarare än att ersätta befintliga tjänster (s. 14).", "beskrivning": "När digitala samhällsfunktioner organiseras efter systemets logik snarare än efter hur människor söker och förstår information blir innehåll otillgängligt trots att det tekniskt finns där.", "lankar": ["https://www.riksrevisionen.se/download/18.1e0fa62b19047f61fcc9553/1719239329567/RiR_2023_6_master.pdf", "https://www.begripsam.se/download/18.34c5105e19cf45dbbdba114/1773657022640/SMFOI_2025_huvudrapport_v2.pdf", "https://www.digg.se/download/18.4d9d13fe19c34cfab85e4b/1772203531877/Rapport-Uppf%C3%B6ljning-av-digitaliseringsstrategin-feb-2026.pdf", "https://www.digg.se/download/18.12d3b9fb19d0d4280da64f/1774989242010/Uppdrag%20att%20beskriva%20utmaningar%20och%20mo%CC%88jligheter.pdf"], "tillsynsskydd_finns": "Tillsyn enligt lagen om tillgänglighet till digital offentlig service täcker teknisk tillgänglighet enligt WCAG 2.1, inte informationsarkitektur eller begriplighet utifrån användarens perspektiv."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.5 Diskriminerande systemdesign", "taxonomi_id": "1.5.4", "kategori": "Kognitiva krav", "situation_exempel": "Ansökan har så många steg och tidsgränser att jag inte hinner tänka — jag ger upp halvvägs och det finns inget sätt att spara och fortsätta senare.", "radgivning_enskild": "Respektive myndighet (begära hjälp enligt förvaltningslagen 6 §)<br>Statens servicecenter (hjälp vid besök på servicekontor)<br>Diskrimineringsombudsmannen (anmälan om bristande tillgänglighet)", "radgivning_utforare": "Myndigheten för digital förvaltning (vägledning om tillgänglighet till digital offentlig service)<br>Institutet för språk och folkminnen (vägledning om klarspråk)<br>Diskrimineringsombudsmannen (vägledning om bristande tillgänglighet som diskriminering)", "tvist": "DO (bristande tillgänglighet som diskriminering); förvaltningsrätten (om beslut kan överklagas)", "tillsynsmyndighet": "Myndigheten för digital förvaltning (tillsyn enligt lagen om tillgänglighet till digital offentlig service)<br>Diskrimineringsombudsmannen (tillsyn enligt diskrimineringslagen)<br>Justitieombudsmannen (granskar enskilda fall av myndighetsutövning)", "lagstod": "**Förvaltningslagen (2017:900)** 6 § anger att myndigheter ska se till att kontakterna med enskilda blir smidiga och enkla, och lämna den enskilde sådan hjälp att hen kan ta till vara sina intressen.<br>**Lagen om tillgänglighet till digital offentlig service (2018:1937)** anger att digital offentlig service ska vara möjlig att uppfatta, hanterbar, begriplig och robust.<br>**Diskrimineringslagen (2008:567)** 1 kap. 4 § anger att bristande tillgänglighet för en person med funktionsnedsättning utgör diskriminering om skäliga åtgärder för tillgänglighet inte vidtagits.<br>**Språklagen (2009:600)** 11 § anger att språket i offentlig verksamhet ska vara vårdat, enkelt och begripligt.", "lucka_status": "Delvis", "empirisk_kalla": "Riksrevisionen (RiR 2023:6) Digitala tjänster till privatpersoner – stora utvecklingsmöjligheter för statliga myndigheter::Ett annat problem handlar om att personer är rädda för att göra fel eller känner sig stressade och osäkra. Några av personerna med neuropsykiatrisk funktionsnedsättning (NPF) ger uttryck för problem när man blir stressad, att de uppfattar tjänsterna som röriga och att de känner en oro och osäkerhet inför om de använder tjänsterna på rätt sätt (s. 30).| Svenskarna med funktionsnedsättning och internet 2025::Även om lagstiftningen på ett övergripande plan ställer krav på begriplighet så finns det i de standarder lagarna pekar på inte tillräckliga krav för att lagstiftningen ska ge effekt. Den stora majoriteten av personer med funktionsnedsättning är beroende av att man ser lagstiftningen som en miniminivå och går vidare genom att göra tjänsterna enklare, mer begripliga och med bättre design (s. 12).", "beskrivning": "Digitala samhällsfunktioner som innehåller många steg, korta tidsgränser eller komplex information skapar hinder för den som behöver mer tid eller tydligare struktur.", "lankar": ["https://www.riksrevisionen.se/download/18.1e0fa62b19047f61fcc9553/1719239329567/RiR_2023_6_master.pdf", "https://www.begripsam.se/download/18.34c5105e19cf45dbbdba114/1773657022640/SMFOI_2025_huvudrapport_v2.pdf"], "tillsynsskydd_finns": "WCAG 2.1 ställer krav på tillräcklig tid (2.2.1) och begriplig information (3.1) men kognitiv tillgänglighet saknar specifika krav i nuvarande standard. Tillsynsmyndighetens granskning sker inte i den utsträckning EU kräver."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.6 Ansvar för användbarhet", "taxonomi_id": "1.6.1", "kategori": "Pedagogiskt ansvar", "situation_exempel": "Mitt anslutningståg ställdes in och jag står på stationen. Tågföretagets chatbot fattar inte vad jag menar och jag hittar inget telefonnummer. Jag vet inte ens om jag har rätt till ersättning.", "radgivning_enskild": "Hallå konsument (allmän konsumentupplysning)<br>Allmänna reklamationsnämnden (prövning av konsumenttvister)", "radgivning_utforare": "Konsumentverket (vägledning om konsumenträtt och kundservice)<br>Transportstyrelsen (vägledning om tågpassagerarförordningen)", "tvist": "ARN (ej bindande)", "tillsynsmyndighet": "Konsumentverket (tillsyn enligt konsumenträttslig lagstiftning)<br>Transportstyrelsen (tillsyn enligt tågpassagerarförordningen)", "lagstod": "**Förvaltningslagen (2017:900)** 6 § anger att myndigheter ska se till att kontakterna med enskilda blir smidiga och enkla, och lämna den enskilde sådan hjälp att hen kan ta till vara sina intressen. 7 § anger att myndigheter ska vara tillgängliga för kontakter.<br>**Konsumentköplagen (2022:260)** 5 kap. 25 § anger att näringsidkaren ska tillhandahålla information som konsumenten behöver för att kunna ta tillvara sina rättigheter vid fel i vara eller tjänst.<br>**Förordning (EU) 2021/782 om rättigheter och skyldigheter för tågresenärer** art. 18 anger att resenärer som drabbas av försening eller inställd avgång har rätt till information och assistans. Art. 28 anger att järnvägsföretag ska inrätta klagomålshanteringssystem som ska vara lättillgängliga, även för personer med funktionsnedsättning.<br>**Lagen om vissa produkters och tjänsters tillgänglighet (2023:254)** anger tillgänglighetskrav för bland annat persontransporttjänster och e-handelstjänster som riktar sig till konsumenter.", "lucka_status": "Nej", "empirisk_kalla": "DN/Kristofer Ahlström (2026) Hur dålig kan kundtjänst bli innan den blir direkt olaglig?::De flesta avskyr kundtjänst. En mur av AI-chatbottar, timslånga telefonköer – och får man väl tala med en människa är det nästan omöjligt att få rätt. DN:s Kristofer Ahlström djupdyker i den havererade kundtjänstens orsaker och konsekvenser.", "beskrivning": "Den aktör som inför en digital samhällsfunktion ansvarar för att den enskilde kan använda lösningen – inte bara tekniskt utan i den situation där den ska användas. Att publicera generell information till en bred allmänhet är inte tillräckligt. I ärenden som rör ekonomisk utsatthet, sjukdom eller rättslig osäkerhet innebär ansvaret att den enskilde inte lämnas ensam med ett formulär i en situation där hen tidigare hade en handläggare.", "lankar": ["https://www.dn.se/kultur/kristofer-ahlstrom-hur-dalig-kan-kundtjanst-bli-innan-den-blir-direkt-olaglig/"], "tillsynsskydd_finns": "Tillsynsansvaret är splittrat mellan myndighet, kommun och marknad. Ingen instans granskar rätten till fungerande stöd som en helhet. Utförare avgör själva vilken nivå av stöd som erbjuds."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.6 Ansvar för användbarhet", "taxonomi_id": "1.6.2", "kategori": "Förändringsansvar", "situation_exempel": "Appen uppdaterades – jag som kunde förut hittar inte längre.", "radgivning_enskild": "Kundtjänst eller kontaktcenter hos respektive  aktör", "radgivning_utforare": "Myndigheten för digital förvaltning (vägledning om tillgänglighet till digital offentlig service)<br>Konsumentverket (vägledning om konsumenträtt vid förändringar i privata tjänster)", "tvist": "Saknas – en gränssnittsförändring är inte ett överklagbart beslut", "tillsynsmyndighet": "Justitieombudsmannen (granskar enskilda fall av myndighetsutövning)<br>Myndigheten för digital förvaltning (tillsyn enligt lagen om tillgänglighet till digital offentlig service)<br>Konsumentverket (tillsyn över systematiska brister i privata tjänster)<br>Post- och telestyrelsen (tillsyn enligt lagen om vissa produkters och tjänsters tillgänglighet)", "lagstod": "**Förvaltningslagen (2017:900)** 6 § anger att myndigheter ska se till att kontakterna med enskilda blir smidiga och enkla, och lämna den enskilde sådan hjälp att hen kan ta till vara sina intressen. 7 § anger att myndigheter ska vara tillgängliga för kontakter och informera allmänheten om hur och när sådana kan tas.<br>**Lagen om tillgänglighet till digital offentlig service (2018:1937)** anger att digital offentlig service ska vara möjlig att uppfatta, hanterbar, begriplig och robust.<br>**Konsumentköplagen (2022:260)** 4 kap. 4 § anger att näringsidkaren vid köp av varor med digitala delar ska se till att konsumenten informeras om och tillhandahålls säkerhetsuppdateringar och andra nödvändiga uppdateringar.<br>**Lagen om vissa produkters och tjänsters tillgänglighet (2023:254)** anger tillgänglighetskrav för bland annat banktjänster, betaltjänster, e-handelstjänster och elektroniska kommunikationstjänster som riktar sig till konsumenter.", "lucka_status": "Nej", "empirisk_kalla": "1177 (2026) Uppdatering av mobilt Bank-id och inloggning på 1177.se::1177 informerar om att mobilt BankID från 1 mars 2026 kräver minst Android 9 eller iOS 16, och att man utan detta inte längre kan logga in på 1177.se för att läsa journal, boka tid eller kontakta sin mottagning. Användaren rekommenderas att kontrollera operativsystemets version och vid behov uppdatera, byta enhet eller använda Freja+.  | PC-tidningen (2026-02-01) Katastrofal Windows-uppdatering låser dina filer::Efter att uppdateringen med namnet KB5074109 installerats upplevde tusentals användare stora problem på sina datorer.", "beskrivning": "När en digital lösning förändras i gränssnitt, logik eller process uppstår ett förnyat ansvar. Den som tidigare behärskade tjänsten ska inte behöva söka stöd hos annan aktör för att återfå den förmågan.", "lankar": ["https://pctidningen.se/datorutrustning/operativsystem/windows-11/katastrofal-windows-uppdatering-laser-dina-filer"], "tillsynsskydd_finns": "Ingen myndighet granskar att gränssnittsförändringar inte försämrar användbarhet för befintliga användare. Lagstiftningen kräver tillgänglighet vid en given tidpunkt men inte kontinuitet vid förändring."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.6 Ansvar för användbarhet", "taxonomi_id": "1.6.3", "kategori": "Rättighetsansvar", "situation_exempel": "Mitt konto stängdes utan förklaring. Var är mina inlägg nu?", "radgivning_enskild": "Hallå konsument (allmän konsumentupplysning)<br>Integritetsskyddsmyndigheten (klagomål om dataskyddsfrågor och rätt till tillgång till personuppgifter)<br>Allmänna reklamationsnämnden (prövning av konsumenttvister)", "radgivning_utforare": "Post- och telestyrelsen (vägledning om förordningen om digitala tjänster, DSA)<br>Konsumentverket (vägledning om informationsskyldighet och kontaktvägar för konsumenter)<br>Integritetsskyddsmyndigheten (vägledning om dataskydd, dataportabilitet och rätt till tillgång)", "tvist": "Oklart – DSA art. 20 ger rätt till intern klagomålshantering hos plattformen, men tvistlösning (art. 21) sker via certifierat organ som ofta saknas i Sverige.", "tillsynsmyndighet": "Post- och telestyrelsen (nationell samordnare och tillsynsmyndighet enligt förordningen om digitala tjänster, DSA)<br>Konsumentverket (tillsyn enligt förordningen om digitala tjänster och konsumenträttslig lagstiftning)<br>Mediemyndigheten (tillsyn enligt förordningen om digitala tjänster)<br>Integritetsskyddsmyndigheten (tillsyn enligt dataskyddsförordningen)", "lagstod": "**Förordning (EU) 2022/2065 om en inre marknad för digitala tjänster (förordningen om digitala tjänster, DSA)** art. 17 anger att leverantörer av värdtjänster ska tillhandahålla en tydlig och specifik motivering till varje berörd mottagare av tjänsten avseende beslut om begränsning, avlägsnande av innehåll eller avstängning av konto. Art. 20 anger att leverantörer av onlineplattformar ska tillhandahålla mottagarna ett internt klagomålshanteringssystem som är effektivt, lättillgängligt och kostnadsfritt. Art. 21 anger att mottagare som omfattas av beslut har rätt att vända sig till ett certifierat organ för tvistlösning utanför domstol.<br>**Förordning (EU) 2023/2854 om harmoniserade regler för skälig åtkomst till och användning av data (dataförordningen)** art. 4 anger att användaren ska ha rätt till åtkomst till data som genereras genom användning av en uppkopplad produkt eller tillhörande tjänst, kostnadsfritt och i ett allmänt använt maskinläsbart format. Art. 5 anger att användaren har rätt att begära att data delas med en tredje part. Art. 23 anger att leverantörer av databehandlingstjänster ska vidta åtgärder för att möjliggöra byte av tjänst utan oskäliga hinder.<br>**Dataskyddsförordningen (GDPR 2016/679)** art. 15 anger att den registrerade har rätt att få bekräftelse på om personuppgifter som rör hen behandlas och, om så är fallet, få tillgång till personuppgifterna. Art. 20 anger att den registrerade har rätt att få ut sina personuppgifter i ett strukturerat, allmänt använt och maskinläsbart format..", "lucka_status": "Nej", "empirisk_kalla": "Forbrukerrådet (2026) Breaking free. Pathways to a fair technological future::Many companies – including some of the most profitable companies in the world - have abandoned any pretense of providing customer service, thereby denying consumers the possibility to receive information and support when a product or service stops working as promised. Human customer support is replaced with chatbots or predefined feedback forms designed to make consumers give up, while any point of human contact is often hidden away or nonexistent. This means that when a device breaks down, an account is suspended, or a service provider makes sweeping changes, consumers are often left on their own (s. 29). | Konsumentverket (2025:3) Brister i företagens kundtjänster::19 av 60 företag saknade fullständiga kontaktuppgifter ( s. 3);  För att kunna realisera sina rättigheter är det viktigt att konsumenten kan visa att hen har ångrat ett köp eller sagt upp ett avtal. 42 av de totalt 60 granskade företagen tillhandahöll chatt och/eller kontaktformulär. Endast två av dessa informerade om huruvida uppgifterna som lämnades gick att spara eller få som kopia (s. 17-18).", "beskrivning": "Den aktör som tillhandahåller en digital samhällsfunktion ansvarar för att den enskilde känner till vilka rättigheter, alternativa kontaktvägar och möjligheter till stöd som är kopplade till tjänsten. Ansvaret omfattar även information om vad som gäller vid driftstörningar och systemavbrott (se även 1.8.3). Rättigheter som inte kommuniceras kan inte utövas.", "lankar": ["https://storage02.forbrukerradet.no/media/2026/02/breaking-free-pathways-to-a-fair-technological-future.pdf", "https://stpubshop.blob.core.windows.net/publikationer/redovisningsrapport-2025-3-brister-i-foretagens-kundtjanster-konsumentverket-2025_02b.pdf"], "tillsynsskydd_finns": "Plattformar har ingen skyldighet att erbjuda mänsklig kontakt. Konsumenten saknar i praktiken möjlighet att nå fram."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.6 Ansvar för användbarhet", "taxonomi_id": "1.6.4", "kategori": "Krisansvar", "situation_exempel": "Mina personuppgifter har läckt i en hackerattack. Nu  ringer företag och säljer skyddande tjänster. Behöver jag dessa tjänster? Hur ska jag agera?", "radgivning_enskild": "Den aktör som drabbats av intrånget (informationsplikt enligt dataskyddsförordningen art. 34)<br>Integritetsskyddsmyndigheten (klagomål om personuppgiftsbehandling)<br>Polisen (anmälan vid bedrägeri eller dataintrång)<br>Hallå konsument (allmän konsumentupplysning)", "radgivning_utforare": "Integritetsskyddsmyndigheten (vägledning om personuppgiftsincidenter och informationsplikt enligt art. 33–34)<br>Myndigheten för civilt försvar (vägledning om cyberincidenthantering)", "tvist": "", "tillsynsmyndighet": "Integritetsskyddsmyndigheten (tillsyn enligt dataskyddsförordningen)<br>Myndigheten för civilt försvar (tillsyn enligt cybersäkerhetslagen)<br>Justitieombudsmannen (granskar enskilda fall av myndighetsutövning)", "lagstod": "**Dataskyddsförordningen (GDPR 2016/679)** art. 33 anger att den personuppgiftsansvarige utan onödigt dröjsmål och senast 72 timmar efter att ha fått vetskap om en personuppgiftsincident ska anmäla incidenten till tillsynsmyndigheten. Art. 34 anger att den personuppgiftsansvarige utan onödigt dröjsmål ska informera den registrerade om incidenten om den sannolikt leder till en hög risk för fysiska personers rättigheter och friheter, och att informationen ska innehålla rekommendationer om åtgärder som kan vidtas för att mildra incidentens potentiella negativa effekter.<br>**Cybersäkerhetslagen** anger krav på samhällsviktiga och digitala aktörer att hantera cyberincidenter och rapportera till Myndigheten för civilt försvar. Lagen genomför direktiv (EU) 2022/2555 (NIS2).<br>**Förvaltningslagen (2017:900)** 6 § anger att myndigheter ska se till att kontakterna med enskilda blir smidiga och enkla, och lämna den enskilde sådan hjälp att hen kan ta till vara sina intressen.<br>**Regeringsformen (RF)** 1 kap. 2 § anger att det allmänna ska verka för att alla människor ska kunna uppnå delaktighet och jämlikhet i samhället.", "lucka_status": "Nej", "empirisk_kalla": "Integritetsskyddsmyndigheten, IMY (2026)  Årsredovisning 2025::Under 2025 ökade antalet inkomna personuppgiftsincidenter betydligt, nästan en fördubbling jämfört med föregående år (s. 32). Antalet berörda registrerade uppgick totalt till mer än 1,5 miljoner och berörde i vissa fall barn samt personer med skyddade personuppgifter (s. 34). | Integritetsskyddsmyndigheten (2026-05-08) Dataintrång mot läroplattformen Canvas::Lärplattformen Canvas, som tillhandahålls av den amerikanska leverantören Instructure, har utsatts för ett dataintrång. Cirka 30 svenska lärosäten är drabbade. |  SVT nyheter (2026) Flera svenska universitet drabbade i hackerattack::Det amerikanska företaget Instructure med lärplattformen Canvas har utsatts för ett dataintrång. Canvas används bland annat för studieinformation, inlämningar och kontakt med lärare och andra studenter. Tusentals lärosäten i världen rapporteras vara drabbade.", "beskrivning": "När ett digitalt system drabbas av allvarliga incidenter uppstår akuta behov av operativ vägledning för enskilda drabbade.", "lankar": ["https://www.imy.se/globalassets/dokument/arsredovisningar/imy-arsredovisning-2025.pdf", "https://www.imy.se/nyheter/dataintrang-mot-laroplattformen-canvas/", "https://www.svt.se/nyheter/inrikes/flera-svenska-universitet-drabbade-i-hackerattack"], "tillsynsskydd_finns": "Lagstiftningen ålägger den drabbade aktören att informera om incidenter och rekommendera åtgärder, men det saknas en samlad operativ stödfunktion för enskilda som drabbas."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.6 Ansvar för användbarhet", "taxonomi_id": "1.6.5", "kategori": "Ansvarsförskjutning", "situation_exempel": "Jag visste inte att den räkningen gick till Kivra och missade betalningen. Påminnelserna gick också till Kivra så mitt ärende hamnade hos Kronofogden.", "radgivning_enskild": "Konsumenternas Bank- och finansbyrå (vägledning om reklamation vid betalningsanmärkning)<br>Hallå konsument (allmän konsumentupplysning)<br>Kronofogden (bestrida betalningsföreläggande)", "radgivning_utforare": "Myndigheten för digital förvaltning (vägledning om digital post)<br>Konsumentverket (vägledning om god kreditgivningssed)<br>Integritetsskyddsmyndigheten (tillsyn vid inkassoverksamhet enligt inkassolagen)", "tvist": "Kronofogden (invändning mot betalningsföreläggande); förvaltningsrätten (om myndighetsbeslut)", "tillsynsmyndighet": "Konsumentverket (tillsyn över god kreditgivningssed)<br>Integritetsskyddsmyndigheten (tillsyn över inkassoverksamhet enligt inkassolagen)<br>Justitieombudsmannen (granskar myndigheters serviceskyldighet vid digital post)", "lagstod": "**Konsumentkreditlagen (2010:1846)** 14 § anger att kreditgivaren ska följa god kreditgivningssed och ta tillvara konsumentens intressen med tillbörlig omsorg.<br>**Inkassolagen (1974:182)** 4 § anger att inkassoverksamhet ska bedrivas enligt god inkassosed och att gäldenären inte får utsättas för otillbörlig påtryckning eller skada.<br>**Förvaltningslagen (2017:900)** 6 § anger att myndigheter ska se till att kontakterna med enskilda blir smidiga och enkla, och lämna den enskilde sådan hjälp att hen kan ta till vara sina intressen. 7 § anger att myndigheter ska vara tillgängliga för kontakter och informera allmänheten om hur och när sådana kan tas.<br>**Regeringsformen (RF)** 1 kap. 2 § anger att det allmänna ska verka för att alla människor ska kunna uppnå delaktighet och jämlikhet i samhället.", "lucka_status": "Nej", "empirisk_kalla": "Svenskarna med funktionsnedsättning och internet 2025::Ett problem med den digitala brevlådan är att det blir ytterligare ett ställe där det kan komma räkningar (s. 49). | Sveriges Radio Plånboken (2020-10-21)::14-årings Kivra-konto ledde till missad post från Skatteverket – hamnade hos Kronofogden. | Raymond, T. (2025) Gotland i en digital tid::It-handledaren på Korpens bibliotek berättar att ett grundläggande problem är att många inte vet om att de har en digital brevlåda. Det har till exempel hänt att personalen har hjälpt någon att logga in och de hittade flera fakturor som redan hade förfallit (s. 79).", "beskrivning": "När handläggning ersätts av digitala självbetjäningsformulär, eller när post omdirigeras till en annan aktörs digitala brevlåda, förskjuts utförandeansvaret till den enskilde. Konsekvenserna av fel, förseningar eller missade notifieringar hamnar då också hos den enskilde.", "lankar": ["https://www.sverigesradio.se/artikel/7579862", "https://dokument.gotland.se/IntegrationService.svc/doc/content/49202"], "tillsynsskydd_finns": "Det saknas krav på att aktörer ska säkerställa att den enskilde faktiskt förstått att handläggning eller post omdirigerats till en digital kanal. Konsekvenserna bärs av den enskilde."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.7 Ansvarsluckor och bristande styrning", "taxonomi_id": "1.7.1", "kategori": "Avsaknad av systemansvar", "situation_exempel": "Jag blev sjukskriven och behövde kontakta Försäkringskassan, Arbetsförmedlingen, kommunen och vårdcentralen – alla med olika inloggningar, regler och handläggare. Ingen kunde ge mig en överblick. Jag vet fortfarande inte om jag missat något jag borde ha gjort.", "radgivning_enskild": "Respektive myndighet (begära fast handläggare och samverkan)<br>Vårdcentralens fasta vårdkontakt eller kurator<br>Patientnämnden (vid frågor om vård- och stödkedjan)<br>Statens servicecenter (samlad hjälp på servicekontor)<br>Finsam (samordnad rehabilitering vid sammansatt behov)", "radgivning_utforare": "Myndigheten för digital förvaltning (vägledning om digital samordning och Ena)<br>Sveriges Kommuner och Regioner (stöd till kommuner och regioner om samverkan)<br>Socialstyrelsen (vägledning om samordnad individuell plan)", "tvist": "Saknas – bristande samverkan mellan myndigheter är inte överklagbart som enskilt beslut.", "tillsynsmyndighet": "Inspektionen för vård och omsorg (tillsyn över vårdkedjan och samordnad individuell plan)<br>Myndigheten för digital förvaltning (samordningsansvar för statlig digital förvaltning)", "lagstod": "**Förvaltningslagen (2017:900)** 6 § anger att myndigheter ska se till att kontakterna med enskilda blir smidiga och enkla, och lämna den enskilde sådan hjälp att hen kan ta till vara sina intressen. 8 § anger att en myndighet inom sitt verksamhetsområde ska samverka med andra myndigheter.<br>**Hälso- och sjukvårdslagen (2017:30)** 7 kap. 2 § anger att regionen ska, om det inte är uppenbart obehövligt, så snart som möjligt utse en fast vårdkontakt för patienten. 7 kap. 3 § anger att om patienten har behov av insatser från både hälso- och sjukvård och socialtjänst ska regionen tillsammans med kommunen upprätta en samordnad individuell plan.<br>**Regeringsformen (RF)** 1 kap. 2 § anger att det allmänna ska verka för att alla människor ska kunna uppnå delaktighet och jämlikhet i samhället.", "lucka_status": "Nej", "empirisk_kalla": "Digg/PTS (2026) Redovisning av uppdraget att stödja genomförandet av Sveriges Digitaliseringsstrategi::Brister i ansvarsfördelning, finansiering och prioritering skapar stuprör mellan initiativ (s. 11). Tre strukturella glapp: (1) ansvar och mandat otydliga vid gemensamma beslut, (2) långsiktig finansiering saknas, (3) inga återkommande processer som väger sektorers behov mot varandra (s. 26–27). | Riksrevisionen (RiR 2023:6) Digitala tjänster till privatpersoner – stora utvecklingsmöjligheter för statliga myndigheter::Det saknas i de flesta fall en samlad plats där man kan få information om vilka myndigheter som ska kontaktas och i vilken ordning, vid en\nviss livshändelse (sid. 36). Det finns enligt Riksrevisionens bedömning inget legalt inslag i den svenska förvaltningsmodellen som hindrar en starkare styrning från regeringen när det gäller utvecklingen av digitala tjänster (sid. 70). |Svenskarna med funktionsnedsättning och internet 2025::Ett problem med den digitala brevlådan är att det blir ytterligare ett ställe där det kan komma räkningar (s. 49). | Digg (2026) Uppdrag att analyser och beskriva möjligheter och utmaningar kopplade till att etablera en digital ingång till det offentliga::Etableringen av en gemensam digital ingång är inte i första hand en teknisk fråga. Den handlar i hög grad om styrning, ansvar och arbetssätt. För att lyckas behöver offentlig förvaltning i större utsträckning agera samlat utifrån människors behov, snarare än utifrån enskilda organisationers uppdrag. En gemensam digital ingång leder inte i sig till sammanhängande tjänster, utan förutsätter att processer, ansvar och datadelning fungerar samordnat över organisationsgränser, och att ansvar ligger hos de aktörer som har ansvar över data, regelverk och processer (s. 2).", "beskrivning": "Aktörer tar ansvar för sin del, men ingen ansvarar för hur systemen samverkar eller vilka barriärer som uppstår i kedjan.", "lankar": ["https://www.digg.se/download/18.4d9d13fe19c34cfab85e4b/1772203531877/Rapport-Uppf%C3%B6ljning-av-digitaliseringsstrategin-feb-2026.pdf", "https://www.riksrevisionen.se/download/18.1e0fa62b19047f61fcc9553/1719239329567/RiR_2023_6_master.pdf", "https://www.begripsam.se/download/18.34c5105e19cf45dbbdba114/1773657022640/SMFOI_2025_huvudrapport_v2.pdf", "https://www.digg.se/download/18.12d3b9fb19d0d4280da64f/1774989242010/Uppdrag%20att%20beskriva%20utmaningar%20och%20mo%CC%88jligheter.pdf"], "tillsynsskydd_finns": "Lagen kräver samverkan mellan myndigheter och samordnad individuell plan i vården, men kraven omfattar inte digitala system. Ingen aktör har ansvar för att de digitala tjänsterna, inloggningarna och informationsflödena hänger ihop. Att navigera fragmenteringen förskjuts till den enskilde"}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.7 Ansvarsluckor och bristande styrning", "taxonomi_id": "1.7.2", "kategori": "Otydliga styrkedjor", "situation_exempel": "Min region bytte journalsystem och nu kan personalen inte se min läkemedelshistorik ordentligt – risken för feldosering har ökat", "radgivning_enskild": "Patientnämnden (vid frågor om vården)<br>1177 (vårdguiden)<br>Ansvarig vårdgivare (synpunkter och klagomål)", "radgivning_utforare": "Myndigheten för digital förvaltning (vägledning om Ena, gemensam digital infrastruktur och interoperabilitet)<br>E-hälsomyndigheten (vägledning om nationell digital infrastruktur i vården)<br>Sveriges Kommuner och Regioner (stöd till regioner vid systembyten)<br>Inera (gemensam digital infrastruktur för kommuner och regioner)", "tvist": "IVO (tillsynsbeslut vid patientsäkerhetsrisk)", "tillsynsmyndighet": "Inspektionen för vård och omsorg (tillsyn över patientsäkerhet och vårdkvalitet)<br>Myndigheten för digital förvaltning (samordningsansvar för statlig digital förvaltning)<br>Post- och telestyrelsen (föreslagen behörig myndighet enligt dataförordningen)<br>Läkemedelsverket (tillsyn över medicintekniska produkter)<br>Justitieombudsmannen (granskar enskilda fall av myndighetsutövning)", "lagstod": "**Hälso- och sjukvårdslagen (2017:30)** 3 kap. 1 § anger att målet med hälso- och sjukvården är en god hälsa och vård på lika villkor för hela befolkningen. 5 kap. 1 § anger att vården ska vara av god kvalitet och tillgodose patientens behov av trygghet, kontinuitet och säkerhet.<br>**Patientdatalagen (2008:355)** 3 kap. 1 § anger att en patientjournal ska föras för varje patient. 6 kap. anger förutsättningarna för sammanhållen journalföring mellan vårdgivare.<br>**Förordning (EU) 2023/2854 om harmoniserade regler för skälig åtkomst till och användning av data (dataförordningen)** art. 23 anger att leverantörer av databehandlingstjänster ska vidta åtgärder för att möjliggöra byte av tjänst utan oskäliga hinder. Art. 33 anger interoperabilitetskrav för deltagare i dataområden.<br>**Förordning (EU) 2018/1724 om en gemensam digital ingång (SDG-förordningen)** anger principen om en uppgift en gång (once-only-principen) inom EU:s inre marknad.<br>**Förvaltningslagen (2017:900)** 8 § anger att en myndighet inom sitt verksamhetsområde ska samverka med andra myndigheter.<br>**Regeringsformen (RF)** 1 kap. 2 § anger att det allmänna särskilt ska trygga rätten till hälsa och social omsorg.", "lucka_status": "Delvis", "empirisk_kalla": "SVT (2026-03-06) Allvarliga kritiken mot nya journalsystemet Cosmic::En allvarlig brist är svårigheterna att följa en patients läkemedelshistorik i systemet, menar läkemedelskommittén i region Västernorrland. Något som de menar ökar risken för feldoseringar. | Svensk farmaci (2025-08-13) Fel i Cosmic gör att patienter riskerar att få fel läkemedel::Buggar i journalsystemet Cosmic gjorde att remisser såg ut att försvinna och patienter riskerade att få fel läkemedel. Felet gällde samtliga Cosmic-regioner. Vårdbolaget Praktikertjänst anmälde Cosmic till Läkemedelsverket två veckor efter att journalsystemet hade införts i Region Gävleborg. Felet hade tidigare anmälts av tillverkaren Cambio men kvarstod i flera versioner (4.0–4.2).", "beskrivning": "Det är oklart vem som ska agera när problem uppstår, särskilt i samverkande system där flera myndigheter och leverantörer är inblandade. Parallella nationella infrastrukturer (Ena, NDI, sektorspecifika satsningar) byggs utan explicit samordning.", "lankar": ["https://www.svt.se/nyheter/lokalt/vasternorrland/allvarliga-kritiken-mot-nya-journalsystemet-coscmic", "https://www.svenskfarmaci.se/2025/08/13/fel-i-cosmic-gor-att-patienter-riskerar-att-fa-fel-lakemedel/"], "tillsynsskydd_finns": "Lagar om vårdkvalitet och patientsäkerhet adresserar utfallet, inte hur digitala system samverkar. Parallella nationella infrastrukturer (SDK, Ena, NDI) byggs av olika aktörer utan tydlig handlingsordning när problem uppstår."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.7 Ansvarsluckor och bristande styrning", "taxonomi_id": "1.7.3", "kategori": "Bristande konsekvensanalys", "situation_exempel": "Hemtjänsten gick över till digital matbeställning utan att utreda om jag klarar det – jag har svårt att se och beställer samma saker varje vecka", "radgivning_enskild": "Kommunens biståndshandläggare (vid frågor om utformningen av insatser)<br>Patientnämnden (vid frågor om vården)<br>Diskrimineringsombudsmannen (anmälan om bristande tillgänglighet)", "radgivning_utforare": "Inspektionen för vård och omsorg (vägledning om välfärdsteknik och kvalitet i omsorg)<br>Socialstyrelsen (vägledning om digital teknik enligt socialtjänstlagen)<br>Sveriges Kommuner och Regioner (stöd till kommuner)<br>Institutet för mänskliga rättigheter (vägledning om konsekvensbedömningar utifrån mänskliga rättigheter)", "tvist": "IVO (om insatsen inte möter behovet); JO", "tillsynsmyndighet": "Inspektionen för vård och omsorg (tillsyn över omsorgskvalitet och välfärdsteknik)<br>Diskrimineringsombudsmannen (tillsyn enligt diskrimineringslagen)<br>Justitieombudsmannen (granskar enskilda fall av myndighetsutövning)<br>Institutet för mänskliga rättigheter (granskar Sveriges efterlevnad av mänskliga rättigheter)", "lagstod": "**Socialtjänstlagen (2025:400)** 2 kap. 4 § anger att kommunens insatser inom socialtjänsten ska vara av god kvalitet och utformas så att de blir lätt tillgängliga. 8 kap. 2 § anger G34:J35att äldre personer ska, så långt det är möjligt, få välja när och hur stöd och hjälp i boendet och annan lättåtkomlig service ska ges. 8 kap. 3 § anger att äldre personer ska få leva ett värdigt liv och känna välbefinnande.<br>**Konsekvensutredningsförordningen (2024:183)** 5–6 §§ anger vilka konsekvenser som ska beskrivas vid utarbetande av föreskrifter, inklusive ekonomiska konsekvenser, men anger inte krav på analys av exkluderingseffekter eller tillgänglighetskonsekvenser för enskilda.<br>**Diskrimineringslagen (2008:567)** 1 kap. 4 § anger att bristande tillgänglighet för en person med funktionsnedsättning utgör diskriminering om skäliga åtgärder för tillgänglighet inte vidtagits.<br>**Regeringsformen (RF)** 1 kap. 2 § anger att det allmänna särskilt ska trygga rätten till social omsorg och verka för att alla människor ska kunna uppnå delaktighet och jämlikhet i samhället.", "lucka_status": "Nej", "empirisk_kalla": "Sveriges Radio (2026-02-12) Äldre tvingas handla mat digitalt – Johan: ”Blev omöjligt”::I minst 120 kommuner har hemtjänstpersonal slutat handla i fysisk butik. SKR kallar det en \"nödvändig effektiviserande åtgärd\". | Begripsam (2025) Utestängd från det kontantlösa samhället::Hemtjänstpersonal beskriver att digitala matinköp leder till att brukare beställer kakor och godis istället för riktig mat (s. 21). | Institutet för mänskliga rättigheter (2026) Årsrapport 2026::I våra remissvar påpekar vi återkommande att statliga utredningar i många fall saknar tillräckliga konsekvensbedömningar utifrån mänskliga rättigheter, vilket försvårar möjligheten att tidigt se risker och göra tydliga avvägningar och proportionalitetsbedömningar (s. 34).", "beskrivning": "Digitala lösningar införs utan att strukturella exkluderingsrisker analyseras. Konsekvensutredningsförordningen (SFS 2024:183) kräver analys av kostnader och intäkter men inte av exkluderingseffekter eller tillgänglighetskonsekvenser.", "lankar": ["https://www.sverigesradio.se/artikel/allt-fler-aldre-med-hemtjanst-maste-handla-mat-digitalt", "https://www.begripsam.se/download/18.4fd9741419ac5edf2a463b49/1764751364652/Rapport%20Utesta%CC%88ngd%20fra%CC%8An%20det%20kontantlo%CC%88sa%20samha%CC%88llet%20december%202025.pdf", "https://mrinstitutet.se/download/18.234277b219d0483f491b63a/1774331817101/Rapport-Arsrapport-2026.pdf"], "tillsynsskydd_finns": "Konsekvensutredningar enligt 2024:183 fokuserar på ekonomiska konsekvenser och inte på strukturella exkluderingsrisker. Det saknas systematiska verktyg för analys av konsekvenserna för den enskilde innan digitala lösningar införs."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.7 Ansvarsluckor och bristande styrning", "taxonomi_id": "1.7.4", "kategori": "Regelverk som skapar oavsiktlig exkludering", "situation_exempel": "Banken stängde mitt företagskonto för att kunderna inte uppfyllde kundkännedomskraven – nu är jag utan betalkonto, utan BankID och kan inte betala skatt, räkningar eller skicka pengar till min dotter", "radgivning_enskild": "Konsumenternas Bank- och finansbyrå (vägledning för konsumenter)<br>Länsstyrelsen (vägledning om grundläggande betaltjänster)<br>Kommunal budget- och skuldrådgivning", "radgivning_utforare": "Finansinspektionen (vägledning om betalkontodirektivet och kundkännedom)<br>Länsstyrelsen (bevakningsuppdrag inom grundläggade betaltjänster)", "tvist": "ARN bankavdelningen (ej bindande); allmän domstol", "tillsynsmyndighet": "Finansinspektionen (tillsyn över banker och betaltjänstleverantörer)<br>Konsumentverket (tillsyn över konsumentskydd vid betaltjänster)<br>Riksbanken (bevakar betalningsmarknadens utveckling)<br>Justitieombudsmannen (granskar enskilda fall av myndighetsutövning)", "lagstod": "**Lagen om betaltjänster (2010:751)** 4 a kap. 1 § anger att en konsument som är lagligen bosatt inom Europeiska ekonomiska samarbetsområdet har rätt att hos en kreditinstitut öppna och använda ett betalkonto med grundläggande funktioner. 4 a kap. 2 § anger att kreditinstitutet får avslå en ansökan om det skulle strida mot lagen om åtgärder mot penningtvätt och finansiering av terrorism.<br>**Lagen om åtgärder mot penningtvätt och finansiering av terrorism (2017:630)** 3 kap. 1 § anger att en verksamhetsutövare ska ha tillräcklig kännedom om sina kunder för att kunna hantera den risk för penningtvätt eller finansiering av terrorism som kan förknippas med kundrelationen. 3 kap. 4 § anger att en verksamhetsutövare inte får etablera eller upprätthålla en affärsförbindelse om kundkännedom inte uppnåtts.<br>**Regeringsformen (RF)** 1 kap. 2 § anger att det allmänna ska verka för att alla människor ska kunna uppnå delaktighet och jämlikhet i samhället.", "lucka_status": "Nej", "empirisk_kalla": "Länsstyrelserna (2025) När betaltjänster är otillgängliga – Berättelser från verkligheten::Persona Anders (52 år) fick sitt betalkonto uppsagt pga penningtvättsregler. Anders nekas nytt konto pga betalningsanmärkning. Skulder har vuxit men kommunens skuldrådgivning nekade hjälp för att gården räknas som näringsverksamhet. | Riksbanken (2026) Betalningsrapporten 2026::Riksbanken anser att bankerna, riksdagen och regeringen behöver göra mer för att inkludera fler på betalningsmarknaden. För det första bör bankerna alltid pröva riskreducerande åtgärder innan de nekar eller avslutar ett betalkonto. Finansinspektionen ska ge ut vägledning på området, vilket kommer hjälpa bankerna att göra korrekta bedömningar när penningtvättsregelverket hamnar i konflikt med rätten till ett betalkonto. För det andra anser Riksbanken att det behövs en lösning för att även personer som saknar ett betalkonto eller upplever digitalt utanförskap ska kunna göra nödvändiga betalningar, som att betala räkningar. Riksbanken menar att det bör gå att ta fram enhetliga alternativ som kan erbjudas i hela landet (s. 55).", "beskrivning": "Regelverk som penningtvättlagen eller kundkännedomsregler kan oavsiktligt utestänga invånare och företag. Problemet uppstår när olika myndigheters regelverk inte är samordnade eller när implementeringen inte tar hänsyn till de grupper som lagen avser att skydda.", "lankar": ["https://www.lansstyrelsen.se/download/18.1dda0708198e5f6fa8112688/1756382206490/N%C3%A4r%20betaltj%C3%A4nster%20%C3%A4r%20otillg%C3%A4ngliga%20Ber%C3%A4ttelser%20fr%C3%A5n%20verkligheten%202025.pdf", "https://www.riksbank.se/sv/betalningar--kontanter/sa-betalar-svenskarna/betalningsrapport-2026/"], "tillsynsskydd_finns": "Finansinspektionen granskar kundkännedom och betalkontodirektivet separat, men ingen myndighet äger konflikten mellan regelverken. När penningtvättslagen och rätten till betalkonto kommer i konflikt får bankerna i praktiken tolkningsföreträde."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.7 Ansvarsluckor och bristande styrning", "taxonomi_id": "1.7.5", "kategori": "Tillsynskapacitet", "situation_exempel": "Myndighetens webbplats är inte tillgänglig för mig som synskadad. Jag anmäler det men inget händer.", "radgivning_enskild": "Myndigheten för digital förvaltning (anmäl bristande tillgänglighet)<br>Diskrimineringsombudsmannen (anmälan om bristande tillgänglighet som diskriminering)<br>Respektive myndighet (begära åtgärd direkt)", "radgivning_utforare": "Myndigheten för digital förvaltning (vägledning om webbtillgänglighet och WCAG)<br>Myndigheten för delaktighet (vägledning om tillgänglighet ur funktionsrättsperspektiv)", "tvist": "Förvaltningsrätten (överklagande av Diggs tillsynsbeslut); DO (diskrimineringsärende)", "tillsynsmyndighet": "Myndigheten för digital förvaltning (tillsyn enligt lagen om tillgänglighet till digital offentlig service)<br>Riksrevisionen (granskar effektivitet och resursanvändning i statsförvaltningen)<br>Justitieombudsmannen (granskar enskilda fall av myndighetsutövning)", "lagstod": "**Lagen om tillgänglighet till digital offentlig service (2018:1937)** anger att digital offentlig service ska vara möjlig att uppfatta, hanterbar, begriplig och robust och utpekar Myndigheten för digital förvaltning som tillsynsmyndighet.<br>**Förordning (2016:1048) med instruktion för Myndigheten för digital förvaltning** anger att myndigheten ska bedriva tillsyn över att den offentliga förvaltningen uppfyller kraven på tillgänglighet enligt lagen om tillgänglighet till digital offentlig service.<br>**Regeringsformen (RF)** 1 kap. 6 § anger att regeringen styr riket och 8 § anger att förvaltningsmyndigheter lyder under regeringen, vilket inkluderar regeringens ansvar för att tilldela myndigheter tillräckliga resurser för sina uppdrag.<br>**Förenta nationernas konvention om rättigheter för personer med funktionsnedsättning (CRPD)** art. 9 anger att konventionsstaterna ska vidta ändamålsenliga åtgärder för att säkerställa att personer med funktionsnedsättning får tillgång på lika villkor som andra till information och kommunikation.", "lucka_status": "Nej", "empirisk_kalla": "Riksrevisionen (RiR 2023:6) Digitala tjänster till privatpersoner – stora utvecklingsmöjligheter för statliga myndigheter::Digg bedriver inte tillsyn i den utsträckning EU kräver, vilket är 309 webbplatser och 17 appar per år. Enligt Diggs budgetunderlag för 2023–2025 räcker de medel som Digg får för uppdraget bara till övervakning av ungefär 40 procent av vad EU-kommissionen har beslutat om (s. 59-60). | Digg/PTS (2026) Redovisning av uppdraget att stödja genomförandet av Sveriges Digitaliseringsstrategi::Mätningar av webbplatser och appar visar fortfarande stora tillgänglighetsbrister inom både offentlig och privat sektor (s. 35). | Integritetsskyddsmyndigheten, IMY (2026)  Årsredovisning 2025::Inom tillsynsverksamheten konstaterar myndigheten att handläggningstiden fortsatt är för lång och att myndigheten som tidigare år inlett i huvudsak klagomålsbaserade tillsyner. En av myndighetens främsta prioriteringar är att öka det egeninitierade tillsynsarbetet. | Begripsam (2026) Svenskarna med funktionsnedsättning och internet:: Våra mätningar började 2017 och sträcker sig snart över en 10-årsperiod. Det är samma kritik som återkommer om och om igen. Att förbättringar kan ha svårt att slå igenom mellan två mätningar kan vara acceptabelt men att det inte går att spåra förbättringar över så långa mätperioder tyder på att de insatser som görs inte är tillräckliga (s. 17).", "beskrivning": "Tillsyn över digitala samhällsfunktioner förutsätter att tillsynsmyndigheter har tillräckliga resurser och stödfunktioner för att utöva det mandat de tilldelats.", "lankar": ["https://www.riksrevisionen.se/download/18.1e0fa62b19047f61fcc9553/1719239329567/RiR_2023_6_master.pdf", "https://www.digg.se/download/18.4d9d13fe19c34cfab85e4b/1772203531877/Rapport-Uppf%C3%B6ljning-av-digitaliseringsstrategin-feb-2026.pdf", "https://www.imy.se/globalassets/dokument/arsredovisningar/imy-arsredovisning-2025.pdf", "https://www.begripsam.se/download/18.34c5105e19cf45dbbdba114/1773657022640/SMFOI_2025_huvudrapport_v2.pdf"], "tillsynsskydd_finns": "När tillsynskapaciteten inte är dimensionerad efter uppdragets omfattning blir skyddet svagt i praktiken trots att det rättsliga ramverket finns."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.7 Ansvarsluckor och bristande styrning", "taxonomi_id": "1.7.6", "kategori": "Effektivitetslogik och förvaltningsmässig inlåsning", "situation_exempel": "Kommunen räknade på vad de sparar genom att skicka post digitalt –  men inte på vad jag behöver för att ta emot digital post, att mina anhöriga lägger timmar på att hjälpa mig, eller vad som händer när jag missar ett brev och hamnar hos Kronofogden eller missar en läkartid.", "radgivning_enskild": "Respektive myndighet (begära fysisk post)<br> Kommunal konsumentvägledning", "radgivning_utforare": "Myndigheten för digital förvaltning (vägledning om digital post)<br>Ekonomistyrningsverket (vägledning om nyttorealisering)", "tvist": "Förvaltningsrätten", "tillsynsmyndighet": "Riksrevisionen (granskar effektivitet och måluppfyllelse i statsförvaltningen)<br>Diskrimineringsombudsmannen (tillsyn enligt diskrimineringslagen)<br>Justitieombudsmannen (granskar enskilda fall av myndighetsutövning)", "lagstod": "**Konsekvensutredningsförordningen (2024:183)** 5–6 §§ anger vilka konsekvenser som ska beskrivas vid utarbetande av föreskrifter, inklusive ekonomiska konsekvenser. Förordningen anger inte krav på analys av effekter för den enskilde eller för dennes anhöriga.<br>**Förvaltningslagen (2017:900)** 6 § anger att myndigheter ska se till att kontakterna med enskilda blir smidiga och enkla, och lämna den enskilde sådan hjälp att hen kan ta till vara sina intressen.<br>**Diskrimineringslagen (2008:567)** 1 kap. 4 § anger att bristande tillgänglighet för en person med funktionsnedsättning utgör diskriminering om skäliga åtgärder för tillgänglighet inte vidtagits.<br>**Regeringsformen (RF)** 1 kap. 2 § anger att det allmänna ska verka för att alla människor ska kunna uppnå delaktighet och jämlikhet i samhället.", "lucka_status": "Nej", "empirisk_kalla": "Raymond, T. (2025) Gotland i en digital tid::Genomgång av Ineras nyttokalkylmall visar att poster för invånarens och anhörigas kostnader saknas (s. 71–72). | Riksrevisionen (2025) Statliga strategiska digitaliseringsprojekt – stora gemensamma utmaningar. RiR 2025:8::Riksrevisionen konstaterar att en klar majoritet av myndigheterna inte har arbetat systematiskt med nyttorealisering i sina strategiska digitaliseringsprojekt. I många fall saknas viktiga delar av processen för nyttorealisering, såsom nyttoberäkning, analys av nyttorisk, uppskattning av driftkostnader, nollmätning och utvärdering av realiserade nyttor. Detta beror ofta på att myndigheter saknar resurser eller relevanta rutiner (s. 7). | Institutet för mänskliga rättigheter (2026) Årsrapport 2026::I våra remissvar påpekar vi återkommande att statliga utredningar i många fall saknar tillräckliga konsekvensbedömningar utifrån mänskliga rättigheter, vilket försvårar möjligheten att tidigt se risker och göra tydliga avvägningar och proportionalitetsbedömningar (s. 34).", "beskrivning": "Offentlig digitalisering styrs ofta genom snäva nyttokalkyler utan att väga in tillgänglighet, rättvisa eller den enskildes inflytande. Organisationens behov av styrning och kontroll kan göra det omöjligt att avvika från digitala rutiner, även när den enskildes behov kräver det.", "lankar": ["https://dokument.gotland.se/IntegrationService.svc/doc/content/49202", "https://www.riksrevisionen.se/granskningar/granskningsrapporter/2025/statliga-strategiska-digitaliseringsprojekt---stora-gemensamma-utmaningar.html", "https://mrinstitutet.se/download/18.234277b219d0483f491b63a/1774331817101/Rapport-Arsrapport-2026.pdf"], "tillsynsskydd_finns": "Standardmall för nyttokalkyl saknar rutinmässigt poster för invånarens kostnader. Konsekvensutredningsförordningen kräver analys av ekonomiska konsekvenser men ger ingen vägledning om hur tillgänglighet, rättvisa eller den enskildes inflytande ska vägas in."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.8 Digital beredskap", "taxonomi_id": "1.8.1", "kategori": "Informationssäkerhet", "situation_exempel": "Jag har ringt sjukvårdsrådgivningen 1177 flera gånger. När jag läser i tidningen att miljoner inspelade samtal till 1177 har legat öppet på internet undrar jag: är mina samtal också där? Är det farligt?", "radgivning_enskild": "Den aktör som drabbats av incidenten (informationsplikt enligt dataskyddsförordningen art. 34)<br>Integritetsskyddsmyndigheten (klagomål om personuppgiftsbehandling)<br>Patientnämnden (för frågor om hälso- och sjukvård)", "radgivning_utforare": "Integritetsskyddsmyndigheten (vägledning om informationssäkerhet och personuppgiftsincidenter enligt art. 32–34)<br>Myndigheten för civilt försvar (vägledning om cyberincidenthantering och NIS2)<br>Socialstyrelsen (vägledning om informationssäkerhet i vård och omsorg)", "tvist": "", "tillsynsmyndighet": "Integritetsskyddsmyndigheten (tillsyn enligt dataskyddsförordningen art. 32 om säkerhet vid behandling)<br>Myndigheten för civilt försvar (tillsyn enligt cybersäkerhetslagen)<br>Inspektionen för vård och omsorg (tillsyn över informationssäkerhet i hälso- och sjukvården)<br>Justitieombudsmannen (granskar enskilda fall av myndighetsutövning)", "lagstod": "**Dataskyddsförordningen (GDPR 2016/679)** art. 32 anger att den personuppgiftsansvarige och personuppgiftsbiträdet ska vidta lämpliga tekniska och organisatoriska åtgärder för att säkerställa en säkerhetsnivå som är lämplig i förhållande till risken. Art. 33–34 anger anmälningsplikt vid personuppgiftsincidenter och informationsplikt till den registrerade.<br>**Cybersäkerhetslagen (2025:1506)** anger krav på samhällsviktiga och digitala aktörer att hantera cyberincidenter och rapportera till Myndigheten för civilt försvar. Lagen genomför direktiv (EU) 2022/2555 (NIS2).<br>**Patientdatalagen (2008:355)** 2 kap. 7 § anger att den som är personuppgiftsansvarig för en behandling av personuppgifter ska se till att behandlingen utförs i enlighet med dataskyddsförordningen och denna lag. 4 kap. anger krav på behörighetsstyrning och åtkomstkontroll inom hälso- och sjukvården.", "lucka_status": "Delvis", "empirisk_kalla": "Integritetsskyddsmyndigheten (2021) Beslut efter tillsyn enligt dataskyddsförordningen mot Voice Integrate Nordic AB (DI-2019-2488)::Mellan 650 000 och 900 000 samtal till Sjukvårdsupplysningen 1177 spelades in och lagrades som ljudfiler i lagringsservern Voice NAS. En stor mängd hälsouppgifter har därigenom exponerats utan skydd och under okänd tid varit åtkomliga för alla som har en internetuppkoppling. Beslut om sanktionsavgift om 650 000 kronor  (s. 11). | Riksrevisionen (2024) Informationssäkerhet i vård och omsorg – statens stöd och tillsyn::Varken Myndigheten för civilt försvar, Integritetsskyddsmyndigheten eller Socialstyrelsen anser sig ha ansvar att tillgodose vårdens och omsorgens behov av specifikt stöd. Myndigheterna arbetar också i stuprör och har inte samverkat eller samordnat sina insatser när de utformar sitt stöd (s. 5). Sedan 2018, när dataskyddsförordningen och lagen om informationssäkerhet för samhällsviktiga och digitala tjänster (NIS-lagen) trädde i kraft, har Integritetsskyddsmyndigheten (IMY) och Inspektionen för vård och omsorg (IVO) genomfört få tillsynsärenden av vårdgivare och inga alls av omsorgsgivare. | Integritetsskyddsmyndigheten, IMY (2026) Årsredovisning 2025::Under 2025 ökade antalet inkomna personuppgiftsincidenter betydligt, nästan en fördubbling jämfört med föregående år (s. 32). Antalet berörda registrerade uppgick totalt till mer än 1,5 miljoner (s. 34).", "beskrivning": "När samhällsviktiga tjänster brister i informationssäkerhet drabbas också den enskilde. Uppgifter kan röjas, ändras felaktigt eller bli otillgängliga. Skydd av sådana tjänster är därför inte enbart en teknisk eller upphandlingsfråga utan en förutsättning för att rättigheter ska kunna utövas.", "lankar": ["https://www.imy.se/globalassets/dokument/beslut/2021/2021-06-07-beslut-voice-integrate.pdf", "https://www.riksrevisionen.se/granskningar/granskningsrapporter/2024/informationssakerhet-i-vard-och-omsorg---statens-stod-och-tillsyn.html", "https://www.imy.se/globalassets/dokument/arsredovisningar/imy-arsredovisning-2025.pdf"], "tillsynsskydd_finns": "Granskningen av informationssäkerheten i samhällsviktiga tjänster är fördelad mellan flera aktörer som arbetar i stuprör."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.8 Digital beredskap", "taxonomi_id": "1.8.2", "kategori": "Digital suveränitet och kritiska beroenden", "situation_exempel": "Jag är student och har fått besked om att personuppgifter kan ha läckt vid ett dataintrång hos den amerikanska leverantören av lärplattformen Canvas. Mitt universitet säger att det på kort sikt inte finns alternativ till tjänsten.", "radgivning_enskild": "Den aktör som drabbats av incidenten (informationsplikt enligt dataskyddsförordningen art. 34)<br>Det egna lärosätets dataskyddsombud<br>Integritetsskyddsmyndigheten (klagomål om personuppgiftsbehandling)", "radgivning_utforare": "Integritetsskyddsmyndigheten (vägledning om tredjelandsöverföringar enligt dataskyddsförordningens kap. V)<br>Myndigheten för digital förvaltning, Digg (vägledning om Ena, statlig digital infrastruktur)<br>Myndigheten för civilt försvar (vägledning om kontinuitetshantering och NIS2)<br>Upphandlingsmyndigheten (vägledning om kontraktsvillkor, exitvillkor och dataskydd vid upphandling)", "tvist": "", "tillsynsmyndighet": "Integritetsskyddsmyndigheten (tillsyn över personuppgiftsbehandling och tredjelandsöverföringar)<br>Myndigheten för civilt försvar (tillsyn enligt cybersäkerhetslagen)<br>Riksrevisionen (granskar effektivitet och måluppfyllelse i statsförvaltningen)", "lagstod": "**Dataskyddsförordningen (GDPR 2016/679)** kap. V (art. 44–50) reglerar överföring av personuppgifter till tredjeland. Överföring är endast tillåten om mottagarlandet säkerställer en adekvat skyddsnivå eller om lämpliga skyddsåtgärder vidtagits. EU-domstolens dom i Schrems II (C-311/18) underkände Privacy Shield-avtalet med USA och ställde krav på kompletterande skyddsåtgärder vid överföringar till länder utan adekvat skyddsnivå.<br>**Cybersäkerhetslagen (2025:1506)** anger krav på samhällsviktiga och digitala aktörer att hantera leverantörsrisker och rapportera incidenter. Lagen genomför direktiv (EU) 2022/2555 (NIS2).<br>**Förordning (EU) 2023/2854 (dataförordningen, Data Act)** art. 23–35 ställer krav på molntjänstleverantörer att underlätta byte mellan tjänster och undanröja hinder för portabilitet.", "lucka_status": "Nej", "empirisk_kalla": "Integritetsskyddsmyndigheten (2026-05-08) Dataintrång mot läroplattformen Canvas::Lärplattformen Canvas, som tillhandahålls av den amerikanska leverantören Instructure, har utsatts för ett dataintrång. Cirka 30 svenska lärosäten är drabbade. | Riksrevisionen (2025) Statliga strategiska digitaliseringsprojekt – stora gemensamma utmaningar (RiR 2025:8)::Digitaliseringsrådet har föreslagit tydliga riktlinjer från statens sida för offentlig sektors användning av (privata) molntjänster (s. 65). | Forbrukerrådet (2026) Breaking Free – Pathways to a fair technological future::Inlåsningseffekter, höga byteskostnader och brist på fungerande alternativ gör att marknadsdynamiken – som annars skulle få konsumenter att byta leverantör – ofta saknas i den digitala ekonomin (s. 14). EU ifrågasätter alltmer sitt beroende av nästan uteslutande amerikansk digital infrastruktur, vilket har lett till initiativ som Eurostack med syfte att lägga grunden för en europeisk digital infrastruktur (s. 69).", "beskrivning": "När centrala digitala funktioner är beroende av leverantörer i andra jurisdiktioner blir den enskildes rättighetsskydd avhängigt förhållanden utanför svensk kontroll. Att säkra alternativ till sådana beroenden är en förutsättning för att rättigheter ska gälla också i förändrade omständigheter.", "lankar": ["https://www.imy.se/nyheter/dataintrang-mot-laroplattformen-canvas/", "https://www.riksrevisionen.se/granskningar/granskningsrapporter/2025/statliga-strategiska-digitaliseringsprojekt---stora-gemensamma-utmaningar.html", "https://storage02.forbrukerradet.no/media/2026/02/breaking-free-pathways-to-a-fair-technological-future.pdf"], "tillsynsskydd_finns": "Ingen myndighet har ett samlat ansvar för att granska offentlig sektors beroenden av utländska leverantörer. Tredjelandsöverföringar granskas av Integritetsskyddsmyndigheten, men inte som strategisk fråga utan reaktivt vid klagomål eller incidenter."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.8 Digital beredskap", "taxonomi_id": "1.8.3", "kategori": "Kriskommunikation som når alla", "situation_exempel": "Under pandemin uppmanades alla att kontakta vården digitalt istället för fysiskt. Jag kan inte använda 1177.se eller BankID på egen hand. Jag tillhörde samtidigt en riskgrupp. Hur var jag tänkt att få min vård?", "radgivning_enskild": "Den utförare som har gett uppmaningen (kontakta för anpassning eller alternativ)<br>Patientnämnden (för frågor om hälso- och sjukvård)<br>Diskrimineringsombudsmannen (anmälan vid bristande tillgänglighet som diskriminering)", "radgivning_utforare": "Myndigheten för digital förvaltning, Digg (vägledning om tillgänglighet enligt DOS-lagen och WCAG 2.1)<br>Myndigheten för delaktighet, MFD (vägledning om funktionshindersperspektiv i krisberedskap)<br>Myndigheten för civilt försvar (vägledning om kriskommunikation och VMA)<br>Socialstyrelsen (vägledning om vård och omsorg under kris)", "tvist": "", "tillsynsmyndighet": "Myndigheten för digital förvaltning, Digg (tillsyn över DOS-lagen)<br>Diskrimineringsombudsmannen (tillsyn enligt diskrimineringslagen vid bristande tillgänglighet)<br>Inspektionen för vård och omsorg (tillsyn över vårdens tillgänglighet)<br>Justitieombudsmannen (granskar enskilda fall av myndighetsutövning)", "lagstod": "**Lagen (2018:1937) om tillgänglighet till digital offentlig service (DOS-lagen)** 9–13 §§ ställer krav på att digital offentlig service ska följa tillgänglighetskraven i harmoniserad standard EN 301 549 (WCAG 2.1 nivå AA). 13 § anger att tjänster ska vara möjliga att uppfatta, hanterbara, begripliga och robusta.<br>**Diskrimineringslagen (2008:567)** 1 kap. 4 § anger att bristande tillgänglighet för en person med funktionsnedsättning utgör diskriminering om skäliga åtgärder för tillgänglighet inte vidtagits.<br>**Hälso- och sjukvårdslagen (2017:30)** 3 kap. 1 § anger att målet med hälso- och sjukvården är en god hälsa och en vård på lika villkor för hela befolkningen.<br>**FN:s konvention om rättigheter för personer med funktionsnedsättning** art. 11 anger att konventionsstaterna ska vidta nödvändiga åtgärder för att säkerställa skydd och säkerhet för personer med funktionsnedsättning i risksituationer, inklusive humanitära nödlägen.", "lucka_status": "Nej", "empirisk_kalla": "Myndigheten för delaktighet (2025) Krisberedskap för alla – Om kommunal krisberedskap för personer med funktionsnedsättning (2025:1)::67 procent av kommunerna uppger att de saknar rutiner eller arbetssätt för att säkerställa att information kan nå alla kommuninvånare med\nfunktionsnedsättning i händelse av kris eller krig (s. 55). Enligt FN:s kommitté för rättigheter för personer med funktionsnedsättning saknar Sverige en effektiv kommunikation i risk- och katastrofsituationer för personer med funktionsnedsättning, särskilt för personer med intellektuella,\nneuropsykiatriska och psykiska funktionsnedsättningar och personer med neurodivergens (s. 15–16). | Pettersson, L. m.fl. (2025) Accessibility of eHealth Before and During the COVID-19 Pandemic Among People With and People Without Impairment: Repeated Cross-Sectional Survey::eHealth services were not accessible to some groups of people who were identified as being at risk of severe disease during the COVID-19 pandemic. This implies that all people could not use eHealth as a measure of infection protection. | Slutbetänkande av Coronakommissionen (2022) Sverige under pandemin. Volym 2. Förutsätningar, vägval och utvärdering (SOU 2022:10)::Informationsgivningen till personer med funktionsnedsättning har inte fungerat fullt tillfredsställande och språkliga översättningar kom alldeles för sent från den nationella nivån och samordnades inte i tillräckligt stor utsträckning (s. 549).  | Nationellt organ för dialog och samråd mellan regeringen och det civila samhället (NOD) (2020-06-08) Kortrapport (v. 23)::Informationstillgängligheten har varit undermålig, där många organisationer fått tolka, förtydliga och sprida informationen om smittskydd och riskgrupper på ett tillgänglighetsanpassat sätt. Den digitala omställningen av verksamheten har varit svår för många inom rörelsen, då medlemmar ofta står utanför det digitala samhället och de digitala verktygen sällan har en utformning som gör att de lätt går att använda med exempelvis hörsel- eller synnedsättning.", "beskrivning": "När kriskommunikation förmedlas i digitala kanaler nås inte alla. Räckvidden är en förutsättning för att den enskilde ska kunna agera för sin egen och andras säkerhet i kris och höjd beredskap.", "lankar": ["https://www.mfd.se/material/publikationer/rapport/krisberedskap-for-alla/", "https://publichealth.jmir.org/2025/1/e64707/", "https://www.regeringen.se/contentassets/fd48596c00214a47bcbbeb8580c3853d/sverige-under-pandemin-volym-2_webb.pdf", "https://www.nodsverige.se/kortrapport-v-23/"], "tillsynsskydd_finns": "Tillgänglighetskraven i DOS-lagen och diskrimineringslagen träffar enskilda gränssnitt och enskilda tjänster, inte den samlade frågan om vem som faktiskt nås av ett myndighetsbudskap."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.1 Ekonomisk utsatthet", "taxonomi_id": "2.1.1", "kategori": "Fattigdom", "situation_exempel": "Kommunen nekar mig dator eftersom jag har en smartphone – men på den lilla skärmen är det svårt att fylla i formulär och bifoga bilagor.", "radgivning_enskild": "Kommunens socialtjänst (ansökan om ekonomiskt bistånd)<br>Folkbiblioteket (låna dator)<br>Kommunal budget- och skuldrådgivning", "radgivning_utforare": "Socialstyrelsen (vägledning om ekonomiskt bistånd och allmänna råd om skälighetsbedömning)<br>Sveriges Kommuner och Regioner (stöd till kommuner om tillämpning av socialtjänstlagen)", "tvist": "Förvaltningsrätten (överklaga biståndsbeslut); kammarrätten", "tillsynsmyndighet": "Inspektionen för vård och omsorg (tillsyn över socialtjänstens insatser).<br> Länsstyrelsen (tillsyn över kommunens socialtjänst i länet).<br> Justitieombudsmannen (granskar handläggning hos socialnämnden).", "lagstod": "**Socialtjänstlag (2025:400)** 12 kap. 1 § anger rätten till ekonomiskt bistånd för den som inte själv kan tillgodose sina behov. Biståndet ska tillförsäkra den enskilde en skälig levnadsnivå. (Lagen anger vad som ska uppnås, inte vad som ska beviljas.)<br>**Socialtjänstlag (2025:400)** 12 kap. 7 § anger att försörjningsstödets gemensamma del lämnas enligt en riksnorm som beslutas av regeringen.<br>**Regeringsformen (1974:152)** 1 kap. 2 § anger att det allmänna ska trygga rätten till social välfärd och verka för att alla kan delta i samhället på lika villkor.", "lucka_status": "Nej", "empirisk_kalla": "Raymond, T. (2024) Digital delaktighet. Digitalisering som inte lämnar någon utanför::Ansökan om införskaffande av mobiltelefon eller dator kan beviljas utifrån skäliga kostnader som respektive kommun bedömer. Däremot beviljas sällan inköp av dator/surfplatta om en smartphone redan finns i hemmet. Anledningen är att en smartphone med internetuppkoppling bedöms uppfylla samma behov som en dator enl dom i Kammarrätten i Göteborg (mål 3255–18, 2018-12-11) (s. 19). | Dagens Juridik (2020) Ny praxis: Får rätt till socialbidrag för köp av smartphone::En dom i Kammarrätten i Stockholm gav för första gången rätt till ekonomiskt bistånd för inköp av en smartphone, med motiveringen att Bank-id krävs för allt fler myndighetstjänster. | Sveriges Stadsmissioner (2024) Fattigdomsrapporten 2024::Socialstyrelsen, som ansvarar för de nationella riktlinjerna kring ekonomiskt bistånd, har vid upprepade tillfällen uttryckt oro över att nivån för riksnormen inte överensstämmer med deras syn på en skälig levnadsnivå (s.12). | Socialstyrelsen (2025-07-01) Senaste version av SOSFS 2013:1 Socialstyrelsens allmänna råd om ekonomiskt bistånd::Enligt Socialstyrelsen ska hemelektronik som är nödvändig för att den enskilde ska kunna kommunicera och ta del av information omfattas av begreppet hemutrustning. Men råden preciserar inte vilken typ av hemelektronik som krävs för att använda digitaliserad samhällsservice.", "beskrivning": "Kostnaden för digital delaktighet har aldrig systematiskt beräknats eller kompenserats. Den som inte har råd hänvisas till publika lösningar med varierande begränsningar och säkerhetsinställningar.", "lankar": ["https://www.rvn.se/contentassets/8acb7d26c2754f148a1de07e95b4675f/digital-delaktighet-rapport-rvn-digidel-240530.pdf", "https://www.dagensjuridik.se/nyheter/ny-praxis-far-ratt-till-socialbidrag-for-kop-av-smartphone/", "https://sverigesstadsmissioner.se/wp-content/uploads/Fattigdomsrapporten-2024-Sveriges-Stadsmissioner.pdf", "https://www.socialstyrelsen.se/kunskapsstod-och-regler/regler-och-riktlinjer/foreskrifter-och-allmanna-rad/konsoliderade-foreskrifter/20131-om-ekonomiskt-bistand/"], "tillsynsskydd_finns": "Vad som ingår i en skälig levnadsnivå avgörs i varje enskilt fall av kommunen, med stöd av Socialstyrelsens allmänna råd och förvaltningsdomstolarnas praxis. Digital utrustning som krävs för att sköta vardagliga kontakter med myndigheter, bank och vård är inte preciserad i de nationella råden."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.1 Ekonomisk utsatthet", "taxonomi_id": "2.1.2", "kategori": "Otillräcklig kreditprövning", "situation_exempel": "Jag klickade \"betala senare\" utan att förstå att det var ett lån – nu har jag skulder hos flera inkassobolag.", "radgivning_enskild": "Konsumenternas Bank- och finansbyrå (oberoende rådgivning om bank- och finanstjänster)<br>Hallå konsument (Konsumentverkets vägledningstjänst)<br>Kommunal budget- och skuldrådgivning", "radgivning_utforare": "Finansinspektionen (vägledning om kreditprövning och god kreditgivningssed)<br>Konsumentverket (vägledning om marknadsföring av krediter)", "tvist": "ARN bankavdelningen (ej bindande); allmän domstol", "tillsynsmyndighet": "Finansinspektionen (tillsyn över kreditgivare enligt lag om bank- och finansieringsrörelse)<br>Konsumentverket (tillsyn över marknadsföring av krediter och god kreditgivningssed)", "lagstod": "**Konsumentkreditlag (2010:1846)** 6 § anger att näringsidkaren i sitt förhållande till konsumenten ska iaktta god kreditgivningssed och ta tillvara konsumentens intressen med tillbörlig omsorg.<br>**Konsumentkreditlag (2010:1846)** 12 § anger att näringsidkaren ska pröva om konsumenten har ekonomiska förutsättningar att fullgöra kreditavtalet. Krediten får beviljas endast om konsumenten har sådana förutsättningar.<br>**Konsumentkreditlag (2010:1846)** 19 a § anger att en högkostnadskredit inte får ha en kreditränta eller dröjsmålsränta som överstiger referensräntan med mer än 40 procentenheter.<br>**Marknadsföringslag (2008:486)** anger att vilseledande och aggressiva affärsmetoder är förbjudna.<br>**Lag (2004:297) om bank- och finansieringsrörelse** 8 kap. 1 § anger att kreditgivning, garantigivning och liknande åtaganden ska prövas så att förpliktelserna mot kreditinstitutet på goda grunder kan förväntas bli fullgjorda.", "lucka_status": "Delvis", "empirisk_kalla": "Konsumenternas Bank- och finansbyrå (2026) Verksamhetsberättelse 2025: Flera klagomål angående konsumtionslån bland annat räntefria kampanjer med dolda villkor, bristfälliga kreditprövningar och annuitetslån med lång återbetalningstid (s. 17-19).", "beskrivning": "Kreditgivare beviljar lån och krediter trots uppenbar återbetalningsoförmåga. Villkor är svåra att förstå, räntor höga och möjligheten att omförhandla obefintlig. Skuldsättningen som följer kan leda till kreditvärdighetsexkludering (2.1.3).", "lankar": ["https://www.konsumenternas.se/globalassets/pdf
