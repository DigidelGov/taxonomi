 jag har rätt till ersättning.", "radgivning_enskild": "Kommunal konsumentvägledning; Hallå konsument", "radgivning_utforare": "Konsumentverket (vägledning om kundservice)", "tvist": "ARN (ej bindande)", "tillsynsmyndighet": "Konsumentverket; Transportstyrelsen (tågpassagerarförordningen)", "lagstod": "FL 6–7 §§ (om myndighet); SFS 2022:260 (om privat); EU 2021/782 (tågpassagerare)", "lucka_status": "Nej", "empirisk_kalla": "DN/Kristofer Ahlström (2026) Hur dålig kan kundtjänst bli innan den blir direkt olaglig?::De flesta avskyr kundtjänst. En mur av AI-chatbottar, timslånga telefonköer – och får man väl tala med en människa är det nästan omöjligt att få rätt. DN:s Kristofer Ahlström djupdyker i den havererade kundtjänstens orsaker och konsekvenser.", "beskrivning": "Den aktör som inför en digital samhällsfunktion ansvarar för att den enskilde kan använda lösningen – inte bara tekniskt utan i den situation där den ska användas. Att publicera generell information till en bred allmänhet är inte tillräckligt. I ärenden som rör ekonomisk utsatthet, sjukdom eller rättslig osäkerhet innebär ansvaret att den enskilde inte lämnas ensam med ett formulär i en situation där hen tidigare hade en handläggare.", "lankar": ["https://www.dn.se/kultur/kristofer-ahlstrom-hur-dalig-kan-kundtjanst-bli-innan-den-blir-direkt-olaglig/"], "tillsynsskydd_finns": "Tillsynsansvaret är splittrat mellan myndighet, kommun och marknad – ingen instans granskar rätten till fungerande stöd som en helhet."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.6 Ansvar för användbarhet", "taxonomi_id": "1.6.2", "kategori": "Förändringsansvar", "situation_exempel": "Appen uppdaterades – jag som kunde förut hittar inte längre", "radgivning_enskild": "Resp. myndighet (FL 6 §, om offentlig tjänst); kundtjänst (om privat tjänst); kommunal vägledning i digital vardag (om det finns)", "radgivning_utforare": "Digg (digital tillgänglighet); Konsumentverket (om privat tjänst)", "tvist": "Saknas – en gränssnittsförändring är inte ett överklagbart beslut", "tillsynsmyndighet": "JO (om myndighet); Digg (DOS-lagen); Konsumentverket (om privat, systematiska brister); PTS (LPTT – om privat tjänst inom bank, e-handel, elektronisk kommunikation)", "lagstod": "FL 6–7 §§; SFS 2018:1937 (DOS-lagen); KköpL (2022:260) om privat tjänst; LPTT (2023:254)", "lucka_status": "Nej", "empirisk_kalla": "PC-tidningen (2026-02-01) Katastrofal Windows-uppdatering låser dina filer::Efter att uppdateringen med namnet KB5074109 installerats upplevde tusentals användare stora problem på sina datorer.", "beskrivning": "När en digital lösning förändras i gränssnitt, logik eller process uppstår ett förnyat ansvar. Den som tidigare behärskade tjänsten ska inte behöva söka stöd hos annan aktör för att återfå den förmågan.", "lankar": ["https://pctidningen.se/datorutrustning/operativsystem/windows-11/katastrofal-windows-uppdatering-laser-dina-filer"], "tillsynsskydd_finns": "Ingen myndighet granskar att gränssnittsförändringar inte försämrar användbarhet för befintliga användare. DOS-lagen kräver tillgänglighet men inte kontinuitet vid förändring"}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.6 Ansvar för användbarhet", "taxonomi_id": "1.6.3", "kategori": "Rättighetsansvar", "situation_exempel": "Mitt konto stängdes utan förklaring. Ingen kontaktväg alls.", "radgivning_enskild": "Saknas i praktiken. IMY (klagomål); Hallå konsument (allmän vägledning)", "radgivning_utforare": "Konsumentverket (vägledning om informationsskyldighet); IMY (dataskydd)", "tvist": "Oklart – DSA art. 20 ger rätt till intern klagomålshantering hos plattformen, men tvistlösning (art. 21) sker via certifierat organ som ofta saknas i Sverige.", "tillsynsmyndighet": "Konsumentverket / IMY; Mediemyndigheten (DSA); PTS (LPTT – e-handel)", "lagstod": "DSA (EU) 2022/2065 art. 20–21; e-handelslagen (2002:562) 8 § (kontaktuppgiftskrav); LPTT (2023:254", "lucka_status": "Nej", "empirisk_kalla": "Forbrukerrådet (2026) Breaking free. Pathways to a fair technological future::Many companies – including some of the most profitable companies in the world - have abandoned any pretense of providing customer service, thereby denying consumers the possibility to receive information and support when a product or service stops working as promised. Human customer support is replaced with chatbots or predefined feedback forms designed to make consumers give up, while any point of human contact is often hidden away or nonexistent. This means that when a device breaks down, an account is suspended, or a service provider makes sweeping changes, consumers are often left on their own (s. 29). | Konsumentverket (2025:3) Brister i företagens kundtjänster::19 av 60 företag saknade fullständiga kontaktuppgifter ( s. 3);  För att kunna realisera sina rättigheter är det viktigt att konsumenten kan visa att hen har ångrat ett köp eller sagt upp ett avtal. 42 av de totalt 60 granskade företagen tillhandahöll chatt och/eller kontaktformulär. Endast två av dessa informerade om huruvida uppgifterna som lämnades gick att spara eller få som kopia (s. 17-18).", "beskrivning": "Den aktör som tillhandahåller en digital samhällsfunktion ansvarar för att den enskilde känner till vilka rättigheter, alternativa kontaktvägar och möjligheter till stöd som är kopplade till tjänsten. Ansvaret omfattar även information om vad som gäller vid driftstörningar och systemavbrott (se även 1.8.3). Rättigheter som inte kommuniceras kan inte utövas.", "lankar": ["https://storage02.forbrukerradet.no/media/2026/02/breaking-free-pathways-to-a-fair-technological-future.pdf", "https://stpubshop.blob.core.windows.net/publikationer/redovisningsrapport-2025-3-brister-i-foretagens-kundtjanster-konsumentverket-2025_02b.pdf"], "tillsynsskydd_finns": "Plattformar har ingen skyldighet att erbjuda mänsklig kontakt. Konsumenten saknar i praktiken möjlighet att nå fram."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.6 Ansvar för användbarhet", "taxonomi_id": "1.6.4", "kategori": "Ansvarsförskjutning via digital självservice", "situation_exempel": "Jag visste inte att mina myndighetsbrev gick till Kivra – missade en betalning och hamnade hos Kronofogden.", "radgivning_enskild": "Kommunal konsumentvägledning; Kronofogden (begära omprövning)", "radgivning_utforare": "Digg (vägledning om digital post)", "tvist": "Kronofogden (invändning mot betalningsföreläggande); förvaltningsrätten (om myndighetsbeslut)", "tillsynsmyndighet": "Digg (digital post som infrastruktur); IMY (om personuppgiftsbehandling vid anslutning); JO (om myndighets delgivningsskyldighet)", "lagstod": "FL 6–7 §§ (tillgänglighet, service); SFS 2023:704 (lagen om auktoriserade digitalpostlådor); delgivningslagen (2010:1932)", "lucka_status": "Nej", "empirisk_kalla": "Sveriges Radio Plånboken (2020-10-21)::14-årings Kivra-konto ledde till missad post från Skatteverket – hamnade hos Kronofogden. | Raymond, T. (2025) Gotland i en digital tid::It-handledaren på Korpens bibliotek berättar att ett grundläggande problem är att många\ninte vet om att de har en digital brevlåda. Det har till exempel hänt att personalen har hjälpt någon att logga in och de hittade flera fakturor som redan hade förfallit (s. 79).", "beskrivning": "När det som tidigare sköttes i ett möte med en handläggare ersätts av digital självbetjäning förskjuts utförandeansvaret till den enskilde. Den enskilde förväntas identifiera rätt kanal, förstå formuläret, bifoga rätt underlag och hålla reda på tidsfrister. Konsekvenserna av fel, förseningar eller missade notifieringar bärs av den enskilde. Förskjutningen uppstår när aktören inför självbetjäning utan att ta det pedagogiska, förändrings- och rättighetsansvar som 1.6.1–1.6.3 beskriver.", "lankar": ["https://www.sverigesradio.se/artikel/7579862", "https://dokument.gotland.se/IntegrationService.svc/doc/content/49202"], "tillsynsskydd_finns": "Ingen granskar att den enskilde faktiskt förstått att post omdirigeras digitalt, eller att konsekvenserna av att missa digital post kan vara rättsförlust"}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.7 Ansvarsluckor och bristande styrning", "taxonomi_id": "1.7.1", "kategori": "Avsaknad av systemansvar", "situation_exempel": "Jag blev sjukskriven och behövde kontakta FK, AF, kommunen och min vårdcentral — alla med olika inloggningar, olika handläggare och olika regler. Ingen kunde ge mig en överblick. Jag vet fortfarande inte om jag missat något jag hade rätt till.", "radgivning_enskild": "Resp. myndighet; kurator på vårdenheten; patientnämnden; Statens servicecenter; Finsam (samordnad rehabilitering)", "radgivning_utforare": "Digg (vägledning om digital samordning och Ena); SKR (stöd till kommuner och regioner om samverkan)", "tvist": "Saknas – bristande samverkan mellan myndigheter är inte överklagbart som enskilt beslut.", "tillsynsmyndighet": "JO; IVO (vårdkedjan); Digg (digital samordning)", "lagstod": "RF 1 kap. 2 §; FL 6 § (service), 8 § (samverkan); HSL (2017:30) 7 kap. 2–3 § (fast vårdkontakt, samordnad individuell plan)", "lucka_status": "Nej", "empirisk_kalla": "Digg/PTS (2026) Redovisning av uppdraget att stödja genomförandet av Sveriges Digitaliseringsstrategi::Brister i ansvarsfördelning, finansiering och prioritering skapar stuprör mellan initiativ (s. 11). Tre strukturella glapp: (1) ansvar och mandat otydliga vid gemensamma beslut, (2) långsiktig finansiering saknas, (3) inga återkommande processer som väger sektorers behov mot varandra (s. 26–27). | Riksrevisionen (RiR 2023:6) Digitala tjänster till privatpersoner – stora utvecklingsmöjligheter för statliga myndigheter::Det saknas i de flesta fall en samlad plats där man kan få information om vilka myndigheter som ska kontaktas och i vilken ordning, vid en\nviss livshändelse (sid. 36). Det finns enligt Riksrevisionens bedömning inget legalt inslag i den svenska förvaltningsmodellen som hindrar en starkare styrning från regeringen när det gäller utvecklingen av digitala tjänster (sid. 70). |Svenskarna med funktionsnedsättning och internet 2025::Ett problem med den digitala brevlådan är att det blir ytterligare ett ställe där det kan komma räkningar (s. 49). | Digg (2026) Uppdrag att analyser och beskriva möjligheter och utmaningar kopplade till att etablera en digital ingång till det offentliga::Etableringen av en gemensam digital ingång är inte i första hand en teknisk fråga. Den handlar i hög grad om styrning, ansvar och arbetssätt. För att lyckas behöver offentlig förvaltning i större utsträckning agera samlat utifrån människors behov, snarare än utifrån enskilda organisationers uppdrag. En gemensam digital ingång leder inte i sig till sammanhängande tjänster, utan förutsätter att processer, ansvar och datadelning fungerar samordnat över organisationsgränser, och att ansvar ligger hos de aktörer som har ansvar över data, regelverk och processer (s. 2).", "beskrivning": "Aktörer tar ansvar för sin del, men ingen ansvarar för hur systemen samverkar eller vilka barriärer som uppstår i kedjan.", "lankar": ["https://www.digg.se/download/18.4d9d13fe19c34cfab85e4b/1772203531877/Rapport-Uppf%C3%B6ljning-av-digitaliseringsstrategin-feb-2026.pdf", "https://www.riksrevisionen.se/download/18.1e0fa62b19047f61fcc9553/1719239329567/RiR_2023_6_master.pdf", "https://www.begripsam.se/download/18.34c5105e19cf45dbbdba114/1773657022640/SMFOI_2025_huvudrapport_v2.pdf", "https://www.digg.se/download/18.12d3b9fb19d0d4280da64f/1774989242010/Uppdrag%20att%20beskriva%20utmaningar%20och%20mo%CC%88jligheter.pdf"], "tillsynsskydd_finns": "FL 8 § kräver samverkan och HSL kräver samordnad individuell plan, men ingen av dem omfattar digitala system. Ingen myndighet ansvarar för att medborgaren har en samlad bild."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.7 Ansvarsluckor och bristande styrning", "taxonomi_id": "1.7.2", "kategori": "Otydliga styr-kedjor", "situation_exempel": "Min region bytte journalsystem och nu kan personalen inte se min läkemedelshistorik ordentligt – risken för feldosering har ökat", "radgivning_enskild": "Patientnämnden; 1177; ansvarig vårdgivare", "radgivning_utforare": "E-hälsomyndigheten (nationell digital infrastruktur); SKR (stöd till regioner vid systembyten)", "tvist": "IVO (tillsynsbeslut vid patientsäkerhetsrisk)", "tillsynsmyndighet": "IVO (patientsäkerhet); JO", "lagstod": "HSL (2017:30) 3 kap. 1 § (vård på lika villkor); patientsäkerhetslagen (2010:659); patientdatalagen (2008:355)", "lucka_status": "Delvis", "empirisk_kalla": "SVT (2026-03-06) Allvarliga kritiken mot nya journalsystemet Cosmic::En allvarlig brist är svårigheterna att följa en patients läkemedelshistorik i systemet, menar läkemedelskommittén i region Västernorrland. Något som de menar ökar risken för feldoseringar. | Svensk farmaci (2025-08-13) Fel i Cosmic gör att patienter riskerar att få fel läkemedel::Buggar i journalsystemet Cosmic gjorde att remisser såg ut att försvinna och patienter riskerade att få fel läkemedel. Felet gällde samtliga Cosmic-regioner. Vårdbolaget Praktikertjänst anmälde Cosmic till Läkemedelsverket två veckor efter att journalsystemet hade införts i Region Gävleborg. Felet hade tidigare anmälts av tillverkaren Cambio men kvarstod i flera versioner (4.0–4.2).", "beskrivning": "Det är oklart vem som ska agera när problem uppstår, särskilt i samverkande system där flera myndigheter och leverantörer är inblandade. Parallella nationella infrastrukturer (Ena, NDI, sektorspecifika satsningar) byggs utan explicit samordning.", "lankar": ["https://www.svt.se/nyheter/lokalt/vasternorrland/allvarliga-kritiken-mot-nya-journalsystemet-coscmic", "https://www.svenskfarmaci.se/2025/08/13/fel-i-cosmic-gor-att-patienter-riskerar-att-fa-fel-lakemedel/"], "tillsynsskydd_finns": "IVO har tillsyn över patientsäkerhet men inte över regionernas val av journalsystem eller upphandlingsprocess. Ingen myndighet granskar att systembyten inte försämrar patientsäkerheten"}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.7 Ansvarsluckor och bristande styrning", "taxonomi_id": "1.7.3", "kategori": "Bristande konsekvensanalys", "situation_exempel": "Hemtjänsten gick över till digital matbeställning utan att utreda om jag klarar det – jag har svårt att se och beställer samma saker varje vecka", "radgivning_enskild": "Kommunens biståndshandläggare; patientnämnden", "radgivning_utforare": "IVO (vägledning om välfärdsteknik); SKR (stöd till kommuner); Institutet för mänskliga rättigheter (vägledning om konsekvensutredningar)", "tvist": "IVO (om insatsen inte möter behovet); JO", "tillsynsmyndighet": "IVO (omsorgens kvalitet); kommunens egna revisorer", "lagstod": "SoL (2025:400) 2 kap. 4 § (lätt tillgänglig); 8 kap. 2–3 §§ (äldres självständighet); SFS 2024:183 (konsekvensutredningsförordningen)", "lucka_status": "Nej", "empirisk_kalla": "Sveriges Radio (2026-02-12) Äldre tvingas handla mat digitalt – Johan: ”Blev omöjligt”::I minst 120 kommuner har hemtjänstpersonal slutat handla i fysisk butik. SKR kallar det en \"nödvändig effektiviserande åtgärd\". | Begripsam (2025) Utestängd från det kontantlösa samhället::Hemtjänstpersonal beskriver att digitala matinköp leder till att brukare beställer kakor och godis istället för riktig mat (s. 21). | Institutet för mänskliga rättigheter (2026) Årsrapport 2026::I våra remissvar påpekar vi återkommande att statliga utredningar i många fall saknar tillräckliga konsekvensbedömningar utifrån mänskliga rättigheter, vilket försvårar möjligheten att tidigt se risker och göra tydliga avvägningar och proportionalitetsbedömningar (s. 34).", "beskrivning": "Digitala lösningar införs utan att strukturella exkluderingsrisker analyseras. Konsekvensutredningsförordningen (SFS 2024:183) kräver analys av kostnader och intäkter men inte av exkluderingseffekter eller tillgänglighetskonsekvenser.", "lankar": ["https://www.sverigesradio.se/artikel/allt-fler-aldre-med-hemtjanst-maste-handla-mat-digitalt", "https://www.begripsam.se/download/18.4fd9741419ac5edf2a463b49/1764751364652/Rapport%20Utesta%CC%88ngd%20fra%CC%8An%20det%20kontantlo%CC%88sa%20samha%CC%88llet%20december%202025.pdf", "https://mrinstitutet.se/download/18.234277b219d0483f491b63a/1774331817101/Rapport-Arsrapport-2026.pdf"], "tillsynsskydd_finns": "Kunskap om hur kommuner följer upp och agerar på äldres önksemål om hur inköp ska gå till saknas."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.7 Ansvarsluckor och bristande styrning", "taxonomi_id": "1.7.4", "kategori": "Regelverk som skapar oavsiktlig exkludering", "situation_exempel": "Banken stängde mitt företagskonto för att kunderna inte uppfyllde kundkännedomskraven – nu är jag utan betalkonto, utan BankID och kan inte betala skatt, räkningar eller skicka pengar till min dotter", "radgivning_enskild": "Konsumenternas Bank- och finansbyrå; Länsstyrelsen (betaltjänstlagen); kommunal budget- och skuldrådgivning", "radgivning_utforare": "FI (vägledning om betalkontodirektivet och kundkännedom)", "tvist": "ARN bankavdelningen (ej bindande); allmän domstol", "tillsynsmyndighet": "Finansinspektionen (bankernas kundkännedom och betalkontodirektivet); Länsstyrelsen (betaltjänstlagen)", "lagstod": "Betaltjänstlagen (2010:751) 4a kap. (rätt till betalkonto); penningtvättslagen (2017:630); EU betalkontodirektivet (2014/92/EU)", "lucka_status": "Nej", "empirisk_kalla": "Länsstyrelserna (2025) När betaltjänster är otillgängliga – Berättelser från verkligheten::Persona Anders (52 år) fick sitt betalkonto uppsagt pga penningtvättsregler. Anders nekas nytt konto pga betalningsanmärkning. Skulder har vuxit men kommunens skuldrådgivning nekade hjälp för att gården räknas som näringsverksamhet. | Riksbanken (2026) Betalningsrapporten 2026::Riksbanken anser att bankerna, riksdagen och regeringen behöver göra mer för att inkludera fler på betalningsmarknaden. För det första bör bankerna alltid pröva riskreducerande åtgärder innan de nekar eller avslutar ett betalkonto. Finansinspektionen ska ge ut vägledning på området, vilket kommer hjälpa bankerna att göra korrekta bedömningar när penningtvättsregelverket hamnar i konflikt med rätten till ett betalkonto. För det andra anser Riksbanken att det behövs en lösning för att även personer som saknar ett betalkonto eller upplever digitalt utanförskap ska kunna göra nödvändiga betalningar, som att betala räkningar. Riksbanken menar att det bör gå att ta fram enhetliga alternativ som kan erbjudas i hela landet (s. 55).", "beskrivning": "Regelverk som penningtvättlagen eller kundkännedomsregler kan oavsiktligt utestänga invånare och företag. Problemet uppstår när olika myndigheters regelverk inte är samordnade eller när implementeringen inte tar hänsyn till de grupper som lagen avser att skydda.", "lankar": ["https://www.lansstyrelsen.se/download/18.1dda0708198e5f6fa8112688/1756382206490/N%C3%A4r%20betaltj%C3%A4nster%20%C3%A4r%20otillg%C3%A4ngliga%20Ber%C3%A4ttelser%20fr%C3%A5n%20verkligheten%202025.pdf", "https://www.riksbank.se/sv/betalningar--kontanter/sa-betalar-svenskarna/betalningsrapport-2026/"], "tillsynsskydd_finns": "FI granskar kundkännedom och betalkontodirektivet separat, men ingen myndighet äger konflikten mellan regelverken. Bankerna tolkar penningtvättslagen så att den i praktiken övertrumfar rätten till betalkonto."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.7 Ansvarsluckor och bristande styrning", "taxonomi_id": "1.7.5", "kategori": "Implementering av EU-direktiv", "situation_exempel": "Myndighetens webbplats är inte tillgänglig för mig som synskadad", "radgivning_enskild": "Digg (anmäl bristande tillgänglighet); resp. myndighet", "radgivning_utforare": "Digg (vägledning om webbtillgänglighet och WCAG); MFD (Myndigheten för delaktighet)", "tvist": "Förvaltningsrätten (överklagande av Diggs tillsynsbeslut); DO (diskrimineringsärende)", "tillsynsmyndighet": "Digg (DOS-lagen); JO", "lagstod": "SFS 2018:1937 (DOS-lagen); EU-direktiv 2016/2102 (webbtillgänglighetsdirektivet); Diskrimineringslagen (2008:567) 1 kap. 4 §", "lucka_status": "Nej", "empirisk_kalla": "Riksrevisionen (RiR 2023:6) Digitala tjänster till privatpersoner – stora utvecklingsmöjligheter för statliga myndigheter::Digg bedriver inte tillsyn i den utsträckning EU kräver. Enligt Diggs budgetunderlag för 2023–2025 räcker de medel som Digg får för uppdraget bara till övervakning av ungefär 40 procent av vad EU-kommissionen har beslutat om (s. 59-60). | Digg/PTS (2026) Redovisning av uppdraget att stödja genomförandet av Sveriges Digitaliseringsstrategi::Mätningar av webbplatser och appar visar fortfarande stora tillgänglighetsbrister inom både offentlig och privat sektor (s. 35).", "beskrivning": "EU-direktiv som genomförs genom ändringar i flera svenska lagar riskerar att splittra tillsynsansvar och försvaga det avsedda skyddet. Riksrevisionen har konstaterat att tillsyn enligt DOS-lagen inte bedrivs i den utsträckning EU kräver (RiR 2023:6).", "lankar": ["https://www.riksrevisionen.se/download/18.1e0fa62b19047f61fcc9553/1719239329567/RiR_2023_6_master.pdf", "https://www.digg.se/download/18.4d9d13fe19c34cfab85e4b/1772203531877/Rapport-Uppf%C3%B6ljning-av-digitaliseringsstrategin-feb-2026.pdf"], "tillsynsskydd_finns": "EU kräver granskning av 309 webbplatser och 17 appar per år; Digg klarar ca 40 % med tre handläggare"}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.7 Ansvarsluckor och bristande styrning", "taxonomi_id": "1.7.6", "kategori": "Effektivitetslogik och förvaltnings-mässig inlåsning", "situation_exempel": "Kommunen räknade på vad de sparar genom att skicka post digitalt – men inte på vad jag behöver för att ta emot digital post, att mina anhöriga lägger timmar på att hjälpa mig, eller vad som händer när jag missar ett brev och hamnar hos Kronofogden eller missar en läkartid.", "radgivning_enskild": "Resp. myndighet (begära fysisk post); Kronofogden (invändning vid krav); kommunal konsumentvägledning", "radgivning_utforare": "Digg (vägledning om digital post); ESV (nyttorealisering)", "tvist": "Förvaltningsrätten", "tillsynsmyndighet": "Digg (digital post som infrastruktur); JO; ESV (nyttokalkyler i statlig förvaltning)", "lagstod": "FL 6–7 §§ (tillgänglighet, service); SFS 2023:704 (lagen om auktoriserade digitala brevlådor); SFS 2024:183 (konsekvensutredningsförordningen); delgivningslagen (2010:1932)", "lucka_status": "Nej", "empirisk_kalla": "Raymond, T. (2025) Gotland i en digital tid::Genomgång av Ineras nyttokalkylmall visar att poster för invånarens och anhörigas kostnader saknas (s. 71-72).", "beskrivning": "Offentlig digitalisering styrs ofta genom snäva nyttokalkyler utan att väga in tillgänglighet, rättvisa eller den enskildes inflytande. Organisationens behov av styrning och kontroll kan göra det omöjligt att avvika från digitala rutiner, även när den enskildes behov kräver det.", "lankar": ["https://dokument.gotland.se/IntegrationService.svc/doc/content/49202"], "tillsynsskydd_finns": "Standardmall för nyttokalkyl saknar rutinmässigt poster för invånarens kostnader. Konsekvensutredningsförordningen kräver analys vid införanden men ingen granskar att den genomförs."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.8 Digital beredskap", "taxonomi_id": "1.8.1", "kategori": "Informationssäkerhet", "situation_exempel": "", "radgivning_enskild": "", "radgivning_utforare": "", "tvist": "", "tillsynsmyndighet": "", "lagstod": "", "lucka_status": "Nej", "empirisk_kalla": "", "beskrivning": "När samhällsviktiga tjänster brister i informationssäkerhet drabbas också den enskilde. Uppgifter kan röjas, ändras felaktigt eller bli otillgängliga. Skydd av sådana tjänster är därför inte enbart en teknisk eller upphandlingsfråga utan en förutsättning för att rättigheter ska kunna utövas.", "lankar": [], "tillsynsskydd_finns": ""}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.8 Digital beredskap", "taxonomi_id": "1.8.2", "kategori": "Digital suveränitet och kritiska beroenden", "situation_exempel": "", "radgivning_enskild": "", "radgivning_utforare": "", "tvist": "", "tillsynsmyndighet": "", "lagstod": "", "lucka_status": "Nej", "empirisk_kalla": "", "beskrivning": "När centrala digitala funktioner är beroende av leverantörer i andra jurisdiktioner blir den enskildes rättighetsskydd avhängigt förhållanden utanför svensk kontroll. Att säkra alternativ till sådana beroenden är en förutsättning för att rättigheter ska gälla också i förändrade omständigheter.", "lankar": [], "tillsynsskydd_finns": ""}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.8 Digital beredskap", "taxonomi_id": "1.8.3", "kategori": "Kriskommunikation som når alla", "situation_exempel": "", "radgivning_enskild": "", "radgivning_utforare": "", "tvist": "", "tillsynsmyndighet": "", "lagstod": "", "lucka_status": "Nej", "empirisk_kalla": "", "beskrivning": "När kriskommunikation förmedlas i digitala kanaler nås inte alla. Räckvidden är en förutsättning för att den enskilde ska kunna agera för sin egen och andras säkerhet i kris och höjd beredskap.", "lankar": [], "tillsynsskydd_finns": ""}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.1 Ekonomisk utsatthet", "taxonomi_id": "2.1.1", "kategori": "Fattigdom", "situation_exempel": "Kommunen nekar mig dator eftersom jag har en smartphone – men på den lilla skärmen är det svårt att fylla i formulär och bifoga bilagor", "radgivning_enskild": "Kommunens socialtjänst; biblioteket (låna dator); konsumentbudgetrådgivning", "radgivning_utforare": "Socialstyrelsen (riktlinjer om ekonomiskt bistånd); SKR (stöd till kommuner)", "tvist": "Förvaltningsrätten (överklaga biståndsbeslut); kammarrätten", "tillsynsmyndighet": "IVO (socialtjänstens insatser); Länsstyrelsen (kommunens socialtjänst)", "lagstod": "SoL (2025:400) 12 kap. (ekonomiskt bistånd, skälig levnadsnivå); RF 1 kap. 2 §", "lucka_status": "Nej", "empirisk_kalla": "Raymond, T. (2024) Digital delaktighet. Digitalisering som inte lämnar någon utanför. s. 19: Ansökan om införskaffande av mobiltelefon eller dator kan beviljas utifrån skäliga kostnader som respektive kommun bedömer. Däremot beviljas sällan inköp av dator/surfplatta om en smartphone redan finns i hemmet. Anledningen är att en smartphone med internetuppkoppling bedöms uppfylla samma behov som en dator enl dom i Kammarrätten i Göteborg (mål 3255–18, 2018-12-11). | Sveriges Stadsmissioner (2024) Fattigdomsrapporten 2024 s.12: Socialstyrelsen, som ansvarar för de nationella riktlinjerna kring ekonomiskt bistånd, har vid upprepade tillfällen uttryckt oro över att nivån för riksnormen inte överensstämmer med deras syn på en skälig levnadsnivå.", "beskrivning": "Kostnaden för digital delaktighet har aldrig systematiskt beräknats eller kompenserats. Den som inte har råd hänvisas till publika lösningar med varierande begränsningar och säkerhetsinställningar.", "lankar": ["https://www.rvn.se/contentassets/8acb7d26c2754f148a1de07e95b4675f/digital-delaktighet-rapport-rvn-digidel-240530.pdf", "https://www.dagensjuridik.se/nyheter/ny-praxis-far-ratt-till-socialbidrag-for-kop-av-smartphone/", "https://sverigesstadsmissioner.se/wp-content/uploads/Fattigdomsrapporten-2024-Sveriges-Stadsmissioner.pdf"], "tillsynsskydd_finns": "Nej – ingen nationell vägledning om digital utrustning som del av skälig levnadsnivå. Kammarrättens dom (2018) att smartphone uppfyller samma behov som dator tillämpas generellt."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.1 Ekonomisk utsatthet", "taxonomi_id": "2.1.2", "kategori": "Otillräcklig kreditprövning", "situation_exempel": "Jag klickade \"betala senare\" utan att förstå att \ndet var ett lån – nu har jag skulder hos flera \ninkassobolag", "radgivning_enskild": "Konsumenternas Bank- och finansbyrå; kommunal budget- och skuldrådgivning; Hallå konsument", "radgivning_utforare": "FI (vägledning om kreditprövning); Konsumentverket (marknadsföring av krediter)", "tvist": "ARN bankavdelningen (ej bindande); allmän domstol", "tillsynsmyndighet": "Finansinspektionen (kreditprövning och marknadsföring); Konsumentverket (marknadsföring av krediter)", "lagstod": "Konsumentkreditlagen (2010:1846) 12 § (kreditprövning), 19 § (ränteändringar); lagen om bank- och finansieringsrörelse (2004:297)", "lucka_status": "Delvis", "empirisk_kalla": "Konsumenternas Bank- och finansbyrå (2026) Årsredovisning 2025: Flera klagomål angående konsumtionslån bland annat räntefria kampanjer med dolda villkor, bristfälliga kreditprövningar och annuitetslån med lång återbetalningstid.", "beskrivning": "Kreditgivare beviljar lån och krediter trots uppenbar återbetalningsoförmåga. Villkor är svåra att förstå, räntor höga och möjligheten att omförhandla obefintlig. Skuldsättningen som följer kan leda till kreditvärdighetsexkludering (2.1.3).", "lankar": ["https://www.konsumenternas.se/globalassets/pdf/vb/verksamhetsberattelse-2025.pdf"], "tillsynsskydd_finns": "Delvis – FI har tillsyn över kreditgivare men kreditprövningen brister systematiskt."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.1 Ekonomisk utsatthet", "taxonomi_id": "2.1.3", "kategori": "Kreditvärdighets-exkludering", "situation_exempel": "Jag nekas mobilabonnemang på grund av skulder och kan inte längre nå digitala samhällsfunktioner", "radgivning_enskild": "Resp. operatör (förskottsalternativ); Kommunal budget- och skuldrådgivning; Konsumenternas Bank- och finansbyrå; Telekområdgivarna", "radgivning_utforare": "PTS (samhällsomfattande tjänster)", "tvist": "ARN (ej bindande); allmän domstol", "tillsynsmyndighet": "PTS (LPTT – elektronisk kommunikation); FI (kreditupplysning)", "lagstod": "LEK (2022:482) 7 kap. (samhällsomfattande tjänster – täcker telefoni men inte mobildata eller bredband). I övrigt saknas lagstöd som säkerställer skuldsattas tillgång till digital infrastruktur; LPTT (2023:254)", "lucka_status": "Nej", "empirisk_kalla": "Kronofogden (2026): Antalet skuldsatta i Sverige är nästan 450 000. | Telia (2026): du kan inte teckna abonnemang hos oss om du har en betalningsanmärkning. Om du redan är kund och har ett eller flera befintliga abonnemang kan du behålla dem. Du kan dock inte förlänga eller göra om villkoren för dem, exempelvis ta ut en ny mobil eller ta del av ett kampanjerbjudande. | Bredbandsval.se (2025): De flesta internetleverantörer utför en kreditkontroll i samband med beställning av bredband. Om den kreditupplysning som görs visar på en nedsatt betalningsförmåga kan tyvärr operatören neka dig att skaffa bredband via dem.", "beskrivning": "Skuldsättning eller låg kreditvärdighet kan hindra tillgång till internet- och telefonabonnemang.", "lankar": ["https://kronofogden.se/om-kronofogden/nyheter-och-press/pressmeddelande/2026-01-26-skulderna-hos-kronofogden-fortsatter-att-oka#:~:text=Skatteskulder%20vanligt&text=%C3%84ven%20antalet%20skuldsatta%20%C3%B6kar%20n%C3%A5got,procent%20j%C3%A4mf%C3%B6rt%20med%20f%C3%B6reg%C3%A5ende%20%C3%A5r.", "https://www.telia.se/support/kopinformation", "https://www.bredbandsval.se/bredband/betalningsanmarkning"], "tillsynsskydd_finns": "Nej – LEK:s samhällsomfattande tjänster täcker telefoni men inte mobildata eller bredband. Ingen myndighet säkerställer att skuldsatta behåller tillgång till digital infrastruktur."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.2 Funktionsrelaterad exkludering", "taxonomi_id": "2.2.1", "kategori": "Kognitiv exkludering", "situation_exempel": "Jag har en NPF-diagnos och Försäkringskassans ansökan har så många steg och tidsgränser att jag ger upp halvvägs och det finns inget sätt att spara och fortsätta senare", "radgivning_enskild": "Försäkringskassan (telefon/besök); Statens servicecenter; funktionsrättsorganisation", "radgivning_utforare": "", "tvist": "JO; DO (om bristande tillgänglighet utgör diskriminering)", "tillsynsmyndighet": "Digg (DOS-lagen); DO; JO", "lagstod": "DOS-lagen (2018:1937); diskrimineringslagen (2008:567) 1 kap. 4 § (bristande tillgänglighet); FL 6–7 §§", "lucka_status": "Delvis", "empirisk_kalla": "RiR 2026:4 s. 28: I samtal med fokusgrupper med företrädare för organisationer inom\nfunktionshinderområdet framkommer att försäkrade med kognitiv nedsättning har\nsvårt att anmäla ändrade förhållanden inom sjukersättning. | FN:s funktionsrättskommitté (2024, CRPD/C/SWE/CO/2–3, punkt 9c): konstaterar att det saknas tillräckliga möjligheter för enskilda att klaga och få upprättelse i fall där kommuner och regioner brister i genomförandet av funktionsrättskonventionens rättigheter. |  Institutet för mänskliga rättigheter (2026) Årsrapport 2026:  I undersökning från 2023, genomförd tillsammans med Rivkraftspanelen, besvarad av\n1 833 personer med funktionsnedsättning, uppgav endast 36 procent av\ndeltagarna att de vet vart de kan vända sig om deras rättigheter inte efterlevs.", "beskrivning": "Digitala samhällsfunktioner som förutsätter snabb orientering, komplex navigering eller stor mängd information utestänger den som behöver mer tid, tydligare struktur eller enklare gränssnitt.", "lankar": ["https://www.riksrevisionen.se/download/18.3183a4c019c47d273ac1dc18/1771403839821/RiR-2026-4-rapport.pdf", "https://regeringen.se/contentassets/c6e42825cbcc4985b771934a7b8248e4/crpd-kommittens-slutsatser-och-rekommendationer-2024-03-22-svensk-oversattning.pdf", "https://mrinstitutet.se/download/18.234277b219d0483f491b63a/1774331817101/Rapport-Arsrapport-2026.pdf"], "tillsynsskydd_finns": "Delvis – DOS-lagen täcker WCAG-krav men inte kognitiv tillgänglighet som informationsarkitektur, antal steg, tidsgränser eller möjlighet att spara och återkomma. WCAG 2.1 har vissa kognitiva kriterier men de är svaga och sällan granskade."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.2 Funktionsrelaterad exkludering", "taxonomi_id": "2.2.2", "kategori": "Sensorisk exkludering", "situation_exempel": "Jag är döv och ska boka tolk via regionens Tolkportal – men verktyget fungerar inte på mobil och regionen har pausat allt förbättringsarbete.", "radgivning_enskild": "Tolkcentralen; patientnämnden; Sveriges Dövas Riksförbund (SDR)", "radgivning_utforare": "Digg (webbtillgänglighet); MFD (delaktighet); SKR (stöd till regioner)", "tvist": "DO (diskrimineringsärende); förvaltningsrätten (om vårdinsats kan överklagas)", "tillsynsmyndighet": "Digg (DOS-lagen); IVO (om tolkbrist leder till patientsäkerhetsrisk); DO; PTS (LPTT — elektronisk kommunikation, banktjänster)", "lagstod": "DOS-lagen (2018:1937); diskrimineringslagen (2008:567) 1 kap. 4 §; HSL (2017:30) 3 kap. 1 §; språklagen (2009:600) 9 § (det allmänna har ansvar att skydda och främja svenskt teckenspråk); LPTT (2023:254)", "lucka_status": "Delvis", "empirisk_kalla": "Stockholms Dövas Förening (dec 2024) Rapport från möte angående Tolkportalen: Tolkportalen fungerar inte på mobil, krångligt att ändra/avboka, fel information om support. Stockholms Dövas Förening (maj 2025) Summering från samverkansmötet med Tolkcentralen: ny IT-leverantör tar inte ansvar för tidigare kod, lansering försenad. Tolkbristen ökade från 0,6 % till 3,1 % (228 uppdrag, 441 timmar). Staten tilldelade 28 mkr till Region Stockholm men bara 4 mkr extra nådde Tolkcentralen. FaceTime och WhatsApp får inte användas pga GDPR – yngre döva som saknar bildtelefon har inga alternativa kontaktvägar. Stockholms Dövas Förening (okt 2025) Rapport: samverkansmöte med Tolkcentralen: regionens konsultstopp pausar allt utvecklingsarbete. Tolkportalen fortsatt otillgänglig. Vårdgivare bokar inte tolk vid akuta behov. | FN:s funktionsrättskommitté (2024, CRPD/C/SWE/CO/2–3, punkt 9c): konstaterar att det saknas tillräckliga möjligheter för enskilda att klaga och få upprättelse i fall där kommuner och regioner brister i genomförandet av funktionsrättskonventionens rättigheter.", "beskrivning": "Digitala samhällsfunktioner som inte kompenserar för syn- eller hörselnedsättning i sin design utestänger hela grupper.", "lankar": ["https://stockholmsdf.se/nyheter/rapport-tolkportalen/", "https://stockholmsdf.se/nyheter/summering-fran-tolkcentralen/", "https://stockholmsdf.se/nyheter/samverkansmote-tolkcentralen/", "https://regeringen.se/contentassets/c6e42825cbcc4985b771934a7b8248e4/crpd-kommittens-slutsatser-och-rekommendationer-2024-03-22-svensk-oversattning.pdf"], "tillsynsskydd_finns": "Delvis — Tolkportalen som intern beställningsportal kan falla utanför DOS-lagens tillämpningsområde. Sparåtgärder som pausar tillgänglighetsarbete behandlas som generella budgetbeslut, inte som inskränkningar av rättigheter."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.2 Funktionsrelaterad exkludering", "taxonomi_id": "2.2.3", "kategori": "Motorisk exkludering", "situation_exempel": "Jag har Parkinsons och kan inte hålla fingret stilla nog för BankID:s fingeravtrycksläsare, sexsiffrig kod, jag träffar fel varje gång", "radgivning_enskild": "Banken (alternativa inloggningsmetoder); hjälpmedelscentralen; Funktionsrätt Sverige", "radgivning_utforare": "Digg (webbtillgänglighet, EN 301 549); FI (bankernas tillgänglighetskrav)", "tvist": "DO (diskrimineringsärende)", "tillsynsmyndighet": "DO; Digg (DOS-lagen); FI (BankID som infrastruktur); PTS (LPTT — banktjänster)", "lagstod": "Diskrimineringslagen (2008:567) 1 kap. 4 § (bristande tillgänglighet); EN 301 549 kap. 5.3 (biometri ska inte vara enda identifieringsmetod); DOS-lagen (2018:1937); LPTT (2023:254)", "lucka_status": "Delvis", "empirisk_kalla": "BankID (support.bankid.com): ansiktsigenkänning stöds bara på iPhone (Face ID) — inte på Android. Användare med motorisk funktionsnedsättning och Android-telefon har bara fingeravtryck och sexsiffrig kod som alternativ.", "beskrivning": "Digitala gränssnitt som kräver finmotorik, handstyrka eller precisa rörelser utan alternativ utestänger den som inte kan utföra dem.", "lankar": ["https://support.bankid.com/sv/tekniska-fragor-och-problem/fingeravtryck-och-ansiktsigenkanning"], "tillsynsskydd_finns": "Delvis — ansvaret splittrat mellan DO, Digg och FI."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.2 Funktionsrelaterad exkludering", "taxonomi_id": "2.2.4", "kategori": "Psykosocial exkludering", "situation_exempel": "Jag måste skicka in återkommande rapporter men är rädd att skriva fel och förlora min ersättning – systemet ger ingen förhandsgranskning och jag vet inte om jag kan ändra efteråt", "radgivning_enskild": "Respektive myndighet (telefon); Statens servicecenter", "radgivning_utforare": "ISF (granskning av FK:s digitala tjänster); IAF (tillsyn över arbetslöshetsförsäkringen); Digg (digital tillgänglighet)", "tvist": "Förvaltningsrätten (om felaktigt beslut)", "tillsynsmyndighet": "ISF (Inspektionen för socialförsäkringen); IAF (tillsyn över arbetslöshetsförsäkringen); JO", "lagstod": "FL 6–7 §§ (tillgänglighet, service); FL 25 § (kommunikationsskyldighet före beslut)", "lucka_status": "Delvis", "empirisk_kalla": "IAF (2018:5) Aktivitetsrapportering — till vilken nytta och för vem? s. 20: De intervjuade var överens om att det finns grupper av sökande som behöver särskilt stöd med aktivitetsrapporteringen och s. 3: En arbetssökande som inte lämnar in sin aktivitetsrapport kan få en sanktion, i form av en varning eller avstängning, för misskötsel av sitt arbetssökande. | RiR 2023:6 s. 30: Ett annat problem handlar om att personer är rädda för att göra fel eller känner sig\nstressade och osäkra.", "beskrivning": "Digitala samhällsfunktioner kan skapa stress, ångest eller känsla av maktlöshet genom otydlig systemlogik eller risk för oåterkalleliga fel. Den som lever med psykisk ohälsa eller social utsatthet är särskilt utsatt när systemet inte ger utrymme för osäkerhet.", "lankar": ["https://www.iaf.se/globalassets/dokument/rapporter/2017-2018/2018-5-aktivitetsrapportering-till-vilken-nytta-och-for-vem.pdf", "https://www.riksrevisionen.se/download/18.1e0fa62b19047f61fcc9553/1719239329567/RiR_2023_6_master.pdf"], "tillsynsskydd_finns": "Delvis — ISF och JO har tillsyn men ingen granskar att gränssnittsdesignen skapar onödig psykisk belastning. FL 25 § (rätt att yttra sig före beslut) syns inte i gränssnittet"}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.2 Funktionsrelaterad exkludering", "taxonomi_id": "2.2.5", "kategori": "Gradvis försämrad kognitiv förmåga", "situation_exempel": "Mamma glömmer sina lösenord allt oftare och missar digital post – hon är inte tillräckligt sjuk för god man men klarar inte längre sin digitala vardag", "radgivning_enskild": "Vårdcentralen (kognitiv utredning); kommunens biståndshandläggare; bank (fullmakter)", "radgivning_utforare": "Överförmyndarnämnden (vägledning om god man och fullmakter); Digg (digital tillgänglighet)", "tvist": "Tingsrätten (ansökan om god man)", "tillsynsmyndighet": "Överförmyndarnämnden (god man); IVO (om omsorgsbehov)", "lagstod": "FB 11 kap. (god man); SFS 2017:310 (framtidsfullmakter); SoL (2025:400)", "lucka_status": "Nej", "empirisk_kalla": "Svenskt Demenscentrum (2023): År 2023 uppgick antalet personer med demenssjukdom till omkring 130 000–150 000. Varje år beräknas 20 000–25 000 personer insjukna, enligt Socialstyrelsen. | Institutet för mänskliga rättigheter (2026) Årsrapport 2026 s. 71: Lagen om stöd och service till vissa funktionshindrade (LSS) undantar funktionsnedsättningar som uppenbart beror på normalt åldrande. Det innebär att personer som får hjälpbehov sent i livet – exempelvis på grund av nedsatt rörlighet, syn, hörsel eller kognitiv svikt – inte har tillgång till samma rättighetsbaserade stöd som yngre personer med motsvarande funktionsnedsättning.", "beskrivning": "Digitala samhällsfunktioner förutsätter stabil kognitiv förmåga över tid. Under perioden av gradvis försämring ökar den enskildes behov av kontakt med vård, omsorg och myndigheter samtidigt som systemen saknar rutiner och funktioner för den övergången.", "lankar": ["https://demenscentrum.se/Fakta-om-demens/Demens-i-siffror/", "https://mrinstitutet.se/download/18.234277b219d0483f491b63a/1774331817101/Rapport-Arsrapport-2026.pdf"], "tillsynsskydd_finns": "Nej – det finns ingen mekanism för den gråzon där en person gradvis förlorar digital förmåga men ännu inte uppfyller kraven för god man."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.3 Beroendeposition och digital kontroll", "taxonomi_id": "2.3.1", "kategori": "Tillgång i omsorg", "situation_exempel": "Jag bor på LSS-boende och det finns inget internet i min lägenhet – personalen säger att jag kan använda wifi i gemensamma utrymmen men där ser andra min skärm", "radgivning_enskild": "Kommunens LSS-handläggare; god man; funktionsrättsorganisation", "radgivning_utforare": "IVO (vägledning om LSS-boenden); Socialstyrelsen (riktlinjer om goda levnadsvillkor)", "tvist": "Förvaltningsrätten (överklaga biståndsbeslut)", "tillsynsmyndighet": "IVO (LSS-boenden och äldreboenden) / Migrationsverket (förvar)", "lagstod": "LSS (1993:387) 5–6 §§ (självbestämmande, goda levnadsvillkor, integritet); RF 2 kap. 6 § (skydd för privatliv)", "lucka_status": "Delvis", "empirisk_kalla": "Socialstyrelsen (2025) E-hälsa och välfärdsteknik i kommunerna 2025: Internettillgången i enskildas rum eller lägenheter är högre på kommunalt drivna särskilda boenden för äldre än i stöd- och serviceboenden för personer med\nfunktionsnedsättning. 66 procent av kommunerna har uppgett att alla deras särskilda boenden för äldre har tillgång till internet i enskildas rum eller lägenheter. 58 procent av kommunerna uppger att det finns internetuppkoppling på alla stöd- och serviceboenden för personer med funktionsnedsättnin som drivs av kommunen. Resultaten är desamma som förra året. 20 respektive 23 procent av kommunerna saknar internettillgång i enskildas rum eller lägenheter. Samtidigt minskar andelen kommuner som erbjuder gratis internetuppkoppling på sina boenden, i år är den cirka 55 procent. | IVO (2023) Att inte få rätten att leva som andra :IVO har genomfört en riktad tillsyn av 90 gruppbostäder (LSS-boenden) för vuxna med funktionsnedsättningar. IVO har funnit brister i 80 av de 90 granskade gruppbostäderna (tillsynen i fråga gällde otillåtna tvångs- och begränsningsåtgärder)", "beskrivning": "Personal i boenden, daglig verksamhet eller förvar kan styra över den enskildes internetåtkomst, enheter och konton. Eller aldrig erbjuda uppkoppling. Begränsningar kan vara befogade men förutsätter individuell bedömning.", "lankar": ["https://www.socialstyrelsen.se/contentassets/d90a552a88914f07b47eb174b0f4fbd2/2025-5-9625.pdf", "https://www.ivo.se/aktuellt/publikationer/rapporter/att-inte-fa-ratten-att-leva-som-andra/"], "tillsynsskydd_finns": "Delvis — IVO har tillsyn men det finns inga nationella krav på internet i den enskildes lägenhet. Frågan om internet ingår i 'goda levnadsvillkor' enligt LSS är inte rättsligt prövad"}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.3 Beroendeposition och digital kontroll", "taxonomi_id": "2.3.2", "kategori": "Skyddsbehov", "situation_exempel": "Jag flydde från en förövare som jag hade en relation med. Personen gör fortfarande allt för att spåra mig och det är svårt att leva dold när allt är digitalt.", "radgivning_enskild": "Kvinnojouren; Brottsofferjouren; Skatteverket (skyddade personuppgifter); banken", "radgivning_utforare": "SKR (stöd till kommuner om skyddade personuppgifter); IMY (dataskydd); Jämställdhetsmyndigheten (vägledning om digitalt våld)", "tvist": "Polisen (anmälan); tingsrätten (kontaktförbud)", "tillsynsmyndighet": "IMY (personuppgifter); FI (bankens hantering); Skatteverket (sekretessmarkering)", "lagstod": "Offentlighets- och sekretesslagen (2009:400) 22 kap. 1 §; folkbokföringslagen (1991:481) 16 § (skyddad folkbokföring); brottsbalken 4 kap. 4a § (olaga förföljelse)", "lucka_status": "Nej", "empirisk_kalla": "Jämställdhetsmyndigheten (2026) Det gränslösa våldet (Rapport 2026:1): teknologifaciliterat våld handlar om hur digital teknik används för att utöva och förstärka psykiskt, sexuellt och ekonomiskt våld — utsattheten är omfattande och tydligt könad. | SVT (2024) SVT granskar: Så röjs skyddade personer av rättsväsendet: Nästan 33 000 personer i Sverige lever med skyddade personuppgifter, eftersom de är utsatta för hot eller våld. Men det händer att deras uppgifter blir röjda – och då kan det få stora konsekvenser. När det händer är det vanligt att källan till röjningarna är polis, åklagare och domstolar – det visar en enkät som Skatteverket gjort med gömda personer. | Jämställdhetsmyndigheten (2022) Skyddade personuppgifter —  oskyddade personer. s. 43: Möjligheten att ta fram ett digitalt ID-nummer som inte är kopplat till den faktiska personen bör utredas, för att personer med skyddade personuppgifter ska kunna ta del av digital service och tjänster på samma villkor som övriga medborgare.", "beskrivning": "Digitala samhällsfunktioner förutsätter att den enskilde har kontroll över sin identitet, sina konton och sina enheter. För den som lever under hot eller i en kontrollerande relation är detta problematiskt, och farligt. Sammankopplade register kan röja adresser, sekretessmarkering hanteras inte av de flesta digitala myndighetstjänster, och konton och BankID knutna till en förövare kan inte enkelt frigöras.", "lankar": ["https://jamstalldhetsmyndigheten.se/aktuellt/publikationer/rapport-2026-1-det-granslosa-valdet-en-kartlaggning-av-den-digitala-teknikens-betydelse-for-mans-vald-mot-kvinnor-och-vald-mot-barn/", "https://www.svt.se/nyheter/lokalt/smaland/svt-granskar-sa-rojs-skyddade-personer-av-rattsvasendet", "https://jamstalldhetsmyndigheten.se/media/bkbdjajc/2022_10-delrapport-skyddade-personuppgifer.pdf"], "tillsynsskydd_finns": "Nej – sekretessmarkering hanteras inte konsekvent i digitala myndighetstjänster. Sammankopplade register kan röja adress om inte varje system aktivt stöder skyddade uppgifter. Ingen samlad process finns för att digitalt frigöra en person från en kontrollerande partner"}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.4 Livskris och instabilitet", "taxonomi_id": "2.4.1", "kategori": "Akut livskris", "situation_exempel": "Jag sitter på akuten med mitt sjuka barn och parkeringsappen kräver registrering, kortbetalning och zonval – jag kan inte tänka klart just nu", "radgivning_enskild": "Sjukhusets reception; parkeringsbolaget", "radgivning_utforare": "Saknas", "tvist": "ARN (ej bindande); kommunen (om kommunal parkering)", "tillsynsmyndighet": "Ingen tydlig – kommunen ansvarar för kommunal parkering, privata parkeringsbolag regleras av branschöverenskommelse", "lagstod": "RF 1 kap. 2 § (det allmänna ska trygga rätten till hälsa); kommunallagen (2017:725) kap. 2 (kommunens ansvar för allmänna platser)", "lucka_status": "Nej", "empirisk_kalla": "Sveriges Radio P4 (2025) Sjukhusparkering: Par r.", "tax_kat": "2.6 Migrationsstatus och rättsligt skydd", "taxonomi_id": "2.6.1", "kategori": "Identitetskrav", "situation_exempel": "Jag har ett samordningsnummer – jag kan inte skaffa BankID, inte öppna digital brevlåda och inte använda myndigheternas e-tjänster.", "radgivning_enskild": "Skatteverket (folkbokföring, personnummer); Migrationsverket; kommunal flyktingsamordnare", "radgivning_utforare": "Digg (vägledning om e-legitimation och tillgänglighet); Skatteverket (vägledning samordningsnummer); SKR (riktlinjer för kommunal service)", "tvist": "Förvaltningsrätten (folkbokföringsbeslut)", "tillsynsmyndighet": "Digg (e-legitimation); JO", "lagstod": "FL 6–7 §§; folkbokföringslagen (1991:481); eIDAS-förordningen (910/2014)", "lucka_status": "Nej", "empirisk_kalla": "Digg:s informationswebb elegitimation.se om att använda utländska e-legitimationer i Sverige (hämtad 2026-04-07): En e-legitimation från ett annat land än Sverige kan i vissa fall användas för att logga in i svenska myndigheters e-tjänster men det är inte säkert att det går att använda alla funktioner i e-tjänsten. Det beror på att många svenska e-tjänster kräver ett svenskt personnummer, och att den utländska e-legitimationen inte är kopplad till det svenska personnumret. | IOM (2023) Ukrainians and third-country nationals under temporary protection in Sweden. s. 4 : Avsaknaden av personnummer förhindrar fullständig tillgång till flera offentliga och privata tjänster. Transportstyrelsens webbsida om digital brevlåda (hämtad 2026-04-07): Personer som har samordningsnummer kan inte ha digital brevlåda då alla tjänsterna kräver legitimation och det finns idag ingen e-legitimation som fungerar med samordningsnummer.", "beskrivning": "Digitala samhällsfunktioner förutsätter ofta personnummer, e-legitimation och bankkonto – där det första är förutsättning för de övriga. Asylsökande och papperslösa kan sakna alla tre. Utländska e-legitimationer erkänns formellt via Sweden Connect men ger i praktiken inte tala system som kräver personuppgifter för tillgång till vård, stöd eller rättighetsinformation tvingar den enskilde att välja mellan att utöva en rättighet och att skydda sin säkerhet. Rädslan är folkrättsligt grundad.", "lankar": ["https://www.dn.se/sverige/allt-farre-papperslosa-soker-vard-de-ar-radda/"], "tillsynsskydd_finns": "Nej – hälso- och sjukvårdssekretessen skyddar patientuppgifter men det pågår politisk diskussion om informationsplikt mot Migrationsverket. Ingen myndighet ansvarar för att informera papperslösa om att vården är sekretessbelagd."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.6 Migrationsstatus och rättsligt skydd", "taxonomi_id": "2.6.3", "kategori": "Funktionsnedsättning och migrationsstatus", "situation_exempel": "Jag är asylsökande och har en hörselnedsättning – jag kan inte få hörapparat anpassad eftersom hjälpmedelscentralen kräver personnummer för att öppna ett ärende.", "radgivning_enskild": "Migrationsverket; regionen (asylhälsa); funktionsrättsorganisation", "radgivning_utforare": "Socialstyrelsen (vägledning om hjälpmedel); SKR (riktlinjer för hjälpmedelsförskrivning); Myndigheten för delaktighet (tillgänglighet och funktionsrätt)", "tvist": "IVO; DO (diskriminering på grund av funktionsnedsättning och etnisk tillhörighet)", "tillsynsmyndighet": "IVO; DO", "lagstod": "HSL (2017:30); SFS 2008:286; CRPD art. 5 och 19; diskrimineringslagen (2008:567)", "lucka_status": "Nej", "empirisk_kalla": "Funktionsrätt Sverige (2025) Respekt för funktionsrätt. Uppföljning av rekommendationer från FN:s funktionsrättskommitté om genomförande av konventionen om rättigheter för personer med funktionsnedsättning. s. 18: Funktionsrätt Sverige bedömer att rättigheterna för migranter med funktionsnedsättning har backat på flera områden. Den nuvarande migrationspolitiken saknar ett MR-perspektiv och tar inte hänsyn till intersektionalitet, exempelvis till situationen för personer med funktionsnedsättning som befinner sig i migrations- eller asylprocesser. | IOM (2023) Ukrainians and third-country nationals under temporary protection in Sweden. s. 23: föräldrar och anhöriga till personer med funktionsnedsättning rapporterar svårigheter att få adekvat medicinsk och ekonomisk hjälp för familjemedlemmar med vårdbehov.", "beskrivning": "När migrationsstatus samverkar med funktionsnedsättning uppstår ett utanförskap som ingen myndighet har ett tydligt ansvar för. Tillgänglighetsanpassning förutsätter ofta en registrerad status som saknas.", "lankar": ["https://funktionsratt.se/wp-content/uploads/frs/2025/12/respekt-for-funktionsratt-den-3-december-edit.pdf", "https://dtm.iom.int/sites/g/files/tmzbdl1461/files/reports/DTM2023_Sweden_Ukrainians%20and%20TCNs%20under%20TP%20in%20Sweden_June_0.pdf"], "tillsynsskydd_finns": "Nej – CRPD gäller oavsett migrationsstatus men hjälpmedelssystem kräver personnummer. Ingen myndighet äger frågan om tillgänglighetsanpassning för asylsökande med funktionsnedsättning."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.6 Migrationsstatus och rättsligt skydd", "taxonomi_id": "2.6.4", "kategori": "Barn och unga med migrationsstatus", "situation_exempel": "Jag är 16 och kom ensam till Sverige – jag har ingen digital identitet, min gode man har problem med mitt ärende och jag kan inte följa min asylprocess digitalt.", "radgivning_enskild": "God man; Asylrättscentrum; Rädda Barnen; kommunens socialtjänst", "radgivning_utforare": "Migrationsverket (vägledning om asylprocessen för barn); SKR (riktlinjer för god man); Socialstyrelsen (vägledning om ensamkommande barn)", "tvist": "Förvaltningsrätten (asylbeslut);", "tillsynsmyndighet": "Migrationsverket (asylprocessen)
