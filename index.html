/vb/verksamhetsberattelse-2025.pdf"], "tillsynsskydd_finns": "Finansinspektionen har tillsyn över kreditgivarna och Konsumentverket över marknadsföringen, men kreditprövningen brister systematiskt."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.1 Ekonomisk utsatthet", "taxonomi_id": "2.1.3", "kategori": "Kreditvärdighetsexkludering", "situation_exempel": "Jag nekas mobilabonnemang på grund av skulder och kan inte längre nå digitala samhällsfunktioner.", "radgivning_enskild": "Respektive operatör (förskotts- eller kontantkortsalternativ)<br>Telekområdgivarna (oberoende rådgivning om telekomtjänster)<br>Kommunal budget- och skuldrådgivning", "radgivning_utforare": "Post- och telestyrelsen (vägledning om samhällsomfattande tjänster)<br>Finansinspektionen (vägledning om kreditupplysning)", "tvist": "ARN (ej bindande); allmän domstol", "tillsynsmyndighet": "Post- och telestyrelsen (tillsyn över elektronisk kommunikation och samhällsomfattande tjänster)", "lagstod": "**Lag om elektronisk kommunikation (2022:482)** 6 kap. 1 § anger att Post- och telestyrelsen får besluta om en skyldighet att tillhandahålla samhällsomfattande tjänster om det behövs för att tillgång till överkomligt pris ska kunna säkerställas. Samhällsomfattande tjänst avser en adekvat internetanslutningstjänst eller en talkommunikationstjänst i en fast nätanslutningspunkt i en stadigvarande bostad. Mobiltelefoni och mobildata omfattas inte.<br>**Lagen om vissa produkters och tjänsters tillgänglighet (2023:254)** anger tillgänglighetskrav för bland annat elektroniska kommunikationstjänster som riktar sig till konsumenter, men reglerar inte rätten till abonnemang för den som har betalningsanmärkning.<br>**Regeringsformen (1974:152)** 1 kap. 2 § anger att det allmänna ska verka för att alla kan delta i samhället på lika villkor.", "lucka_status": "Nej", "empirisk_kalla": "Kronofogden (2026-01-26) Pressmeddelande (webben)::Antalet skuldsatta i Sverige är nästan 450 000. | Telia (2026) Köp- och leveransinformation (webben)::Du kan inte teckna abonnemang hos oss om du har en betalningsanmärkning. Om du redan är kund och har ett eller flera befintliga abonnemang kan du behålla dem. Du kan dock inte förlänga eller göra om villkoren för dem, exempelvis ta ut en ny mobil eller ta del av ett kampanjerbjudande. | Bredbandsval.se (2025) Bredband med betalningsanmärkning::De flesta internetleverantörer utför en kreditkontroll i samband med beställning av bredband. Om den kreditupplysning som görs visar på en nedsatt betalningsförmåga kan tyvärr operatören neka dig att skaffa bredband via dem.", "beskrivning": "Skuldsättning eller låg kreditvärdighet kan hindra tillgång till internet- och telefonabonnemang.", "lankar": ["https://kronofogden.se/om-kronofogden/nyheter-och-press/pressmeddelande/2026-01-26-skulderna-hos-kronofogden-fortsatter-att-oka", "https://www.telia.se/support/kopinformation", "https://www.bredbandsval.se/bredband/betalningsanmarkning"], "tillsynsskydd_finns": "Skyddet för samhällsomfattande tjänster gäller fast bredband och fast telefoni i bostaden, inte mobildata eller mobilabonnemang. Ingen myndighet säkerställer att skuldsatta behåller tillgång till digital infrastruktur."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.2 Funktionsrelaterad exkludering", "taxonomi_id": "2.2.1", "kategori": "Kognitiv exkludering", "situation_exempel": "Jag har en NPF-diagnos och Försäkringskassans ansökan har så många steg och tidsgränser att jag ger upp halvvägs och det finns inget sätt att spara och fortsätta senare.", "radgivning_enskild": "Respektive myndighet (begära hjälp enligt förvaltningslagen 6 §)<br>Statens servicecenter (hjälp vid besök på servicekontor)<br>Funktionsrättsorganisation<br>Diskrimineringsombudsmannen (anmälan vid bristande tillgänglighet som diskriminering)", "radgivning_utforare": "Myndigheten för digital förvaltning (vägledning om tillgänglighet till digital offentlig service)<br>Myndigheten för delaktighet (vägledning om kognitiv tillgänglighet ur funktionsrättsperspektiv)<br>Diskrimineringsombudsmannen (vägledning om bristande tillgänglighet som diskriminering)", "tvist": "JO; DO (om bristande tillgänglighet utgör diskriminering)", "tillsynsmyndighet": "Myndigheten för digital förvaltning (tillsyn enligt lagen om tillgänglighet till digital offentlig service)<br>Diskrimineringsombudsmannen (tillsyn enligt diskrimineringslagen)<br>Justitieombudsmannen (granskar enskilda fall av myndighetsutövning)", "lagstod": "**Lagen om tillgänglighet till digital offentlig service (2018:1937)** anger att digital offentlig service ska vara möjlig att uppfatta, hanterbar, begriplig och robust.<br>**Diskrimineringslagen (2008:567)** 1 kap. 4 § anger att bristande tillgänglighet för en person med funktionsnedsättning utgör diskriminering om skäliga åtgärder för tillgänglighet inte vidtagits.<br>**Förvaltningslagen (2017:900)** 6 § anger att myndigheter ska se till att kontakterna med enskilda blir smidiga och enkla, och lämna den enskilde sådan hjälp att hen kan ta till vara sina intressen. 7 § anger att myndigheter ska vara tillgängliga för kontakter.<br>**Förenta nationernas konvention om rättigheter för personer med funktionsnedsättning (CRPD)** art. 9 anger att konventionsstaterna ska vidta åtgärder för att säkerställa tillgång på lika villkor till information och kommunikation.", "lucka_status": "Delvis", "empirisk_kalla": "Riksrevisionen (RiR 2026:4) Ändrade förhållanden – ineffektiv hantering i socialförsäkringen::I samtal med fokusgrupper med företrädare för organisationer inom\nfunktionshinderområdet framkommer att försäkrade med kognitiv nedsättning har\nsvårt att anmäla ändrade förhållanden inom sjukersättning (s. 28). | FN:s funktionsrättskommitté (2024, CRPD/C/SWE/CO/2–3, punkt 9c)::Kommittén är oroad över att det inte finns tillräckliga möjligheter för personer med funktionsnedsättning att vidta rättsliga åtgärder, inge klagomål och få gottgörelse i fall där regioner och kommuner inte genomför konventionen på ett tillräckligt sätt (s. 3). | Institutet för mänskliga rättigheter (2026) Årsrapport 2026::I undersökning från 2023, genomförd tillsammans med Rivkraftspanelen, besvarad av 1 833 personer med funktionsnedsättning, uppgav endast 36 procent av\ndeltagarna att de vet vart de kan vända sig om deras rättigheter inte efterlevs (s. 36).", "beskrivning": "Digitala samhällsfunktioner som förutsätter snabb orientering, komplex navigering eller stor mängd information utestänger den som behöver mer tid, tydligare struktur eller enklare gränssnitt.", "lankar": ["https://www.riksrevisionen.se/download/18.3183a4c019c47d273ac1dc18/1771403839821/RiR-2026-4-rapport.pdf", "https://regeringen.se/contentassets/c6e42825cbcc4985b771934a7b8248e4/crpd-kommittens-slutsatser-och-rekommendationer-2024-03-22-svensk-oversattning.pdf", "https://mrinstitutet.se/download/18.234277b219d0483f491b63a/1774331817101/Rapport-Arsrapport-2026.pdf"], "tillsynsskydd_finns": "DOS-lagen täcker tekniska tillgänglighetskrav enligt WCAG 2.1, men kognitiv tillgänglighet – informationsarkitektur, antal steg, tidsgränser och möjlighet att spara och återkomma – har svaga kriterier som sällan granskas."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.2 Funktionsrelaterad exkludering", "taxonomi_id": "2.2.2", "kategori": "Sensorisk exkludering", "situation_exempel": "Jag är döv och ska boka tolk via regionens Tolkportal – men verktyget fungerar inte på mobil och regionen har pausat allt förbättringsarbete.", "radgivning_enskild": "Tolkcentralen i regionen (boka tolk och lämna synpunkter)<br>Patientnämnden (vid frågor om vården)<br>Sveriges Dövas Riksförbund (rättighetsorganisation)<br>Diskrimineringsombudsmannen (anmälan vid bristande tillgänglighet som diskriminering)", "radgivning_utforare": "Myndigheten för digital förvaltning (vägledning om tillgänglighet till digital offentlig service)<br>Myndigheten för delaktighet (vägledning om tillgänglighet ur funktionsrättsperspektiv)<br>Sveriges Kommuner och Regioner (stöd till regioner om tolktjänster)<br>Post- och telestyrelsen (upphandlar nationella förmedlingstjänster för personer med funktionsnedsättning, exempelvis texttelefoni och teletal)", "tvist": "DO (diskrimineringsärende); förvaltningsrätten (om vårdinsats kan överklagas)", "tillsynsmyndighet": "Myndigheten för digital förvaltning (tillsyn enligt lagen om tillgänglighet till digital offentlig service)<br>Diskrimineringsombudsmannen (tillsyn enligt diskrimineringslagen)<br>Inspektionen för vård och omsorg (tillsyn över patientsäkerhet vid tolkbrist)<br>Post- och telestyrelsen (tillsyn enligt lagen om vissa produkters och tjänsters tillgänglighet)", "lagstod": "**Lagen om tillgänglighet till digital offentlig service (2018:1937)** anger att digital offentlig service ska vara möjlig att uppfatta, hanterbar, begriplig och robust.<br>**Diskrimineringslagen (2008:567)** 1 kap. 4 § anger att bristande tillgänglighet för en person med funktionsnedsättning utgör diskriminering om skäliga åtgärder för tillgänglighet inte vidtagits.<br>**Lagen om vissa produkters och tjänsters tillgänglighet (2023:254)** anger tillgänglighetskrav för bland annat elektroniska kommunikationstjänster som riktar sig till konsumenter.<br>**Förenta nationernas konvention om rättigheter för personer med funktionsnedsättning (CRPD)** art. 9 anger att konventionsstaterna ska säkerställa tillgång på lika villkor till information och kommunikation. Art. 21 anger att konventionsstaterna ska erkänna och främja användning av teckenspråk.", "lucka_status": "Delvis", "empirisk_kalla": "Stockholms Dövas Förening (dec 2024) Rapport från möte angående Tolkportalen::Tolkportalen fungerar inte på mobil, krångligt att ändra/avboka, fel information om support. | Stockholms Dövas Förening (maj 2025) Summering från samverkansmötet med Tolkcentralen::Ny IT-leverantör tar inte ansvar för tidigare kod, lansering försenad. Tolkbristen ökade från 0,6 % till 3,1 % (228 uppdrag, 441 timmar). Staten tilldelade 28 mkr till Region Stockholm men bara 4 mkr extra nådde Tolkcentralen. FaceTime och WhatsApp får inte användas pga dataskyddsförordningen (GDPR) så yngre döva som saknar bildtelefon har inga alternativa kontaktvägar. | Stockholms Dövas Förening (okt 2025) Rapport: samverkansmöte med Tolkcentralen::Regionens konsultstopp pausar allt utvecklingsarbete. Tolkportalen fortsatt otillgänglig. Vårdgivare bokar inte tolk vid akuta behov. | FN:s funktionsrättskommitté (2024, CRPD/C/SWE/CO/2–3, punkt 9c)::Kommittén är oroad över att det inte finns tillräckliga möjligheter för personer med funktionsnedsättning att vidta rättsliga åtgärder, inge klagomål och få gottgörelse i fall där regioner och kommuner inte genomför konventionen på ett tillräckligt sätt (s. 3).", "beskrivning": "Digitala samhällsfunktioner som inte kompenserar för syn- eller hörselnedsättning i sin design utestänger hela grupper.", "lankar": ["https://stockholmsdf.se/nyheter/rapport-tolkportalen/", "https://stockholmsdf.se/nyheter/summering-fran-tolkcentralen/", "https://stockholmsdf.se/nyheter/samverkansmote-tolkcentralen/", "https://regeringen.se/contentassets/c6e42825cbcc4985b771934a7b8248e4/crpd-kommittens-slutsatser-och-rekommendationer-2024-03-22-svensk-oversattning.pdf"], "tillsynsskydd_finns": "Tolkportalen som intern beställningsportal kan falla utanför DOS-lagens tillämpningsområde. Sparåtgärder som pausar tillgänglighetsarbete behandlas som generella budgetbeslut, inte som inskränkningar av rättigheter."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.2 Funktionsrelaterad exkludering", "taxonomi_id": "2.2.3", "kategori": "Motorisk exkludering", "situation_exempel": "Jag har Parkinsons och kan inte hålla fingret stilla nog för BankID:s fingeravtrycksläsare, sexsiffrig kod, jag träffar fel varje gång", "radgivning_enskild": "Banken (alternativa inloggningsmetoder)<br>Diskrimineringsombudsmannen (anmälan vid bristande tillgänglighet som diskriminering)", "radgivning_utforare": "Myndigheten för digital förvaltning (vägledning om webbtillgänglighet och EN 301 549)<br>Finansinspektionen (vägledning om bankers tillgänglighetskrav)<br>Post- och telestyrelsen (vägledning om lagen om vissa produkters och tjänsters tillgänglighet)", "tvist": "DO (diskrimineringsärende)", "tillsynsmyndighet": "Diskrimineringsombudsmannen (tillsyn enligt diskrimineringslagen)<br>Myndigheten för digital förvaltning (tillsyn enligt lagen om tillgänglighet till digital offentlig service)<br>Finansinspektionen (tillsyn över banker)<br>Post- och telestyrelsen (tillsyn enligt lagen om vissa produkters och tjänsters tillgänglighet)", "lagstod": "**Diskrimineringslagen (2008:567)** 1 kap. 4 § anger att bristande tillgänglighet för en person med funktionsnedsättning utgör diskriminering om skäliga åtgärder för tillgänglighet inte vidtagits.<br>**Lagen om tillgänglighet till digital offentlig service (2018:1937)** anger att digital offentlig service ska vara möjlig att uppfatta, hanterbar, begriplig och robust. Lagen pekar ut harmoniserad standard EN 301 549 som ska följas.<br>**EN 301 549 (harmoniserad europeisk tillgänglighetsstandard)** kap. 5.3 anger att när biometri används för att identifiera eller styra en funktion ska användaren erbjudas en likvärdig alternativ metod.<br>**Lagen om vissa produkters och tjänsters tillgänglighet (2023:254)** anger tillgänglighetskrav för bland annat banktjänster, betaltjänster och e-handelstjänster som riktar sig till konsumenter.", "lucka_status": "Delvis", "empirisk_kalla": "BankID (2026) Fingeravtryck och ansiktsigenkänning::Ansiktsigenkänning stöds bara på iPhone (Face ID), inte på Android. Användare med motorisk funktionsnedsättning och Android-telefon har bara fingeravtryck och sexsiffrig kod som alternativ.", "beskrivning": "Digitala gränssnitt som kräver finmotorik, handstyrka eller precisa rörelser utan alternativ utestänger den som inte kan utföra dem.", "lankar": ["https://support.bankid.com/sv/tekniska-fragor-och-problem/fingeravtryck-och-ansiktsigenkanning"], "tillsynsskydd_finns": "Ansvaret är splittrat mellan Diskrimineringsombudsmannen, Myndigheten för digital förvaltning och Finansinspektionen."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.2 Funktionsrelaterad exkludering", "taxonomi_id": "2.2.4", "kategori": "Psykosocial exkludering", "situation_exempel": "Jag måste skicka in återkommande rapporter men är rädd att skriva fel och förlora min ersättning – systemet ger ingen förhandsgranskning och jag vet inte om jag kan ändra efteråt.", "radgivning_enskild": "Respektive myndighet (telefon eller besök)<br>Statens servicecenter (hjälp vid besök på servicekontor)", "radgivning_utforare": "Myndigheten för digital förvaltning (vägledning om tillgänglighet till digital offentlig service)<br>Inspektionen för socialförsäkringen (granskning av Försäkringskassans digitala tjänster)<br>Inspektionen för arbetslöshetsförsäkringen (vägledning om aktivitetsrapportering)", "tvist": "Förvaltningsrätten (om felaktigt beslut)", "tillsynsmyndighet": "Inspektionen för socialförsäkringen (tillsyn över Försäkringskassan, Pensionsmyndigheten och socialförsäkringen)<br>Inspektionen för arbetslöshetsförsäkringen (tillsyn över arbetslöshetsförsäkringen)<br>Justitieombudsmannen (granskar enskilda fall av myndighetsutövning)", "lagstod": "**Förvaltningslagen (2017:900)** 6 § anger att myndigheter ska se till att kontakterna med enskilda blir smidiga och enkla, och lämna den enskilde sådan hjälp att hen kan ta till vara sina intressen. 7 § anger att myndigheter ska vara tillgängliga för kontakter.<br>**Förvaltningslagen (2017:900)** 25 § anger att en myndighet ska underrätta parten om allt material av betydelse för beslutet och ge parten tillfälle att yttra sig innan beslut fattas, om det inte är uppenbart obehövligt.<br>**Lagen om tillgänglighet till digital offentlig service (2018:1937)** anger att digital offentlig service ska vara möjlig att uppfatta, hanterbar, begriplig och robust.)", "lucka_status": "Delvis", "empirisk_kalla": "Inspektionen för arbetslöshetsförsäkringen, IAF (2018:5) Aktivitetsrapportering — till vilken nytta och för vem?::De intervjuade var överens om att det finns grupper av sökande som behöver särskilt stöd med aktivitetsrapporteringen (s. 20) och en arbetssökande som inte lämnar in sin aktivitetsrapport kan få en sanktion, i form av en varning eller avstängning, för misskötsel av sitt arbetssökande (s. 3: ). | Riksrevisionen (RiR 2023:6) Digitala tjänster till privatpersoner – stora utvecklingsmöjligheter för statliga myndigheter::Ett annat problem handlar om att personer är rädda för att göra fel i digitala tjänster eller känner sig stressade och osäkra.  (s. 30).", "beskrivning": "Digitala samhällsfunktioner kan skapa stress, ångest eller känsla av maktlöshet genom otydlig systemlogik eller risk för oåterkalleliga fel. Den som lever med psykisk ohälsa eller social utsatthet är särskilt utsatt när systemet inte ger utrymme för osäkerhet.", "lankar": ["https://www.iaf.se/globalassets/dokument/rapporter/2017-2018/2018-5-aktivitetsrapportering-till-vilken-nytta-och-for-vem.pdf", "https://www.riksrevisionen.se/download/18.1e0fa62b19047f61fcc9553/1719239329567/RiR_2023_6_master.pdf"], "tillsynsskydd_finns": "Tillsynsmyndigheterna granskar enskilda beslut men inte hur gränssnittsdesign påverkar den enskildes möjlighet att förstå och hantera sitt ärende."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.2 Funktionsrelaterad exkludering", "taxonomi_id": "2.2.5", "kategori": "Gradvis försämrad kognitiv förmåga", "situation_exempel": "Mamma glömmer sina lösenord allt oftare och missar digital post – hon är inte tillräckligt sjuk för god man men klarar inte längre sin digitala vardag.", "radgivning_enskild": "Vårdcentralen (kognitiv utredning)<br>Kommunens biståndshandläggare<br>Banken (egen fullmaktsprocess)<br>Överförmyndarnämnden (vägledning om god man och framtidsfullmakt)", "radgivning_utforare": "Överförmyndarnämnden (vägledning om god man och framtidsfullmakter)<br>Socialstyrelsen (vägledning om biståndsbedömning enligt socialtjänstlagen)<br>Myndigheten för digital förvaltning (vägledning om digital tillgänglighet)", "tvist": "Tingsrätten (ansökan om god man)", "tillsynsmyndighet": "Inspektionen för vård och omsorg (tillsyn över socialtjänstens insatser)<br>Länsstyrelsen (tillsyn över överförmyndarnämndens verksamhet)<br>Justitieombudsmannen (granskar enskilda fall av myndighetsutövning)", "lagstod": "**Föräldrabalken (1949:381)** 11 kap. 4 § anger att rätten ska besluta att anordna godmanskap för den som på grund av sjukdom, psykisk störning, försvagat hälsotillstånd eller liknande förhållande behöver hjälp med att bevaka sin rätt, förvalta sin egendom eller sörja för sin person.<br>**Lagen om framtidsfullmakter (2017:310)** 1 § anger att en framtidsfullmakt är en fullmakt som någon ger åt en fysisk person att företräda fullmaktsgivaren för det fall hen på grund av sjukdom, psykisk störning, försvagat hälsotillstånd eller liknande förhållande varaktigt inte längre har förmåga att ha hand om sina angelägenheter.", "lucka_status": "Nej", "empirisk_kalla": "Svenskt Demenscentrum (2023) Demens i siffror::År 2023 uppgick antalet personer med demenssjukdom till omkring 130 000–150 000. Varje år beräknas 20 000–25 000 personer insjukna, enligt Socialstyrelsen. | Institutet för mänskliga rättigheter (2026) Årsrapport 2026::Lagen om stöd och service till vissa funktionshindrade (LSS) undantar funktionsnedsättningar som uppenbart beror på normalt åldrande. Det innebär att personer som får hjälpbehov sent i livet – exempelvis på grund av nedsatt rörlighet, syn, hörsel eller kognitiv svikt – inte har tillgång till samma rättighetsbaserade stöd som yngre personer med motsvarande funktionsnedsättning (s. 72).", "beskrivning": "Digitala samhällsfunktioner förutsätter stabil kognitiv förmåga över tid. Under perioden av gradvis försämring ökar den enskildes behov av kontakt med vård, omsorg och myndigheter samtidigt som systemen saknar rutiner och funktioner för den övergången.", "lankar": ["https://demenscentrum.se/Fakta-om-demens/Demens-i-siffror/", "https://mrinstitutet.se/download/18.234277b219d0483f491b63a/1774331817101/Rapport-Arsrapport-2026.pdf"], "tillsynsskydd_finns": "Det finns ingen mekanism för den gråzon där en person gradvis förlorar digital förmåga men ännu inte uppfyller kraven för god man."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.3 Beroendeposition och digital kontroll", "taxonomi_id": "2.3.1", "kategori": "Tillgång i omsorg", "situation_exempel": "Jag bor på LSS-boende och det finns inget internet i min lägenhet – personalen säger att jag kan använda wifi i gemensamma utrymmen men där ser andra min skärm.", "radgivning_enskild": "Kommunens LSS-handläggare<br>God man<br>Funktionsrättsorganisation<br>Patientnämnden (om vårdkopplad insats)", "radgivning_utforare": "Inspektionen för vård och omsorg (vägledning om LSS-boenden)<br>Socialstyrelsen (vägledning om goda levnadsvillkor och välfärdsteknik)<br>Myndigheten för delaktighet (vägledning om tillgänglighet ur funktionsrättsperspektiv)", "tvist": "Förvaltningsrätten (överklaga biståndsbeslut)", "tillsynsmyndighet": "Inspektionen för vård och omsorg (tillsyn över LSS-boenden och äldreboenden)<br>Migrationsverket (förvar)<br>Justitieombudsmannen (granskar enskilda fall av myndighetsutövning)", "lagstod": "**Lagen om stöd och service till vissa funktionshindrade (1993:387)** 5 § anger att verksamheten ska främja jämlikhet i levnadsvillkor och full delaktighet i samhällslivet, och att målet är att den enskilde får möjlighet att leva som andra. 6 § anger att verksamheten ska vara grundad på respekt för den enskildes självbestämmanderätt och integritet. 7 § anger att den enskilde genom insatserna ska tillförsäkras goda levnadsvillkor.<br>**Regeringsformen (1974:152)** 2 kap. 6 § anger att var och en gentemot det allmänna är skyddad mot betydande intrång i den personliga integriteten som sker utan samtycke.<br>**Förenta nationernas konvention om rättigheter för personer med funktionsnedsättning (CRPD)** art. 19 anger att personer med funktionsnedsättning har rätt att leva självständigt och delta i samhället på lika villkor som andra.", "lucka_status": "Delvis", "empirisk_kalla": "Socialstyrelsen (2025) E-hälsa och välfärdsteknik i kommunerna 2025::Internettillgången i enskildas rum eller lägenheter är högre på kommunalt drivna särskilda boenden för äldre än i stöd- och serviceboenden för personer med funktionsnedsättning. 66 procent av kommunerna har uppgett att alla deras särskilda boenden för äldre har tillgång till internet i enskildas rum eller lägenheter. 58 procent av kommunerna uppger att det finns internetuppkoppling på alla stöd- och serviceboenden för personer med funktionsnedsättning som drivs av kommunen. Resultaten är desamma som förra året. 20 respektive 23 procent av kommunerna saknar internettillgång i enskildas rum eller lägenheter. Samtidigt minskar andelen kommuner som erbjuder gratis internetuppkoppling på sina boenden, i år är den cirka 55 procent (s. 27-28). | Inspektionen för vård och omsorg, IVO (2023) Att inte få rätten att leva som andra::IVO har genomfört en riktad tillsyn av 90 gruppbostäder (LSS-boenden) för vuxna med funktionsnedsättningar. IVO har funnit brister i 80 av de 90 granskade gruppbostäderna (tillsynen i fråga gällde otillåtna tvångs- och begränsningsåtgärder) (s. 3).", "beskrivning": "Personal i boenden, daglig verksamhet eller förvar kan styra över den enskildes internetåtkomst, enheter och konton. Eller aldrig erbjuda uppkoppling. Begränsningar kan vara befogade men förutsätter individuell bedömning.", "lankar": ["https://www.socialstyrelsen.se/contentassets/d90a552a88914f07b47eb174b0f4fbd2/2025-5-9625.pdf", "https://www.ivo.se/aktuellt/publikationer/rapporter/att-inte-fa-ratten-att-leva-som-andra/"], "tillsynsskydd_finns": "Inspektionen för vård och omsorg har tillsyn över LSS-boenden men det finns inga nationella krav på internet i den enskildes lägenhet. Frågan om internet ingår i \"goda levnadsvillkor\" enligt LSS är inte rättsligt prövad."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.3 Beroendeposition och digital kontroll", "taxonomi_id": "2.3.2", "kategori": "Skyddsbehov", "situation_exempel": "Jag flydde från en förövare som jag hade en relation med. Personen gör fortfarande allt för att spåra mig och det är svårt att leva dold när allt är digitalt.", "radgivning_enskild": "Kvinnojouren<br>Brottsofferjouren<br>Skatteverket (skyddade personuppgifter)<br>Banken (egna säkerhetsrutiner och fullmaktshantering)", "radgivning_utforare": "Sveriges Kommuner och Regioner (stöd till kommuner om skyddade personuppgifter)<br>Integritetsskyddsmyndigheten (vägledning om dataskydd)<br>Jämställdhetsmyndigheten (vägledning om mäns våld mot kvinnor och digitalt våld)<br>Skatteverket (vägledning om skyddade personuppgifter)", "tvist": "Polisen (anmälan); tingsrätten (kontaktförbud)", "tillsynsmyndighet": "Integritetsskyddsmyndigheten (tillsyn över behandling av personuppgifter)<br>Finansinspektionen (tillsyn över banker och deras hantering av skyddade kunder)<br>Skatteverket (får signaler från drabbade när skyddet brister hos andra myndigheter)<br>Justitieombudsmannen (granskar enskilda fall av myndighetsutövning)", "lagstod": "**Offentlighets- och sekretesslagen (2009:400)** 22 kap. anger sekretess för uppgift om en enskilds personliga förhållanden inom folkbokföringen, om det av särskild anledning kan antas att den enskilde eller någon närstående lider men om uppgiften röjs.<br>**Folkbokföringslagen (1991:481)** 16 § anger att en person som av särskilda skäl kan antas bli utsatt för brott, förföljelser eller allvarliga trakasserier får medges skyddad folkbokföring om åtgärden kan antas tillgodose behovet av skydd.<br>**Dataskyddsförordningen (GDPR)** art. 5 anger principen att personuppgifter ska behandlas på ett sätt som säkerställer lämplig säkerhet, inbegripet skydd mot obehörig behandling.", "lucka_status": "Nej", "empirisk_kalla": "Jämställdhetsmyndigheten (2026) Det gränslösa våldet (Rapport 2026:1)::Teknologifaciliterat våld är inte en ny våldsform, utan handlar om hur digital teknik används för att utöva och förstärka psykiskt, sexuellt och ekonomiskt våld. Utsattheten är omfattande och tydligt könad. | SVT (2024) SVT granskar: Så röjs skyddade personer av rättsväsendet::Nästan 33 000 personer i Sverige lever med skyddade personuppgifter, eftersom de är utsatta för hot eller våld. Men det händer att deras uppgifter blir röjda – och då kan det få stora konsekvenser. När det händer är det vanligt att källan till röjningarna är polis, åklagare och domstolar – det visar en enkät som Skatteverket gjort med gömda personer. | Jämställdhetsmyndigheten (2022) Skyddade personuppgifter – oskyddade personer:: Möjligheten att ta fram ett digitalt ID-nummer som inte är kopplat till den faktiska personen bör utredas, för att personer med skyddade personuppgifter ska kunna ta del av digital service och tjänster på samma villkor som övriga medborgare (s. 43).", "beskrivning": "Digitala samhällsfunktioner förutsätter att den enskilde har kontroll över sin identitet, sina konton och sina enheter. För den som lever under hot eller i en kontrollerande relation är detta problematiskt, och farligt. Sammankopplade register kan röja adresser, sekretessmarkering hanteras inte av de flesta digitala myndighetstjänster, och konton och BankID knutna till en förövare kan inte enkelt frigöras.", "lankar": ["https://jamstalldhetsmyndigheten.se/aktuellt/publikationer/rapport-2026-1-det-granslosa-valdet-en-kartlaggning-av-den-digitala-teknikens-betydelse-for-mans-vald-mot-kvinnor-och-vald-mot-barn/", "https://www.svt.se/nyheter/lokalt/smaland/svt-granskar-sa-rojs-skyddade-personer-av-rattsvasendet", "https://jamstalldhetsmyndigheten.se/media/bkbdjajc/2022_10-delrapport-skyddade-personuppgifer.pdf"], "tillsynsskydd_finns": "Sekretessmarkering hanteras inte konsekvent i digitala myndighetstjänster. Sammankopplade register kan röja adress om inte varje system aktivt stöder skyddade uppgifter. Ingen samlad process finns för att digitalt frigöra en person från en kontrollerande partner."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.4 Livskris och instabilitet", "taxonomi_id": "2.4.1", "kategori": "Akut livskris", "situation_exempel": "Jag sitter på akuten med mitt sjuka barn och parkeringsappen kräver registrering, kortbetalning och zonval – jag kan inte tänka klart just nu.", "radgivning_enskild": "Sjukhusets reception<br>Parkeringsbolaget (kontaktuppgifter på betalautomat eller skylt)<br>Kommunens kontaktcenter", "radgivning_utforare": "Saknas – ingen myndighet ger riktad vägledning om analoga betalningsalternativ vid samhällskritiska parkeringsplatser", "tvist": "ARN (ej bindande); kommunen (om kommunal parkering)", "tillsynsmyndighet": "Kommunen (ansvar för kommunal parkering)<br>Branschorganisationen Svensk Parkeringsförening (branschöverenskommelse för privata parkeringsbolag)", "lagstod": "**Regeringsformen (1974:152)** 1 kap. 2 § anger att det allmänna ska trygga rätten till hälsa och verka för att alla kan delta i samhället på lika villkor.<br>**Hälso- och sjukvårdslagen (2017:30)** 3 kap. 1 § anger att målet med hälso- och sjukvården är en god hälsa och vård på lika villkor för hela befolkningen.<br>**Kommunallagen (2017:725)** 2 kap. 1 § anger att kommuner får ha hand om angelägenheter av allmänt intresse som har anknytning till kommunens område eller medlemmar. Lagen ställer inga krav på att kommunala parkeringsplatser ska erbjuda analoga betalningsalternativ.", "lucka_status": "Nej", "empirisk_kalla": "Sveriges radio P4 (2025) Parkeringsappar för krångliga – Hugo tar bussen istället::Parkeringsappar skapar stress för äldreD15:M15 och teknikovana vid sjukhus och andra offentliga platser | Jmfr 1.3.1 (Digitalt utan alternativ) för detaljerad empiri om parkeringsappar.", "beskrivning": "Digitala samhällsfunktioner som förutsätter handlingskraft och precision i situationer där sjukdom, psykisk ohälsa, våld eller förlust tillfälligt gör det omöjligt.", "lankar": ["https://www.sverigesradio.se/artikel/parkeringsappar-for-krangliga-hugo-tar-bussen-istallet"], "tillsynsskydd_finns": "Ingen myndighet ställer krav på att parkeringsplatser vid samhällskritiska funktioner ska ha analoga betalningsalternativ."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.4 Livskris och instabilitet", "taxonomi_id": "2.4.2", "kategori": "Anhörigansvar", "situation_exempel": "Min mamma är ensamstående och har varit med om en olycka. Hon ligger på sjukhus. Jag behöver meddela berörda myndigheter att hon inte kan jobba och jag behöver betala hennes räkningar. Jag har ingen fullmakt men tänker använda hennes BankID.", "radgivning_enskild": "Respektive myndighet (egna ombudsrutiner)<br>Banken (egna fullmaktsrutiner)<br>Överförmyndarnämnden (vägledning om god man och framtidsfullmakt)", "radgivning_utforare": "Myndigheten för digital förvaltning (vägledning om ombudshantering i digitala tjänster)<br>Sveriges Kommuner och Regioner (stöd till kommuner om fullmakter)<br>Konsumenternas Bank- och finansbyrå (vägledning om bankernas fullmaktshantering)", "tvist": "Förvaltningsrätten (myndighetsbeslut)", "tillsynsmyndighet": "Justitieombudsmannen (granskar enskilda fall av myndighetsutövning)<br>Överförmyndarnämnden (granskar god man och förvaltare)<br>Finansinspektionen (tillsyn över banker)", "lagstod": "**Förvaltningslagen (2017:900)** 14 § anger att den som är part i ett ärende får som ombud eller biträde anlita någon som är lämplig för uppdraget. 15 § anger att en myndighet får begära att ett ombud styrker sin behörighet genom skriftlig eller muntlig fullmakt.<br>**Lagen om framtidsfullmakter (2017:310)** 1 § anger att en framtidsfullmakt är en fullmakt som någon ger åt en fysisk person att företräda fullmaktsgivaren för det fall hen på grund av sjukdom, psykisk störning, försvagat hälsotillstånd eller liknande förhållande varaktigt inte längre har förmåga att ha hand om sina angelägenheter.", "lucka_status": "Nej", "empirisk_kalla": "Konsumenternas Bank- och finansbyrå (2026) Verksamhetsberättelse 2025::Ett återkommande klagomål 2025 var att konsumenten upplevde att det inte var möjligt att hjälpa\nen anhörig med bankärenden digitalt (s. 24). | Begripsam (2025) Utestängd från det kontantlösa samhället::Avsnitt som beskriver problem med fullmakter (s. 24-25). | Prop. 2025/26:92 Ett ställfäreträdarskap att lita på::Regeringen föreslår att det införs ett nationellt ställföreträdarregister. Registret kommer att underlätta tillsynen av gode män och förvaltare och göra det lättare för ställföreträdare att visa sin behörighet i kontakter med bland annat myndigheter och banker. | Se även 1.2.4 (Ombudskap)", "beskrivning": "Digitala samhällsfunktioner som saknar enkla och rättssäkra sätt för anhöriga att agera i den enskildes ärenden vid kris. Bristen på reglerade ombudsfunktioner tvingar anhöriga att agera utan formellt stöd.", "lankar": ["https://www.konsumenternas.se/globalassets/pdf/vb/verksamhetsberattelse-2025.pdf", "https://www.begripsam.se/download/18.4fd9741419ac5edf2a463b49/1764751364652/Rapport%20Utesta%CC%88ngd%20fra%CC%8An%20det%20kontantlo%CC%88sa%20samha%CC%88llet%20december%202025.pdf", "https://www.regeringen.se/rattsliga-dokument/proposition/2025/12/prop.-20252692"], "tillsynsskydd_finns": "Förvaltningslagens rätt att anlita ombud finns på papper men digitala myndighetstjänster saknar funktion för ombudshantering. I mellanperioden mellan akut behov och formellt ställföreträdarskap har anhöriga inget rättssäkert sätt att agera digitalt."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.4 Livskris och instabilitet", "taxonomi_id": "2.4.3", "kategori": "Dödsfall", "situation_exempel": "Min mamma dog och jag har svårt att få överblick över alla olika typer av prenumerationer och fakturor.", "radgivning_enskild": "Banken (egna rutiner för dödsbo)<br>Skatteverket (bouppteckning och dödsfallsintyg)<br>Efterlevandeguiden.se (myndighetssamverkan)<br>Begravningsbyrå (administrativt stöd)", "radgivning_utforare": "Skatteverket (vägledning om bouppteckningsprocessen)<br>Myndigheten för digital förvaltning (vägledning om digital samordning vid dödsfall)<br>Konsumenternas Bank- och finansbyrå (vägledning om bankernas dödsbohantering)", "tvist": "Tingsrätten (boutredningsman vid tvist)", "tillsynsmyndighet": "Skatteverket (registrerar bouppteckning)<br>Finansinspektionen (tillsyn över bankernas dödsbohantering)<br>Justitieombudsmannen (granskar enskilda fall av myndighetsutövning)", "lagstod": "**Ärvdabalken (1958:637)** 18 kap. 1 § anger att efterlevande make eller sambo, arvingar och universella testamentstagare gemensamt förvaltar den dödes egendom under boets utredning, om inte särskild dödsboförvaltning anordnats. 20 kap. anger reglerna om bouppteckning, som ska förrättas inom tre månader från dödsfallet och ges in till Skatteverket inom en månad från förrättningsdagen.", "lucka_status": "Nej", "empirisk_kalla": "Swedbank (2025) När någon dör – ta hand om dödsbo och bouppteckning::När vi får veta av Skatteverket att någon har dött sker följande: Betal- och kreditkort samt BankID spärras; Internetbanken och telefontjänsten Kundcenter avslutas; Tjänsten e-faktura sägs upp och alla framtida fakturor skickas istället som pappersfakturor; Privatgiro avslutas; Dispositionsrätter för god man, förvaltare och övriga personer tas bort; Kapital- och räntebesked skickas till dödsboets adress. | Nordea (2025) Checklista vid dödsfall::E-fakturor stängs av men autogiron fortsätter dras. | Efterlevandeguiden.se (statlig samverkan) Checklista – efter ett dödsfall::Lista med sociala medier och streamingtjänster som ska avslutas. Varje tjänst kräver separat kontakt med dödsbevis.", "beskrivning": "Digitala samhällsfunktioner som saknar rutiner för övergång vid dödsfall. Anhöriga saknar ofta fullmakter eller åtkomst till konton, ärenden och myndighetskontakter i en situation där dessa behövs akut.", "lankar": ["https://www.swedbank.se/privat/livet/familj/dodsfall-dodsbo.html", "https://www.nordea.se/privat/liv/familj/vid-dodsfall/checklista-vid-dodsfall.html", "https://www.efterlevandeguiden.se/checklista-efter-ett-dodsfall.html"], "tillsynsskydd_finns": "Dödsbodelägare har rätt att förvalta tillgångar men digitala tjänster saknar enhetliga rutiner. Ingen samlad digital process finns för att hantera dödsbo gentemot myndigheter, banker, prenumerationstjänster och sociala medier."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.5 Barn och unga", "taxonomi_id": "2.5.1", "kategori": "Digitala ombud", "situation_exempel": "Jag och mitt ex har gemensam vårdnad men vi pratar inte med varandra – tjänsten kräver att vi båda signerar digitalt och det går inte att lösa.", "radgivning_enskild": "Familjerätten i kommunen (samarbetssamtal vid vårdnadskonflikt)<br>Respektive myndighet (egna rutiner för dubbel signering)", "radgivning_utforare": "Myndigheten för digital förvaltning (vägledning om digital ombudshantering)<br>Skatteverket (vägledning om folkbokföringsprocesser och vårdnadsregistrering)<br>Socialstyrelsen (vägledning om familjerätt)", "tvist": "Tingsrätten (ensam vårdnad); familjerätten (samarbetssamtal)", "tillsynsmyndighet": "Justitieombudsmannen (granskar enskilda fall av myndighetsutövning)<br>Inspektionen för vård och omsorg (tillsyn över socialtjänsten och familjerätten)", "lagstod": "**Föräldrabalken (1949:381)** 6 kap. 11 § anger att vårdnadshavaren har rätt och skyldighet att bestämma i frågor som rör barnets personliga angelägenheter. 6 kap. 13 § anger att vid gemensam vårdnad ska vårdnadshavarna utöva sina rättigheter och skyldigheter mot barnet tillsammans. Om en av vårdnadshavarna är förhindrad får den andra fatta beslut ensam, om beslutet inte utan olägenhet kan skjutas upp.<br>**Förvaltningslagen (2017:900)** 6 § anger att myndigheter ska se till att kontakterna med enskilda blir smidiga och enkla, och lämna den enskilde sådan hjälp att hen kan ta till vara sina intressen. 7 § anger att myndigheter ska vara tillgängliga för kontakter.<br>**Förenta nationernas konvention om barnets rättigheter** art. 3 anger att vid alla åtgärder som rör barn ska barnets bästa komma i främsta rummet.", "lucka_status": "Nej", "empirisk_kalla": "Riksrevisionen (RiR 2023:6) Digitala tjänster till privatpersoner – stora utvecklingsmöjligheter för statliga myndigheter::Exempel på tjänster som rör barn och kräver dubbel signering,\nvilket inte är möjligt att göra digitalt i vissa fall. Det handlar exempelvis om att\nansöka om för- och efternamn på nyfött barn, ansöka om id-kort för barn och anmäla\nflerbarnstillägg (föräldrarnas gemensamma anmälan om mottagare) (s. 23).", "beskrivning": "Digitala samhällsfunktioner förutsätter en vårdnadshavare med e-legitimation. Ensamkommande barn, barn omhändertagna enligt LVU och barn i familjer utan giltig e-legitimation saknar strukturerade alternativ. Tjänster som kräver dubbel signering av vårdnadshavarna går i många fall inte att genomföra digitalt (RiR 2023:6).", "lankar": ["https://www.riksrevisionen.se/download/18.1e0fa62b19047f61fcc9553/1719239329567/RiR_2023_6_master.pdf"], "tillsynsskydd_finns": "Tjänster som kräver dubbel signering förutsätter samarbetande vårdnadshavare. Inget rättssäkert alternativ finns när kommunikationen brister och inget alternativ finns när en eller båda vårdnadshavarna saknar e-legitimation."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.5 Barn och unga", "taxonomi_id": "2.5.2", "kategori": "Digitala spår skapade av andra", "situation_exempel": "Min mamma la upp bilder på mig på sin Instagram – nu vill jag ta bort bilderna men det är hennes konto.", "radgivning_enskild": "Bris (stöd för barn och unga)<br>Barnombudsmannen (rättighetsinformation)<br>Integritetsskyddsmyndigheten (klagomål om personuppgiftsbehandling)", "radgivning_utforare": "Integritetsskyddsmyndigheten (vägledning om barns dataskydd)<br>Mediemyndigheten (skydd för minderåriga online)<br>Barnombudsmannen (vägledning om barnkonventionen)", "tvist": "IMY (klagomål)", "tillsynsmyndighet": "Integritetsskyddsmyndigheten (tillsyn över behandling av personuppgifter)<br>Justitieombudsmannen (granskar enskilda fall av myndighetsutövning)", "lagstod": "**Dataskyddsförordningen (GDPR)** art. 17 anger att den registrerade har rätt att utan onödigt dröjsmål få sina personuppgifter raderade.<br>**Dataskyddsförordningen (GDPR)** art. 8 anger att behandling av personuppgifter på grundval av barns samtycke är tillåten när barnet är minst 16 år, med möjlighet för medlemsstater att sänka åldern till lägst 13 år.<br>**Dataskyddslagen (2018:218) 2 kap. 4 § anger den svenska åldersgränsen 13 år för informationssamhällets tjänster.<br>**Föräldrabalken (1949:381)** 6 kap. 11 § anger att vårdnadshavaren har rätt och skyldighet att bestämma i frågor som rör barnets personliga angelägenheter, men ska i takt med barnets stigande ålder och utveckling ta allt större hänsyn till barnets synpunkter och önskemål.<br>**Förenta nationernas konvention om barnets rättigheter** art. 16 anger att inget barn får utsättas för godtyckliga eller olagliga ingripanden i sitt privatliv. Barnet har rätt till lagens skydd mot sådana ingripanden.", "lucka_status": "Delvis", "empirisk_kalla": "Schildt Gillion, A. (2021) Juridiken bakom sharenting. Barns rättigheter när vårdnadshavare publicerar bilder eller annan information om sitt barn på internet::I Frankrike har man förstärkt barns rätt till radering genom att ge även mindre barn en rätt att kräva radering. Om ett barn önskar få sina uppgifter raderade på exempelvis en förälders instagramkonto bör även noteras att barnet, utöver att vända sig direkt till föräldern, kan vända sig direkt till plattformen med sådan begäran (s. 38). | IMY (2026) Dataskydd för dig som är ung – dina rättigheter::Du har rätt att säga nej till dina föräldrar och andra vuxna, om du inte vill att de ska dela en bild, film eller information som handlar om dig på sina sociala medier.", "beskrivning": "Barns digitala identitet skapas av föräldrar, skola och vård utan barnets medverkan. Rätten att begära radering finns i GDPR men förutsätter kännedom om var uppgifterna finns. Det är ett villkor som sällan är uppfyllt i praktiken.", "lankar": ["https://mediemyndigheten.se/globalassets/barn-och-pedagogik/pedagogiskt-material/sharenting/juridiken-bakom-sharenting.pdf", "https://www.imy.se/privatperson/dataskydd/dataskydd-for-dig-som-ar-ung/for-dig-som-ar-ung/dina-rattigheter/"], "tillsynsskydd_finns": "Dataskyddsförordningen ger rätt till radering men barnet kan inte agera utan förälderns medverkan eller plattformens hantering. Integritetsskyddsmyndigheten kan pröva klagomål men har inte agerat i typfall av sharenting."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.5 Barn och unga", "taxonomi_id": "2.5.3", "kategori": "Bristande samtyckesskydd", "situation_exempel": "Jag orkade inte läsa alla villkor när jag fyllde 13 och skaffade sociala medier – jag har ingen aning vad som händer med min data.", "radgivning_enskild": "Bris (stöd för barn och unga)<br>Barnombudsmannen (rättighetsinformation)<br>Integritetsskyddsmyndigheten (klagomål om personuppgiftsbehandling)", "radgivning_utforare": "Integritetsskyddsmyndigheten (vägledning om barns dataskydd)<br>Mediemyndigheten (skydd för minderåriga online)<br>Europeiska dataskyddsstyrelsen (riktlinjer om barns samtycke)", "tvist": "IMY (klagomål)", "tillsynsmyndighet": "Integritetsskyddsmyndigheten (tillsyn över behandling av personuppgifter)<br>Post- och telestyrelsen (samordnare för digitala tjänster enligt DSA i Sverige)<br>Mediemyndigheten (granskar skydd för minderåriga i mediemiljöer)", "lagstod": "**Dataskyddsförordningen (GDPR)** art. 8 anger att behandling av personuppgifter på grundval av barns samtycke är tillåten när barnet är minst 16 år, med möjlighet för medlemsstater att sänka åldern till lägst 13 år. **Dataskyddslagen (2018:218)** 2 kap. 4 § anger den svenska åldersgränsen 13 år för informationssamhällets tjänster.<br>**Dataskyddsförordningen (GDPR)** art. 12 anger att information till den registrerade ska lämnas i en koncis, klar och tydlig, begriplig och lätt tillgänglig form, med användning av ett klart och tydligt språk, särskilt när information riktas till ett barn.<br>**Förordningen om digitala tjänster (DSA, 2022/2065)** art. 28 anger att leverantörer av onlineplattformar som är tillgängliga för minderåriga ska vidta lämpliga och proportionella åtgärder för att säkerställa en hög nivå av integritet, säkerhet och trygghet för minderåriga.<br>**Förenta nationernas konvention om barnets rättigheter** art. 16 anger att inget barn får utsättas för godtyckliga eller olagliga ingripanden i sitt privatliv.", "lucka_status": "Delvis", "empirisk_kalla": "Integritetsskyddsmyndigheten (IMY), Barnombudsmannen & Statens medieråd (2020) Barns och ungas rättigheter på digitala plattformar. En vägledning till aktörer::Barnet har rätt att få information anpassad till sin ålder och mognad (s. 20). | Schildt Gillion (2021) Juridiken bakom sharenting::Sverige valde 13-årsgränsen men det är oklart hur samtyckets kvalitet säkerställs i praktiken (s. 35–36). | CRC-kommittén (2023) CRC/C/SWE/CO/6-7 punkt 22::Sverige bör stärka skyddet för barns rättigheter i den digitala miljön.", "beskrivning": "Sverige tillämpar 13-årsgräns för barns samtycke och GDPR kräver åldersanpassad information. Reglering utan fungerande implementering ger inte reellt skydd.", "lankar": ["https://www.imy.se/globalassets/dokument/ovrigt/barn-och-ungas-rattigheter-pa-digitala-plattformar.pdf", "https://mediemyndigheten.se/globalassets/barn-och-pedagogik/pedagogiskt-material/sharenting/juridiken-bakom-sharenting.pdf", "https://www.regeringen.se/globalassets/regeringen/dokument/socialdepartementet/barnets-rattigheter/crc_c_swe_co_6-7_51663_e-8.pdf"], "tillsynsskydd_finns": "Integritetsskyddsmyndigheten har tillsyn men har konstaterat att informationen sällan är barnanpassad och att mekanismer för att utöva rättigheter ofta saknas eller är svåra att hitta."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.5 Barn och unga", "taxonomi_id": "2.5.4", "kategori": "Åldersgränser och digitala vakuum", "situation_exempel": "Jag är 16 och kan se min journal på 1177 men förstår inte mina provsvar – mina föräldrar har inte längre tillgång och ingen förklarar för mig.", "radgivning_enskild": "Vårdcentralen<br>Ungdomsmottagningen<br>1177 Vårdguiden", "radgivning_utforare": "Inera (förvaltning av 1177 och nationella e-hälsotjänster)<br>Sveriges Kommuner och Regioner (riktlinjer för regionerna)<br>Inspektionen för vård och omsorg (tillsynsvägledning hälso- och sjukvård)", "tvist": "Patientnämnden; IVO", "tillsynsmyndighet": "Inspektionen för vård och omsorg (tillsyn över hälso- och sjukvården)<br>Integritetsskyddsmyndigheten (tillsyn över journalåtkomst och personuppgiftsbehandling)<br>Justitieombudsmannen (granskar enskilda fall av myndighetsutövning)", "lagstod": "**Patientlagen (2014:821)** 3 kap. 1 § anger att patienten ska få information om sitt hälsotillstånd, de metoder som finns för undersökning, vård och behandling. 3 kap. 6 § anger att informationen ska anpassas till mottagarens ålder, mognad, erfarenhet, språkliga bakgrund och andra individuella förutsättningar.<br>**Patientdatalagen (2008:355)** anger reglerna för behandling av personuppgifter inom hälso- och sjukvården, inklusive patientens rätt att ta del av sin journal.<br>**Dataskyddsförordningen (GDPR)** art. 8 anger åldersgränsen för barns samtycke vid informationssamhällets tjänster, med svensk gräns 13 år enligt dataskyddslagen.<br>**Förenta nationernas konvention om barnets rättigheter** art. 3 anger att barnets bästa ska komma i främsta rummet vid alla åtgärder som rör barn. Art. 12 anger att barnet har rätt att uttrycka sin mening och få den respekterad i frågor som rör barnet.", "lucka_status": "Nej", "empirisk_kalla": "SKR & Inera (2025-10-10) Avsikten är att skydda tonåringars integritet::Nu ligger ett nytt förslag på remiss hos regionerna. Förslaget innebär att vårdnadshavare ska kunna se sina barns journaler tills de fyller 15 år. I förslaget ingår också att vårdnadshavare ska kunna hantera barnets olika ärenden, som tidbokning och förnyelse av läkemedel, tills barnet fyller 18 år, något som i dag bara är möjligt tills barnet fyller 13 år. I åldrarna 13 till 15 år är det i dag krångligt för både barn och vårdnadshavare att komma åt journalen. | Barncancerfonden m.fl. (2025) 16 organisationer i gemensam skrivelse (till Inera): Föräldrar måste få tillgång till sina svårt sjuka tonåringars journaler::I dag förlorar föräldrar åtkomst till sitt barns journal via 1177 vid 13 års ålder. För familjer med barn som har livshotande, svår eller långvarig sjukdom, neuropsykiatriska diagnoser eller funktionsnedsättning innebär detta att de måste navigera i komplex behandling utan tillgång till viktig information. Nu har SKR:s bolag Inera, som ansvarar för 1177 och de nationella e-hälsotjänsterna, presenterat sitt förslag till hur ramverket ska förnyas. För familjer med svårt sjuka barn eller barn med funktionsnedsättningar innebär det fortsatt att föräldrar måste söka dispens – ett år i taget – för att få tillgång till vad som ibland är rentutav livsviktig information.", "beskrivning": "Barn 13–18 år förväntas i allt fler digitala system agera självständigt utan rättshandlingsförmåga eller stöd. Inom hälso- och sjukvården skapar patientlagens regler ett gränsland där den unges journalåtkomst inte kombineras med vägledning. Systemet tar bort vuxenstödet utan att tillföra annat stöd.", "lankar": ["https://www.barncancerfonden.se/press/2025/16-organisationer-i-gemensam-skrivelse-foraldrar-maste-fa-tillgang-till-sina-svart-sjuka-tonaringars-journaler/", "https://skr.se/pressrum/aktuellt/nyhetsarkiv/avsiktenarattskyddatonaringarsintegritet.9203.html"], "tillsynsskydd_finns": "Patientlagen ger rätt till åldersanpassad information men digitala journalsystem saknar pedagogisk vägledning. Vårdnadshavare förlorar åtkomst vid 13 år utan att den unga får motsvarande stöd."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.5 Barn och unga", "taxonomi_id": "2.5.5", "kategori": "Manipulativ design riktad mot barn", "situation_exempel": "Min dotter följer influencers på TikTok – hon vill vara som de och tjatar om att köpa saker hela tiden.", "radgivning_enskild": "Konsumentverket (Hallå konsument)<br>Mediemyndigheten (information om medieanvändning och skydd för minderåriga)<br>Bris (stöd för barn och unga)", "radgivning_utforare": "Konsumentverket (vägledning om marknadsföring till barn)<br>Mediemyndigheten (vägledning om skydd för minderåriga i mediemiljöer)<br>Reklamombudsmannen (näringslivets självreglering, ICC:s regler)", "tvist": "Konsumentverket (anmälan); ARN (vid köp)", "tillsynsmyndighet": "Konsumentverket (tillsyn över marknadsföringslagen och konsumentskydd)<br>Mediemyndigheten (granskar skydd för minderåriga i mediemiljöer)<br>Post- och telestyrelsen (samordnare för digitala tjänster enligt DSA i Sverige)", "lagstod": "**Förordningen om digitala tjänster (DSA, 2022/2065)** art. 28 anger att leverantörer av onlineplattformar som är tillgängliga för minderåriga ska vidta lämpliga och proportionella åtgärder för att säkerställa en hög nivå av integritet, säkerhet och trygghet för minderåriga. Reklam baserad på profilering med användning av minderårigas personuppgifter är förbjuden.<br>**Marknadsföringslagen (2008:486)** och bilaga I till direktivet om otillbörliga affärsmetoder (2005/29/EG) p. 28 anger att det är otillbörlig marknadsföring att i en annons direkt uppmana barn att köpa eller övertala sina föräldrar eller andra vuxna att köpa produkter åt dem. **Marknadsföringslagen** 9 § anger att marknadsföring ska utformas och presenteras så att det tydligt framgår att det är fråga om marknadsföring.<br>**Direktivet om audiovisuella medietjänster (AVMSD, 2010/13/EU)** art. 9 anger att audiovisuella kommersiella meddelanden inte får orsaka fysisk, psykisk eller moralisk skada hos minderåriga eller direkt uppmana minderåriga att köpa eller hyra en produkt.<br>**Förenta nationernas konvention om barnets rättigheter** art. 17 anger att barnet ska ha tillgång till information från olika källor med syfte att främja barnets välfärd. Art. 36 anger att barnet ska skyddas mot alla former av utnyttjande som kan skada barnet i något avseende.", "lucka_status": "Delvis", "empirisk_kalla": "The European Consumer Organisation, BEUC (2025) Influencer Marketing Unboxed:: 88 % av användare 15–24 år uppger att de påverkats av influencerinnehåll (s. 9). Av 576 granskade influencers hade 97 % kommersiellt innehåll men bara 20 % märkte det systematiskt (s. 13). 13 klagomål om marknadsföring av ohälsosam mat riktad mot barn inlämnade till EU Pledge — samtliga avvisades eller bedömdes som regelrätta (s. 28). | Sveriges konsumenter (2026) Stärkt konsumentskydd för barn i digitala miljöer::Organisationen Sveriges Konsumenter ser behov av att stärka konsumentskyddet för barn i digitala miljöer (s. 8).", "beskrivning": "Barn och unga exponeras för kommersiella tekniker på digitala plattformar som är utformade för att kringgå deras förmåga att skilja reklam från genuint innehåll.", "lankar": ["https://www.beuc.eu/reports/influencer-marketing-unboxed-exposing-how-fast-fashion-and-food-sectors-hook-consumers", "https://www.sverigeskonsumenter.se/media/deyny2mb/sta-rkt-konsumentskydd-fo-r-barn-i-digitala-miljo-er.pdf"], "tillsynsskydd_finns": "DSA förbjuder riktad reklam mot minderåriga baserad på profilering, men plattformarnas ålderskontroll kringgås rutinmässigt. Självreglering har visat sig otillräcklig. Konsumentverket har tillsyn men influencermarknadsföring mot barn är ett nytt och outvecklat tillsynsområde."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.6 Migrationsstatus och rättsligt skydd", "taxonomi_id": "2.6.1", "kategori": "Identitetskrav", "situation_exempel": "Jag har ett samordningsnummer – jag kan inte skaffa BankID, inte öppna digital brevlåda och inte använda myndigheternas e-tjänster.", "radgivning_enskild": "Skatteverket (folkbokföring, personnummer och samordningsnummer)<br>Migrationsverket (uppehållsärenden)<br>Kommunal flyktingsamordnare<br>Asylrättscentrum (rättslig rådgivning)", "radgivning_utforare": "Myndigheten för digital förvaltning (vägledning om e-legitimation och Sweden Connect)<br>Skatteverket (vägledning om samordningsnummer)<br>Sveriges Kommuner och Regioner (riktlinjer för kommunal service)", "tvist": "Förvaltningsrätten (folkbokföringsbeslut)", "tillsynsmyndighet": "Myndigheten för digital förvaltning (tillsyn över anslutning till eIDAS-noden)<br>Post- och telestyrelsen (tillsynsmyndighet för betrodda tjänster enligt eIDAS-förordningen)<br>Justitieombudsmannen (granskar enskilda fall av myndighetsutövning)", "lagstod": "**Förvaltningslagen (2017:900)** 6 § anger att myndigheter ska se till att kontakterna med enskilda blir smidiga och enkla, och lämna den enskilde sådan hjälp att hen kan ta till vara sina intressen. 7 § anger att myndigheter ska vara tillgängliga för kontakter.<br>**Folkbokföringslagen (1991:481)** anger reglerna för folkbokföring och tilldelning av personnummer.<br>**Lagen (2022:1697) om samordningsnummer** anger reglerna för tilldelning av samordningsnummer till personer som inte är eller har varit folkbokförda.<br>**eIDAS-förordningen (910/2014)** art. 6 anger att medel för elektronisk identifiering som utfärdats i en annan medlemsstat ska erkännas i Sverige för gränsöverskridande autentisering för åtkomst till nättjänster som tillhandahålls av offentliga organ. Ett sådant erkännande gäller endast på tillitsnivå väsentlig eller hög.", "lucka_status": "Nej", "empirisk_kalla": "Digg:s informationswebb elegitimation.se om att använda utländska e-legitimationer i Sverige (hämtad 2026-04-07)::En e-legitimation från ett annat land än Sverige kan i vissa fall användas för att logga in i svenska myndigheters e-tjänster men det är inte säkert att det går att använda alla funktioner i e-tjänsten. Det beror på att många svenska e-tjänster kräver ett svenskt personnummer, och att den utländska e-legitimationen inte är kopplad till det svenska personnumret. | IOM (2023) Ukrainians and third-country nationals under temporary protection in Sweden::Avsaknaden av personnummer förhindrar fullständig tillgång till flera offentliga och privata tjänster ( s. 4). | Transportstyrelsens webbsida om digital brevlåda (hämtad 2026-04-07)::Personer som har samordningsnummer kan inte ha digital brevlåda då alla tjänsterna kräver legitimation och det finns idag ingen e-legitimation som fungerar med samordningsnummer.", "beskrivning": "Digitala samhällsfunktioner förutsätter ofta personnummer, e-legitimation och bankkonto – där det första är förutsättning för de övriga. Asylsökande och papperslösa kan sakna alla tre. Utländska e-legitimationer erkänns formellt via Sweden Connect men ger i praktiken inte tillgång till tjänsterna (RiR 2023:6).", "lankar": ["https://www.elegitimation.se/utlandska-e-legitimationer-och-e-tjanster", "https://dtm.iom.int/sites/g/files/tmzbdl1461/files/reports/DTM2023_Sweden_Ukrainians%20and%20TCNs%20under%20TP_Executive_Summary_SWE_ENG.pdf", "https://www.transportstyrelsen.se/sv/om-oss/det-har-ar-transportstyrelsen/vart-uppdrag-och-arbetssatt/digital-brevlada/"], "tillsynsskydd_finns": "Ingen myndighet ansvarar för att personer med samordningsnummer eller utländsk e-legitimation får faktisk tillgång till digitala samhällstjänster. eIDAS-erkännandet är formellt men de flesta svenska e-tjänster kräver svenskt personnummer som inte kopplas till utländsk e-legitimation."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.6 Migrationsstatus och rättsligt skydd", "taxonomi_id": "2.6.2", "kategori": "Rädsla för digital spårning", "situation_exempel": "Jag har fått avslag på min asylansökan men behöver vård – jag vågar inte söka den eftersom jag inte vet om vårdgivaren delar mina uppgifter med Migrationsverket.", "radgivning_enskild": "Röda Korset (vårdförmedling för papperslösa)<br>Läkare i Världen (vård för papperslösa)<br>Asylrättscentrum (rättslig rådgivning)<br>Diakonia eller stadsmissionen (lokala stödorganisationer)", "radgivning_utforare": "Socialstyrelsen (vägledning om vård för asylsökande och tillståndslösa)<br>Sveriges Kommuner och Regioner (riktlinjer för regionerna)<br>Inspektionen för vård och omsorg (tillsynsvägledning hälso- och sjukvård)", "tvist": "IVO (om vård nekas)", "tillsynsmyndighet": "Inspektionen för vård och omsorg (tillsyn över hälso- och sjukvården)<br>Integritetsskyddsmyndigheten (tillsyn över personuppgiftsbehandling)<br>Justitieombudsmannen (granskar enskilda fall av myndighetsutövning)", "lagstod": "**Lag (2013:407) om hälso- och sjukvård till vissa utlänningar som vistas i Sverige utan nödvändiga tillstånd** 6 § anger att regionen ska erbjuda vuxna personer som omfattas av lagen vård som inte kan anstå, mödrahälsovård, vård vid abort och preventivmedelsrådgivning. 5 § anger att barn ska erbjudas vård i samma omfattning som bosatta barn.<br>**Hälso- och sjukvårdslagen (2017:30)** 8 kap. 4 § anger att regionen ska erbjuda omedelbar hälso- och sjukvård till den som vistas inom regionen utan att vara bosatt där.<br>**Offentlighets- och sekretesslagen (2009:400)** 25 kap. 1 § anger att sekretess gäller inom hälso- och sjukvården för uppgift om en enskilds hälsotillstånd eller andra personliga förhållanden.<br>**Utlänningslagen (2005:716)** 17 kap. 1 § anger uppgiftsskyldighet för socialtjänsten, hälso- och sjukvården, polismyndighet, Försäkringskassan, Pensionsmyndigheten och Skatteverket att på begäran lämna uppgifter till Migrationsverket eller polisen. Den nya informationsplikten enligt utlänningslagen (föreslås träda i kraft 2026 enligt SOU 2024:80) ålägger sex myndigheter — Skatteverket, Försäkringskassan, Pensionsmyndigheten, Kronofogdemyndigheten, Arbetsförmedlingen och Kriminalvården — att på eget initiativ anmäla personer som misstänks vistas i landet utan tillstånd. Sjukvård, skola, socialtjänst och bibliotek är undantagna.<br>**Förenta nationernas konvention om ekonomiska, sociala och kulturella rättigheter (ICESCR)** art. 12 anger att alla har rätt att åtnjuta bästa möjliga fysiska och psykiska hälsa.", "lucka_status": "Nej", "empirisk_kalla": "Dagens nyheter (2026-04-06) Allt färre papperslösa söker vård: ”De är rädda”::Antalet papperslösa som söker offentlig vård har halverats i flera storstadsregioner. Oron för informationsplikten, okunskap om rättigheter och avsaknad av BankID/legitimation är återkommande orsaker. En gravid papperslös kvinna frågade om hemförlossning för att undvika sjukhus eftersom Skatteverket, som omfattas av informationsplikten, informeras vid födsel.", "beskrivning": "Digitala system som kräver personuppgifter för tillgång till vård, stöd eller rättighetsinformation tvingar den enskilde att välja mellan att utöva en rättighet och att skydda sin säkerhet. Rädslan är folkrättsligt grundad.", "lankar": ["https://www.dn.se/sverige/allt-farre-papperslosa-soker-vard-de-ar-radda/"], "tillsynsskydd_finns": "Hälso- och sjukvårdssekretessen skyddar patientuppgifter och vården är undantagen från informationsplikten. Däremot omfattas Skatteverket av informationsplikten från 2026, vilket betyder att händelser som födsel och folkbokföringsärenden kan utlösa anmälan till Migrationsverket. Ingen myndighet ansvarar för att informera papperslösa om vilka kontaktytor som är säkra."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.6 Migrationsstatus och rättsligt skydd", "taxonomi_id": "2.6.3", "kategori": "Funktionsnedsättning och migrationsstatus", "situation_exempel": "Jag är asylsökande och har en hörselnedsättning – jag kan inte få hörapparat anpassad eftersom hjälpmedelscentralen kräver personnummer för att öppna ett ärende.", "radgivning_enskild": "Migrationsverket (asylhälsa och hänvisning)<br>Regionen (asylhälsovård)<br>Funktionsrätt Sverige eller motsvarande funktionsrättsorganisation<br>Asylrättscentrum (rättslig rådgivning)", "radgivning_utforare": "Socialstyrelsen (vägledning om vård och hjälpmedel för asylsökande)<br>Sveriges Kommuner och Regioner (riktlinjer för hjälpmedelsförskrivning)<br>Myndigheten för delaktighet (vägledning om tillgänglighet och funktionsrätt)", "tvist": "IVO; DO (diskriminering på grund av funktionsnedsättning och etnisk tillhörighet)", "tillsynsmyndighet": "Inspektionen för vård och omsorg (tillsyn över hälso- och sjukvården)<br>Diskrimineringsombudsmannen (tillsyn över diskrimineringslagen)<br>Justitieombudsmannen (granskar enskilda fall av myndighetsutövning)", "lagstod": "**Lag (2008:344) om hälso- och sjukvård åt asylsökande m.fl.** 6 § anger att regionen ska erbjuda vuxna asylsökande vård som inte kan anstå. Enligt förarbetena (prop. 2007/08:105) kan vård som inte kan anstå innefatta skyldighet att erbjuda lån av hjälpmedel för personer med funktionsnedsättning när behovet inte tillgodoses på annat sätt. 5 § anger att barn ska erbjudas vård i samma omfattning som bosatta barn.<br>**Diskrimineringslagen (2008:567)** 1 kap. 4 § anger att bristande tillgänglighet för personer med funktionsnedsättning är en form av diskriminering.<br>**Förenta nationernas konvention om rättigheter för personer med funktionsnedsättning (CRPD)** art. 5 anger likhet inför lagen och förbud mot diskriminering på grund av funktionsnedsättning. Art. 19 anger rätten till självständigt liv och delaktighet i samhället, vilket inkluderar tillgång till stödtjänster och hjälpmedel.", "lucka_status": "Nej", "empirisk_kalla": "Funktionsrätt Sverige (2025) Respekt för funktionsrätt. Uppföljning av rekommendationer från FN:s funktionsrättskommitté om genomförande av konventionen om rättigheter för personer med funktionsnedsättning::Funktionsrätt Sverige bedömer att rättigheterna för migranter med funktionsnedsättning har backat på flera områden. Den nuvarande migrationspolitiken saknar ett MR-perspektiv och tar inte hänsyn till intersektionalitet, exempelvis till situationen för personer med funktionsnedsättning som befinner sig i migrations- eller asylprocesser (s. 18). | IOM (2023) Ukrainians and third-country nationals under temporary protection in Sweden::Föräldrar och anhöriga till personer med funktionsnedsättning rapporterar svårigheter att få adekvat medicinsk och ekonomisk hjälp för familjemedlemmar med vårdbehov (s. 23).", "beskrivning": "När migrationsstatus samverkar med funktionsnedsättning uppstår ett utanförskap som ingen myndighet har ett tydligt ansvar för. Tillgänglighetsanpassning förutsätter ofta en registrerad status som saknas.", "lankar": ["https://funktionsratt.se/wp-content/uploads/frs/2025/12/respekt-for-funktionsratt-den-3-december-edit.pdf", "https://dtm.iom.int/sites/g/files/tmzbdl1461/files/reports/DTM2023_Sweden_Ukrainians%20and%20TCNs%20under%20TP%20in%20Sweden_June_0.pdf"], "tillsynsskydd_finns": "FN:s funktionsrättskonvention (CRDP) gäller oavsett migrationsstatus och svensk lag ger asylsökande rätt till hjälpmedel som lån när behovet är akut. Hjälpmedelssystemen är dock byggda kring personnummer och ingen myndighet äger ansvaret för att asylsökande med funktionsnedsättning faktiskt får tillgång till anpassade hjälpmedel."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.6 Migrationsstatus och rättsligt skydd", "taxonomi_id": "2.6.4", "kategori": "Barn och unga med migrationsstatus", "situation_exempel": "Jag är 16 och kom ensam till Sverige – jag har ingen digital identitet, min gode man har problem med mitt ärende och jag kan inte följa min asylprocess digitalt.", "radgivning_enskild": "Asylrättscentrum (rättslig rådgivning)<br>Rädda Barnen (stöd för barn på flykt)<br>Kommunens socialtjänst (placering och stöd)", "radgivning_utforare": "Migrationsverket (vägledning om asylprocessen för barn)<br>Sveriges Kommuner och Regioner (riktlinjer för god man och placering)<br>Socialstyrelsen (vägledning om ensamkommande barn)", "tvist": "Förvaltningsrätten (asylbeslut);", "tillsynsmyndighet": "Inspektionen för vård och omsorg (tillsyn över boenden för ensamkommande barn)<br>Överförmyndarnämnden (tillsyn över godmanskapet)<br>Justitieombudsmannen (granskar enskilda fall av myndighetsutövning)", "lagstod": "**Förenta nationernas konvention om barnets rättigheter (CRC)** art. 3 anger att barnets bästa ska komma i främsta rummet vid alla åtgärder som rör barn. Art. 22 anger att barn som söker asyl eller har flyktingstatus har rätt till skydd och humanitärt bistånd. Art. 37 anger att frihetsberövade barn har rätt att hålla kontakt med sin familj och få tillgång till juridiskt biträde.<br>**Utlänningslagen (2005:716)** 1 kap. 10 § anger att barnets bästa särskilt ska beaktas i fall som rör barn.<br>**Lag (2005:429) om god man för ensamkommande barn** anger att överförmyndaren ska förordna god man som i vårdnadshavares och förmyndares ställe ansvarar för barnets personliga förhållanden och sköter dess angelägenheter.<br>**Lag (1994:137) om mottagande av asylsökande m.fl. (LMA)** anger Migrationsverkets ansvar för asylsökandes mottagande, inklusive ensamkommande barns boende och dagersättning.", "lucka_status": "Nej", "empirisk_kalla": "CRC-kommittén (2023) CRC/C/SWE/CO/6-7::Slutkommentarerna till Sverige träffar direkt 2.6.4 från tre håll. Punkt 43 (s. 13, brådskande område) kräver att ensamkommande barn skyndsamt tilldelas kvalificerad god man med stöd anpassat efter deras behov, snabbare asylprocesser och prompt tillgång till stöd samt fortsatt utredning av försvinnanden under asylprocessen. Punkt 20 (s. 5) kräver att barn ska höras i beslut om migration och asyl och att undantaget om \"olämplighet\" i utlänningslagen avskaffas. Punkt 18 (s. 5) kräver att barnets bästa som primär princip konsekvent tillämpas i asylprocesser.", "beskrivning": "Ensamkommande barn saknar digital identitet, behörigt ombud och möjlighet att följa sin process digitalt. Barnets bästa som primär princip återspeglas inte i hur digitala asylprocesser är utformade.", "lankar": ["https://www.regeringen.se/globalassets/regeringen/dokument/socialdepartementet/barnets-rattigheter/crc_c_swe_co_6-7_51663_e-8.pdf"], "tillsynsskydd_finns": "Barnkonventionen kräver att barnets bästa beaktas men Migrationsverkets digitala processer förutsätter vuxen digital kompetens och ombud med digital behörighet. Ensamkommande barn kan inte själva följa sin asylprocess digitalt och är beroende av teknisk förmåga hos god man."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.6 Migrationsstatus och rättsligt skydd", "taxonomi_id": "2.6.5", "kategori": "Tidsbegränsad status", "situation_exempel": "Mitt uppehållstillstånd löpte ut förra veckan – jag har ansökt om förlängning men i väntan har jag förlorat tillgång till 1177, Mina sidor hos Försäkringskassans och min digitala brevlåda.", "radgivning_enskild": "Migrationsverket (förlängningsärenden)<br>Skatteverket (folkbokföring)<br>Respektive myndighet som hanterar den specifika tjänsten<br>Asylrättscentrum (rättslig rådgivning)", "radgivning_utforare": "Migrationsverket (vägledning om förlängningsprocess); Skatteverket (vägledning folkbokföring); Digg (vägledning e-legitimation)", "tvist": "Förvaltningsrätten (folkbokföringsbeslut; uppehållstillståndsbeslut)", "tillsynsmyndighet": "Justitieombudsmannen (granskar enskilda fall av myndighetsutövning)<br>Myndigheten för digital förvaltning (tillsyn över anslutning till digital infrastruktur)<br>Förvaltningsrätten (prövar överklagade beslut om folkbokföring)", "lagstod": "**Utlänningslagen (2005:716)** anger reglerna för uppehållstillstånd, inklusive att den som ansöker om förlängning innan tillståndet löper ut får fortsätta vistas i landet i avvaktan på beslut.<br>**Förvaltningslagen (2017:900)** 6 § anger att myndigheter ska se till att kontakterna med enskilda blir smidiga och enkla, och lämna den enskilde sådan hjälp att hen kan ta till vara sina intressen. 7 § anger att myndigheter ska vara tillgängliga för kontakter.<br>**Folkbokföringslagen (1991:481)** 21 § anger att den som inte anses bosatt enligt 7–13 §§ och inte ska avregistreras som utflyttad enligt 20 § ska avregistreras från folkbokföringen som försvunnen. Avregistrering medför att personen förlorar tillgång till samhällstjänster som förutsätter folkbokföring.", "lucka_status": "Nej", "empirisk_kalla": "Informationsverige.se (2025) Ansöka om förlängt uppehållstillstånd::Den som ansöker om förlängning efter att uppehållstillståndet löpt ut riskerar att förlora arbetsrätt och förmåner som introduktionsersättning, studiemedel och föräldrapenning. Ansökan kräver inloggning med BankID. | Skatteverket (webbsida, hämtad 2026-04-08)::En person som Skatteverket bedömer har en okänd bosättning men som vistas i Sverige, kan bli avregistrerad från folkbokföringen som försvunnen. Avregistrering från folkbokföringen innebär att personen förlorar tillgång till förmåner, sjukvård och utbetalningar från Försäkringskassan och Pensionsmyndigheten.", "beskrivning": "Digitala system saknar i regel hantering av statusövergångar. Den som väntar på förlängt tillstånd kan förlora åtkomst till tjänster trots laglig rätt att vara i landet.", "lankar": ["https://www.informationsverige.se/en/jag-har-fatt-uppehallstillstand/ansoka-om-forlangt-uppehallstillstand.html", "https://skatteverket.se/offentligaaktorer/folkbokforing/avregistreradsomforsvunnenpersonensbosattningarokand.4.fa979e918895f4387d102.html"], "tillsynsskydd_finns": "Den som ansöker om förlängning innan tillståndet löper ut har laglig rätt att vistas i landet, men digitala system bygger på status som är ja/nej i ett ögonblick. Ingen myndighet samordnar vad som händer med folkbokföring, e-legitimation och tjänsteåtkomst under handläggningstiden."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.7 Plattformsstyrt arbete", "taxonomi_id": "2.7.1", "kategori": "Algoritmisk arbetsledning", "situation_exempel": "Jag kör mat åt en plattform – appen bestämmer vilka leveranser jag får, hur lång tid jag har och vad jag tjänar. Igår sänktes min ersättning utan förklaring.", "radgivning_enskild": "Fackförbund (Transportarbetareförbundet, Hotell- och restaurangfacket eller motsvarande)<br>Arbetsmiljöverket<br>Integritetsskyddsmyndigheten (klagomål om personuppgiftsbehandling)", "radgivning_utforare": "Arbetsmiljöverket (vägledning om arbetsmiljöansvar)<br>Skatteverket (vägledning om arbetsgivaransvar och F-skatt)<br>Integritetsskyddsmyndigheten (vägledning om automatiserat beslutsfattande)", "tvist": "Arbetsdomstolen (frågan om anställningsförhållande); allmän domstol", "tillsynsmyndighet": "Arbetsmiljöverket (tillsyn över arbetsmiljölagen och föreslagen tillsynsroll enligt SOU 2026:3)<br>Integritetsskyddsmyndigheten (tillsyn över personuppgiftsbehandling och automatiserat beslutsfattande)<br>Skatteverket (kontroll av arbetsgivaravgifter och anställningsförhållanden)", "lagstod": "**Plattformsdirektivet (EU 2024/2831)** art. 5 anger att avtalsförhållandet mellan en digital arbetsplattform och en person som utför plattformsarbete rättsligt ska presumeras vara ett anställningsförhållande när det finns sakförhållanden som tyder på ledning och kontroll. Kapitel III anger regler om algoritmisk verksamhetsledning, inklusive krav på transparens, mänsklig kontroll och rätt till förklaring vid automatiserade beslut. Direktivet ska vara genomfört i svensk rätt senast 2 december 2026.<br>**Lagen (1982:80) om anställningsskydd (LAS)** anger reglerna för anställningsavtal, uppsägning och avsked för den som är arbetstagare i lagens mening.<br>**Arbetsmiljölagen (1977:1160)** anger arbetsgivarens ansvar för arbetsmiljön. Lagens bestämmelser träffar som utgångspunkt förhållandet mellan arbetsgivare och arbetstagare.<br>**Dataskyddsförordningen (GDPR)** art. 22 anger att den registrerade har rätt att inte bli föremål för ett beslut som enbart grundas på automatiserad behandling och som har rättsliga följder eller på liknande sätt i betydande grad påverkar personen. Art. 15 ger rätt till information om förekomsten av automatiserat beslutsfattande och meningsfull information om logiken bakom.", "lucka_status": "Nej", "empirisk_kalla": "Fairwork/Oxford (2025) Fair Work for Platform Workers: Lessons from the EU Directive and Beyond (i Industrial Law Journal)::Intervjuer med över 7 400 plattformsarbetare visar att de upprepade gånger utsätts för ogenomskinliga algoritmiska beslut om arbetsvillkor och disciplinära åtgärder. | Electronic Frontier Foundation (2025) What Europe’s New Gig Work Law Means for Unions and Technology::79 % av europeiska företag använder algoritmisk övervakning (bossware). Övervakningen resulterar bland annat i algoritmisk lönediskriminering beroende på uppvisad ekonomisk utsatthet. | Human Rights Watch (2025) The Gig Trap. Algorithmic, Wage and Labor Exploitation in Platform Work in the US.::Rapporten dokumenterar\nhur ledande digitala plattformar i USA (Uber, Lyft, DoorDash, Instacart, Shipt, Favor, Amazon Flex) ensidigt sätter ersättning och nekar förhandlingsutrymme. Sex av sju studerade plattformar använder ogenomskinliga och föränderliga algoritmer som håller arbetstagare okunniga om hur deras lön beräknas. Algoritmiska system styr också hur frekventa och lönsamma uppdrag som erbjuds, baserat på efterlevnad av prestationsmått som kundbetyg och acceptansgrad.\" | Ponce Del Castillo, A. & Naranjo, D. (2022) Regulating algorithmic management: An assessment of the EC's draft Directive on improving working conditions in platform work. ETUI Policy Brief 2022::The GDPR also provides individuals with the right not to be subject to a decision based solely on automated processing, including profiling ... In theory, this should benefit workers. In practice, exercising these rights is very difficult (as shown in the Worker Info Exchange and App Drivers & Couriers union (ADCU) v Uber case in the United Kingdom).", "beskrivning": "Digitala plattformar styr arbetsvillkor genom algoritmer som fördelar uppdrag, sätter tidsramar och utvärderar prestation utan motsvarande arbetsgivaransvar. Den som utför arbetet saknar insyn i hur beslut fattas och möjlighet att förhandla.", "lankar": ["https://academic.oup.com/ilj/article/54/3/425/8176731", "https://www.eff.org/deeplinks/2025/10/what-europes-new-gig-work-law-means-unions-and-technology", "https://www.hrw.org/report/2025/05/12/the-gig-trap/algorithmi
