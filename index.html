<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samhällskontraktet i en digital tid – taxonomi-utforskare v1.6</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@300;400;500;600&display=swap');
:root {
  --bg:#faf9f7;--surface:#fff;--surface2:#f9f8f6;--surface3:#f0eeea;
  --border:#ddd9d3;--border-light:#e8e5e0;--text:#1a1a1a;--text-dim:#5c5750;--text-muted:#736e65;
  --accent:#2c5f8a;--accent-light:#e8f0f7;--accent-hover:#1e4a6e;
  --ja:#1f7340;--ja-bg:#eef7f1;--delvis:#2e6b9c;--delvis-bg:#eaf1f7;--nej:#c0392b;--nej-bg:#fdf0ef;
  --law-bg:#f7f5f0;--eu-bg:#f0f5f7;--tag-bg:#f0ede8;
  --sec1:#8a5a2d;--sec2:#5a7a1e;--sec3:#4e6d82;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;font-size:14px}
.app{max-width:1400px;margin:0 auto;padding:28px 24px}
header{margin-bottom:28px;padding-bottom:16px;border-bottom:2px solid var(--border)}
header h1{font-family:'Source Serif 4',Georgia,serif;font-size:24px;font-weight:600;letter-spacing:-0.01em}
header p{color:var(--text-dim);font-size:13px;margin-top:3px}
.stats{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--border-light);border-radius:6px;padding:10px 16px;min-width:110px}
.stat-val{font-family:'Source Serif 4',serif;font-size:22px;line-height:1}
.stat-label{font-size:11px;color:var(--text-muted);margin-top:2px}
.stat.ja .stat-val{color:var(--ja)}.stat.delvis .stat-val{color:var(--delvis)}.stat.nej .stat-val{color:var(--nej)}.stat.total .stat-val{color:var(--accent)}
.controls{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.search-box{flex:1;min-width:240px;position:relative}
.search-box input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:9px 12px 9px 34px;font-family:inherit;font-size:13px;color:var(--text);outline:none}
.search-box input:focus{border-color:var(--accent)}
.search-box input::placeholder{color:var(--text-muted)}
.search-box::before{content:'\2315';position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:14px}
.fbtn{background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:7px 13px;color:var(--text-dim);font-family:inherit;font-size:12px;cursor:pointer;transition:all .12s;white-space:nowrap}
.fbtn:hover{border-color:var(--accent);color:var(--text)}.fbtn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.fg{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.fg-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em;margin-right:3px}
.main{display:grid;grid-template-columns:320px 1fr;gap:16px;min-height:70vh}
@media(max-width:900px){.main{grid-template-columns:1fr}}
.catlist{background:#fff;border:1px solid var(--border);border-radius:8px;overflow-y:auto;max-height:78vh;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.catlist::-webkit-scrollbar{width:4px}.catlist::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.sec-divider{padding:12px 14px 9px;font-size:12px;font-weight:600;color:var(--accent);background:var(--surface);border-bottom:2px solid var(--border-light);cursor:pointer;letter-spacing:.01em;transition:all .12s;border-left:3px solid transparent}
.sec-divider.sec-1{border-left-color:var(--sec1);color:var(--sec1)}
.sec-divider.sec-2{border-left-color:var(--sec2);color:var(--sec2)}
.sec-divider.sec-3{border-left-color:var(--sec3);color:var(--sec3)}
.sec-divider.sec-1:hover{background:rgba(138,90,45,.1)}
.sec-divider.sec-2:hover{background:rgba(90,122,30,.1)}
.sec-divider.sec-3:hover{background:rgba(78,109,130,.1)}
.sec-divider.selected{background:var(--surface2)}
.grp-hdr{padding:8px 14px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);background:#fff;border-bottom:1px solid var(--border-light);position:sticky;top:0;z-index:2;cursor:pointer;transition:all .12s;display:flex;justify-content:space-between;align-items:center;border-left:3px solid transparent}
.grp-hdr.sec-1{border-left-color:rgba(138,90,45,.3);background:#fef5ef}
.grp-hdr.sec-2{border-left-color:rgba(90,122,30,.3);background:#fcfcf0}
.grp-hdr.sec-3{border-left-color:rgba(78,109,130,.3);background:#f5f8fa}
.grp-hdr::after{content:'\25B8';font-size:12px;opacity:.3;transition:all .15s;font-weight:400}
.grp-hdr.sec-1:hover{color:var(--sec1);background:#fceee2;border-left-color:var(--sec1)}
.grp-hdr.sec-2:hover{color:var(--sec2);background:#f6f8e0;border-left-color:var(--sec2)}
.grp-hdr.sec-3:hover{color:var(--sec3);background:#ebf1f5;border-left-color:var(--sec3)}
.grp-hdr:hover::after{opacity:.7}
.grp-hdr.selected{background:var(--accent-light)}
.grp-hdr.selected.sec-1{color:var(--sec1);background:#fceee2;border-left-color:var(--sec1)}
.grp-hdr.selected.sec-2{color:var(--sec2);background:#f6f8e0;border-left-color:var(--sec2)}
.grp-hdr.selected.sec-3{color:var(--sec3);background:#ebf1f5;border-left-color:var(--sec3)}
.grp-hdr.selected::after{opacity:.7}
.grp-hdr.expanded::after{content:'\25BE';opacity:.5}
.cat-item{padding:10px 14px;border-bottom:1px solid var(--border-light);cursor:pointer;transition:all .1s;display:flex;align-items:flex-start;gap:9px;border-left:3px solid transparent}
.cat-item.sec-1{border-left-color:rgba(138,90,45,.2)}
.cat-item.sec-2{border-left-color:rgba(90,122,30,.2)}
.cat-item.sec-3{border-left-color:rgba(78,109,130,.2)}
.cat-item.sec-1:hover{border-left-color:var(--sec1);background:#fceee2}
.cat-item.sec-2:hover{border-left-color:var(--sec2);background:#f6f8e0}
.cat-item.sec-3:hover{border-left-color:var(--sec3);background:#ebf1f5}
.cat-item.selected{background:var(--accent-light);border-left:3px solid var(--accent)}
.cat-item.selected.sec-1{background:#fceee2;border-left-color:var(--sec1)}
.cat-item.selected.sec-2{background:#f6f8e0;border-left-color:var(--sec2)}
.cat-item.selected.sec-3{background:#ebf1f5;border-left-color:var(--sec3)}
.cat-item .ci-id{font-size:11px;font-weight:600;color:var(--text-muted);min-width:32px;padding-top:1px}
.cat-item .ci-name{font-size:12.5px;color:var(--text);flex:1}
.ci-dot{width:7px;height:7px;border-radius:50%;margin-top:4px;flex-shrink:0}
.ci-dot.ja{background:var(--ja)}.ci-dot.delvis{background:var(--delvis)}.ci-dot.nej{background:var(--nej)}
.detail{background:var(--surface);border:1px solid var(--border-light);border-radius:8px;padding:24px;overflow-y:auto;max-height:78vh}
.detail::-webkit-scrollbar{width:4px}.detail::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.d-empty{display:flex;align-items:center;justify-content:center;height:300px;color:var(--text-muted);font-size:13px;text-align:center}
.d-hdr{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border-light)}
.d-hdr .d-id.sec-1{color:var(--sec1)}
.d-hdr .d-id.sec-2{color:var(--sec2)}
.d-hdr .d-id.sec-3{color:var(--sec3)}
.d-id{font-size:11px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.d-title{font-family:'Source Serif 4',serif;font-size:22px;font-weight:600;line-height:1.25;margin-bottom:14px}
.d-desc{font-family:'Source Serif 4',serif;font-size:16px;color:var(--text);line-height:1.65}
.d-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.mtag{font-size:10px;padding:3px 10px;border-radius:16px;border:1px solid var(--border);color:var(--text-dim)}
.mtag.ja{border-color:var(--ja);color:var(--ja);background:var(--ja-bg)}
.mtag.delvis{border-color:var(--delvis);color:var(--delvis);background:var(--delvis-bg)}
.mtag.nej{border-color:var(--nej);color:var(--nej);background:var(--nej-bg)}
.sit-quote{background:var(--surface2);border-left:3px solid var(--accent);padding:12px 16px;border-radius:0 6px 6px 0;font-style:italic;font-size:13px;line-height:1.55;margin-bottom:16px;color:var(--text)}
.sit-quote.sec-1{border-left-color:var(--sec1);background:#fef5ef}
.sit-quote.sec-2{border-left-color:var(--sec2);background:#fcfcf0}
.sit-quote.sec-3{border-left-color:var(--sec3);background:#f5f8fa}
.iblock{margin-bottom:16px}
.iblock-t{font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;display:flex;align-items:center;gap:5px}
.iblock-c{font-size:13px;line-height:1.65;color:var(--text)}
.law-box{background:var(--law-bg);border-radius:7px;padding:14px 18px;margin-bottom:14px}
.eu-box{background:var(--eu-bg);border-radius:7px;padding:14px 18px;margin-bottom:14px}
.lucka-box{border-radius:7px;padding:14px 18px;margin-bottom:14px}
.lucka-box.ja{background:var(--ja-bg);border:1px solid rgba(192,57,43,.15)}
.lucka-box.delvis{background:var(--delvis-bg);border:1px solid rgba(212,136,15,.15)}
.lucka-box.nej{background:var(--nej-bg);border:1px solid rgba(39,131,74,.15)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:1100px){.dgrid{grid-template-columns:1fr}}
.dcard{background:#fff;border:1px solid var(--border-light);border-radius:6px;padding:12px}
.dcard .iblock-c{font-size:12px;color:var(--text-dim)}
.emp-scroll{font-size:12px;color:var(--text-dim);line-height:1.65;max-height:160px;overflow-y:auto;padding-right:6px}
.emp-scroll::-webkit-scrollbar{width:3px}.emp-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.ptag{display:inline-block;background:var(--tag-bg);border:1px solid var(--border);border-radius:16px;padding:3px 12px;font-size:11px;color:var(--text-dim);margin-right:4px;margin-bottom:4px}

/* Underkategoridetalj — ny layout med ramar */
.uk-block{border:1px solid var(--border-light);border-radius:8px;padding:16px 20px;margin-bottom:14px;background:#fff}
.uk-block.sec-1{background:#fef5ef;border-color:rgba(138,90,45,.18)}
.uk-block.sec-2{background:#fcfcf0;border-color:rgba(90,122,30,.18)}
.uk-block.sec-3{background:#f5f8fa;border-color:rgba(78,109,130,.18)}
.uk-block.eu-block{background:#eaf3fb;border-color:rgba(0,51,153,.15)}
.uk-block.plain-block{background:transparent}
.uk-block-sm{border:1px solid var(--border-light);border-radius:6px;padding:12px 16px;margin-bottom:10px;background:#fff}
.uk-block-sm.sec-1{background:#fef5ef;border-color:rgba(138,90,45,.18)}
.uk-block-sm.sec-2{background:#fcfcf0;border-color:rgba(90,122,30,.18)}
.uk-block-sm.sec-3{background:#f5f8fa;border-color:rgba(78,109,130,.18)}
.uk-block-t{font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.uk-block-c{font-size:13px;line-height:1.65;color:var(--text)}
.uk-block-sm .uk-block-c{font-size:12.5px;line-height:1.55;color:var(--text-dim)}
.uk-quote{font-family:'Source Serif 4',Georgia,serif;font-size:14.5px;font-style:italic;line-height:1.5;color:var(--text);margin:0}
.uk-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.uk-grid-2 .uk-block-sm{margin-bottom:0}
@media(max-width:900px){.uk-grid-2{grid-template-columns:1fr}}
.uk-line{border:none;border-top:1px solid var(--border-light);margin:18px 0}
.uk-empiri{margin-bottom:14px}
.uk-empiri-row{padding:10px 0;border-top:1px solid var(--border-light)}
.uk-empiri-row:first-of-type{border-top:none;padding-top:6px}
.uk-empiri-title{font-size:13px;font-weight:600;color:var(--text);line-height:1.5;margin-bottom:4px}
.uk-empiri-body{font-size:12.5px;color:var(--text-dim);line-height:1.6}
.uk-links{margin-top:18px;padding-top:14px;border-top:1px solid var(--border-light)}
.uk-link-row{padding:4px 0;font-size:12px;line-height:1.5}
.uk-link-row a{color:var(--accent);text-decoration:none;word-break:break-all}
.uk-link-row a:hover{text-decoration:underline}
.collapse-btn{font-size:11px;color:var(--accent);cursor:pointer;border:none;background:none;font-family:inherit;padding:4px 0;margin-top:4px}
.collapse-btn:hover{color:var(--accent-hover)}
.collapsed{display:none}
.uk-list-compact{margin-top:16px}
.uk-list-compact .cat-item{padding:8px 12px}
.uk-list-compact .ci-id{font-size:10px;min-width:28px}
.uk-list-compact .ci-name{font-size:11.5px}
footer{margin-top:32px;padding-top:12px;border-top:1px solid var(--border);font-size:11px;color:var(--text-muted)}
.overview-page{padding:0}
.ov-cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.ov-col{background:var(--surface);border:1px solid var(--border-light);border-radius:8px;overflow:hidden}
.ov-sec-hdr{padding:10px 12px 4px;font-family:'Source Serif 4',serif;font-size:14px;font-weight:600;color:var(--accent);border-bottom:2px solid var(--accent);cursor:pointer}
.ov-sec-hdr:hover{background:var(--accent-light)}
.ov-kat{border-bottom:1px solid var(--border-light)}
.ov-kat:last-child{border-bottom:none}
.ov-kat-hdr{padding:8px 12px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);background:var(--surface2);cursor:pointer}
.ov-kat-hdr:hover{color:var(--accent)}
.ov-item{display:flex;align-items:center;gap:6px;padding:4px 12px;font-size:11.5px;cursor:pointer;transition:background .1s}
.ov-item:hover{background:var(--accent-light)}
.ov-highlight.nej-hl{background:var(--nej-bg)}
.ov-highlight.delvis-hl{background:var(--delvis-bg)}
.ov-highlight.ja-hl{background:var(--ja-bg)}
.ov-id{font-size:10px;color:var(--text-muted);min-width:26px;font-variant-numeric:tabular-nums}
.ov-name{flex:1;color:var(--text)}
@media(max-width:900px){.ov-cols{grid-template-columns:1fr}}

</style>
</head>

<script>
var DATA = [{"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.1 Fragmenterad grundinfrastruktur", "taxonomi_id": "1.1.1", "kategori": "Avsaknad av gemensamma standarder", "situation_exempel": "Varför ska jag mata in samma uppgifter om mig själv överallt?", "radgivning_enskild": "Respektive ansvarig aktör<br>Statens servicecenter (allmän service)", "radgivning_utforare": "Digg (vägledning om digital infrastruktur)", "tvist": "Saknas", "tillsynsmyndighet": "Justitieombudsmannen (granskar enskilda fall)<br>Digg (samordnar inom statlig digital förvaltning)", "lagstod": "**Förvaltningslagen (2017:900)** 6 § anger att myndigheter ska se till att kontakterna med enskilda blir smidiga och enkla, och lämna den enskilde sådan hjälp att hen kan ta till vara sina intressen. 7 § anger att myndigheter ska vara tillgängliga för kontakter och 8 § anger att myndigheter ska samverka inom sina verksamhetsområden.<br>**SDG-förordningen (EU 2018/1724)** etablerar principen \"en uppgift en gång\" inom EU:s inre marknad: den enskilde ska inte behöva lämna samma uppgift till olika myndigheter när uppgiften redan finns hos någon av dem. I svensk rätt finns ännu ingen motsvarande generell skyldighet.", "lucka_status": "Nej", "empirisk_kalla": "Lagrådsremiss (2026) Nya krav på interoperabilitet vid datadelning inom den offentliga förvaltningen::För att uppnå de politiska målen på området digital\nförvaltning behöver datadelningen inom den offentliga förvaltningen\neffektiviseras. | Riksrevisionen (RiR 2023:6) Digitala tjänster till privatpersoner – stora utvecklingsmöjligheter för statliga myndigheter::Informationsöverföring sker ofta på ett manuellt och omständligt sätt (sid. 47).  | Digg/PTS (2026) Redovisning av uppdraget att stödja genomförandet av Sveriges Digitaliseringsstrategi::Mognaden i praktisk datadelning och interoperabilitet är ojämn. Datadelning sker ofta manuellt eller filbaserat och incitamenten för att utveckla mer avancerade maskin-till-maskin-lösningar är fortsatt svaga (sid. 60). | Digg (2025) Förslag till långsiktig utveckling och förvaltning av Ena::Lagstiftningen ger inte stöd för obligatorisk användning av Enas digitala tjänster – skyldigheten stannar vid interoperabilitetslösningar vid datadelning  (sid. 44). | Digg (2026) Uppdrag att analyser och beskriva möjligheter och utmaningar kopplade till att etablera en digital ingång till det offentliga::OECD pekar på att Sverige saknar en formell koordineringsmekanism på hög nivå och att Statsrådsberedningen har en mer begränsad roll i styrningen av tvärsektoriella prioriteringar än i många andra länder. Detta innebär en begränsad förmåga att etablera gemensamma standarder samt att utveckla användardrivna och proaktiva tjänster, inklusive möjligheten att tillämpa principen om ”en uppgift en gång” (sid. 18).", "beskrivning": "Sammanhållen kravställning på systeminfrastruktur saknas, både för fysisk utbyggnad och teknisk interoperabilitet. Resultatet är fragmenterade digitala miljöer som skapar utestängning och merarbete för invånare och organisationer.", "lankar": ["https://www.regeringen.se/rattsliga-dokument/lagradsremiss/2026/03/nya-krav-pa-interoperabilitet-vid-datadelning-inom-den-offentliga-forvaltningen/", "https://www.riksrevisionen.se/granskningar/granskningsrapporter/2023/digitala-tjanster-till-privatpersoner---stora-utvecklingsmojligheter-for-statliga-myndigheter.html", "https://www.digg.se/download/18.4d9d13fe19c34cfab85e4b/1772203531877/Rapport-Uppf%C3%B6ljning-av-digitaliseringsstrategin-feb-2026.pdf", "https://www.digg.se/download/18.5dc93d131948db30f8dc89/1738837000456/Rapport_F%C3%B6rslag%20till%20l%C3%A5ngsiktig%20utveckling%20och%20f%C3%B6rvaltning%20av%20Ena.pdf", "https://www.digg.se/download/18.12d3b9fb19d0d4280da64f/1774989242010/Uppdrag%20att%20beskriva%20utmaningar%20och%20mo%CC%88jligheter.pdf"], "tillsynsskydd_finns": "Ingen aktör har tillsyn över interoperabilitet"}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.1 Fragmenterad grundinfrastruktur", "taxonomi_id": "1.1.2", "kategori": "Lönsamhetsdriven exkludering", "situation_exempel": "Ingen operatör erbjuder fast bredband där jag bor", "radgivning_enskild": "Kommunen (bredbandssamordnare)", "radgivning_utforare": "Regional bredbandskoordinator<br>Post- och telestyrelsen (bredbandsstöd, samverkan)<br>Länsstyrelsen (handlägger bredbandsstöd, gör marknadssamråd)", "tvist": "PTS (vid brister i leveransplikt)", "tillsynsmyndighet": "Post- och telestyrelsen", "lagstod": "**Lagen om elektronisk kommunikation (2022:482)** 6 kap. 1 § anger att Post- och telestyrelsen får besluta om en skyldighet för den som bedöms lämplig att tillhandahålla samhällsomfattande tjänster, om det behövs för att tillgång till överkomligt pris ska kunna säkerställas. Med samhällsomfattande tjänst avses en adekvat internetanslutningstjänst eller talkommunikationstjänst i en stadigvarande bostad. 6 kap. 2 § anger att en internetanslutningstjänst, för att vara adekvat, ska ha kapacitet att leverera en lägsta datahastighet som medger funktionell tillgång till internet.<br>**Lagen om åtgärder för utbyggnad av bredbandsnät (2016:534)** reglerar tvistlösning mellan operatörer vid utbyggnad.<br>**Europeiska kodexen för elektronisk kommunikation (EU 2018/1972)** är det direktiv som lagen om elektronisk kommunikation genomför.<br>**Regeringsformen (RF)** 1 kap. 2 § anger att det allmänna ska verka för att alla människor ska kunna uppnå delaktighet och jämlikhet i samhället.", "lucka_status": "Nej", "empirisk_kalla": "Digg/PTS (2026) Redovisning av uppdraget att stödja genomförandet av Sveriges Digitaliseringsstrategi::Många områden utan gigabitnät har betydande risk för svag lönsamhet även med stöd. Stödbeloppet per byggnad fördubblat 2020–2025. Budgeten räcker inte till alla kvarvarande hushåll. Regeringen bedömer att Sverige sannolikt inte når EU:s bredbandsmål 2030 (s. 47). | Sveriges digitaliseringsstrategi 2025–2030::Det finns skillnader i utbyggnaden mellan städer och landsbygder. Exempelvis hade 99,7 procent av hushållen i storstadskommunerna 2024 tillgång till fast bredband om minst 1 Gbit/s, eller fiber i absoluta närheten, samtidigt som motsvarande nivå i mycket glesa landsbygdskommuner var knappt 89 procent. Där det saknas kommersiella förutsättningar för utbyggnad ska det offentliga därför stötta utbyggnaden om det bedöms vara samhällsekonomiskt effektivt (s. 38).", "beskrivning": "Marknaden levererar inte till geografiska områden eller kundsegment som saknar lönsamhet. Digitala lösningar bygger ofta på urbana antaganden om närhet och resurser som inte gäller överallt. Även tillgång till fysiska kontaktvägar och stöd varierar kraftigt.", "lankar": ["https://www.digg.se/download/18.4d9d13fe19c34cfab85e4b/1772203531877/Rapport-Uppf%C3%B6ljning-av-digitaliseringsstrategin-feb-2026.pdf", "https://www.regeringen.se/rapporter/2025/05/sveriges-digitaliseringsstrategi-20252030/"], "tillsynsskydd_finns": "Post- och telestyrelsen (PTS) beskriver sin roll som stödjande genom samverkan, dialog och kommunikation, inte som en myndighet som fattar bindande beslut om utbyggnad."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.1 Fragmenterad grundinfrastruktur", "taxonomi_id": "1.1.3", "kategori": "Bristande konsumentvillkor", "situation_exempel": "Jag vill säga upp en prenumeration men jag förstår inte hur jag ska göra", "radgivning_enskild": "Hallå konsument (Konsumentverkets vägledningstjänst)<br>Telekområdgivarna (oberoende rådgivning om telekomtjänster)<br>Kommunal konsumentvägledning", "radgivning_utforare": "Konsumentverket (vägledning om avtalsvillkor och dark patterns)", "tvist": "ARN (ej bindande)", "tillsynsmyndighet": "Konsumentverket (avtalsvillkor, marknadsföring)<br>Post- och telestyrelsen (elektronisk kommunikation)", "lagstod": "**Konsumentköplagen (2022:260)** 1 kap. 10 § anger att avtalsvillkor som är till nackdel för konsumenten är utan verkan mot denne.<br>**Avtalsvillkorslagen (1994:1512)** ger Patent- och marknadsdomstolen rätt att förbjuda oskäliga avtalsvillkor i konsumentförhållanden. I MD 2015:3 bedömdes krav på skriftlig uppsägning och uppsägningstid längre än 30 dagar för digitala tjänster vara oskäliga.<br>**Lagen om elektronisk kommunikation (2022:482)** 7 kap. innehåller specifika bestämmelser för avtal om elektroniska kommunikationstjänster, däribland högst 24 månaders bindningstid (8 §) och högst en månads uppsägningstid (13 §).<br>**Distansavtalslagen (2005:59)** anger informationskrav och ångerrätt vid avtal på distans.<br>**Marknadsföringslagen (2008:486)** anger att vilseledande och aggressiva affärsmetoder är förbjudna.", "lucka_status": "Nej", "empirisk_kalla": "Sveriges Konsumenter (2024) Är du säker på att du vill lämna oss? Vilseledande webbdesign i 20 medietjänsters uppsägningsflöden::Granskning av dark patterns som försvårar uppsägning av prenumerationer. | Forbrukerrådet (2026) Breaking free. Pathways to a fair technological future::Faktaruta om \"malicious compliance\" (s. 46). | Konsumentverket (2025:3) Brister i företagens kundtjänster::Vad gäller uppsägningar av telekomtjänster bottnar problemen i bedömningar utifrån lagstiftning som Post- och telestyrelsen (PTS) har tillsyn över. Problemet rör ett stort antal konsumenter och det är fortsatta problem trots Konsumentverkets tillsyn. Det vore därför till stor nytta för konsumentkollektivet om frågan utreddes vidare av PTS för att möjliggöra för konsumenter att enklare kunna säga upp abonnemang och säkerställa konkurrensen på marknaden (s. 10).", "beskrivning": "Komplexa avtalsvillkor, dolda avgifter och snåriga abonnemangsformer gör det svårt att förstå vad man betalar för och vad man går med på. Det kan leda till oväntade kostnader, svårigheter att säga upp tjänster eller förlust av rättigheter.", "lankar": ["https://www.sverigeskonsumenter.se/media/5aejrqo2/vilseledande-webbdesign-i-medietja-nster.pdf", "https://storage02.forbrukerradet.no/media/2026/02/breaking-free-pathways-to-a-fair-technological-future.pdf", "https://stpubshop.blob.core.windows.net/publikationer/redovisningsrapport-2025-3-brister-i-foretagens-kundtjanster-konsumentverket-2025_02b.pdf"], "tillsynsskydd_finns": "Konsumentverket agerar mot systematiska mönster men inte i enskilda fall. Den enskilde får ingen hjälp att avsluta sitt eget avtal."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.1 Fragmenterad grundinfrastruktur", "taxonomi_id": "1.1.4", "kategori": "Boendeformsbaserad ojämlikhet", "situation_exempel": "Hyresvärden bestämmer bredbandsleverantör och det är dyrt", "radgivning_enskild": "Hyresgästföreningen (rådgivning till hyresgäster, opinionsbildning)<br>Kommunal konsumentvägledning", "radgivning_utforare": "Post- och telestyrelsen (bredbandsmarknad)<br>Konsumentverket (avtalsvillkor mot konsument)", "tvist": "Hyresnämnden (hyrestvist); ARN (konsumenttvist, ej bindande)", "tillsynsmyndighet": "Konsumentverket (avtalsvillkor)", "lagstod": "**Jordabalken 12 kap. (hyreslagen)** reglerar avtalsförhållandet mellan hyresvärd och hyresgäst. Bredband är inte särskilt reglerat i hyreslagen och omfattas inte av samma skydd som el, vatten och värme.<br>**Lagen om elektronisk kommunikation (2022:482)** reglerar marknaden för bredbandstjänster men inte villkoren för fastighetsägares ensamrätt eller ersättningar mellan bredbandsleverantörer och fastighetsägare.", "lucka_status": "Nej", "empirisk_kalla": "Hyresgästföreningen (2025) Hyresgäster betalar miljarder i dolda bredbandsavgifter – nu krävs lagändring.::Priset på bredband har rusat i hyresrätter – en 70-procentig ökning sedan 2017, medan kostnaden i bostadsrätter varit i stort sett oförändrad. Förklaringen? Oreglerade kickbacks från bredbandsleverantörer till fastighetsägare som resulterar osynlig miljardnota för hyresgästerna.", "beskrivning": "Den enskilde saknar i flera boendeformer möjlighet att välja eller påverka sin digitala infrastruktur. I hyresrätt avgör till exempel fastighetsägaren. Kvalitet och kostnad varierar utan att den enskilde kan åtgärda det.", "lankar": ["https://www.hyresgastforeningen.se/aktuellt/extern-nyhet/hyresgaster-betalar-miljarder-i-dolda-bredbandsavgifter--nu-kravs-lagandring!tt-3985719/"], "tillsynsskydd_finns": "Ingen tillsyn över ersättningarna mellan bredbandsleverantörer och fastighetsägare. Hyresgästföreningen och Bahnhof föreslår utredning, lagkrav på transparens samt att bredband ska likställas med el och vatten i hyreslagen (2025)."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.1 Fragmenterad grundinfrastruktur", "taxonomi_id": "1.1.5", "kategori": "IoT – kompatibilitet och reservplan", "situation_exempel": "Det digitala låset fungerar inte pga strömavbrott så nu kommer jag inte in", "radgivning_enskild": "Kommunens biståndshandläggare (om välfärdsteknik i offentlig regi)<br>Återförsäljaren (vid privat köp)<br>Kommunal konsumentvägledning", "radgivning_utforare": "Socialstyrelsen (vägledning om välfärdsteknik)<br>Konsumentverket (produktsäkerhet, avtalsvillkor)", "tvist": "IVO (offentlig omsorg); ARN (privat köp, ej bindande)", "tillsynsmyndighet": "Inspektionen för vård och omsorg (välfärdsteknik i offentlig regi)<br>Konsumentverket (produkter på konsumentmarknaden)", "lagstod": "**Socialtjänstlagen (2025:400)** 8 kap. 6 § anger att digital teknik får användas när insatser ges i form av hemtjänst eller boende i särskild boendeform för äldre personer. Lagen reglerar inte krav på reservplan vid avbrott, kompatibilitet mellan enheter eller ansvarsfördelning vid funktionsfel.<br>**Konsumentköplagen (2022:260)** gäller köp av varor med digitala delar, uppkopplade enheter omfattas. 4 kap. anger att en vara har fel om den inte motsvarar vad som följer av avtalet eller vad köparen rimligen kunnat förutsätta.<br>**Förordning (EU) 2023/988 om allmän produktsäkerhet** anger att produkter som släpps ut på marknaden ska vara säkra. För uppkopplade enheter omfattas även risker som uppstår när produkten är ansluten till andra produkter.", "lucka_status": "Nej", "empirisk_kalla": "Hem & Hyra (2025) Elavbrott och åska kan slå ut hyresgästers lås: ”Vid en direktsmäll kan vad som helst hända”::Elektroniska lås till lägenheter blir allt vanligare. Men vissa värdar installerar lås som bara fungerar i tolv timmar om strömmen försvinner. Och ett blixtnedslag kan slå ut dem direkt. | Sveriges allmännytta och Hyresgästföreningen (2025) Sveriges Allmännyttas och Hyresgästföreningens rapport om digitala lås::Sveriges Allmännytta och Hyresgästföreningen är överens om ett antal grundkrav: de digitala låsen måste gå att använda även om strömmen eller internet försvinner, personuppgifter ska hanteras varsamt och hyresgästen ska alltid ha kontroll över vem som får tillträde. Och om hyran ska förändras måste det bero på tydliga förbättringar som gör vardagen bättre – inte bara på att låset är nytt eller digitalt.", "beskrivning": "Uppkopplade enheter i hemmet kräver installation, konfiguration och kompatibilitet med andra enheter. Det är sällan tydligt vad som fungerar tillsammans, vem som ansvarar vid problem eller vad som händer vid strömavbrott.", "lankar": ["https://www.hemhyra.se/nyheter/nu-kommer-de-digitala-lagenhetslasen-men-sakerheten-brister/", "https://www.sverigesallmannytta.se/sveriges-allmannytta-och-hyresgastforeningen-overens-om-riktlinjer-for-digitala-las/"], "tillsynsskydd_finns": "Ingen granskar att uppkopplade enheter i hemmet har reservplan vid avbrott, vare sig i offentlig omsorg eller i privata hem."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.1 Fragmenterad grundinfrastruktur", "taxonomi_id": "1.1.6", "kategori": "Planerat åldrande", "situation_exempel": "Min enhet slutade fungera efter 2 år och ingen reparation var möjlig", "radgivning_enskild": "Hallå konsument (Konsumentverkets vägledningstjänst)<br>Kommunal konsumentvägledning", "radgivning_utforare": "Konsumentverket (köprätt och konsumentskydd)<br>Naturvårdsverket (ekodesign och reparerbarhet)", "tvist": "ARN (ej bindande)", "tillsynsmyndighet": "Konsumentverket (köprätt)<br>Naturvårdsverket (ekodesign och reparerbarhet)", "lagstod": "**Konsumentköplagen (2022:260)** 4 kap. 2 § anger att en vara ska ha de egenskaper i fråga om hållbarhet, funktionalitet och kompatibilitet som är normalt förekommande för varor av samma slag och som konsumenten med fog kan förutsätta. 4 kap. 14 § anger att näringsidkaren svarar för fel som visar sig inom tre år från det att varan avlämnades. För varor med digitala delar ska näringsidkaren se till att konsumenten informeras om och tillhandahålls säkerhetsuppdateringar och andra nödvändiga uppdateringar (4 kap. 4 §).<br>**Förordning (EU) 2024/1781 om ekodesign för hållbara produkter (ESPR)** anger ramar för produktkrav, däribland krav på beständighet, reparerbarhet, uppgraderingsbarhet och tillgång till reservdelar. Specifika krav fastställs i delegerade akter per produktgrupp.<br>**Direktiv (EU) 2019/771 om vissa aspekter av avtal om försäljning av varor (varudirektivet)** är det direktiv som konsumentköplagen genomför.", "lucka_status": "Nej", "empirisk_kalla": "Forbrukerrådet (2026) Breaking free. Pathways to a fair technological future::Konsumenter tvingas byta fungerande enheter när mjukvaruuppdateringar upphör. | Naturvårdsverket (2025) EU-förordningen om ekodesign för hållbara produkter (ESPR)::Ekodesignkrav kan vara relaterade till produktens prestanda (prestandakrav) eller till information som ska följa med produkten (informationskrav). Dessa krav kan bland annat inkludera produktens beständighet, återanvändbarhet, uppgraderingsbarhet och reparerbarhet och förekomst av farliga ämnen och ämnen som påverkar återvinningen. | Ekodesignförordningen (EU) 2024/1781 utgör en ram för att fastställa krav på så kallad ekodesign av produkter", "beskrivning": "Digitala enheter designas med begränsad livslängd och saknar ofta möjlighet till reparation. Den enskilde tvingas ersätta fungerande teknik för att behålla tillgång till samhällsfunktioner.", "lankar": ["https://eur-lex.europa.eu/eli/reg/2024/1781/oj?locale=sv", "https://storage02.forbrukerradet.no/media/2026/02/breaking-free-pathways-to-a-fair-technological-future.pdf"], "tillsynsskydd_finns": "Reparerbarhetskrav finns i EU:s ekodesignförordning (2024/1781) men svensk tillsyn är ännu inte operativ."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.1 Fragmenterad grundinfrastruktur", "taxonomi_id": "1.1.7", "kategori": "Tekniknedläggning", "situation_exempel": "2G/3G stängdes av och nu kan jag inte ringa 112", "radgivning_enskild": "Post- och telestyrelsen (information om nedstängning)<br>Operatören", "radgivning_utforare": "Post- och telestyrelsen (vägledning om övergångsplaner)", "tvist": "PTS (vid brister i övergångsplan)", "tillsynsmyndighet": "Post- och telestyrelsen", "lagstod": "**Regeringsformen (RF)** 1 kap. 2 § anger att det allmänna särskilt ska trygga rätten till social omsorg och trygghet och verka för goda förutsättningar för hälsa.<br>**Lagen om elektronisk kommunikation (2022:482)** 7 kap. 35 § anger att den som tillhandahåller ett allmänt elektroniskt kommunikationsnät eller en allmänt tillgänglig nummerbaserad interpersonell kommunikationstjänst ska medverka till att nödkommunikation utan avbrott kan förmedlas avgiftsfritt för slutanvändaren.<br>**Lagen om skydd mot olyckor (2003:778)** reglerar kommunal och statlig räddningstjänst, men förutsätter att den enskilde kan nå räddningstjänsten. Lagen reglerar inte förutsättningarna för larmkommunikation.", "lucka_status": "Delvis", "empirisk_kalla": "Expressen (2026) Ellinors hus brann ner – kunde inte ringa 112::När elden hotade sluka familjens gård gick det inte att larma – det fanns ingen mobiltäckning. |Digg/PTS (2026) Redovisning av uppdraget att stödja genomförandet av Sveriges Digitaliseringsstrateg::67 000 telefoner blockerade vid 2G/3G-nedstängning dec 2025 (s. 48–49).", "beskrivning": "Avveckling av befintlig infrastruktur – 2G/3G-nät, kopparnät, kontanttjänster – skapar nya barriärer utan att fullgoda ersättningar finns på plats.", "lankar": ["https://www.digg.se/download/18.4d9d13fe19c34cfab85e4b/1772203531877/Rapport-Uppf%C3%B6ljning-av-digitaliseringsstrategin-feb-2026.pdf", "https://www.expressen.se/nyheter/politik/ellinors-hus-brann-ner-kunde-inte-ringa-112/"], "tillsynsskydd_finns": "Post- och telestyrelsen (PTS) har tillsyn men kan inte kräva att fullgoda ersättningar finns på plats innan infrastruktur avvecklas."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.2 Villkorad digital åtkomst", "taxonomi_id": "1.2.1", "kategori": "E-legitimationsexkludering", "situation_exempel": "BankID krävs för inloggning. Jag har inget BankID och kan inte få det heller.", "radgivning_enskild": "Konsumenternas Bank- och finansbyrå<br>Länsstyrelsen (bevakning av grundläggande betaltjänster)<br>Hallå konsument (Konsumentverkets vägledningstjänst)", "radgivning_utforare": "Digg (vägledning om e-legitimation och digital tillgänglighet)<br>Post- och telestyrelsen (vägledning om tillgänglighetslagen)", "tvist": "Saknas", "tillsynsmyndighet": "Justitieombudsmannen (granskar myndigheters hantering av e-tjänster)<br>Post- och telestyrelsen (tillsyn över LPTT vad gäller banktjänster, betaltjänster och e-handel)<br>Diskrimineringsombudsmannen (om bristen på alternativ utgör diskriminering)", "lagstod": "**DOS-lagen (2018:1937)** anger att digitala tjänster som tillhandahålls av offentliga aktörer ska vara tillgängliga.<br>**Förvaltningslagen (2017:900)** 7 § anger att en myndighet ska vara tillgänglig för kontakter med enskilda och informera allmänheten om hur och när sådana kan tas.<br>**Lagen om vissa produkters och tjänsters tillgänglighet (2023:254)** anger tillgänglighetskrav för bland annat banktjänster, betaltjänster och e-handelstjänster som riktar sig till konsumenter.", "lucka_status": "Nej", "empirisk_kalla": "Länsstyrelserna (2025) När betaltjänster är otillgängliga – Berättelser från verkligheten::Persona Saga (21 år, LSS-boende) som saknar BankID kan inte beställa möbler online och får betala 8 000 kr mer i butik. | Konsumenternas Bank- och finansbyrå (2026) Verksamhetsberättelse 2025::Antalet klagomål där konsumenten blivit nekad att öppna ett betalkonto var den näst vanligaste\nklagomålskategorin under året och antalet klagomål från konsumenter som har fått sitt betalkonto spärrat ökade också under 2025 (s 11-12). |  IOM/DTM (2023) Sweden – Ukrainians and Third-Country Nationals under Temporary Protection – Needs, Intentions and Challenges (April-May 2023)::Avsaknad av personnummer hindrar tillgång till SFI, körkort, jobbkontrakt, bostad, sjukvård, bankkonto. 32% av ukrainarna ej berättigade att öppna bankkonto (s. 6 och 8). | Svenskarna med funktionsnedsättning och internet 2025::När en person får förvaltare som övertar ekonomin upphör personens BankID omedelbart (s. 61).", "beskrivning": "Utan e-legitimation går stora delar av det digitala samhället inte att nå. Enligt Betalningsutredningens beräkningar saknar ungefär en tiondel av den vuxna befolkningen tillgång till BankID", "lankar": ["https://www.lansstyrelsen.se/download/18.1dda0708198e5f6fa8112688/1756382206490/N%C3%A4r%20betaltj%C3%A4nster%20%C3%A4r%20otillg%C3%A4ngliga%20Ber%C3%A4ttelser%20fr%C3%A5n%20verkligheten%202025.pdf", "https://www.konsumenternas.se/globalassets/pdf/vb/verksamhetsberattelse-2025.pdf", "https://dtm.iom.int/reports/sweden-ukrainians-and-third-country-nationals-under-temporary-protection-needs-intentions", "https://www.begripsam.se/forskning/internet/2025-rapporter-och-resultat"], "tillsynsskydd_finns": "Ingen myndighet ansvarar för att alternativ till BankID finns för den som inte kan få eller använda det. En statlig e-legitimation är beslutad och planeras träda i kraft 2026."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.2 Villkorad digital åtkomst", "taxonomi_id": "1.2.2", "kategori": "Autentisering som barriär", "situation_exempel": "Varje tjänst kräver lösenord, koder eller inloggning. Jag har svårt att komma ihåg dem och vågar inte skriva ner dem.", "radgivning_enskild": "Formaliserad och nationellt utpekad vägledning saknas men oftast träder en eller flera kommunala instanser in och stöttar. Olika från kommun till kommun.", "radgivning_utforare": "Digg (DOS-lagen, vägledning om webbtillgänglighet)<br>Finansinspektionen (LPTT – banktjänster för konsumenter)<br>Post- och telestyrelsen (LPTT – elektroniska kommunikationstjänster)<br>Konsumentverket (LPTT – e-handelstjänster)<br>Mediemyndigheten (LPTT – audiovisuella medietjänster)<br>Transportstyrelsen (LPTT – persontransporttjänster)", "tvist": "Saknas", "tillsynsmyndighet": "Justitieombudsmannen (om myndighet brister i tillgänglighet eller service)<br>Diskrimineringsombudsmannen (om bristande tillgänglighet utgör diskriminering enligt 1 kap. 4 §)", "lagstod": "**DOS-lagen (2018:1937)** anger att digitala tjänster som tillhandahålls av offentliga aktörer ska vara tillgängliga.<br>**Förvaltningslagen (2017:900)** 6 § anger att myndigheter ska se till att kontakterna med enskilda blir smidiga och enkla, och lämna den enskilde sådan hjälp att hen kan ta till vara sina intressen. 7 § anger att myndigheter ska vara tillgängliga för kontakter.<br>**Diskrimineringslagen (2008:567)** 1 kap. 4 § anger att bristande tillgänglighet för en person med funktionsnedsättning utgör diskriminering om skäliga åtgärder för tillgänglighet inte vidtagits.<br>**Lagen om vissa produkters och tjänsters tillgänglighet (2023:254)** anger tillgänglighetskrav avseende information, användargränssnitt och funktionell utformning för bland annat banktjänster, elektroniska kommunikationstjänster och e-handelstjänster som riktar sig till konsumenter.", "lucka_status": "Delvis", "empirisk_kalla": "Svenskarna med funktionsnedsättning och internet 2025::Andelen som rapporterar svårigheter med lösenord har ökat tydligt mellan 2023 och 2025, vilket sammanfaller med ökad tvåfaktorsautentisering. Ökad säkerhet har skett på bekostnad av minskad tillgänglighet. Lösenordsadministration kräver ofta e-post och förmåga att klicka på länkar eller memorera koder. Det är förmågor som inte alla har (s. 33–35).", "beskrivning": "Krav på lösenord, PIN-koder, sms-koder eller frekventa inloggningar skapar kognitiva och praktiska hinder.", "lankar": ["https://www.begripsam.se/forskning/internet/2025-rapporter-och-resultat"], "tillsynsskydd_finns": "Säkerhetslogiken har konkreta, mätbara krav. Tillgänglighetslogiken har generella formuleringar utan proportionalitetsregel. DOS-lagen ställer krav på tillgänglighet men inte på att antalet inloggningsmoment eller lösenordskrav ska vara proportionerliga mot den enskildes förmåga."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.2 Villkorad digital åtkomst", "taxonomi_id": "1.2.3", "kategori": "Personbunden teknik", "situation_exempel": "Min partner hanterade våra digitala abonnemang och det är väldigt svårt att få vardagstekniken att fungera för mig nu när han är död och jag är ensam.", "radgivning_enskild": "Efterlevandeguiden (statlig informationswebbplats med checklistor, hänvisar vidare till respektive tjänsteleverantör)<br>Kommunalt stöd (där sådant finns)", "radgivning_utforare": "Saknas. Ingen myndighet vägleder utförare i hur personbunden teknik ska kunna överlåtas eller frigöras", "tvist": "Saknas", "tillsynsmyndighet": "Saknas. Frågan är inte rättsligt reglerad och kan därför inte granskas.", "lagstod": "**Ärvdabalken (1958:637)** 18 kap. anger att dödsbodelägarna gemensamt förvaltar den dödes egendom under boets utredning. Hårdvara övergår till dödsboet men tjänsteleverantörens avtalsvillkor styr om kontot kopplat till enheten kan föras över eller avslutas. Ingen lagstiftning reglerar rätten att överta eller frigöra personbunden teknik inom ett hushåll.", "lucka_status": "Nej", "empirisk_kalla": "Raymond, T. (2025) Gotland i en digital tid::IT-handledaren på Korpens bibliotek berättar om ett hembesök hos en änka som blivit ensam med all teknik i huset efter makens bortgång (s. 44).", "beskrivning": "Digitala tjänster och enheter som kräver koppling till personliga konton försvårar delning, överlåtelse och tillfällig utlåning – både mellan privatpersoner och i det allmännas regi.", "lankar": ["https://dokument.gotland.se/IntegrationService.svc/doc/content/49202"], "tillsynsskydd_finns": "Lagstiftning saknas. Den efterlevande är hänvisad till varje tjänsteleverantörs egna efterlevandeprocesser."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.2 Villkorad digital åtkomst", "taxonomi_id": "1.2.4", "kategori": "Ombudskap", "situation_exempel": "Min fru är drabbad av demenssjukdom och jag har en framtidsfullmakt. Men banken godtar inte fullmakten digitalt och närmaste kontor ligger 5 mil bort.", "radgivning_enskild": "Banken (egen fullmaktsprocess)<br>Konsumenternas Bank- och finansbyrå (oberoende rådgivning om bank- och finanstjänster)<br>Överförmyndarnämnden (vägledning om god man och framtidsfullmakt)<br>Kommunalt stöd (där sådant finns)", "radgivning_utforare": "Finansinspektionen (bankernas fullmaktshantering)<br>Digg (vägledning om digital ombudshantering och e-legitimation)<br>Bolagsverket (Mina ombud)", "tvist": "Om bank vägrar: ARN bankavdelningen (ej bindande)", "tillsynsmyndighet": "Justitieombudsmannen (om myndighet brister i hantering av ombud enligt förvaltningslagen)", "lagstod": "**Förvaltningslagen (2017:900)** 14 § anger att den som är part i ett ärende får som ombud eller biträde anlita någon som är lämplig för uppdraget. 15 § anger att en myndighet får begära att ett ombud styrker sin behörighet genom en skriftlig eller muntlig fullmakt.<br>**Lagen om framtidsfullmakter (2017:310)** 1 § anger att en framtidsfullmakt är en fullmakt som någon ger åt en fysisk person att företräda fullmaktsgivaren för det fall hen på grund av sjukdom, psykisk störning, försvagat hälsotillstånd eller liknande förhållande varaktigt inte längre har förmåga att ha hand om sina angelägenheter. 2 § anger att en framtidsfullmakt får omfatta ekonomiska och personliga angelägenheter.<br>**Föräldrabalken (1949:381)** 11 kap. 4 § anger att rätten ska besluta att anordna godmanskap för den som på grund av sjukdom, psykisk störning, försvagat hälsotillstånd eller liknande förhållande behöver hjälp med att bevaka sin rätt, förvalta sin egendom eller sörja för sin person. 7 § anger att förvaltare får förordnas om godmanskap inte är tillräckligt.", "lucka_status": "Nej", "empirisk_kalla": "Konsumenternas Bank- och finansbyrå (2026) Verksamhetsberättelse 2025::Ett återkommande klagomål 2025 var att konsumenten upplevde att det inte var möjligt att hjälpa\nen anhörig med bankärenden digitalt (s. 24). | Begripsam (2025) Utestängd från det kontantlösa samhället::Avsnitt som beskriver problem med fullmakter (s 24-25). | Länsstyrelserna (2025) När betaltjänster är otillgängliga – Berättelser från verkligheten::Persona Saga (21 år, LSS-boende) har en god man som sköter ekonomin men ombudskapet täcker inte BankID-kravet vid köp och personalen på boendet kan inte agera ombud digitalt. | Prop. 2025/26:92 Ett ställfäreträdarskap att lita på::Regeringen föreslår att det införs ett nationellt ställföreträdarregister. Registret kommer att underlätta tillsynen av gode män och förvaltare och göra det lättare för ställföreträdare att visa sin behörighet i kontakter med bland annat myndigheter och banker. | Se även 2.4.2 (Anhörigansvar)", "beskrivning": "Ombud som agerar i annan persons ställe kan undergräva självbestämmande och skapa otydliga ansvarsförhållanden.", "lankar": ["https://www.konsumenternas.se/globalassets/pdf/vb/verksamhetsberattelse-2025.pdf", "https://www.begripsam.se/download/18.4fd9741419ac5edf2a463b49/1764751364652/Rapport%20Utesta%CC%88ngd%20fra%CC%8An%20det%20kontantlo%CC%88sa%20samha%CC%88llet%20december%202025.pdf", "https://www.lansstyrelsen.se/download/18.1dda0708198e5f6fa8112688/1756382206490/N%C3%A4r%20betaltj%C3%A4nster%20%C3%A4r%20otillg%C3%A4ngliga%20Ber%C3%A4ttelser%20fr%C3%A5n%20verkligheten%202025.pdf", "https://www.regeringen.se/rattsliga-dokument/proposition/2025/12/prop.-20252692"], "tillsynsskydd_finns": "Förvaltningslagen anger skriftlig eller muntlig fullmakt. Digitala myndighetstjänster stödjer ingendera. Mina ombud (Bolagsverket) finns men täcker bara anslutna myndigheter och kommuner – inte banker. I mellanperioden mellan akut behov och formellt ställföreträdarskap har anhöriga inget rättssäkert sätt att agera digitalt."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.2 Villkorad digital åtkomst", "taxonomi_id": "1.2.5", "kategori": "Plattformsberoende", "situation_exempel": "Riksdagen.se har tekniska problem och hänvisar till X men där vill jag inte vara registrerad användare.", "radgivning_enskild": "Respektive myndighet (FL 6 §)<br>Integritetsskyddsmyndigheten (klagomål om personuppgiftsbehandling)", "radgivning_utforare": "Integritetsskyddsmyndigheten (vägledning om gemensamt personuppgiftsansvar och rättslig grund vid sociala medier)", "tvist": "Saknas", "tillsynsmyndighet": "Justitieombudsmannen (om myndighet brister i tillgänglighet eller service)<br>Integritetsskyddsmyndigheten (om personuppgiftsbehandling saknar rättslig grund)", "lagstod": "**Förvaltningslagen (2017:900)** 6 § anger att myndigheter ska se till att kontakterna med enskilda blir smidiga och enkla. 7 § anger att myndigheter ska vara tillgängliga för kontakter och informera allmänheten om hur och när sådana kan tas.<br>**Dataskyddsförordningen (GDPR 2016/679)** art. 5 anger att personuppgifter ska behandlas på ett lagligt, korrekt och öppet sätt. Art. 6 anger att behandling endast är laglig om en rättslig grund föreligger. Art. 26 anger att när två eller flera personuppgiftsansvariga gemensamt fastställer ändamålen och medlen för behandlingen är de gemensamt personuppgiftsansvariga. EU-domstolen har i Wirtschaftsakademie-domen (C-210/16) slagit fast att den som driver en sida på sociala medier är gemensamt personuppgiftsansvarig med plattformen.<br>**Regeringsformen** 1 kap. 2 § anger att det allmänna ska verka för att alla människor ska kunna uppnå delaktighet och jämlikhet i samhället.", "lucka_status": "Delvis", "empirisk_kalla": "Axbom, P. (2026) Strategi för trygg offentlig kommunikation (axbom.se, februari 2026)::Riksdagen.se hänvisar vid driftstörning till X (före detta Twitter) som enda alternativ. Problematiskt eftersom plattformen X kräver konto, når 15 % av befolkningen och ägs av privat aktör i tredje land.", "beskrivning": "Samhällsfunktioner blir i praktiken beroende av privata plattformar. Den som inte accepterar villkoren riskerar att stängas ute från information och kontaktvägar som borde vara allmänt tillgängliga.", "lankar": ["https://axbom.se/tokstrategi/"], "tillsynsskydd_finns": "Ingen granskar myndigheters beroende av privata plattformar som kommunikationskanal"}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.3 Digitalt som enda val", "taxonomi_id": "1.3.1", "kategori": "Digitalt utan alternativ", "situation_exempel": "Parkeringsavgiften kan bara betalas via app – jag har ingen smarttelefon", "radgivning_enskild": "Kommunen (om kommunal parkering); Hallå konsument (om privat)", "radgivning_utforare": "Konsumentverket (vägledning om betalvägar); kommunen", "tvist": "ARN (om privat, ej bindande); förvaltningsrätten (om kommunalt beslut som kan överklagas)", "tillsynsmyndighet": "Konsumentverket (privat); kommunens revisorer (kommunal)", "lagstod": "FL 6–7 §§ (om kommunal); SFS 2022:260 (KköpL, om privat); RF 1 kap. 2 §", "lucka_status": "Nej", "empirisk_kalla": "Sveriges radio P4 (2025) Parkeringsappar för krångliga – Hugo tar bussen istället::Parkeringsappar skapar stress för äldre och teknikovana vid sjukhus och andra offentliga platser. | Corren (2024) Insändare: Alla kan inte betala med app – kommunens ansvar::Hur blev det plötsligt mitt ansvar att ta konsekvenserna av att automaten är trasig? Betalningsvilja finns ju från min sida, men kommunen klarar inte av att ta betalt. | Dagens nyheter (2025) Misstag i parkeringsapparna kan kosta tusenlappar::Parkeringsbolagen vägrar att betala tillbaka pengar till bilister som av misstag till exempel råkat välja fel zon, eller fel typ av biljett. | Lagrådet (2026-02-04) Yttrande över Åtgärder för att stärka kontanternas funktionssätt::Lagen om kontantkrav i livsmedelsbutiker och apotek saknar tillsyn, sanktion och individuell rättighet. Lagrådet konstaterar att lagen är \"onödig och dessutom verkningslös\" och avstyrker.", "beskrivning": "Samhällsfunktioner, vardagstjänster och betaltjänster erbjuds enbart digitalt utan fungerande alternativ. Myndigheter accepterar i vissa ärenden bara digitala anmälningar. Kommuner ersätter parkeringsautomater med appar. Kontanthantering avvecklas utan att säkerställa alternativ. Den som inte kan använda den digitala kanalen saknar väg in.", "lankar": ["https://www.sverigesradio.se/artikel/parkeringsappar-for-krangliga-hugo-tar-bussen-istallet", "https://www.corren.se/insandare/artikel/om-jag-inte-vill-betala-med-app-ar-jag-forbjuden-att-parkera/re64770l", "https://www.dn.se/ekonomi/misstag-i-parkeringsapparna-kan-kosta-tusenlappar/", "https://lagradet.se/yttranden/Atgarder-for-att-starka-kontanternas-funktionssatt.pdf"], "tillsynsskydd_finns": "Ingen kräver att alternativa betalvägar erbjuds"}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.3 Digitalt som enda val", "taxonomi_id": "1.3.2", "kategori": "Systemavbrott utan reservplan", "situation_exempel": "Jag ska lämna aktivitetsrapport till Arbetsförmedlingen men systemet ligger nere – missar jag deadline riskerar jag varning och indragen ersättning", "radgivning_enskild": "Arbetsförmedlingen (telefon); a-kassan", "radgivning_utforare": "IAF (vägledning om aktivitetsrapportering)", "tvist": "A-kassan (omprövning); förvaltningsrätten (överklaga sanktionsbeslut)", "tillsynsmyndighet": "IAF; JO", "lagstod": "FL 6–7 §§; SFS 2018:1937 (DOS-lagen); 43 § ALF (1997:238)", "lucka_status": "Nej", "empirisk_kalla": "Krisinformation.se (2025) It-störningar och digital säkerhet::Verksamheter i hela samhället är beroende av it-baserade informationssystem. Det gäller allt från kreditkortsbetalningar till trafikövervakning, patientjournaler och samhällsviktiga funktioner som el- och vattenförsörjning. | Läkartidningen (2024) Återkommande driftstopp hos 1177: »Det är oacceptabelt«::I dag låg möjligheten att logga in hos 1177 nere – igen. Det var ett i raden av flera driftstopp på senare tiden.", "beskrivning": "Digitala system som saknar alternativ vid driftstörningar lägger konsekvenserna av systemfel på den enskilde och är sårbara ur beredskapssynpunkt.", "lankar": ["https://www.krisinformation.se/forbered-dig/internetsakerhet/", "https://lakartidningen.se/nyheter/aterkommande-driftstopp-hos-1177-det-ar-oacceptabelt/"], "tillsynsskydd_finns": "Ingen kräver att reservrutiner skyddar den enskilde från rättsförlust vid driftstopp. Kommentar: Dokumentation av rättsförlust vid driftstopp saknas."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.4 Digital otrygghet och otydlighet", "taxonomi_id": "1.4.1", "kategori": "Samtycke utan insyn", "situation_exempel": "Jag måste godkänna villkor jag inte förstår för att använda tjänsten", "radgivning_enskild": "IMY (klagomål); kommunal konsumentvägledning", "radgivning_utforare": "IMY (vägledning om samtycke och rättslig grund)", "tvist": "IMY (klagomål); ARN (om konsumenttjänst, ej bindande)", "tillsynsmyndighet": "IMY", "lagstod": "GDPR 2016/679; SFS 2018:218 (dataskyddslagen)", "lucka_status": "Delvis", "empirisk_kalla": "IMY (vägledning, imy.se/samtycke)::För att ni ska kunna använda samtycke som rättslig grund måste maktförhållandet vara jämlikt. Tänk på att maktförhållandet ofta är ojämlikt i relationen mellan myndighet och medborgare, och mellan arbetsgivare och arbetstagare. Om det råder ett ojämlikt maktförhållande kan ni inte stödja er på samtycke. | Forbrukerrådet (2020) Out of Control::Tio populära appar delade data med minst 135 tredjeparter; samtycke till datadelning paketerades med samtycke till att använda appena – användaren hade inget reellt val ( s. 5–6, 68, 71).", "beskrivning": "Den enskilde förväntas ge samtycke till villkor som inte är begripliga och saknar möjlighet att följa vad som faktiskt sker med uppgifterna. Bristande insyn i hur personuppgifter hanteras skapar en strukturell maktasymmetri.", "lankar": ["https://www.imy.se/verksamhet/dataskydd/det-har-galler-enligt-gdpr/rattslig-grund/samtycke/", "https://www.forbrukerradet.no/out-of-control/"], "tillsynsskydd_finns": "IMY har tillsyn men konstaterar själv att samtycke ofta används felaktigt som rättslig grund av myndigheter och företag"}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.4 Digital otrygghet och otydlighet", "taxonomi_id": "1.4.2", "kategori": "Spårning och datainsamling utan insyn", "situation_exempel": "Jag laddade ner en gratis väderapp – den delade min platsdata med annonsnätverk utan att jag förstod det.", "radgivning_enskild": "IMY (klagomål); Sveriges Konsumenter", "radgivning_utforare": "IMY (vägledning om dataskydd och transparens)", "tvist": "IMY (klagomål)", "tillsynsmyndighet": "IMY", "lagstod": "GDPR 2016/679 art. 5–7 (samtycke, transparens)", "lucka_status": "Delvis", "empirisk_kalla": "Forbrukerrådet (2020) Out of Control::Tio appar delade platsdata med minst 135 tredjeparter; fem platsdatamäklare kartlade – alla tog emot GPS-position kombinerad med enhets-ID (s. 5–6, 82–101). | NRK (2020) Avslørt av mobilen::Vi betalte 35.000 norske kroner, og fikk en omfattende oversikt som viste hvor titusenvis av nordmenn hadde beveget seg i 2019. Posisjons­dataen var fra over 140.000 unike mobiler og nettbrett. | Sveriges Konsumenter (2020) Sveriges Konsumenter kräver: Granska den digitala annonsindustrin::Varje gång du använder en app i mobilen skickas känsliga personuppgifter vidare till hundratals företag. Det avslöjas i en ny rapport. Sveriges Konsumenter uppmanar nu Datainspektionen att granska den digitala annonsindustrin.", "beskrivning": "Appar, IoT-enheter och uppkopplade tjänster samlar in data, till exempel platsdata, användningsmönster och sensordata, utan att den enskilde vet vad som registreras, vart det skickas eller med vem det delas.", "lankar": ["https://www.forbrukerradet.no/out-of-control/", "https://www.nrk.no/norge/xl/avslort-av-mobilen-1.14911685", "https://www.sverigeskonsumenter.se/nyheter-och-press/nyheter-och-pressmeddelanden/anonymiserad-platsdata-inte-sarskilt-anonym/"], "tillsynsskydd_finns": "IMY har tillsyn men agerar reaktivt på klagomål. Ingen systematisk granskning av appar som samlar platsdata."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.4 Digital otrygghet och otydlighet", "taxonomi_id": "1.4.3", "kategori": "Otydlig datadelning i välfärdsteknik", "situation_exempel": "Kommunen lånade ut en robotdammsugare till mig – har den haft kamera och mikrofon på nu utan att jag vet var datan skickades?", "radgivning_enskild": "Kommunens omsorgschef; patientnämnden", "radgivning_utforare": "IVO (välfärdsteknik); IMY (dataskydd by design)", "tvist": "IVO (insatsens utformning); IMY (dataskydd)", "tillsynsmyndighet": "IVO (omsorgskvalitet); IMY (personuppgiftsbehandling)", "lagstod": "GDPR 2016/679 art. 13–14 (informationsskyldighet), art. 25 (inbyggt dataskydd); SoL 2025:400; patientdatalagen (2008:355)", "lucka_status": "Nej", "empirisk_kalla": "M3 (2026) Användare fick av misstag kontroll över 6700 robotdammsugare::En säkerhetsbrist i robotdammsugaren DJI Romo upptäcktes av en slump när en användare försökte styra sin egen enhet med en Playstation-kontroll. Användaren fick oväntat åtkomst till omkring 6700 robotdammsugare världen över. Sårbarheten gjorde det möjligt att se detaljerade planritningar, komma åt livevideo och mikrofoner samt fjärrstyra enheterna.", "beskrivning": "Den som har trygghetslarm, vårdappar eller självmonitorerande tjänster vet inte alltid vem som har tillgång till hälsodata eller hur den används.", "lankar": ["https://www.m3.se/article/3068681/anvandare-fick-av-misstag-kontroll-over-6700-robotdammsugare.html"], "tillsynsskydd_finns": "Ingen systematisk tillsyn över vilken data IoT-enheter i omsorgstjänster samlar in eller vart den skickas"}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.4 Digital otrygghet och otydlighet", "taxonomi_id": "1.4.4", "kategori": "Algoritmisk ogenomskinlighet", "situation_exempel": "Jag fick avslag på mitt försörjningsstöd men ingen kan förklara varför – beslutet fattades av en algoritm", "radgivning_enskild": "Kommunens socialtjänst (begära motivering); fackförbund", "radgivning_utforare": "IMY (vägledning om automatiserade beslut); DO (diskrimineringsperspektiv)", "tvist": "Förvaltningsrätten (överklaga beslut)", "tillsynsmyndighet": "IVO; IMY (GDPR art. 22); JO; DO", "lagstod": "FL 6 §, 32 § (motivering av beslut); GDPR art. 22 (rätt att inte bli föremål för automatiserat beslut); SoL 2025:400", "lucka_status": "Nej", "empirisk_kalla": "Institutet för mänskliga rättigheter (2026) Årsrapport 2026:: AI-tekniken innebär nya risker för att mänskliga rättigheter kränks. Bristande transparens, felaktiga underlag och begränsade möjligheter till ansvarsutkrävande kan leda till att enskilda drabbas av felaktiga eller godtyckliga beslut (s. 57). | Akademikerförbundet SSR (2021) JO visar att lagändring krävs kring robotar i välfärden::Akademikerförbundet SSR välkomnar att JO i stora delar uttrycker stöd för vår anmälan av hur Trelleborg infört algoritmer som ersätter socialsekreterares beslut om försörjningsstöd. | DO (2022) Transparens, träning och data::Myndigheters användning av AI och automatiserat beslutsfattande samt kunskap om risker för diskriminering. 14 av 34 myndigheter använder automatiserade beslut, bara 4 beaktar diskrimineringsgrunderna. | Riksrevisionen (RiR 2020:22) Automatiserat beslutsfattande i statsförvaltningen – effektivt, men kontroll och uppföljning brister::Under 2019 fattade 13 statliga myndigheter 121 miljoner automatiserade beslut gentemot privatpersoner och företag.", "beskrivning": "AI-system och algoritmer fattar beslut inom offentlig sektor utan att det är synligt för den enskilde att sådana system verkar eller hur de kan påverka.", "lankar": ["https://mrinstitutet.se/download/18.234277b219d0483f491b63a/1774331817101/Rapport-Arsrapport-2026.pdf", "https://akademssr.se/post/jo-visar-att-lagandring-kravs-kring-robotar-i-valfarden", "https://www.do.se/rattsfall-beslut-lagar-stodmaterial/publikationer/2022/transparens-traning-och-data", "https://www.riksrevisionen.se/granskningar/granskningsrapporter/2020/automatiserat-beslutsfattande-i-statsforvaltningen---effektivt-men-kontroll-och-uppfoljning-brister.html"], "tillsynsskydd_finns": "DO konstaterar att myndigheter i stort sett saknar diskrimineringsperspektiv i automatiserade beslutsprocesser."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.4 Digital otrygghet och otydlighet", "taxonomi_id": "1.4.5", "kategori": "Inbyggt skydd saknas", "situation_exempel": "Jag fick ett sms som såg ut att komma från min bank – klickade på länken och förlorade pengar från kontot", "radgivning_enskild": "Banken (spärra kort/konto); Polisen (anmälan); Konsumenternas Bank- och finansbyrå", "radgivning_utforare": "FI (bankens ansvar); PTS (operatörens filtrering)", "tvist": "ARN bankavdelningen (ej bindande); allmän domstol", "tillsynsmyndighet": "Finansinspektionen (bankens ansvar); PTS (operatörens ansvar att stoppa spoofade sms)", "lagstod": "SFS 2022:482 (LEK); betaltjänstlagen (2010:751); lagrådsremiss mars 2026 om operatörers skyldighet att stoppa bedrägerisms", "lucka_status": "Delvis", "empirisk_kalla": "Lagrådsremiss (2026) Nya regler mot bedrägerier och annat vilseledande genom elektroniska\nkommunikationer::Under 2023 polisanmäldes ca 29 000 telefonbedrägerier. Den sammanlagda brottsvinsten av dessa bedrägerier uppgick till 708 miljoner kronor. Bland privatpersoner slår bedrägerier genom elektroniska kommunikationstjänster hårt mot framför allt äldre personer\noch leder ofta till negativa psykosociala konsekvenser (s. 7). | BRÅ (2025) Nationella trygghetsundersökningen (NTU)::Bedrägeri på internet är den brottstyp som störst andel av befolkningen (ganska eller mycket) ofta oroar sig för 2025 (39 %).", "beskrivning": "Ansvaret för att skydda sig mot digitala bedrägerier läggs systematiskt på den enskilde. Digitala system saknar krav på inbyggt skydd mot bedrägerier och intrång.", "lankar": ["https://www.regeringen.se/contentassets/ed8fe7b73b404edcb3ef83a9977a89fa/nya-regler-mot-bedragerier-och-annat-vilseledande-genom-elektroniska-kommunikationer.pdf", "https://bra.se/statistik/statistik-fran-enkatundersokningar/nationella-trygghetsundersokningen/otrygghet-och-oro-for-brott"], "tillsynsskydd_finns": "Lagrådsremiss (mars 2026, ikraft aug 2026) lägger skyldighet på operatörer att filtrera. Men tillsyn över filtrering i praktiken saknar metod och resurser."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.4 Digital otrygghet och otydlighet", "taxonomi_id": "1.4.6", "kategori": "Statlig digital övervakning", "situation_exempel": "Staten utökar sin insyn i mitt digitala liv utan att jag vet om det eller kan ifrågasätta det", "radgivning_enskild": "Institutet för mänskliga rättigheter; IMY; Civil Rights Defenders", "radgivning_utforare": "IMY (dataskydd); SIN (tillsyn över hemliga tvångsmedel)", "tvist": "Förvaltningsdomstol; Europadomstolen (EKMR art. 8)", "tillsynsmyndighet": "IMY (dataskydd); JO (myndighetsutövning); Säkerhets- och integritetsskyddsnämnden (SIN)", "lagstod": "RF 2 kap. 6 § (skydd mot intrång i personlig integritet); GDPR 2016/679; EKMR art. 8 (rätt till privatliv); EU AI Act 2024/1689 art. 5 (förbjudna AI-tillämpningar, inkl. biometrisk identifiering i realtid i offentliga utrymmen)", "lucka_status": "Nej", "empirisk_kalla": "Institutet för mänskliga rättigheter (2025) Årsrapport 2025::Under 2024 har flera förslag kommit som syftar till att utöka eller underlätta användningen av kamerabevakning för framför allt offentliga aktörer, däribland brottsbekämpande myndigheter. Ett förslag handlar om att ge brottsbekämpande myndigheter möjlighet att använda biometrisk fjärridentifiering i realtid. Sådan användning är som huvudregel förbjuden eftersom den enligt EU:s AI-förordning innebär en så kallad oacceptabel risk. Men undantag kan göras om vissa villkor och krav är uppfyllda (s. 44).| Institutet för mänskliga rättigheter (2026) Årsrapport 2026::I vårt remissvar avstyrkte vi förslaget om polisens användning av AI för ansiktsigenkänning i realtid (Ds 2025:7) i sin helhet. Institutet för mänskliga rättigheter menar att det innebär ett allvarligt intrång i rätten till privat- och familjeliv och skyddet för den personliga integriteten. Det öppnar också för godtycklig tillämpning och ändamålsglidning, det vill säga när ett verktyg eller en åtgärd börjar användas för andra syften än som först var tanken (s. 41).", "beskrivning": "Utökade befogenheter för staten att övervaka, samla in och samköra den enskildes digitala data utan att proportionalitet, rättssäkerhet och skydd mot missbruk säkerställs.", "lankar": ["https://mrinstitutet.se/download/18.2906d1bb195b2914c0c39eb5/1744008050409/rapport_Arsrapport_manskliga-rattigheter-2025.pdf", "https://mrinstitutet.se/download/18.234277b219d0483f491b63a/1774331817101/Rapport-Arsrapport-2026.pdf"], "tillsynsskydd_finns": "Enskilda lagförslag prövas var för sig utan proportionalitetsbedömning av den kumulativa påverkan på integriteten."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.5 Diskriminerande systemdesign", "taxonomi_id": "1.5.1", "kategori": "Normbaserad design", "situation_exempel": "Försäkringskassan kontrollerade min vab-ansökan extra – jag vet inte varför jag valdes ut eller vad algoritmen baserade sig på", "radgivning_enskild": "Försäkringskassan (begära motivering); IMY (klagomål)", "radgivning_utforare": "IMY (vägledning om AI/dataskydd); DO (diskrimineringsperspektiv)", "tvist": "Förvaltningsrätten (överklaga beslut)", "tillsynsmyndighet": "IMY (dataskydd/AI); JO (myndighetsutövning); DO (diskriminering)", "lagstod": "GDPR 2016/679 art. 22 (automatiserat beslutsfattande), art. 5 (transparens); Diskrimineringslagen (2008:567) 1 kap. 4 §; FL 32 § (motivering); EU AI Act 2024/1689 art. 6, 9–10 (högrisk-AI: krav på riskbedömning, datakvalitet, transparens)", "lucka_status": "Nej", "empirisk_kalla": "Institutet för mänskliga rättigheter (2026) Årsrapport 2026::AI-tekniken innebär nya risker för att mänskliga rättigheter kränks. Bristande transparens, felaktiga underlag och begränsade möjligheter till ansvarsutkrävande kan leda till att enskilda drabbas av felaktiga eller godtyckliga beslut (s. 58). | Svenska Dagbladet (2025) Pekade ut mammor – nu slopas AI-systemet::Försäkringskassans hemliga bot skulle stoppa fusk – men pekade i stället ut oskyldiga mammor och föräldrar i utsatta grupper. Ett år efter SvD:s granskning avvecklar myndigheten AI-systemet. | IMY (2025) Avslutad tillsyn efter att Försäkringskassan tagit AI-system ur bruk::I juni 2025 inledde Integritetsskyddsmyndigheten (IMY) en tillsyn mot Försäkringskassan. Bakgrunden var rapportering om deras användning av AI vid urval för riktade vab-kontroller. Försäkringskassan tog därefter AI-systemet ur bruk och ärendet är nu avslutat.", "beskrivning": "Digitala samhällsfunktioner designas ofta utifrån en antagen norm. Den som faller utanför normen utestängs. Samma mekanism uppstår när AI-system tränas på data som speglar befintliga ojämlikheter eftersom systemet ärver och förstärker dem.", "lankar": ["https://mrinstitutet.se/download/18.234277b219d0483f491b63a/1774331817101/Rapport-Arsrapport-2026.pdf", "https://www.svd.se/a/d45KKB/forsakringskassans-ai-slopas-efter-svd-s-granskning", "https://www.imy.se/nyheter/avslutad-tillsyn-efter-att-forsakringskassan-tagit-ai-system-ur-bruk/"], "tillsynsskydd_finns": "IMY inledde granskning men Försäkringskassan tog riskprofilen ur bruk innan granskningen slutfördes, ärendet avskrevs. Ingen prövning av om urvalet var diskriminerande."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.5 Diskriminerande systemdesign", "taxonomi_id": "1.5.2", "kategori": "Språkliga barriärer", "situation_exempel": "Myndighetens e-tjänst finns bara på svenska – jag förstår inte vad jag ska göra", "radgivning_enskild": "Resp. myndighet (begära tolk eller hjälp, FL 13 §); Statens servicecenter (begära tolk eller hjälp, FL 13 §)", "radgivning_utforare": "Digg (DOS-lagen, vägledning om flerspråkighet)", "tvist": "Saknas – det finns inget överklagbart beslut när en e-tjänst inte är översatt", "tillsynsmyndighet": "JO; Digg (DOS-lagen)", "lagstod": "FL 13 § (tolk och översättning); SFS 2018:1937 (DOS-lagen); RF 1 kap. 2 §", "lucka_status": "Delvis", "empirisk_kalla": "Riksrevisionen (RiR 2023:6) Digitala tjänster till privatpersoner – stora utvecklingsmöjligheter för statliga myndigheter::De flesta digitala tjänster, som får anses vara grundläggande, saknar översättning. Det gäller till exempel Skatteverkets digitala deklarationstjänst, anmäla ny adress eller skriva in sig hos Arbetsförmedlingen. Vi ser också att vissa tjänster där en betydande del av målgruppen kan antas tala andra språk än svenska inte heller är översatta. Det gäller de tjänster som man kan använda när man är ny i Sverige, till exempel att bli inskriven i Försäkringskassan, vilket man behöver bli innan man har rätt att söka stöd. Enligt de servicehandläggare vid Statens servicecenter som vi har intervjuat är bristande kunskap i svenska en vanlig anledning till att personer besöker servicekontoren för att få hjälp (s. 34–35).", "beskrivning": "Digitala samhällsfunktioner som bara erbjuds på vissa språk eller som använder juridiskt, tekniskt eller byråkratiskt språk utestänger den som inte behärskar det.", "lankar": ["https://www.riksrevisionen.se/download/18.1e0fa62b19047f61fcc9553/1719239329567/RiR_2023_6_master.pdf"], "tillsynsskydd_finns": "FL 13 § kräver att myndigheter hjälper den som inte behärskar svenska men RiR 2023:6 visar att majoriteten av granskade e-tjänster inte är översatta"}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.5 Diskriminerande systemdesign", "taxonomi_id": "1.5.3", "kategori": "Systemlogik", "situation_exempel": "Jag hittar inte rätt blankett på myndighetens hemsida (allt är organiserat efter deras avdelningar, inte efter mitt behov)", "radgivning_enskild": "Resp. myndighet (telefon/besök); Statens servicecenter", "radgivning_utforare": "Digg (DOS-lagen, vägledning om informationsarkitektur)", "tvist": "Saknas – ologisk informationsarkitektur är inte ett överklagbart beslut", "tillsynsmyndighet": "Digg (DOS-lagen); JO", "lagstod": "FL 6–7 §§ (smidiga kontakter, tillgänglighet); SFS 2018:1937 (DOS-lagen)", "lucka_status": "Delvis", "empirisk_kalla": "Riksrevisionen (RiR 2023:6) Digitala tjänster till privatpersoner – stora utvecklingsmöjligheter för statliga myndigheter::I de öppna svaren framkommer vissa återkommande problem. Dessa handlar bland annat om att det är svårt att hitta i de digitala tjänsterna, eller att det är svårt att förstå tjänsterna och informationen i dem (s. 30). | Svenskarna med funktionsnedsättning och internet 2025::Sedan 2017 har personer med funktionsnedsättning rapporterat att de har stora svårigheter att söka information, att navigera sig fram till information och att förstå den information de till slut hittar. Det är till exempel en återkommande kritik som riktats mot samhällsviktiga tjänster som 1177.se och Försäkringskassan. Här går det inte att se några tydliga förbättringar (s. 17). | Digg/PTS (2026) Redovisning av uppdraget att stödja genomförandet av Sveriges Digitaliseringsstrategi::Endast en dryg femtedel av de svarande kommunerna följer  regelbundet upp enkelheten i kommunens digitala tjänster för invånare. Knappt två tredjedelar av kommunerna följer upp detta sporadiskt (s. 36). | Digg (2026) Uppdrag att analysera och beskriva möjligheter och utmaningar kopplade till att etablera en digital ingång till det offentliga. Slutrapport i regeringsuppdraget Fi2025/02066::Etableringen av en gemensam digital ingång är inte i första hand en teknisk fråga. Den handlar i hög grad om styrning, ansvar och arbetssätt. För att lyckas behöver offentlig förvaltning i större utsträckning agera samlat utifrån människors behov, snarare än utifrån enskilda organisationers uppdrag. En gemensam digital ingång leder inte i sig till sammanhängande tjänster, utan förutsätter att processer, ansvar och datadelning fungerar samordnat över organisationsgränser, och att ansvar ligger hos de aktörer som har ansvar över data, regelverk och processer (s. 2). På kort och medellång sikt handlar arbetet med en gemensam digital ingång i stor utsträckning om att skapa sammanhang, vägledning och integration – snarare än att ersätta befintliga tjänster (s. 14).", "beskrivning": "När digitala samhällsfunktioner organiseras efter systemets logik snarare än efter hur människor söker och förstår information blir innehåll otillgängligt trots att det tekniskt finns där.", "lankar": ["https://www.riksrevisionen.se/download/18.1e0fa62b19047f61fcc9553/1719239329567/RiR_2023_6_master.pdf", "https://www.begripsam.se/download/18.34c5105e19cf45dbbdba114/1773657022640/SMFOI_2025_huvudrapport_v2.pdf", "https://www.digg.se/download/18.4d9d13fe19c34cfab85e4b/1772203531877/Rapport-Uppf%C3%B6ljning-av-digitaliseringsstrategin-feb-2026.pdf", "https://www.digg.se/download/18.12d3b9fb19d0d4280da64f/1774989242010/Uppdrag%20att%20beskriva%20utmaningar%20och%20mo%CC%88jligheter.pdf"], "tillsynsskydd_finns": "DOS-lagen och Diggs tillsyn täcker teknisk tillgänglighet (WCAG) men inte informationsarkitektur och begriplighet."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.5 Diskriminerande systemdesign", "taxonomi_id": "1.5.4", "kategori": "Kognitiva krav", "situation_exempel": "Ansökan har så många steg och tidsgränser att jag inte hinner tänka — jag ger upp halvvägs och det finns inget sätt att spara och fortsätta senare", "radgivning_enskild": "Resp. myndighet (begära hjälp, FL 6 §); Statens servicecenter", "radgivning_utforare": "Digg (DOS-lagen); DO (diskrimineringsperspektiv)", "tvist": "DO (bristande tillgänglighet som diskriminering); förvaltningsrätten (om beslut kan överklagas)", "tillsynsmyndighet": "Digg (DOS-lagen); JO; DO (om funktionsnedsättning, diskrimineringslagen)", "lagstod": "FL 6–7 §§ (smidiga kontakter, tillgänglighet); SFS 2018:1937 (DOS-lagen); Diskrimineringslagen (2008:567) 1 kap. 4 § (bristande tillgänglighet som diskriminering)", "lucka_status": "Delvis", "empirisk_kalla": "Riksrevisionen (RiR 2023:6) Digitala tjänster till privatpersoner – stora utvecklingsmöjligheter för statliga myndigheter::Ett annat problem handlar om att personer är rädda för att göra fel eller känner sig stressade och osäkra. Några av personerna med neuropsykiatrisk funktionsnedsättning (NPF) ger uttryck för problem när man blir stressad, att de uppfattar tjänsterna som röriga och att de känner en oro och osäkerhet inför om de använder tjänsterna på rätt sätt (s. 30).| Svenskarna med funktionsnedsättning och internet 2025::Även om lagstiftningen på ett övergripande plan ställer\nkrav på begriplighet så finns det i de standarder lagarna pekar på inte tillräckliga krav för att lagstiftningen ska ge effekt. Den stora majoriteten av personer med funktionsnedsättning är beroende av att man ser lagstiftningen som en miniminivå och går vidare genom att göra tjänsterna enklare, mer begripliga och med bättre design. (s. 12).", "beskrivning": "Digitala samhällsfunktioner som innehåller många steg, korta tidsgränser eller komplex information skapar hinder för den som behöver mer tid eller tydligare struktur.", "lankar": ["https://www.riksrevisionen.se/download/18.1e0fa62b19047f61fcc9553/1719239329567/RiR_2023_6_master.pdf", "https://www.begripsam.se/download/18.34c5105e19cf45dbbdba114/1773657022640/SMFOI_2025_huvudrapport_v2.pdf"], "tillsynsskydd_finns": "Delvis – WCAG ställer krav på tillräcklig tid (2.2.1) och begriplig information (3.1) men Digg bedriver inte tillsyn i den utsträckning EU kräver (RiR 2023:6 s. 59). Kognitiv tillgänglighet saknar specifika krav i nuvarande standard."}, {"tax_huvusektion": "Systembarriärer", "tax_huvudsektion_beskrivning": "Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.", "tax_kat": "1.6 Ansvar för användbarhet", "taxonomi_id": "1.6.1", "kategori": "Pedagogiskt ansvar", "situation_exempel": "Mitt anslutningståg ställdes in och jag står på stationen. Tågföretagets chatbot fattar inte vad jag menar och jag hittar inget telefonnummer. Jag vet inte ens om
