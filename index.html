c-wage-and-labor-exploitation-in-platform-work-in-the-us", "https://www.etui.org/publications/regulating-algorithmic-management"], "tillsynsskydd_finns": "Plattformsdirektivet är antaget men inte genomfört i svensk lag (deadline 2 december 2026)."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.7 Plattformsstyrt arbete", "taxonomi_id": "2.7.2", "kategori": "Villkorat socialt skyddsnät", "situation_exempel": "Jag blev sjuk men får ingen sjukpenning – Försäkringskassan säger att jag inte är anställd utan uppdragstagare åt plattformen.", "radgivning_enskild": "Försäkringskassan<br>Fackförbund (Transportarbetareförbundet, Hotell- och restaurangfacket eller motsvarande)<br>Allmänna ombudet för socialförsäkringen (kan överklaga beslut till förmån för enskild)", "radgivning_utforare": "Försäkringskassan (vägledning om SGI och sjukpenning)<br>Skatteverket (vägledning om arbetsgivaransvar och F-skatt)<br>Inspektionen för socialförsäkringen (tillsynsvägledning)", "tvist": "Förvaltningsrätten (sjukpenning); Arbetsdomstolen (anställningsfrågan)", "tillsynsmyndighet": "Inspektionen för socialförsäkringen (tillsyn över Försäkringskassan och socialförsäkringssystemet)<br>Arbetsmiljöverket (tillsyn över arbetsgivaransvar enligt arbetsmiljölagen)<br>Justitieombudsmannen (granskar enskilda fall av myndighetsutövning)", "lagstod": "**Socialförsäkringsbalken (2010:110)** 25 kap. 2 § anger att sjukpenninggrundande inkomst (SGI) är den årliga inkomst i pengar som en försäkrad kan antas komma att tills vidare få för eget arbete antingen som arbetstagare i allmän eller enskild tjänst (inkomst av anställning) eller på annan grund (inkomst av annat förvärvsarbete). 27 kap. anger reglerna för sjukpenning, inklusive karensavdrag respektive karensdagar beroende på om personen är anställd eller har inkomst av annat förvärvsarbete.<br>**Plattformsdirektivet (EU 2024/2831)** art. 5 anger en rättslig presumtion om anställningsförhållande när det finns sakförhållanden som tyder på att plattformen utövar ledning och kontroll. Direktivet ska vara genomfört i svensk rätt senast 2 december 2026.<br>**Lagen (1982:80) om anställningsskydd (LAS)** anger reglerna för anställningsavtal, uppsägning och avsked för den som är arbetstagare i lagens mening.", "lucka_status": "Nej", "empirisk_kalla": "Inspektionen för socialförsäkringen, ISF (2023:3) Gigarbetare och socialförsäkringen Om möjligheten att få ersättning vid sjukdom och föräldraskap::Gigarbetare kan stöta på svårigheter vid ansökan om sjukpenning, föräldrapenning och vab hos Försäkringskassan. Svårigheterna grundar sig på att försäkringen är konstruerad för regelbundna tillsvidareanställningar, medan gigarbete ofta är oregelbundet och oförutsägbart. | Arbetsliv/Prevent (2024) Stärkta rättigheter för gig-arbetare::En majoritet av plattformsarbetarna saknar en regelrätt anställning. Det innebär att de inte har rätt till sjukpenning, föräldraförsäkring eller arbetslöshetsersättning, trots att de arbetar regelbundet på ett sätt som liknar ett anställningsförhållande.|Hartzén (2023) Plattformsarbetare och sjukpenninggrundande inkomst - lika, men ändå olika?::Särskilt problematisk är inkonsekvensen inom Socialförsäkringsbalken (SFB) där steg ett i ett försäkringsärende, det vill säga fastställandet av SGI, hanteras utifrån klassificering av inkomst snarare än personens arbetsrättsliga status, medan efterkommande steg avseende bedömningen av personens rätt till exempelvis sjukpenning relaterar till personens arbetsrättsliga status.", "beskrivning": "Digitala plattformar klassificerar den som utför arbetet som uppdragstagare, inte som anställd. Socialförsäkringssystemets skydd förutsätter anställning.", "lankar": ["https://isf.se/publikationer/rapporter/2023/2023-04-27-gigarbetare-och-socialforsakringen", "https://portal.research.lu.se/sv/publications/plattformsarbetare-och-sjukpenninggrundande-inkomst-lika-men-%C3%A4nd%C3%A5/", "https://www.prevent.se/arbetsliv/lagar-och-regler/2024/starkta-rattigheter-for-gig-arbetare/"], "tillsynsskydd_finns": "Socialförsäkringsbalken förutsätter att den försäkrade kategoriseras som anställd eller egenföretagare. Plattformsarbetaren faller mellan kategorierna – SGI kan fastställas baserat på inkomstens art men sjukpenning förutsätter att personens arbetsrättsliga status klarläggs."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.7 Plattformsstyrt arbete", "taxonomi_id": "2.7.3", "kategori": "Inkomst som inte ryms i systemen", "situation_exempel": "Jag kör för en plattform och söker bostadsbidrag – men min inkomst varierar från vecka till vecka och Försäkringskassans system kräver en fast månadsinkomst. Jag vet inte vad jag ska skriva.", "radgivning_enskild": "Försäkringskassan<br>Skatteverket<br>Fackförbund (kompetens om plattformsinkomster)<br>Allmänna ombudet för socialförsäkringen (kan överklaga beslut till förmån för enskild)", "radgivning_utforare": "Försäkringskassan (vägledning om inkomstrapportering och bostadsbidrag)<br>Skatteverket (vägledning om arbetsgivardeklaration på individnivå)<br>Inspektionen för socialförsäkringen (tillsynsvägledning)", "tvist": "Förvaltningsrätten (om återkrav); JO", "tillsynsmyndighet": "Inspektionen för socialförsäkringen (tillsyn över Försäkringskassan och socialförsäkringssystemet)<br>Justitieombudsmannen (granskar enskilda fall av myndighetsutövning)", "lagstod": "**Socialförsäkringsbalken (2010:110)** 110 kap. 46 § anger att den som ansöker om eller får en förmån är skyldig att anmäla sådana ändringar i förhållanden som påverkar rätten till eller storleken på förmånen. 108 kap. anger reglerna för återkrav av felaktigt utbetalda förmåner.<br>**Lagen (1993:737) om bostadsbidrag** anger reglerna för bostadsbidrag, inklusive att bidraget beräknas på preliminär årsinkomst och stäms av mot faktisk inkomst i efterhand. 22 § anger återbetalningsskyldighet för den som fått bidrag på felaktiga grunder.<br>**Förvaltningslagen (2017:900)** 6 § anger att myndigheter ska se till att kontakterna med enskilda blir smidiga och enkla, och lämna den enskilde sådan hjälp att hen kan ta till vara sina intressen. 7 § anger att myndigheter ska vara tillgängliga för kontakter.<br>**Bidragsbrottslagen (2007:612)** anger straffansvar för den som lämnar oriktiga uppgifter eller inte anmäler ändrade förhållanden och därigenom orsakar att en förmån betalas ut felaktigt.", "lucka_status": "Nej", "empirisk_kalla": "Riksrevisionen (RiR 2026:4) Ändrade förhållanden – ineffektiv hantering i socialförsäkringen::En stor del av felaktiga utbetalningar beror på att försäkrade inte anmält ändrade förhållanden. Systemen bygger till stor del på att försäkrade själva anmäler ändringar, vilket medför stora risker för felaktiga utbetalningar (s. 58). Försäkringskassans handläggningssystem har till exmepel föråldrade funktioner för att hantera ändrade förhållanden. Ärendeköer och fördröjd hantering ökar risken för felaktiga utbetalningar och återkrav (s. 44). | Inspektionen för socialförsäkringen, ISF (2023:3) Gigarbetare och socialförsäkringen – Om möjligheten att få ersättning vid sjukdom och föräldraskap::Socialförsäkringen är konstruerad för regelbundna tillsvidareanställningar. Gigarbetares oregelbundna inkomst gör det omöjligt att beräkna framtida inkomst.", "beskrivning": "Digitala system för inkomstrapportering förutsätter stabila, förutsägbara belopp. Oregelbundna plattformsinkomster passar inte i mallarna. Den som försöker göra rätt riskerar ändå felrapportering, återkrav och sanktioner.", "lankar": ["https://www.riksrevisionen.se/nyhetsarkiv/nyhetsarkiv/2026-02-19-ineffektiv-hantering-av-andrade-forhallanden-i-socialforsakringen.html", "https://isf.se/publikationer/rapporter/2023/2023-04-27-gigarbetare-och-socialforsakringen"], "tillsynsskydd_finns": "Socialförsäkringssystemet förutsätter en förutsägbar månadsinkomst. Den som har oregelbundna plattformsinkomster har laglig skyldighet att anmäla ändrade förhållanden men saknar praktiska verktyg för att göra det löpande, vilket skapar systematisk risk för återkrav och bidragsbrottsanmälan trots ärlig avsikt."}, {"tax_huvusektion": "Bildning, egenmakt och delaktighet", "tax_huvudsektion_beskrivning": "Det allmännas ansvar att upprätthålla förutsättningarna för att den enskilde ska kunna förstå, agera och delta i en digitaliserad välfärdsstat.", "tax_kat": "3.1 Bildningens förutsättningar", "taxonomi_id": "3.1.1", "kategori": "Sammanhållet ekosystem", "situation_exempel": "Jag behöver skriva ut en sak och jag har ingen skrivare hemma. Var kan jag få hjälp med det?", "radgivning_enskild": "Biblioteket (lokala stödfunktioner och hänvisning)<br>Kommunens medborgarservice eller invånarupplysning<br>Studieförbund och folkhögskolor (lokal kursverksamhet och cirklar)<br>Statens servicecenter (servicekontor)", "radgivning_utforare": "Post- och telestyrelsen (samordningsuppdrag digital inkludering)<br>Mediemyndigheten (samordnar MIK Sverige)<br>Kungliga biblioteket (nationell biblioteksstrategi och samverkan inom biblioteksväsendet)<br>Folkbildningsrådet (statsbidrag och uppföljning av folkbildning)<br>Skolverket (formell utbildning)<br>Sveriges Kommuner och Regioner, SKR (stöd till kommuner och regioner)<br>Myndigheten för digital förvaltning, Digg (statlig digital förvaltning)", "tvist": "", "tillsynsmyndighet": "Folkbildningsrådet prövar och följer upp fördelningen av statsbidrag till studieförbund och folkhögskolor<br>Kungliga biblioteket har en nationellt övergripande roll och ska främja samverkan inom det allmänna biblioteksväsendet<br>Sveriges Kommuner och Regioner, SKR, är intresseorganisation för kommuner och regioner<br>Mediemyndigheten samordnar MIK Sverige<br>Skolverket ansvarar för formell utbildning<br>Post- och telestyrelsen fick i februari 2026 ett utökat uppdrag att samordna och, i dialog med berörda aktörer, främja, stödja och följa arbetet för en ökad digital inkludering och säker användning av digitala tjänster.", "lagstod": "**Regeringsformen (1974:152)** 1 kap. 2 § anger att det allmänna ska verka för att alla människor ska kunna uppnå delaktighet och jämlikhet i samhället.<br>**Bibliotekslagen (2013:801)** 2 § anger att biblioteken i det allmänna biblioteksväsendet ska verka för det demokratiska samhällets utveckling genom att bidra till kunskapsförmedling och fri åsiktsbildning, samt främja litteraturens ställning och intresset för bildning, upplysning, utbildning och forskning samt kulturell verksamhet i övrigt. 4 § anger att biblioteken särskilt ska ägna uppmärksamhet åt personer med funktionsnedsättning, bland annat genom att utifrån deras olika behov och förutsättningar erbjuda litteratur och tekniska hjälpmedel för att kunna ta del av information. 7 § anger att folkbiblioteken ska verka för att öka kunskapen om hur informationsteknik kan användas för kunskapsinhämtning, lärande och delaktighet i kulturlivet.<br>**Förordning (2015:218) om statsbidrag till folkbildningen** 1 § anger att syftet med statens stöd till folkbildningen är att stödja verksamhet som bidrar till att stärka och utveckla demokratin, göra det möjligt för en ökad mångfald människor att påverka sin livssituation och skapa engagemang att delta i samhällsutvecklingen, utjämna utbildningsklyftor och höja bildnings- och utbildningsnivån i samhället, samt bredda intresset för och öka delaktigheten i kulturlivet.<br>**Lag (1976:1046) om överlämnande av förvaltningsuppgifter inom Utbildningsdepartementets verksamhetsområde** anger att Folkbildningsrådet prövar frågor om fördelning av statsbidrag till folkhögskolor, studieförbund och studerandeorganisationer.<br>**Folkbildningens verksamhet är i sig inte lagreglerad.** Principen om en fri och frivillig folkbildning innebär att verksamhetens innehåll bestäms av folkbildningens aktörer själva. Endast statsbidragets villkor regleras.", "lucka_status": "Nej", "empirisk_kalla": "Raymond, T. (2025) Gotland i en digital tid::Modellen \"Aktörskarta för arbete med digital inkludering\" visualiserar olika funktioner och aktörer som kan mobilisera bildning och vardagsstöd för en hållbar digital omställning (s. 101–105). | Bäckström, S. (red.) (2020) Bankdosor, skam och sms-poesi. Essäer om bibliotekens arbete med digitalisering::Förarbeten till Bibliotekslagens (2013:801) skrivelser visar att intentionen var att biblioteken skulle stå för tillgång till ett brett databasutbud samt lära ut sökningar i dessa och på Internet. Medie- och informationskunnighet (MIK) var ett högaktuellt ämne som passade väl in i folkbildningsuppdraget med fokus på att lära ut hur man analyserar, värderar och hanterar information. Ingen förväntade sig att biblioteken skulle få en så stor mängd andra ärenden i knät. Men det offentliga samhällets iver att utveckla tjänster och rutiner hamnade hos en lätt förvånad biblioteksbransch som blev en slags generell IT-support. \"Den vision som våra folkvalda har målat upp om Sverige som världsledande i nyttjande av digitaliseringens möjligheter kommer att falla platt om inte samtliga inblandade mellan varven skiftar fokus från själva produktionen av e-tjänster till pedagogiken kring dessa\" (s. 14) . | Digg/PTS (2026) Redovisning av uppdraget att stödja genomförandet av Sveriges Digitaliseringsstrategi::Var tredje folkbibliotekarie uppskattar att mer än hälften av arbetstiden går åt till att hjälpa besökare med olika typer av samhällsservice som myndighetskontakter, blanketter och bankärenden (s. 8). | Tillväxtverket (2022) Utvärdering av Regionala digitaliseringskoordinatorer::De regionala digitaliseringskoordinatorerna verkade 2018–2022 med uppdrag att samordna regionala aktörer kring digital omställning. Tillväxtverket drev ett sekretariat och kompetensnätverk för att stödja koordinatorerna och främja samverkan mellan regionerna. | Regeringskansliet (2026-02-23) Nytt uppdrag ska minska digitalt utanförskap::PTS får i uppdrag att påskynda arbetet med digital inkludering. PTS ska samordna nio namngivna myndigheter (Folkhälsomyndigheten, Digg, Mediemyndigheten, MFD, MTM, MUCF, Statens servicecenter, KB och Socialstyrelsen), kartlägga befintliga fysiska mötesplatser där digital inkludering är en del av uppdraget, samt genomföra nationella informations- och utbildningsinsatser. Slutredovisning januari 2029.", "beskrivning": "Bildningsaktörerna behöver verka i ett sammanhållet ekosystem – med både stödinsatser och lärande – där varje aktörs uppdrag och erbjudande är tydliga. Utan organisatorisk helhet ersätts ekosystemet av enskilda insatser med teknikhjälp.", "lankar": ["https://dokument.gotland.se/IntegrationService.svc/doc/content/49202", "https://www.regionvasterbotten.se/VLL/Filer/Bankdosor-skam-och-sms-poesi-Essaer-om-bibliotekens-arbete-med-digitalisering%20(1).pdf", "https://www.digg.se/download/18.4d9d13fe19c34cfab85e4b/1772203531877/Rapport-Uppf%C3%B6ljning-av-digitaliseringsstrategin-feb-2026.pdf", "https://tillvaxtverket.se/tillvaxtverket/publikationer/publikationer2022/utvarderingavregionaladigitaliseringskoordinatorer.1468.html"], "tillsynsskydd_finns": "Enskild vägledning och lärande om digital vardag avgörs till stor del av lokala eldsjälar och av den enskildes förmåga att navigera stödinsatser och bildningsinitiativ. Aktörer inom det vardagsnära bildningsansvaret arbetar inom sina respektive områden. Det saknas tvärsektoriella mandat att bygga lokala och regionala ekosystem. Dessutom saknas uppdrag på regional och kommunal nivå att underhålla strukturer för tvärsektoriell flernivåsamverkan med fokus på hållbar digital omställning. Tillväxtverkets sekretariat för regionala digitaliseringskoordinatorer (2018–2022) är en potentiell modell – där låg samordningen i regionerna och staten bidrog med ett stödsekretariat och kompetensnätverk."}, {"tax_huvusektion": "Bildning, egenmakt och delaktighet", "tax_huvudsektion_beskrivning": "Det allmännas ansvar att upprätthålla förutsättningarna för att den enskilde ska kunna förstå, agera och delta i en digitaliserad välfärdsstat.", "tax_kat": "3.1 Bildningens förutsättningar", "taxonomi_id": "3.1.2", "kategori": "Organisatorisk förankring", "situation_exempel": "Personen som brukade hjälpa mig har slutat på sitt arbete. Med den försvann ett stöd som var viktigt för att få till en digital vardag.", "radgivning_enskild": "Biblioteket (lokala stödfunktioner och hänvisning)<br>Kommunens medborgarservice eller invånarupplysning<br>Studieförbund och folkhögskolor (kursverksamhet)<br>Statens servicecenter (servicekontor)", "radgivning_utforare": "Sveriges Kommuner och Regioner (stöd till kommuner som arbetsgivare)<br>Folkbildningsrådet (folkbildningens villkor)<br>Digiteket (fortbildning inom bibliotekssektorn)<br>Mediemyndigheten (samordnar MIK Sverige)<br>Skolverket (formell utbildning)", "tvist": "", "tillsynsmyndighet": "Det vardagsnära bildningsansvaret bärs av folkbibliotek, studieförbund, folkhögskolor och kommunala verksamheter. Vid bibliotek är digital handledning sällan en formaliserad tjänstefunktion utan utförs av engagerade enskilda inom ramen för andra uppdrag. Inom folkbildningen finansieras verksamheten ofta projektvis, vilket gör kompetens och kontaktytor tillfälliga. Ingen aktör har ett tydligt uppdrag att tjänstefiera, kompetensförsörja och kvalitetssäkra det vardagsnära bildningsarbetet som en stående verksamhet.", "lagstod": "**Regeringsformen (1974:152)** 1 kap. 2 § anger att det allmänna ska verka för att alla människor ska kunna uppnå delaktighet och jämlikhet i samhället.<br>**Bibliotekslagen (2013:801)** 7 § anger att folkbiblioteken ska verka för att öka kunskapen om hur informationsteknik kan användas för kunskapsinhämtning, lärande och delaktighet i kulturlivet.<br>**Förordning (2015:218) om statsbidrag till folkbildningen** reglerar statsbidragets villkor men inte att verksamhet ska bedrivas eller hur den ska bäras organisatoriskt. Folkbildningens verksamhet är i sig inte lagreglerad.<br>**Arbetsmiljölagen (1977:1160)** 3 kap. 2 a § anger att arbetsgivaren ska systematiskt planera, leda och kontrollera verksamheten på ett sätt som leder till att arbetsmiljön uppfyller kraven på en god arbetsmiljö. **Arbetsmiljöverkets föreskrifter om organisatorisk och social arbetsmiljö (AFS 2015:4)** preciserar krav på tydliga arbetsuppgifter, befogenheter och resurser samt förebyggande av ohälsosam arbetsbelastning.", "lucka_status": "Nej", "empirisk_kalla": "Digg/PTS (2026) Redovisning av uppdraget att stödja genomförandet av Sveriges Digitaliseringsstrategi::Digital kompetens byggs och upprätthålls inte bara genom utbildning och information, utan också genom praktiskt stöd i vardagliga användningssituationer. Mycket av detta arbete görs trots att det inte finns formella uppdrag och statsbidragen till folkhögskolor och studieförbund har minskat kraftigt trots att behoven är desamma (s. 14). |Nilsson, O. (2026) Från eldsjälar till systematik – En analys av MIK-arbetet vid elva svenska folkbibliotek. Digiteket::Organisationsmodellerna för MIK-arbetet varierar kraftigt mellan biblioteken, från informella strukturer till dedikerade arbetsgrupper. Flera bibliotek förlitar sig på enskilda eldsjälar för att driva MIK-arbetet framåt. Studien identifierar en nödvändig förflyttning från eldsjälsdrivet arbete till systematiserat: organisatoriskt stöd och tydlig ledning, formella strukturer med grupper, rutiner och basnivåer, gemensam grundkompetens för alla och integration i bibliotekets vardagsverksamhet. | Bäckström, S. (red.) (2020) Bankdosor, skam och sms-poesi. Essäer om bibliotekens arbete med digitalisering::När Digitalt först blir till digitalt som krav (eller digital by default) blir det svårt för personer och grupper som står utanför det digitala imperativet (se Wormbs 2010). Digitalt omsorgsarbete är smörjmedlet för samhällets stora satsning på digitalisering (s. 44). | Raymond, T. (2025) Gotland i en digital tid::Kortsiktig finansiering skapar osäkerhet och hindrar långsiktig verksamhetsutveckling (s. 48).", "beskrivning": "Bildningsarbetet behöver vara organisatoriskt buret för att inte vila på enskilda eldsjälar och punktinsatser. Organisatorisk förankring är förutsättning för kontinuitet, kvalitet och likvärdighet i utbudet.", "lankar": ["https://www.digg.se/download/18.4d9d13fe19c34cfab85e4b/1772203531877/Rapport-Uppf%C3%B6ljning-av-digitaliseringsstrategin-feb-2026.pdf", "https://digiteket.se/inspirationsartikel/fran-eldsjalar-till-systematik-en-analys-av-mik-arbetet-vid-elva-svenska-folkbibliotek/", "https://www.regionvasterbotten.se/VLL/Filer/Bankdosor-skam-och-sms-poesi-Essaer-om-bibliotekens-arbete-med-digitalisering%20(1).pdf", "https://dokument.gotland.se/IntegrationService.svc/doc/content/49202"], "tillsynsskydd_finns": "Samhällets informella digitalsupport vid folkbibliotek, kommunal IT-handledning och inom folkbildningen vilar i hög grad på enskilda personer. Raymond (2025) beskriver hur it-handledningens centrala funktioner – hembesök, samordning och utbildningsinsatser – finansieras genom externa medel, vilket försvårar långsiktig verksamhetsutveckling. Att förflytta arbetet från eldsjälsdrivet till organisatoriskt buret är en verksamhetsförflyttning som kräver reguljär budget och yrkesnormer som existerar oberoende av enskild personal."}, {"tax_huvusektion": "Bildning, egenmakt och delaktighet", "tax_huvudsektion_beskrivning": "Det allmännas ansvar att upprätthålla förutsättningarna för att den enskilde ska kunna förstå, agera och delta i en digitaliserad välfärdsstat.", "tax_kat": "3.1 Bildningens förutsättningar", "taxonomi_id": "3.1.3", "kategori": "MIK som kärnkompetens", "situation_exempel": "Ska man acceptera kakor eller inte? Olika personer ger mig olika svar och jag förstår inte varför.", "radgivning_enskild": "Yrkesgrupper som dagligen möter invånare med behov av att söka, tolka eller värdera information — bibliotekarier, folkbildare, lärare, IT-handledare, vägledare, socialsekreterare, biståndshandläggare, omsorgspersonal samt frontpersonal i offentlig service och vården.", "radgivning_utforare": "Mediemyndigheten (MIK Sverige)<br>Digiteket (fortbildning inom bibliotekssektorn)<br>Skolverket (formell utbildning och läroplaner)<br>Folkbildningsrådet (folkbildningens kompetensutveckling)<br>Universitetskanslersämbetet (kvalitetssäkring av yrkesutbildningar)<br>Socialstyrelsen (vägledning till omsorgs- och vårdprofessioner)<br>Sveriges Kommuner och Regioner (stöd till kommuner som arbetsgivare)", "tvist": "", "tillsynsmyndighet": "Mediemyndigheten samordnar MIK Sverige men saknar verktyg att granska om insatserna integreras i professionell praktik. Skolverket, Universitetskanslersämbetet och Folkbildningsrådet ansvarar var för sig för respektive utbildningssystem, men ingen aktör har ett sammanhållet uppdrag att säkerställa att pedagogisk MIK-kärnkompetens är integrerad i grundutbildning, fortbildning och tjänstebeskrivningar för de yrkesgrupper som dagligen möter den enskildes informationsbehov.", "lagstod": "**Regeringsformen (1974:152)** 1 kap. 2 § anger att det allmänna ska verka för att alla människor ska kunna uppnå delaktighet och jämlikhet i samhället.<br>**Bibliotekslagen (2013:801)** 2 § anger att biblioteken i det allmänna biblioteksväsendet ska verka för det demokratiska samhällets utveckling genom att bidra till kunskapsförmedling och fri åsiktsbildning. 7 § anger att folkbiblioteken ska verka för att öka kunskapen om hur informationsteknik kan användas för kunskapsinhämtning, lärande och delaktighet i kulturlivet.<br>**Förvaltningslagen (2017:900)** 6 § anger att myndigheter ska se till att kontakterna med enskilda blir smidiga och enkla, och lämna den enskilde sådan hjälp att hen kan ta till vara sina intressen.<br>**Europaparlamentets och rådets förordning (EU) 2024/1689 om harmoniserade regler för artificiell intelligens (AI-förordningen)** art. 4 anger att leverantörer och tillhandahållare av AI-system ska säkerställa att den personal som hanterar och använder AI-system har tillräcklig AI-kunnighet. Bestämmelsen trädde i kraft 2 augusti 2025. Motsvarande krav saknas för de professioner som möter den enskilde i det vardagsnära bildningsuppdraget.", "lucka_status": "Nej", "empirisk_kalla": "UNESCO (2021) Think Critically, Click Wisely – MIL Curriculum for Educators & Learners::UNESCO skiljer mellan tre nivåer: att undervisa om MIK, att undervisa genom MIK och att använda MIK som verktyg för samhällsdeltagande. MIK presenteras som en process integrerad i yrkesutövning och samhällsengagemang, inte som ett avgränsat ämne. Målet är att pedagoger, samhällsledare och folkbildare själva ska bli medie- och informationskunniga och utveckla de kompetenser som krävs för att integrera MIK på alla nivåer och i alla utbildningsformer (s. 60). | Carlsson, U. (red.) (2018) Medie- och informationskunnighet (MIK) i den digitala tidsåldern – En demokratifråga: Kartläggning, analys, reflektioner. Nordicom::Lärare och bibliotekarier är att betrakta som nyckelfunktioner för arbetet med MIK i Sverige mot medborgare i olika målgrupper (s. 100). Folkbiblioteken utgör naturliga arenor för att understödja invånarnas medie- och informationskunnighet; en uppgift som förutom att framhållas i bibliotekslagen även har stöd i Unescos och IFLA:s internationella biblioteksmanifest (s. 83).", "beskrivning": "Mandat och förmåga att stödja den enskilde i att söka, tolka och värdera information behöver vara del av kärnuppdraget för professioner som bär det vardagsnära bildningsansvaret.", "lankar": ["https://unesdoc.unesco.org/ark:/48223/pf0000377068", "https://urn.kb.se/resolve?urn=urn:nbn:se:norden:org:diva-5321", "https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-4"], "tillsynsskydd_finns": "MIK har i huvudsak organiserats som separata insatser riktade till medborgaren –som kurser, kampanjer eller temadagar. Förmågan att stödja den enskilde i att söka, tolka och värdera information är inte integrerad i professionell praktik för de yrkesgrupper som dagligen möter behovet. Konsekvensen blir att den enskilde får olika svar beroende på vem som råkar svara, och att kompetensen är beroende av enskild personals intresse snarare än av yrkesutövning. EU:s AI-förordning ställer från 2025 krav på AI-kunnighet hos personal som hanterar AI-system. Motsvarande krav saknas för de professioner som ska hjälpa befolkningen att förstå och navigera samma system."}, {"tax_huvusektion": "Bildning, egenmakt och delaktighet", "tax_huvudsektion_beskrivning": "Det allmännas ansvar att upprätthålla förutsättningarna för att den enskilde ska kunna förstå, agera och delta i en digitaliserad välfärdsstat.", "tax_kat": "3.2 Egenmakt och samhällsförståelse", "taxonomi_id": "3.2.1", "kategori": "Medborgerlig kompetens", "situation_exempel": "Jag tycker det är svårt att veta vilken offentlig aktör som ansvarar för vad.", "radgivning_enskild": "Folkbildningens aktörer – tio studieförbund och cirka 150 folkhögskolor – erbjuder kurser om samhälle, demokrati och medborgarkunskap<br>Folkbiblioteken som bildningsarena<br>Kommunal vuxenutbildning (komvux)<br>Universitet och högskolor (öppna föreläsningar, fristående kurser)<br>Civilsamhället (intresseföreningar, trossamfund och idéburna organisationer)", "radgivning_utforare": "Skolverket (läroplaner och formell utbildning)<br>Folkbildningsrådet (folkbildningens villkor och utveckling)<br>Universitetskanslersämbetet (högre utbildning)<br>Mediemyndigheten (samhällsorientering kopplat till MIK)<br>Sveriges Kommuner och Regioner (vuxenutbildning och kommunal bildningsverksamhet)", "tvist": "", "tillsynsmyndighet": "Skolverket ansvarar för grundskolans och gymnasiets läroplaner där samhällskunskap och demokratifostran ingår. Universitetskanslersämbetet kvalitetssäkrar högre utbildning. Folkbildningsrådet prövar och följer upp fördelningen av statsbidrag till tio studieförbund och cirka 150 folkhögskolor som tillsammans bedriver verksamhet om demokrati, samhälle och medborgarkunskap över hela landet. Kommunerna ansvarar för vuxenutbildningen. Ingen myndighet har ett sammanhållet uppdrag att säkerställa att hela befolkningen – särskilt vuxna utanför formell utbildning – får möjlighet att bygga och underhålla medborgerlig kompetens som livslångt lärande.", "lagstod": "**Regeringsformen (1974:152)** 1 kap. 1 § anger att all offentlig makt i Sverige utgår från folket. 1 kap. 2 § anger att det allmänna ska verka för att alla människor ska kunna uppnå delaktighet och jämlikhet i samhället.<br>**Skollagen (2010:800)** 1 kap. 4 § anger att utbildningen ska förmedla och förankra respekt för de mänskliga rättigheterna och de grundläggande demokratiska värderingar som det svenska samhället vilar på. Skollagen reglerar formell utbildning men inte vuxnas livslånga lärande utanför utbildningssystemet.<br>**Förordning (2015:218) om statsbidrag till folkbildningen** 1 § anger att syftet med statens stöd till folkbildningen är att stödja verksamhet som bidrar till att stärka och utveckla demokratin, göra det möjligt för en ökad mångfald människor att påverka sin livssituation och skapa engagemang att delta i samhällsutvecklingen.<br>**Europeiska unionens rekommendation om nyckelkompetenser för livslångt lärande (2018/C 189/01)** identifierar åtta nyckelkompetenser som alla individer behöver för personlig utveckling, sysselsättningsbarhet, social inkludering, hållbar livsstil, framgångsrikt liv i fredliga samhällen, hälsomedveten livsföring och aktivt medborgarskap. Nyckelkompetens 6 – medborgerlig kompetens – definieras som förmågan att agera som ansvarsfull medborgare och delta fullt ut i medborgerligt och socialt liv, baserat på förståelse av sociala, ekonomiska, juridiska och politiska begrepp och strukturer samt globala skeenden och hållbarhet. Kompetensen vilar på kunskap om grundläggande begrepp och fenomen som rör individer, grupper, organisationer, samhälle, ekonomi och kultur, samt på förståelse av europeiska gemensamma värden såsom de uttrycks i artikel 2 i EU-fördraget – människans värdighet, frihet, demokrati, jämlikhet, rättsstatsprincipen och respekt för mänskliga rättigheter inbegripet rättigheter för personer som tillhör minoriteter – och i EU:s stadga om de grundläggande rättigheterna. Rekommendationen uppmanar medlemsstaterna att främja utveckling av alla åtta nyckelkompetenser i ett livslångt lärandeperspektiv.", "lucka_status": "Nej", "empirisk_kalla": "Europeiska unionens råd (2018) Rådets rekommendation av den 22 maj 2018 om nyckelkompetenser för livslångt lärande (2018/C 189/01)::Medborgerlig kompetens är förmågan att agera som ansvarsfull medborgare och delta fullt ut i medborgerligt och socialt liv, baserat på förståelse av sociala, ekonomiska, juridiska och politiska begrepp och strukturer samt globala skeenden och hållbarhet. Kompetensen vilar på kunskap om grundläggande begrepp och fenomen som rör individer, grupper, organisationer, samhälle, ekonomi och kultur. Den involverar förståelse av europeiska gemensamma värden, kunskap om samtida händelser samt kritisk förståelse av de huvudsakliga utvecklingarna i nationell, europeisk och världshistoria. Medlemsstater uppmanas att främja utveckling av nyckelkompetenser i ett livslångt lärandeperspektiv från tidig barndom genom hela vuxenlivet, och genom formellt, icke-formellt och informellt lärande i alla sammanhang. | Forbrukerrådet (2026) Breaking free. Pathways to a fair technological future::Maktasymmetrin mellan konsumenter och digitala tjänsteleverantörer leder till en situation där konsumenter är hänvisade till att använda digitala produkter och tjänster på det sätt leverantören förhandsgodkänt, medan leverantören kan justera produkten eller tjänsten för sina egna syften (s. 25). | Digg/PTS (2026) Redovisning av uppdraget att stödja genomförandet av Sveriges Digitaliseringsstrategi::Statsbidragen till folkhögskolor och studieförbund har minskat kraftigt trots att behoven är desamma (s. 14).", "beskrivning": "Förmågan att förstå sina rättigheter, demokratiska processer och samhällets strukturer är en förutsättning för att kunna agera som rättighetsbärare. EU har identifierat medborgerlig kompetens som en av åtta nyckelkompetenser för livslångt lärande (2018/C 189/01). I en digitaliserad välfärdsstat omfattar kompetensen också förståelse av automatiserade beslutsprocesser, digitala förvaltningsstrukturer och hur offentlig information görs tillgänglig. Det allmänna har ansvar för att möjliggöra denna förståelse.", "lankar": ["https://eur-lex.europa.eu/legal-content/SV/TXT/?uri=CELEX:32018H0604(01)", "https://www.forbrukerradet.no/wp-content/uploads/2026/02/breakingfreepathwaystoafairtechnologicalfuture.pdf", "https://www.digg.se/download/18.4d9d13fe19c34cfab85e4b/1772203531877/Rapport-Uppf%C3%B6ljning-av-digitaliseringsstrategin-feb-2026.pdf"], "tillsynsskydd_finns": "Medborgerlig kompetens byggs i grundskola och gymnasium genom samhällskunskap och demokratifostran, och i högre utbildning för dem som studerar vidare. Utanför formell utbildning är vuxna hänvisade till folkbildningen, civilsamhället eller egen kompetensutveckling. Folkbildningen bär ett centralt uppdrag att stärka demokratin och möjliggöra medborgarens deltagande i samhällsutvecklingen, men statsbidragen till studieförbund och folkhögskolor har minskat kraftigt över tid trots att behoven är desamma. I den digitaliserade välfärdsstaten ökar dessutom kraven på medborgerlig kompetens – aktörsbilden är fragmenterad, beslut fattas med stöd av automatisering, gränsen mellan offentligt och privat suddas ut – samtidigt som maktasymmetrin mellan medborgaren och digitala system gör att rättigheter blir svårare att utöva utan systemförståelse. Medborgerlig kompetens måste därför kompletteras med medie- och informationskunnighet (3.2.2) och digital kompetens (3.2.3) för att medborgaren ska kunna agera som rättighetsbärare. Sverige saknar idag en sammanhållen strategi för hur denna utvidgade medborgerliga kompetens ska byggas och underhållas hos befolkningen genom hela livet."}, {"tax_huvusektion": "Bildning, egenmakt och delaktighet", "tax_huvudsektion_beskrivning": "Det allmännas ansvar att upprätthålla förutsättningarna för att den enskilde ska kunna förstå, agera och delta i en digitaliserad välfärdsstat.", "tax_kat": "3.2 Egenmakt och samhällsförståelse", "taxonomi_id": "3.2.2", "kategori": "Medie- och informationskunnighet (MIK)", "situation_exempel": "Min släkting delar saker som inte stämmer. Hur vet man vad som är sant?", "radgivning_enskild": "Mediemyndighetens kostnadsfria webbutbildning Mediemedveten.se<br>Folkbiblioteken (källkritik och digital vägledning)<br>Folkbildningens aktörer – studieförbund och folkhögskolor (kurser i källkritik och mediekunskap)<br>Kommunal vuxenutbildning<br>Mediemyndighetens kunskapsbank MIK Sverige", "radgivning_utforare": "Mediemyndigheten (samordnar MIK Sverige, kunskapsbank och nationell utbildningssatsning)<br>Digiteket (fortbildning inom bibliotekssektorn)<br>Skolverket (läroplaner)<br>Folkbildningsrådet (folkbildningens kompetensutveckling)", "tvist": "", "tillsynsmyndighet": "Mediemyndigheten har i uppgift att verka för medie- och informationskunnighet och samordnar det nationella nätverket MIK Sverige, som etablerades 2020 och samlar ett tjugotal myndigheter och organisationer. Myndigheten förvaltar MIK Sveriges kunskapsbank och genomförde 2024–2026 en nationell utbildningssatsning riktad till befolkningen. Skolverket ansvarar för MIK i läroplanerna. Folkbildningsrådet och Kungliga biblioteket ingår i nätverkets råd. Myndigheten för psykologiskt försvar arbetar mot otillbörlig informationspåverkan från främmande makt, inte mot inhemsk desinformation eller den enskildes vardagliga källkritik. Samordningen finns på plats, men den nationella satsningen genomförs som tidsbegränsade regeringsuppdrag snarare än som en permanent struktur för befolkningens livslånga lärande. Digg/PTS konstaterar att det i dag saknas en tydligt utpekad aktör med samlat och långsiktigt ansvar för att informera allmänheten om säkerhet på nätet.", "lagstod": "**Regeringsformen (1974:152)** 1 kap. 2 § anger att det allmänna ska verka för att alla människor ska kunna uppnå delaktighet och jämlikhet i samhället.<br>**Skollagen (2010:800)** 1 kap. 4 § anger att utbildningen ska ge eleverna kunskaper och förmågor att kritiskt granska information. MIK ingår i läroplanerna men styr inte vuxnas livslånga lärande utanför skolsystemet.<br>**Förordning (2015:218) om statsbidrag till folkbildningen** 1 § anger att statens stöd ska stärka och utveckla demokratin och bredda delaktigheten i samhällsutvecklingen.<br>**Direktiv (EU) 2018/1808 om audiovisuella medietjänster** artikel 33a ålägger medlemsstaterna att främja och vidta åtgärder för utveckling av medie- och informationskunnighet samt att regelbundet rapportera om dessa till kommissionen.<br>**Europeiska unionens rekommendation om nyckelkompetenser för livslångt lärande (2018/C 189/01)** identifierar både läs- och skrivkunnighet och digital kompetens som nyckelkompetenser, vilka inrymmer förmågan att söka, kritiskt värdera och ansvarsfullt använda information.", "lucka_status": "Nej", "empirisk_kalla": "UNESCO (2021) Think Critically, Click Wisely! Media & Information Literacy Curriculum for Educators & Learners. Paris::MIK omfattar de kunskaper, färdigheter och attityder som krävs för att söka, kritiskt värdera, använda och bidra med information och medieinnehåll på ett klokt sätt. Curriculet är utformat för livslångt lärande och riktar sig till både pedagoger och lärande [PARAFRAS – verifiera mot curriculet]. | Carlsson, U. (red.) (2018) Medie- och informationskunnighet (MIK) i den digitala tidsåldern – En demokratifråga. Nordicom::MIK är en förutsättning för demokratiskt deltagande och medborgarskap i det digitala samhället. Folkbiblioteken utgör naturliga arenor för att understödja invånarnas medie- och informationskunnighet (s. 83). | Brottsförebyggande rådet (2025) Nationella trygghetsundersökningen 2025::39 procent uppger att de ganska eller mycket ofta oroat sig för att utsättas för bedrägerier på internet, och utvecklingen visar en ökande trend. | SCB (2025) Generativa AI-verktyg tar plats i svensk vardag::Under mars–juni 2025 använde 37 procent av personer 16 år och äldre generativa AI-tjänster. I åldern 16–24 år var andelen 67 procent.", "beskrivning": "Förmågan att söka, värdera och kritiskt förhålla sig till information är förutsättning för demokratisk delaktighet. Unescos ramverk för medie- och informationskunnighet identifierar de förmågor som krävs för att orientera sig i digitalt medierade informationsmiljöer. Insatser för att stärka befolkningens motståndskraft mot otillbörlig informationspåverkan, vilseledande designmönster och digitala bedrägerier behöver vara nationellt samordnade och organisatoriskt förankrade (se 3.3.3 och 3.1.2).", "lankar": ["https://unesdoc.unesco.org/ark:/48223/pf0000377068", "https://mediemyndigheten.se/medie-och-informationskunnighet-mik/", "https://www.regeringen.se/pressmeddelanden/2024/03/mediemyndigheten-ges-i-uppdrag-att-genomfora-nationell-satsning-for-starkt-medie--och-informationskunnighet-inom-ai-driven-desinformation/"], "tillsynsskydd_finns": "MIK byggs i grundskola och gymnasium genom källkritik och mediekunskap i läroplanerna. Utanför skolsystemet är vuxna hänvisade till folkbildning, bibliotek, Mediemyndighetens öppna resurser eller egen kompetensutveckling. MIK och digital kompetens överlappar: i EU:s ramverk DigComp 3.0 ligger MIK-förmågorna i kompetensområde 1 (söka, värdera och hantera information), och kompetens 1.2 har i den senaste versionen utvidgats från att bedöma källors relevans till att kritiskt granska källor, innehåll och de processer som genererat informationen – en direkt följd av AI-systemens spridning. MIK kompletterar därmed medborgerlig kompetens (3.2.1) och digital kompetens (3.2.3) som en av de förmågor den enskilde behöver för att agera som rättighetsbärare. Samtidigt ökar kraven snabbt: AI används för att framställa och sprida vilseledande innehåll, otillbörlig informationspåverkan riktas mot befolkningen, och vilseledande designmönster utnyttjar bristande kunskap. Mediemyndigheten samordnar och genomför nationella satsningar, men dessa drivs som tidsbegränsade uppdrag. Sverige saknar idag en sammanhållen och varaktigt finansierad struktur för hur MIK ska byggas och underhållas hos hela befolkningen genom livet."}, {"tax_huvusektion": "Bildning, egenmakt och delaktighet", "tax_huvudsektion_beskrivning": "Det allmännas ansvar att upprätthålla förutsättningarna för att den enskilde ska kunna förstå, agera och delta i en digitaliserad välfärdsstat.", "tax_kat": "3.2 Egenmakt och samhällsförståelse", "taxonomi_id": "3.2.3", "kategori": "Digital kompetens", "situation_exempel": "Alla pratar om digital kompetens, men menar olika saker. Jag vet inte vad jag faktiskt behöver kunna.", "radgivning_enskild": "Biblioteket (lokal vägledning, ej utifrån gemensam referensram)<br>Folkbildningens aktörer – studieförbund och folkhögskolor (kurser i olika moment eller verktug inom digital kompetens)<br>Kommunal vuxenutbildning<br>Arbetsförmedlingen (kompetensstöd, ej strukturerat efter DigComp)", "radgivning_utforare": "Digg (digitaliseringspolitik och samordning)<br>Post- och telestyrelsen (samordningsuppdrag digital inkludering)<br>Skolverket (formell utbildning och läroplaner)<br>Folkbildningsrådet (folkbildningens kompetensutveckling)", "tvist": "", "tillsynsmyndighet": "Digg ansvarar för digitaliseringspolitik och samordning men har inte tillsyn över kompetensinsatsers samstämmighet eller kvalitet. Skolverket ansvarar för digital kompetens i den formella utbildningen. Post- och telestyrelsen har sedan 2026 ett samordningsuppdrag inom digital inkludering. En gemensam referensram för digital kompetens finns på EU-nivå i DigComp 3.0, men är inte nationellt översatt och kontextualiserad. Ingen myndighet har ett sammanhållet uppdrag att tillhandahålla en sådan referensram – en struktur och ett gemensamt språk som gör det möjligt att beskriva, systematisera och bygga vidare på lärande inom utbildning, folkbildning, omsorg och arbetsmarknad.", "lagstod": "**Regeringsformen (1974:152)** 1 kap. 2 § anger att det allmänna ska verka för att alla människor ska kunna uppnå delaktighet och jämlikhet i samhället.<br>**Skollagen (2010:800)** 1 kap. 4 § anger att utbildningen ska förmedla kunskaper och färdigheter som eleverna behöver för att kunna verka i samhället. Digital kompetens ingår i läroplanerna men styr inte vuxnas livslånga lärande utanför skolsystemet.<br>**Bibliotekslagen (2013:801)** 7 § anger att folkbiblioteken ska verka för att öka kunskapen om hur informationsteknik kan användas för kunskapsinhämtning, lärande och delaktighet i kulturlivet.<br>**Förordning (2015:218) om statsbidrag till folkbildningen** 1 § anger att statens stöd ska stärka och utveckla demokratin och bredda delaktigheten i samhällsutvecklingen.<br>**Europeiska unionens rekommendation om nyckelkompetenser för livslångt lärande (2018/C 189/01)** identifierar digital kompetens som en av åtta nyckelkompetenser och definierar den som säker, kritisk och ansvarsfull användning av och samverkan med digital teknik för lärande, arbete och deltagande i samhället. Rekommendationen uppmanar medlemsstaterna att främja utveckling av nyckelkompetenser i ett livslångt lärandeperspektiv.", "lucka_status": "Nej", "empirisk_kalla": "Cosgrove, J. & Cachia, R. (2025) DigComp 3.0: European Digital Competence Framework – Fifth Edition. Publications Office of the European Union, Luxembourg::Ramverket beskriver 21 kompetenser inom fem områden, med 523 lärandemål, i fyra färdighetsnivåer (grundläggande, mellannivå, avancerad och mycket avancerad) och tre dimensioner (kunskaper, färdigheter och attityder). DigComp används i EU som gemensam referensram för att beskriva, strukturera och bygga vidare på digital kompetens i utbildning, folkbildning och arbetsliv. | Sveriges digitaliseringsstrategi 2025–2030::Strategin definierar digital bas-, bredd- och spetskompetens. Digital baskompetens innebär grundläggande digitala färdigheter, dvs. förmåga att använda digitala verktyg för exempelvis kommunikation och samarbete, säkerhet eller problemlösning. Digital breddkompetens innebär en generell digital kompetens, dvs. förmåga att hantera det växande antal system och applikationer som krävs för att utföra olika arbetsuppgifter. Digital spetskompetens inbegriper specialistkompetens inom exempelvis AI, programmering och cybersäkerhet (s. 9). | Digg/PTS (2026) Redovisning av uppdraget att stödja genomförandet av Sveriges Digitaliseringsstrategi::Indikatorerna följer DigComp 3.0 för bas- och breddkompetens i befolkningen, ICILS för elever i årskurs 8 och andelen ICT-specialister för spetskompetens (s. 5–8). Strategins indelning i bas-, bredd- och spetskompetens är en egen svensk modell och inte detsamma som DigComp 3.0:s färdighetsnivåer; de båda modellerna beskriver digital kompetens utifrån olika syften.", "beskrivning": "Förmågan att navigera, kommunicera och agera i digitala miljöer är förutsättning för delaktighet i en digitaliserad välfärdsstat. Digital kompetens är en av EU:s åtta nyckelkompetenser och operationaliseras i ramverket DigComp 3.0, som beskriver kompetensen i mätbara nivåer och dimensioner och omfattar även AI-relaterade förmågor. En nationell översättning och kontextualisering är förutsättning för att digital kompetens ska kunna struktureras, beskrivas med ett gemensamt språk och systematiseras i insatser inom utbildning, folkbildning, omsorg och arbetsmarknad.", "lankar": ["https://publications.jrc.ec.europa.eu/repository/handle/JRC144121", "https://www.digitalaustria.gv.at/en/digital-skills/austrian-model-for-digital-competence.html", "https://www.regeringen.se/contentassets/fe3e296228fb474f803a986ae3842b4c/sveriges-digitaliseringsstrategi-20252030.pdf", "https://www.digg.se/download/18.4d9d13fe19c34cfab85e4a/1772203531748/Rapportbilaga-feb-2026-Uppf%C3%B6ljning-av-digitaliseringsstrategin.pdf"], "tillsynsskydd_finns": "Digital kompetens är ett stort och svåröverskådligt kunskapsområde som beskrivs på olika sätt av olika aktörer. Utan en gemensam referensram blir det svårt att tala om kompetensen med ett gemensamt språk, att avgöra vad som ingår och att systematisera lärande mellan utbildning, folkbildning, omsorg och arbetsmarknad. EU:s ramverk DigComp 3.0 erbjuder en sådan struktur – det beskriver kompetensen i 21 kompetenser inom fem områden, i fyra nivåer (grundläggande, mellannivå, avancerad och mycket avancerad) och tre dimensioner (kunskaper, färdigheter och attityder), och omfattar även AI-relaterade förmågor. Ramverket är etablerat i flera EU-länder; Österrike har en nationell anpassning (DigComp 2.3 AT) med ett tillagt grundläggande kompetensområde. Sverige har ännu inte en nationell översättning och kontextualisering som gör det möjligt att arbeta systematiskt med digital kompetens utanför det formella utbildningssystemet, men ett öppet initiativ för att översätta DigComp 3.0 till svenska har startat. Digital kompetens kompletterar medborgerlig kompetens (3.2.1) och medie- och informationskunnighet (3.2.2) som en av de förmågor den enskilde behöver för att agera som rättighetsbärare i en digitaliserad välfärdsstat."}, {"tax_huvusektion": "Bildning, egenmakt och delaktighet", "tax_huvudsektion_beskrivning": "Det allmännas ansvar att upprätthålla förutsättningarna för att den enskilde ska kunna förstå, agera och delta i en digitaliserad välfärdsstat.", "tax_kat": "3.3 Inflytande och demokratisk insyn", "taxonomi_id": "3.3.1", "kategori": "Osynliga rättigheter", "situation_exempel": "Jag visste inte att jag hade rätt till hjälp eller analogt alternativ – ingen informerade mig.", "radgivning_enskild": "Den aktuella myndigheten (information om stöd och alternativa kontaktvägar)<br>Servicekontor (Statens servicecenter)<br>Biblioteket (lokal vägledning och hänvisning)", "radgivning_utforare": "Den aktuella myndigheten (serviceskyldighet enligt förvaltningslagen 6 §)<br>Statens servicecenter (vägledning om alternativa kontaktvägar)<br>Kommunal konsumentvägledning (där den finns)", "tvist": "", "tillsynsmyndighet": "Den aktuella myndigheten ansvarar enligt förvaltningslagen 6 § för att lämna den enskilde sådan hjälp att hen kan ta till vara sina intressen, vilket inbegriper att informera om stöd och alternativa kontaktvägar. Justitieombudsmannen kan granska enskilda fall men kan inte utöva systemtillsyn eller fatta bindande beslut. Ingen myndighet har systemtillsyn över att det allmänna aktivt och systematiskt informerar om rättigheter till stöd och alternativa kontaktvägar.", "lagstod": "**Regeringsformen (1974:152)** 1 kap. 2 § anger att det allmänna ska verka för att alla människor ska kunna uppnå delaktighet och jämlikhet i samhället.<br>**Förvaltningslagen (2017:900)** 6 § anger att en myndighet ska se till att kontakterna med enskilda blir smidiga och enkla, och lämna den enskilde sådan hjälp att hen kan ta till vara sina intressen. 7 § anger att en myndighet ska vara tillgänglig för kontakter med enskilda.", "lucka_status": "Nej", "empirisk_kalla": "Institutet för mänskliga rättigheter (2023) Kännedom om och upplevelser av mänskliga rättigheter i Sverige 2022–2023::Bara 4 % känner sig helt säkra på vart de kan vända sig vid rättighetskränkning. 35 % vet inte alls. Av dem som upplevt kränkningar men inte vänt sig någonstans anger 47 % att de inte vet hur (s. 14–15). | Skallerud, Jørgensen & Karlsson (2024) Exploring Human Rights Awareness, Attitudes and Perception in Scandinavia::35 % av svenskarna kan inte nämna en enda specifik mänsklig rättighet. Medvetenheten om ekonomiska och sociala rättigheter (social trygghet 50 %, bostad 54 %, hälsa 55 %) är markant lägre än om medborgerliga rättigheter (yttrandefrihet 94 %) (s. 14). | Institutet för mänskliga rättigheter (2024) Allt ifrågasätts::36 % av personer med funktionsnedsättning vet vart de kan vända sig om rättigheter inte efterlevs. Många beskriver upplevelser av att känna sig misstrodda och som en belastning vid försök att utkräva sina rättigheter. | Riksrevisionen (2021) RiR 2021:8 Var god dröj, myndigheterna digitaliserar – service till enskilda som inte kan eller vill vara digitala::Bara ett fåtal av 22 granskade myndigheter har en tydlig bild av enskildas behov av alternativ till digital service. Utan sådan kunskap kan myndigheten inte aktivt informera om rätten till hjälp eller alternativa kontaktvägar (s. 32–33). | FN:s funktionsrättskommitté (2024) CRPD/C/SWE/CO/2–3, punkt 9c::Det saknas tillräckliga klagomålsmekanismer för enskilda när kommuner och regioner brister.", "beskrivning": "Det allmänna har ansvar att systematiskt informera om vilka rättigheter till stöd, vägledning och alternativa kontaktvägar som finns. Rättigheter som inte är kända kan inte utövas. Se även 1.6.3 om respektive aktörs ansvar att kommunicera rättigheter.", "lankar": ["https://mrinstitutet.se/vara--publikationer/rapporter/rapporter/2023-11-23-kannedom-om-och-upplevelser-av-manskliga-rattigheter-i-sverige-2022-2023", "https://mrinstitutet.se/vara--publikationer/rapporter/rapporter/2024-12-09-exploring-human-rights-awareness-attitudes-and-perception-in-scandinavia", "https://mrinstitutet.se/vara--publikationer/rapporter/rapporter/2024-09-04-allt-ifragasatts", "https://www.riksrevisionen.se/granskningar/granskningsrapporter/2021/var-god-droj-myndigheterna-digitaliserar---service-till-enskilda-som-inte-kan-eller-vill-vara-digitala.html"], "tillsynsskydd_finns": "Förvaltningslagen 6 § ger den enskilde rätt till hjälp att ta till vara sina intressen, men ingen systemtillsyn säkerställer att myndigheter aktivt och systematiskt informerar om den rätten eller om alternativa kontaktvägar. Rättigheter som inte är kända kan inte utövas. FN:s funktionsrättskommitté konstaterar att det saknas tillräckliga klagomålsmekanismer för enskilda när kommuner och regioner brister."}, {"tax_huvusektion": "Bildning, egenmakt och delaktighet", "tax_huvudsektion_beskrivning": "Det allmännas ansvar att upprätthålla förutsättningarna för att den enskilde ska kunna förstå, agera och delta i en digitaliserad välfärdsstat.", "tax_kat": "3.3 Inflytande och demokratisk insyn", "taxonomi_id": "3.3.2", "kategori": "Inflytande över digitala samhällsfunktioner", "situation_exempel": "Kommunen införde ett nytt digitalt system som jag måste använda, men ingen frågade oss som faktiskt berörs.", "radgivning_enskild": "Kommunens synpunkts- och klagomålshantering<br>Medborgarförslag eller motsvarande lokal påverkanskanal (där den finns)<br>Funktionsrätts- och brukarorganisationer (kollektiv röst i samråd)", "radgivning_utforare": "Digg (vägledning för användarcentrerad och behovsdriven utveckling av digital förvaltning)<br>Myndigheten för delaktighet (kunskapsstöd om delaktighet och tillgänglighet)<br>Sveriges Kommuner och Regioner (Delaktighetstrappan och metodstöd för medborgardialog)<br>Funktionsrätts- och brukarorganisationer (samrådspart enligt CRPD art. 4.3)", "tvist": "", "tillsynsmyndighet": "Digg ansvarar för att stödja och samordna den offentliga förvaltningens digitalisering och vägleder om användarcentrerad utveckling, men har inte tillsyn över att medborgare och civilsamhälle faktiskt involveras i utformningen av digitala samhällsfunktioner. Myndigheten för delaktighet bidrar med kunskapsstöd men har inget tillsynsmandat. Justitieombudsmannen kan granska enskilda fall men kan inte utöva systemtillsyn eller fatta bindande beslut. FN:s funktionsrättskonvention (CRPD) art. 4.3 kräver att personer med funktionsnedsättning aktivt involveras i beslut som rör dem, men ingen svensk myndighet har ett uttalat ansvar för att säkerställa att detta sker vid utformningen av digitala samhällsfunktioner.", "lagstod": "**Regeringsformen (1974:152)** 1 kap. 1 § anger att all offentlig makt i Sverige utgår från folket. 1 kap. 2 § anger att det allmänna ska verka för att alla människor ska kunna uppnå delaktighet och jämlikhet i samhället.<br>**Kommunallagen (2017:725)** 5 kap. reglerar fullmäktiges arbete med bland annat medborgarförslag och beslut om verksamhet, vilket utgör den formella ramen för medborgerligt inflytande på kommunal nivå.<br>**Förvaltningslagen (2017:900)** 6 § anger att en myndighet ska se till att kontakterna med enskilda blir smidiga och enkla, och lämna den enskilde sådan hjälp att hen kan ta till vara sina intressen. 7 § anger att en myndighet ska vara tillgänglig för kontakter med enskilda.<br>**FN:s konvention om rättigheter för personer med funktionsnedsättning (CRPD)** artikel 4.3 anger att konventionsstaterna i beslutsfattande som rör personer med funktionsnedsättning aktivt ska samråda med och involvera dessa personer genom de organisationer som företräder dem. Konventionen är folkrättsligt bindande för Sverige men är inte inkorporerad som svensk lag och kan därför inte åberopas direkt av enskilda inför domstol eller myndighet.", "lucka_status": "Nej", "empirisk_kalla": "Riksrevisionen (2025) RiR 2025:8::Av 1 094 strategiska digitaliseringsprojekt saknar medborgarna inflytande över utformningen. Nyttorealisering sker inte systematiskt, kostnadsnyttoanalyser inkluderar sällan medborgarnyttor, och två tredjedelar av myndigheterna arbetar inte systematiskt med nyttorealisering (s. 26–50). | Digg/PTS (2026) Redovisning av uppdraget att stödja genomförandet av Sveriges Digitaliseringsstrategi::Riksrevisionen bedömer att myndigheterna inte involverar användare i tillräcklig utsträckning vid utveckling av digitala tjänster, och bara ett fåtal arbetar systematiskt med användarinvolvering. 88 procent av statliga myndigheter involverar målgrupper i någon utsträckning, men bara en dryg femtedel av kommunerna följer regelbundet upp enkelheten i digitala tjänster. 15 procent av kommunerna saknar helt rutiner för att samla in eller använda återkoppling från användare (s. 35). | Feenberg, A. (1992) Subversive Rationalization: Technology, Power and Democracy. Inquiry 35(3/4)::Technology is one of the major sources of public power in modern societies. So far as decisions affecting our daily lives are concerned, political democracy is largely overshadowed by the enormous power wielded by the masters of technical systems (s. 301). | Raymond, T. (2024) Digital delaktighet. Digitalisering som inte lämnar någon utanför. Region Västernorrland/Digidel::Samhällets feedback-loop innehåller viktiga indikatorer på digitala samhällshinder som annars ger upphov till fördyrande dubbelarbete (s. 52–65).", "beskrivning": "Den enskilde och civilsamhället behöver ha systematiska möjligheter att påverka hur digitala samhällsfunktioner utformas. Aktiv involvering i utformningen av digitala samhällsfunktioner är en konventionsförpliktelse, inte en kvalitetsambition.", "lankar": ["https://www.riksrevisionen.se/download/18.572f3faf1966b8b95936aea/1746452855623/RiR-2025-8-rapport.pdf", "https://www.digg.se/download/18.4d9d13fe19c34cfab85e4a/1772203531748/Rapportbilaga-feb-2026-Uppf%C3%B6ljning-av-digitaliseringsstrategin.pdf", "https://www.rvn.se/contentassets/8acb7d26c2754f148a1de07e95b4675f/digital-delaktighet-rapport-rvn-digidel-240530.pdf"], "tillsynsskydd_finns": "Digitala samhällsfunktioner utformas i hög grad utan att de som berörs har inflytande över utformningen. Teknik är en form av offentlig makt: besluten om hur system, gränssnitt och processer utformas påverkar människors vardag minst lika mycket som formella politiska beslut, men fattas i praktiken av dem som styr de tekniska systemen. Utan systematiska kanaler för inflytande blir medborgaren och civilsamhället mottagare av färdiga lösningar snarare än delaktiga i deras utformning. Aktiv involvering finns där som metodambition och kvalitetsfaktor, men inte som en garanterad rättighet med någon som har ansvar att säkerställa den. För personer med funktionsnedsättning är involvering dessutom en konventionsförpliktelse enligt CRPD art. 4.3, men förpliktelsen är inte omsatt i ett konkret nationellt ansvar vid digitalisering."}, {"tax_huvusektion": "Bildning, egenmakt och delaktighet", "tax_huvudsektion_beskrivning": "Det allmännas ansvar att upprätthålla förutsättningarna för att den enskilde ska kunna förstå, agera och delta i en digitaliserad välfärdsstat.", "tax_kat": "3.3 Inflytande och demokratisk insyn", "taxonomi_id": "3.3.3", "kategori": "Skydd mot otillbörlig informationspåverkan", "situation_exempel": "Det cirkulerar organiserade desinformationskampanjer på nätet. Vem har ansvar för att möta dem?", "radgivning_enskild": "Mediemyndigheten (resurser för källkritik och att känna igen vilseledande innehåll)<br>Plattformarnas anmälningsfunktioner för olagligt innehåll (rättighet enligt EU:s förordning om digitala tjänster)<br>Se 3.2.2 om att stärka den egna medie- och informationskunnigheten", "radgivning_utforare": "Myndigheten för psykologiskt försvar (samordnar arbetet mot otillbörlig informationspåverkan från utländska aktörer)<br>Myndigheten för samhällsskydd och beredskap (civil beredskap och totalförsvar)<br>Valmyndigheten och länsstyrelserna (valprocessens integritet)<br>Mediemyndigheten (mediestöd och samordning av MIK Sverige)", "tvist": "", "tillsynsmyndighet": "Myndigheten för psykologiskt försvar identifierar, analyserar och möter otillbörlig informationspåverkan från utländska aktörer, men har inte mandat över inhemsk desinformation. Myndigheten för samhällsskydd och beredskap ansvarar för civil beredskap och totalförsvarets civila del. Valmyndigheten och länsstyrelserna ansvarar för valprocessens genomförande. Mediemyndigheten fördelar mediestöd och samordnar MIK Sverige. Leverantörer av mycket stora onlineplattformar är enligt EU:s förordning om digitala tjänster skyldiga att bedöma och begränsa systemrisker som rör negativa effekter på samhällsdebatt och valprocesser. Ansvaret är fördelat på flera aktörer utifrån typ av hot och kanal. Otillbörlig informationspåverkan från utländska aktörer hanteras av Myndigheten för psykologiskt försvar, men inhemsk desinformation som inte kan kopplas till en utländsk antagonist saknar en utpekad ansvarig myndighet. Ingen aktör har ett samlat uppdrag att upprätthålla motståndskraft mot otillbörlig informationspåverkan i hela bredden – från utländska operationer till inhemsk desinformation och plattformarnas spridningsmekanismer.", "lagstod": "**Regeringsformen (1974:152)** 1 kap. 1 § anger att den svenska folkstyrelsen bygger på fri åsiktsbildning och på allmän och lika rösträtt. 1 kap. 2 § anger att det allmänna ska verka för att alla människor ska kunna uppnå delaktighet i samhället.<br>**Förordning (2021:936) med instruktion för Myndigheten för psykologiskt försvar** 2 § anger att myndigheten särskilt ska identifiera, analysera och kunna lämna stöd i bemötandet av otillbörlig informationspåverkan och annan vilseledande information som riktas mot Sverige eller svenska intressen. Myndigheten ska i sin verksamhet värna det öppna och demokratiska samhället och den fria åsiktsbildningen.<br>**Europaparlamentets och rådets förordning (EU) 2022/2065 om en inre marknad för digitala tjänster (förordningen om digitala tjänster, DSA)** artikel 34 anger att leverantörer av mycket stora onlineplattformar och sökmotorer ska bedöma systemrisker, däribland faktiska eller förutsebara negativa effekter på samhällsdebatten och valprocesser samt den allmänna säkerheten. Artikel 35 anger att de ska vidta rimliga, proportionella och effektiva åtgärder för att begränsa dessa risker.", "lucka_status": "Nej", "empirisk_kalla": "Försvarsberedningen (2023) Kraftsamling – inriktningen av totalförsvaret och utformningen av det civila försvaret::Försvarsberedningen lyfter vikten av att höja kunskapsnivån om medie- och informationskunnighet, källkritik och digital kompetens hos befolkningen som en del av motståndskraften mot otillbörlig informationspåverkan. | Europaparlamentets och rådets förordning (EU) 2022/2065 (förordningen om digitala tjänster)::Skäl 82 anger att en riskkategori rör faktiska eller förutsebara negativa effekter på demokratiska processer, samhällsdebatten och valprocesser samt den allmänna säkerheten. Artikel 34 ålägger mycket stora onlineplattformar att bedöma dessa systemrisker och artikel 35 att vidta åtgärder för att begränsa dem.", "beskrivning": "Otillbörlig informationspåverkan avser vilseledande och manipulativa kommunikationsoperationer från statliga eller icke-statliga aktörer som syftar till att påverka demokratiska processer eller den fria åsiktsbildningen. Det allmänna har ansvar att upprätthålla samordnad beredskap, kunskapsspridning och motståndskraft mot sådana påverkansoperationer. Skyddet förutsätter samverkan mellan beredskapsmyndigheter, valmyndighet, mediestöd och bildningsaktörer. Se även 3.2.2 om individens medie- och informationskunnighet som långsiktig motståndskraft.", "lankar": ["https://www.regeringen.se/rattsliga-dokument/departementsserien-och-promemorior/2023/12/ds-202334/", "https://eur-lex.europa.eu/legal-content/SV/TXT/?uri=CELEX:32022R2065", "https://www.mpf.se/"], "tillsynsskydd_finns": "Skyddet mot otillbörlig informationspåverkan är uppdelat efter hottyp och kanal. Försvaret mot påverkansoperationer från utländska aktörer är samlat hos Myndigheten för psykologiskt försvar, medan ansvaret för valprocessens integritet, mediestöd och befolkningens motståndskraft ligger hos olika aktörer. Inhemsk desinformation som inte kan kopplas till en utländsk antagonist saknar en utpekad ansvarig myndighet. EU:s förordning om digitala tjänster lägger ett nytt ansvar på de största plattformarna att bedöma och begränsa systemrisker som rör samhällsdebatt och valprocesser, men tillsynen är gränsöverskridande och effekten för svenska förhållanden är ännu oprövad. Samhällets samlade motståndskraft vilar därmed på att individens egen förmåga att känna igen och värdera information (3.2.2) byggs parallellt med samhällets beredskapsstrukturer. Utan båda delarna blir skyddet ofullständigt."}, {"tax_huvusektion": "Bildning, egenmakt och delaktighet", "tax_huvudsektion_beskrivning": "Det allmännas ansvar att upprätthålla förutsättningarna för att den enskilde ska kunna förstå, agera och delta i en digitaliserad välfärdsstat.", "tax_kat": "3.3 Inflytande och demokratisk insyn", "taxonomi_id": "3.3.4", "kategori": "Institutionellt minne", "situation_exempel": "Jag vill hitta en rapport som producerades av Digitaliseringsrådet 2021 men deras webbplats är borta. På deras domännam ligger slaskreklam nu.", "radgivning_enskild": "Resp. myndighet (begära allmän handling, TF 2 kap.)", "radgivning_utforare": "Riksarkivet (digital informationshantering)<br>Digg (ramverk för spårbarhet inom Ena)", "tvist": "", "tillsynsmyndighet": "Riksarkivet (arkivbildning, statliga myndigheter). JO (enskilda fall). Ingen myndighet har systemtillsyn över att digitala beslutsspår bevaras i versionerade och tillgängliga format.", "lagstod": "**Tryckfrihetsförordningen (1949:105)** 2 kap. slår fast offentlighetsprincipen och rätten att ta del av allmänna handlingar.<br>**Arkivlagen (1990:782)** reglerar myndigheternas arkiv och anger att arkiven ska bevaras, hållas ordnade och vårdas så att de tillgodoser rätten att ta del av allmänna handlingar, behovet av information för rättskipning och förvaltning samt forskningens behov.<br>**Förvaltningslagen (2017:900)** 27 § anger att en myndighet som får uppgifter på annat sätt än genom en handling ska anteckna dem om de kan ha betydelse för ett beslut. 31 § anger att det för varje skriftligt beslut ska finnas dokumentation om bland annat beslutsdag och beslutets innehåll.<br>**Regeringsformen (1974:152)** 1 kap. 1 § anger att den svenska folkstyrelsen bygger på fri åsiktsbildning, vilket förutsätter insyn i och möjlighet att granska det allmännas verksamhet.", "lucka_status": "Delvis", "empirisk_kalla": "Lemne, M. & Ilshammar, L. (2026) \"Sverige håller på att radera sitt demokratiska minne\", Dala-Demokraten, Opinionstext 8 april 2026::Politisk kommunikation i mejl och SMS bevaras inte systematiskt | Riksarkivet (2024) Årsredovisning: det saknas tillräckligt skydd för samhällsviktig information | Johansson, M. (2026) \"Riksarkivet har dragit sig undan ansvaret för digitalt bevarande\", Magasin K::Föreskrifter finns men implementeringen brister | RiR 2025:8 s. 72: myndigheter genomför likartade projekt inom digital arkivering och diarieföring men samverkan understiger 30 procent | Axbom, P. (2024) \"Myndigheters länkröta\", axbom.se::Myndigheters domännamn, rapporter och utredningar försvinner från webben utan att informationen bevaras", "beskrivning": "När myndigheters webbsidor, rapporter, utredningar och beslutsspår inte bevaras raderas det institutionella minnet. Den enskilde förlorar möjligheten att följa beslut, granska utveckling och argumentera utifrån tidigare ställningstaganden. Bristande arkiveringspraktik urholkar samhällets förmåga att förvalta kunskap.", "lankar": [], "tillsynsskydd_finns": "Riksarkivet har tillsynsansvar över arkivbildning men arkivlagen är från 1990 och täcker inte fullt ut den digitala verkligheten. Riksarkivarien har vid upprepade tillfällen efterlyst en moderniserad arkivlag utan resultat. Ingen tillsyn säkerställer att digitala beslutsspår, webbpublicerat material eller beslutsregler versioneras och bevaras i tillgängliga format."}, {"tax_huvusektion": "Bildning, egenmakt och delaktighet", "tax_huvudsektion_beskrivning": "Det allmännas ansvar att upprätthålla förutsättningarna för att den enskilde ska kunna förstå, agera och delta i en digitaliserad välfärdsstat.", "tax_kat": "3.3 Inflytande och demokratisk insyn", "taxonomi_id": "3.3.5", "kategori": "Öppen kunskap och demokratisk insyn", "situation_exempel": "Kommunens digitaliseringsprojekt kostade miljoner men det finns ingen slutrapport, ingen öppen källkod och ingen dokumentation av hur systemen fungerar. Jag som invånare kan inte granska vad jag betalat för.", "radgivning_enskild": "Resp. myndighet (begära allmän handling, TF 2 kap.<br>Kommunens revisorer<br>JO (om insyn nekas)", "radgivning_utforare": "Digg (vägledning om öppna data och Sveriges dataportal)<br>Riksarkivet (informationshantering och bevarande)<br>Sveriges Kommuner och Regioner (stöd till kommuner)", "tvist": "", "tillsynsmyndighet": "Ingen samlad. JO (offentlighetsprincipen, enskilda fall). Digg (öppna data – men vägledning, inte tillsyn). Ingen myndighet har tillsyn över att offentlig digitalisering dokumenteras, delas öppet eller görs granskningsbar.", "lagstod": "**Tryckfrihetsförordningen (1949:105)** 2 kap. slår fast offentlighetsprincipen och rätten att ta del av allmänna handlingar.<br>**Regeringsformen (1974:152)** 1 kap. 1 § anger att all offentlig makt i Sverige utgår från folket.<br>**Lagen (2022:818) om den offentliga sektorns tillgängliggörande av data** genomför EU:s öppna data-direktiv (2019/1024) och anger att data som tillhandahålls ska göras tillgänglig i öppna och maskinläsbara format tillsammans med relevant metadata, när det är möjligt och lämpligt.<br>**Europaparlamentets och rådets förordning (EU) 2024/1689 (AI-förordningen)** artikel 13 anger att högrisk-AI-system ska utformas så att deras funktion är tillräckligt transparent för att verksamhetsutövare ska kunna tolka systemets utdata och använda det på lämpligt sätt.", "lucka_status": "Nej", "empirisk_kalla": "Riksrevisionen (2025) RiR 2025:8 Statliga strategiska digitaliseringsprojekt – stora gemensamma utmaningar::Styrdokument som projektplaner och slutrapporter upprättas inte systematiskt. Utan slutrapporter sprids inte lärdomar, och samverkan och erfarenhetsutbyte sker sällan (s. 38–42). | Digg/PTS (2026) Uppföljning av digitaliseringsstrategin, bilaga tabell 20::Av 23 400 datamängder på Sveriges dataportal är 17 156 öppna, men bara 854 är publicerade av kommuner. 32 procent av de statliga myndigheterna har antagit principen \"öppet som standard\". | Forbrukerrådet (2026) Breaking free. Pathways to a fair technological future::Plattformar stänger de API:er som forskare och journalister behöver för insyn.", "beskrivning": "Offentlig information och data behöver vara tillgängliga för granskning och vidareanvändning, fria från betalväggar och inlåsning i komplexa system. Europaparlamentets och rådets direktiv (EU) 2019/1024 om öppna data och vidareutnyttjande av information från den offentliga sektorn fastställer principer för att offentlig information ska vara tillgänglig i öppna och maskinläsbara format. Öppna licenser och tillgängliga format är förutsättning för att den enskilde ska kunna utöva insyn och bygga vidare på information som rätteligen är allmänt tillgänglig.", "lankar": [], "tillsynsskydd_finns": "Offentlighetsprincipen gäller handlingar men inte kod, designval eller systemdokumentation."}];

var SECTION_TEXTS = {"Systembarriärer":{"ingress":"Strukturella hinder i teknikens utformning och infrastruktur som skapar ojämlika villkor.","text":"Systembarriärer uppstår när digitala lösningar och infrastrukturer är utformade på sätt som inte tar hänsyn till alla människors behov, förutsättningar eller rättigheter. Dessa hinder är inbyggda i själva systemen genom exempelvis otillräcklig teknisk interoperabilitet eller ensidigt fokus på effektivisering. Resultatet blir att vissa utestängs redan i design- och implementeringsfasen."},"Ojämlikhetsfaktorer":{"ingress":"Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.","text":"Systembarriärer drabbar inte alla lika. Vissa omständigheter, till exempel ekonomisk utsatthet, funktionsnedsättning, skyddsbehov, livskris, migrationsstatus eller att vara barn eller ung, gör att systemens brister får allvarligare konsekvenser. Dessa omständigheter uppträder sällan ensamma och förstärker varandra: en person med funktionsnedsättning som samtidigt lever i ekonomisk utsatthet möter fler och högre barriärer än vad varje omständighet hade skapat för sig. Det är inte omständigheterna i sig som skapar exkludering, utan att systemen inte är utformade för den variation som finns i befolkningen.\n\nExkludering är ofta situationsbunden. En person som brukar hantera digitala samhällsfunktioner kan få problem när livssituationen förändras, som vid sjukdom, arbetslöshet, separation eller sorg. Det är just i dessa lägen som behovet av kontakt med välfärdssystemet ökar, samtidigt som förmågan att navigera digitala processer minskar (Wihlborg, Kaharevic & Lindgren 2026). Upprepade negativa erfarenheter kan minska tilliten till myndigheter och leda till att den enskilde undviker kontakt även när rätten till stöd kvarstår.\n\nDenna sektion kartlägger olika omständigheter som faller utanför systemens designantaganden. Syftet är inte att kategorisera människor utan att synliggöra var det allmänna brister i att utforma system som fungerar för alla."},"Bildning, egenmakt och delaktighet":{"ingress":"Det allmännas ansvar att upprätthålla förutsättningarna för att den enskilde ska kunna förstå, agera och delta i en digitaliserad välfärdsstat.","text":"Rätten att förstå sin situation, utöva inflytande och delta i samhället är en demokratisk grundförutsättning. Förvaltningen har alltid haft ansvar för att den enskilde kan orientera sig i samhället, förstå ett beslut, överklaga, söka information, bilda sig en uppfattning och delta i demokratiska processer. Det ansvaret består när samhällsfunktioner digitaliseras.\n\nI svensk digitaliseringspolicy är svaret på digital exkludering i huvudsak att stärka den enskildes kompetens. Men kompetens är inte en statisk egenskap hos individen. Enligt Ellström (1992) kan kompetens förstås som den potentiella handlingsförmågan i relation till en specifik situation, uppgift eller kontext. Förmågan uppstår i mötet mellan individens resurser och de krav och handlingsutrymmen som omgivningen skapar. I digitala system är handlingsutrymmet inte öppet utan inskrivet i teknikens utformning. De antaganden som designers byggt in avgör vilka handlingar som är möjliga och vilka som inte är det (Akrich 1992). Om systemen inte skapar handlingsutrymme är det inte säkert att ökad individuell digital kompetens kan kompensera för strukturella hinder.\n\nDet finns en avgörande skillnad mellan att utföra en uppgift och att förstå sin situation. Att delegera utförande är inte detsamma som att ha kontroll. Kontroll förutsätter förståelse: förmågan att bedöma om ett beslut är rimligt, att veta vilka rättigheter som finns och/eller att kunna avgöra om den information man möter är trovärdig. Bildning kan inte ersättas av teknik som agerar i den enskildes ställe."}};
var ABOUT_SECTIONS = [{"title":"Om ramverket för rättighetsefterlevnad","text":"Digitalisering av samhällsfunktioner förändrar villkoren för hur rättigheter utövas och skyldigheter fullgörs. Ramverket kartlägger var det allmänna brister i att säkerställa att detta kan ske på jämlika villkor. Här granskas systembarriärer i teknikens utformning, omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser, och det allmännas ansvar för digital delaktighet. Ramverket utgår från gällande lagstiftning och riktar sig till beslutsfattare och styrgrupper med ansvar för digitalisering i offentlig sektor.\n\nRamverket utgör grunden i reformprojektet DigidelGov – Samhällskontraktet i en digital tid."},{"title":"Bakgrund","text":"Ett legitimt välfärdssystem förutsätter att rättigheter och skyldigheter inte bara finns formellt utan kan utövas och fullgöras på jämlika villkor. Digitalisering av samhällsfunktioner sätter den förutsättningen på prov.\n\nI svensk digitaliseringspolicy behandlas digital exkludering huvudsakligen som en kompetensfråga. Begrepp som digitalt utanförskap klumpar ihop vitt skilda situationer – otillgänglig teknik, livskriser, funktionsnedsättningar, bristande infrastruktur – och sorterar dem som ett gemensamt avstånd till en digital norm. Insatser för att öka digital inkludering riktas i huvudsak mot individens förmåga i form av utbildning, stödfunktioner och informationskampanjer. Dessa insatser fyller en funktion, men de förbigår ansvaret: när systemen själva skapar barriärerna kan svaret inte vara att anpassa människor till systemen.\n\nNär socialpolitiska, utbildningspolitiska och arbetsmarknadspolitiska frågor omformuleras till digitaliseringsfrågor förskjuts ansvaret. Bredare välfärdspolitiska brister behandlas som tekniska problem. Resultatet blir att insatser riktas mot symptom och inte mot de strukturella orsaker som avgör om digitalt förmedlade samhällsfunktioner faktiskt fungerar för alla.\n\nDetta ramverk utgår från det allmännas ansvar och granskar hur system, ansvarsfördelning och styrning villkorar möjligheten att utöva sociala rättigheter och fullgöra sina skyldigheter. Ramverket förhåller sig till Sveriges digitaliseringsstrategi 2025–2030, Sveriges AI-strategi och tillhörande handlingsplan (Regeringskansliet 2025, 2026)."},{"title":"Digital exkludering – ett strukturellt perspektiv","text":"I detta ramverk avser digital exkludering situationer där digitala system, processer eller styrformer i praktiken försvårar eller omöjliggör möjligheten att använda, förstå eller få stöd i digitalt förmedlade samhällsfunktioner. Begreppet riktar sig mot systemets utformning, inte mot individens förmåga.\n\nRamverket identifierar och strukturerar systembarriärer samt synliggör hur livsvillkor och styrning påverkar möjligheten att delta på lika villkor."},{"title":"Rättslig och normativ grund","text":"Ramverket vilar på tre typer av normativa grunder som tillsammans anger det allmännas ansvar för att sociala rättigheter ska kunna utövas i praktiken, även i den digitala välfärdsstaten.\n\nBindande svensk rätt: Nationell lagstiftning som kan åberopas, prövas och sanktioneras. Hit hör Regeringsformen, Förvaltningslagen, Diskrimineringslagen, Socialtjänstlagen, Hälso- och sjukvårdslagen och Konsumentköplagen, liksom EU-förordningar och EU-direktiv med direkt eller harmoniserad verkan i svensk rätt.\n\nFolkrätt: Internationella konventioner som Sverige ratificerat och som gäller parallellt med den nationella lagstiftningen. FN:s barnkonvention (CRC) är inkorporerad i svensk lag sedan 2020 medan övriga gäller som folkrättsliga åtaganden som ska beaktas vid tolkning och tillämpning.\n\nVägledande politiska principer: Den europeiska förklaringen om digitala rättigheter och principer för det digitala decenniet (2023) uttrycker politisk vilja och kan vägleda tolkning men är inte rättsligt bindande. Förklaringen formulerar principer som konkretiserar hur EU:s medlemss
