: "Informationsverige.se (2025): den som ansöker om förlängning efter att uppehållstillståndet löpt ut riskerar att förlora arbetsrätt och förmåner som introduktionsersättning, studiemedel och föräldrapenning — ansökan kräver inloggning med BankID. | Skatteverket (webbsida, hämtad 2026-04-08): En person som Skatteverket bedömer har en okänd bosättning men som vistas i Sverige, kan bli avregistrerad från folkbokföringen som försvunnen. Avregistrering från folkbokföringen innebär att personen förlorar tillgång till förmåner, sjukvård och utbetalningar från FK och Pensionsmyndigheten.", "beskrivning": "Digitala system saknar i regel hantering av statusövergångar. Den som väntar på förlängt tillstånd kan förlora åtkomst till tjänster trots laglig rätt att vara i landet.", "lankar": ["https://www.informationsverige.se/en/jag-har-fatt-uppehallstillstand/ansoka-om-forlangt-uppehallstillstand.html", "https://skatteverket.se/offentligaaktorer/folkbokforing/avregistreradsomforsvunnenpersonensbosattningarokand.4.fa979e918895f4387d102.html"], "tillsynsskydd_finns": "Nej – digitala system saknar hantering av statusövergångar."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.7 Plattformsstyrt arbete", "taxonomi_id": "2.7.1", "kategori": "Algoritmisk arbetsledning", "situation_exempel": "Jag kör mat åt en plattform – appen bestämmer vilka leveranser jag får, hur lång tid jag har och vad jag tjänar. Igår sänktes min ersättning utan förklaring", "radgivning_enskild": "Fackförbund (Transportarbetareförbundet); Arbetsmiljöverket", "radgivning_utforare": "Arbetsmiljöverket (vägledning om plattformsarbete); Skatteverket (vägledning om arbetsgivaransvar)", "tvist": "Arbetsdomstolen (frågan om anställningsförhållande); allmän domstol", "tillsynsmyndighet": "Arbetsmiljöverket; Skatteverket (arbetsgivaransvar); IMY (dataskydd vid automatiserat beslutsfattande)", "lagstod": "EU:s plattformsdirektiv (2024/2831) presumtion om anställning; LAS (1982:80); arbetsmiljölagen (1977:1160)", "lucka_status": "Nej", "empirisk_kalla": "Fairwork/Oxford (2025) Fair Work for Platform Workers: Lessons from the EU Directive and Beyond (i Industrial Law Journal): intervjuer med över 7 400 plattformsarbetare visar att de upprepade gånger utsätts för ogenomskinliga algoritmiska beslut om arbetsvillkor och disciplinära åtgärder. | Electronic Frontier Foundation (2025) What Europe’s New Gig Work Law Means for Unions and Technology: 79 % av europeiska företag använder algoritmisk övervakning — problem inkluderar algoritmisk lönediskriminering baserad på bedömd ekonomisk utsatthet. | Human Rights Watch (2025) The Gig Trap: plattformarnas ägarskap av inkomstdata skapar informationsasymmetri — arbetare saknar insyn i hur ersättningen beräknas.", "beskrivning": "Digitala plattformar styr arbetsvillkor genom algoritmer som fördelar uppdrag, sätter tidsramar och utvärderar prestation utan motsvarande arbetsgivaransvar. Den som utför arbetet saknar insyn i hur beslut fattas och möjlighet att förhandla.", "lankar": ["https://academic.oup.com/ilj/article/54/3/425/8176731", "https://www.eff.org/deeplinks/2025/10/what-europes-new-gig-work-law-means-unions-and-technology", "https://www.hrw.org/report/2025/05/12/the-gig-trap/algorithmic-wage-and-labor-exploitation-in-platform-work-in-the-us"], "tillsynsskydd_finns": "Nej – plattformsdirektivet är antaget men inte genomfört i svensk lag."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.7 Plattformsstyrt arbete", "taxonomi_id": "2.7.2", "kategori": "Villkorat socialt skyddsnät", "situation_exempel": "Jag blev sjuk men får ingen sjukpenning – Försäkringskassan säger att jag inte är anställd utan uppdragstagare åt plattformen", "radgivning_enskild": "Försäkringskassan; fackförbund; Allmänna ombudet för socialförsäkringen", "radgivning_utforare": "Försäkringskassan (vägledning om SGI); Skatteverket (vägledning om arbetsgivaransvar); ISF (tillsynsvägledning socialförsäkring)", "tvist": "Förvaltningsrätten (sjukpenning); Arbetsdomstolen (anställningsfrågan)", "tillsynsmyndighet": "ISF; Arbetsmiljöverket", "lagstod": "SFB (2010:110); EU plattformsdirektiv (2024/2831); LAS (1982:80)", "lucka_status": "Nej", "empirisk_kalla": "ISF (2023:3) Gigarbetare och socialförsäkringen: socialförsäkringen är konstruerad för regelbundna tillsvidareanställningar — gigarbetares oregelbundna inkomst gör det omöjligt att beräkna framtida inkomst, vilket försvårar rätten till sjukpenning och föräldrapenning. | Hartzén (2023) Plattformsarbetare och sjukpenninggrundande inkomst (Förvaltningsrättslig tidskrift, Lunds universitet): SGI fastställs utifrån inkomstklassificering medan rätten till sjukpenning bedöms utifrån arbetsrättslig status — inkonsekvensen skapar rättsosäkerhet för plattformsarbetare. | Arbetsliv/Prevent (2024): en majoritet av plattformsarbetarna saknar regelrätt anställning och har därmed inte rätt till sjukpenning, föräldraförsäkring eller arbetslöshetsersättning trots att de arbetar regelbundet.", "beskrivning": "Digitala plattformar klassificerar den som utför arbetet som uppdragstagare, inte som anställd. Socialförsäkringssystemets skydd förutsätter anställning.", "lankar": ["https://isf.se/publikationer/rapporter/2023/2023-04-27-gigarbetare-och-socialforsakringen", "https://portal.research.lu.se/sv/publications/plattformsarbetare-och-sjukpenninggrundande-inkomst-lika-men-%C3%A4nd%C3%A5/", "https://www.prevent.se/arbetsliv/lagar-och-regler/2024/starkta-rattigheter-for-gig-arbetare/"], "tillsynsskydd_finns": "Nej – SFB villkorar sjukpenning mot anställning eller egenföretagande med karensdag. Plattformsarbetaren faller mellan kategorierna. Plattformsdirektivet är antaget men inte genomfört i svensk lag."}, {"tax_huvusektion": "Ojämlikhetsfaktorer", "tax_huvudsektion_beskrivning": "Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.", "tax_kat": "2.7 Plattformsstyrt arbete", "taxonomi_id": "2.7.3", "kategori": "Inkomst som inte ryms i systemen", "situation_exempel": "Jag kör för en plattform och söker bostadsbidrag – men min inkomst varierar från vecka till vecka och FK:s system kräver en fast månadsinkomst. Jag vet inte vad jag ska skriva.", "radgivning_enskild": "Försäkringskassan; Skatteverket; fackförbund", "radgivning_utforare": "Försäkringskassan (vägledning om inkomstrapportering); Skatteverket (vägledning om arbetsgivardeklaration på individnivå); ISF (tillsynsvägledning socialförsäkring)", "tvist": "Förvaltningsrätten (om återkrav); JO", "tillsynsmyndighet": "ISF; JO", "lagstod": "SFB (2010:110); FL 6–7 §§", "lucka_status": "Nej", "empirisk_kalla": "RiR 2026:4 s. 58: en stor del av felaktiga utbetalningar beror på att försäkrade inte anmält ändrade förhållanden — systemen bygger till stor del på att försäkrade själva anmäler ändringar, vilket medför stora risker för felaktiga utbetalningar. | RiR 2026:4 s. 44: Försäkringskassans handläggningssystem har föråldrade funktioner för att hantera ändrade förhållanden — ärendeköer och fördröjd hantering ökar risken för felaktiga utbetalningar och återkrav. | ISF (2023:3) Gigarbetare och socialförsäkringen: gigarbetares oregelbundna inkomst gör det omöjligt att beräkna framtida inkomst — socialförsäkringen är konstruerad för regelbundna tillsvidareanställningar.", "beskrivning": "Digitala system för inkomstrapportering förutsätter stabila, förutsägbara belopp. Oregelbundna plattformsinkomster passar inte i mallarna. Den som försöker göra rätt riskerar ändå felrapportering, återkrav och sanktioner.", "lankar": ["https://www.riksrevisionen.se/nyhetsarkiv/nyhetsarkiv/2026-02-19-ineffektiv-hantering-av-andrade-forhallanden-i-socialforsakringen.html", "https://isf.se/publikationer/rapporter/2023/2023-04-27-gigarbetare-och-socialforsakringen"], "tillsynsskydd_finns": "Nej – digitala system för inkomstrapportering förutsätter stabila belopp."}, {"tax_huvusektion": "Bildning, egenmakt och delaktighet", "tax_huvudsektion_beskrivning": "Det allmännas ansvar att upprätthålla förutsättningarna för att den enskilde ska kunna förstå, agera och delta i en digitaliserad välfärdsstat.", "tax_kat": "3.1 Bildningens förutsättningar", "taxonomi_id": "3.1.1", "kategori": "Sammanhållet ekosystem", "situation_exempel": "saknas 2026-04-28", "radgivning_enskild": "saknas 2026-04-28", "radgivning_utforare": "saknas 2026-04-28", "tvist": "saknas 2026-04-28", "tillsynsmyndighet": "saknas 2026-04-28", "lagstod": "saknas 2026-04-28", "lucka_status": "Nej", "empirisk_kalla": "saknas 2026-04-28", "beskrivning": "Bildningsaktörerna behöver verka i ett sammanhållet ekosystem där varje aktörs erbjudande, ansvarsgränser och hänvisningar är tydliga. Utan organisatorisk helhet ersätts ekosystemet av enskilda insatser med teknikhjälp.", "lankar": [], "tillsynsskydd_finns": "saknas 2026-04-28"}, {"tax_huvusektion": "Bildning, egenmakt och delaktighet", "tax_huvudsektion_beskrivning": "Det allmännas ansvar att upprätthålla förutsättningarna för att den enskilde ska kunna förstå, agera och delta i en digitaliserad välfärdsstat.", "tax_kat": "3.1 Bildningens förutsättningar", "taxonomi_id": "3.1.2", "kategori": "Organisatorisk förankring", "situation_exempel": "saknas 2026-04-28", "radgivning_enskild": "saknas 2026-04-28", "radgivning_utforare": "saknas 2026-04-28", "tvist": "saknas 2026-04-28", "tillsynsmyndighet": "saknas 2026-04-28", "lagstod": "saknas 2026-04-28", "lucka_status": "Nej", "empirisk_kalla": "saknas 2026-04-28", "beskrivning": "Bildningsarbetet behöver vara organisatoriskt buret för att inte vila på enskilda eldsjälar och punktinsatser. Organisatorisk förankring är förutsättning för kontinuitet, kvalitet och likvärdighet i utbudet.", "lankar": [], "tillsynsskydd_finns": "saknas 2026-04-28"}, {"tax_huvusektion": "Bildning, egenmakt och delaktighet", "tax_huvudsektion_beskrivning": "Det allmännas ansvar att upprätthålla förutsättningarna för att den enskilde ska kunna förstå, agera och delta i en digitaliserad välfärdsstat.", "tax_kat": "3.1 Bildningens förutsättningar", "taxonomi_id": "3.1.3", "kategori": "MIK som pedagogisk kärnkompetens", "situation_exempel": "Bibliotekarier, pedagoger, folkbildare och gatubyråkrater hjälper hundratals invånare varje dag med att navigera information, bedöma trovärdighet och hantera digitala tjänster. Men medie- och informationskunnighet (MIK) är inte en definierad del av deras uppdrag. Därför sker stödet utan mandat och utan adekvat utan kompetensutveckling.", "radgivning_enskild": "Biblioteket (vardagsnära stöd vid besök). I praktiken saknar den enskilde möjlighet att efterfråga MIK-stöd — behovet uppstår i vardagen utan att den enskilde kan identifiera det som en rättighet.r och kompetensutveckling)", "radgivning_utforare": "Mediemyndigheten (MIK Sverige); Digiteket (fortbildning inom bibliotekssektorn); SKR (stöd till kommuner som arbetsgivare)", "tvist": "Ingen etablerad tvistväg.", "tillsynsmyndighet": "Mediemyndigheten (samordnar MIK Sverige men saknar verktyg att granska om insatserna integreras i professionell praktik). Ingen myndighet ansvarar för att MIK-kompetens är en del av kärnuppdraget för bildningsprofessioner.", "lagstod": "RF 1 kap. 2 §; Bibliotekslagen (2013:801) 2 §, 7 §; FL 6 §", "lucka_status": "Nej", "empirisk_kalla": "UNESCO (2021) Think Critically, Click Wisely – MIL Curriculum for Educators & Learners: UNESCO skiljer mellan tre nivåer: att undervisa om MIK, att undervisa genom MIK och att använda MIK som verktyg för samhällsdeltagande. MIK presenteras som en process integrerad i yrkesutövning och samhällsengagemang, inte som ett avgränsat ämne. Målet är att pedagoger, samhällsledare och folkbildare själva ska bli medie- och informationskunniga och utveckla de kompetenser som krävs för att integrera MIK på alla nivåer och i alla utbildningsformer (sid. 60). | Carlsson, U. (red.) (2018) Medie- och informationskunnighet (MIK) i den digitala tidsåldern – En demokratifråga: Kartläggning, analys, reflektioner: Lärare och bibliotekarier är att betrakta som nyckelfunktioner för arbetet med MIK i Sverige mot medborgare i olika målgrupper (sid. 100); Folkbiblioteken utgör naturliga arenor för att understödja invånarnas medie- och informationskunnighet; en uppgift som förutom att framhållas i bibliotekslagen även har stöd i Unescos och IFLA:s internationella biblioteksmanifest (sid. 83).| EU AI Act (2024) art. 4: ålägger leverantörer och användare av AI-system att säkerställa tillräcklig AI-kunnighet hos personal – motsvarande krav saknas för de professioner som möter den enskilde i bildningsuppdraget.", "beskrivning": "Mandat och förmåga att stödja den enskilde i att söka, tolka och värdera information behöver vara del av kärnuppdraget för professioner som bär det vardagsnära bildningsansvaret.", "lankar": ["https://unesdoc.unesco.org/ark:/48223/pf0000377068", "https://urn.kb.se/resolve?urn=urn:nbn:se:norden:org:diva-5321", "https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-4"], "tillsynsskydd_finns": "Nej – MIK har i huvudsak organiserats som separata insatser riktade till medborgaren. Förmågan att stödja den enskilde i att söka, tolka och värdera information är inte integrerad i professionell praktik för de yrkesgrupper som dagligen möter behovet."}, {"tax_huvusektion": "Bildning, egenmakt och delaktighet", "tax_huvudsektion_beskrivning": "Det allmännas ansvar att upprätthålla förutsättningarna för att den enskilde ska kunna förstå, agera och delta i en digitaliserad välfärdsstat.", "tax_kat": "3.2 Egenmakt och samhällsförståelse", "taxonomi_id": "3.2.1", "kategori": "Medborgerlig kompetens", "situation_exempel": "saknas 2026-04-28", "radgivning_enskild": "saknas 2026-04-28", "radgivning_utforare": "saknas 2026-04-28", "tvist": "saknas 2026-04-28", "tillsynsmyndighet": "saknas 2026-04-28", "lagstod": "saknas 2026-04-28", "lucka_status": "Nej", "empirisk_kalla": "saknas 2026-04-28", "beskrivning": "Förmågan att förstå sina rättigheter, demokratiska processer och samhällets strukturer är en förutsättning för att kunna agera som rättighetsbärare. EU har identifierat medborgerlig kompetens som en av åtta nyckelkompetenser för livslångt lärande (2018/C 189/01). I en digitaliserad välfärdsstat omfattar kompetensen också förståelse av automatiserade beslutsprocesser, digitala förvaltningsstrukturer och hur offentlig information görs tillgänglig. Det allmänna har ansvar för att möjliggöra denna förståelse.", "lankar": [], "tillsynsskydd_finns": "saknas 2026-04-28"}, {"tax_huvusektion": "Bildning, egenmakt och delaktighet", "tax_huvudsektion_beskrivning": "Det allmännas ansvar att upprätthålla förutsättningarna för att den enskilde ska kunna förstå, agera och delta i en digitaliserad välfärdsstat.", "tax_kat": "3.2 Egenmakt och samhällsförståelse", "taxonomi_id": "3.2.2", "kategori": "Medie- och informationskunnighet (MIK)", "situation_exempel": "saknas 2026-04-28", "radgivning_enskild": "saknas 2026-04-28", "radgivning_utforare": "saknas 2026-04-28", "tvist": "saknas 2026-04-28", "tillsynsmyndighet": "saknas 2026-04-28", "lagstod": "saknas 2026-04-28", "lucka_status": "Nej", "empirisk_kalla": "saknas 2026-04-28", "beskrivning": "Förmågan att söka, värdera och kritiskt förhålla sig till information är förutsättning för demokratisk delaktighet. Unescos ramverk för medie- och informationskunnighet identifierar de förmågor som krävs för att orientera sig i digitalt medierade informationsmiljöer. Insatser för att stärka befolkningens motståndskraft mot otillbörlig informationspåverkan, vilseledande designmönster och digitala bedrägerier behöver vara nationellt samordnade och organisatoriskt förankrade (se 3.3.3 och 3.1.2).", "lankar": [], "tillsynsskydd_finns": "saknas 2026-04-28"}, {"tax_huvusektion": "Bildning, egenmakt och delaktighet", "tax_huvudsektion_beskrivning": "Det allmännas ansvar att upprätthålla förutsättningarna för att den enskilde ska kunna förstå, agera och delta i en digitaliserad välfärdsstat.", "tax_kat": "3.2 Egenmakt och samhällsförståelse", "taxonomi_id": "3.2.3", "kategori": "Digital kompetens (DigComp 3.0)", "situation_exempel": "Jag har lärt mig mycket på egen hand och i folkbildande insatser – men när jag söker jobb vill arbetsgivaren veta vad jag kan och jag har inget sätt att visa det. Alla pratar om \"digital kompetens\" men menar olika saker.", "radgivning_enskild": "Saknas i egentlig mening. Biblioteket (lokal vägledning, ej standardiserad); Arbetsförmedlingen (kompetenskartläggning, ej baserad på DigComp); kommunal vuxenutbildning (formell validering men ej för icke-formell digital kompetens).", "radgivning_utforare": "Digg (digitaliseringspolitik, ej kompetensvalidering); PTS (digital inkludering, samordning); Skolverket (formell utbildning). Ingen aktör vägleder utförare i att använda en gemensam referensram för digital kompetens – den finns inte.", "tvist": "JO (om myndighet inte kan hänvisa till likvärdigt kompetensstöd)", "tillsynsmyndighet": "Ingen tydlig – Digg samordnar digitaliseringspolitik men har inte tillsyn över kompetensinsatsers samstämmighet eller kvalitet. Skolverket ansvarar för formell utbildning. Ingen myndighet ansvarar för validering av vuxnas icke-formella digitala kompetens. Medan PTS har samordningsuppdrag digital inkludering.", "lagstod": "RF 1 kap. 2 § (det allmännas ansvar för delaktighet); Bibliotekslagen (2013:801) 7 § (informationsteknik för lärande och delaktighet)", "lucka_status": "Nej", "empirisk_kalla": "Cosgrove & Cachia (2025) DigComp 3.0, JRC: Ramverket definierar 21 kompetenser i fyra färdighetsnivåer (grund, medel, avancerad och specialiserad) med 500+ lärandemål. Ramverket DigComp används i EU som referens för mätning, kursdesign och validering. Österrike har nationell anpassning (DigComp 2.3 AT) med tillägg av Area 0 för baskompetens. Sverige har inte anammat DigComp för att arbeta systematiskt med olika färdigheter och förmågor i digital kompetens. | Sveriges digitaliseringsstrategi 2025–2030 defintierar digital bas-, bredd- och spetskompetens. Digital baskompetens innebär att ha grundläggande digitala färdigheter, dvs. förmåga att använda digitala verktyg för exempelvis kommunikation och samarbete, säkerhet eller problemlösning. Digital breddkompetens innebär att ha en generell digital kompetens, dvs. förmåga att hantera det växande antal system och applikationer som krävs för att utföra olika arbetsuppgifter. Digital spetskompetens inbegriper specialistkompetens inom exempelvis\nAI, programmering, cybersäkerhet och andra områden som är relevanta för digitaliseringen av samhället (sid. 9). | Digg/PTS (2026) Redovisning av uppdraget att stödja genomförandet av Sveriges Digitaliseringsstrategi. Indikatorerna följer DigComp 3.0 för bas- och breddkompetens (befolkningen), ICILS för elever åk 8, ICT specialists för spetskompetens (sid. 5-8).", "beskrivning": "Förmågan att navigera, kommunicera och agera i digitala miljöer är förutsättning för delaktighet i en digitaliserad välfärdsstat. Digital kompetens är en av EU:s åtta nyckelkompetenser och operationaliseras i ramverket DigComp 3.0, som beskriver kompetensen i mätbara nivåer och dimensioner och omfattar även AI-relaterade förmågor. En nationell översättning och kontextualisering är förutsättning för att insatser inom utbildning, folkbildning, omsorg och arbetsmarknad ska kunna samordnas, mätas och jämföras.", "lankar": ["https://publications.jrc.ec.europa.eu/repository/handle/JRC144121", "https://www.digitalaustria.gv.at/en/digital-skills/austrian-model-for-digital-competence.html", "https://www.regeringen.se/contentassets/fe3e296228fb474f803a986ae3842b4c/sveriges-digitaliseringsstrategi-20252030.pdf", "https://www.digg.se/download/18.4d9d13fe19c34cfab85e4a/1772203531748/Rapportbilaga-feb-2026-Uppf%C3%B6ljning-av-digitaliseringsstrategin.pdf"], "tillsynsskydd_finns": "Nej – det saknas nationell instans som ansvarar för gemensam definition, nivåbeskrivning och validering av digital kompetens utanför det formella utbildningssystemet."}, {"tax_huvusektion": "Bildning, egenmakt och delaktighet", "tax_huvudsektion_beskrivning": "Det allmännas ansvar att upprätthålla förutsättningarna för att den enskilde ska kunna förstå, agera och delta i en digitaliserad välfärdsstat.", "tax_kat": "3.3 Inflytande och demokratisk insyn", "taxonomi_id": "3.3.1", "kategori": "Osynliga rättigheter", "situation_exempel": "Jag visste inte att jag hade rätt till hjälp eller analogt alternativ – ingen informerade mig", "radgivning_enskild": "Resp. myndighet; Servicekontor (Statens servicecenter); kommunal vägledning i digital vardag (informell vägledning)", "radgivning_utforare": "Resp. myndighet (FL 6 §); Statens servicecenter (vägledning om alternativa kontaktvägar); kommunal konsumentvägledning", "tvist": "JO (om myndighet brister i att informera om alternativa kontaktvägar)", "tillsynsmyndighet": "JO kan granska enskilda fall. Ingen myndighet har systemtillsyn över att det allmänna aktivt informerar om rättigheter till stöd och alternativa kontaktvägar.", "lagstod": "RF 1 kap. 2 §; FL 6 § (serviceskyldighet, hjälp att ta till vara intressen), 7 § (tillgänglighet)", "lucka_status": "Nej", "empirisk_kalla": "Institutet för mänskliga rättigheter (2023) Kännedom om och upplevelser av mänskliga rättigheter i Sverige 2022–2023: bara 4 % känner sig helt säkra på vart de kan vända sig vid rättighetskränkning; 35 % vet inte alls; av dem som upplevt kränkningar men inte vänt sig någonstans anger 47 % att de inte vet hur (s. 14–15). | Skallerud, Jørgensen & Karlsson (2024) Exploring Human Rights Awareness, Attitudes and Perception in Scandinavia: 35 % av svenskarna kan inte nämna en enda specifik mänsklig rättighet; medvetenheten om ekonomiska och sociala rättigheter (social trygghet 50 %, bostad 54 %, hälsa 55 %) är markant lägre än om medborgerliga rättigheter (yttrandefrihet 94 %) (s. 14). | Institutet för mänskliga rättigheter (2024) Allt ifrågasätts: 36 % av personer med funktionsnedsättning vet vart de kan vända sig om rättigheter inte efterlevs — många beskriver upplevelser av att känna sig misstrodda och som en belastning vid försök att utkräva sina rättigheter. | RiR 2021:8 Var god dröj, myndigheterna digitaliserar – service till enskilda som inte kan eller vill vara digitala: bara ett fåtal av 22 granskade myndigheter har en tydlig bild av enskildas behov av alternativ till digital service — utan sådan kunskap kan myndigheten inte aktivt informera om rätten till hjälp eller alternativa kontaktvägar ( s. 32–33). | FN:s funktionsrättskommitté (2024, CRPD/C/SWE/CO/2–3) punkt 9c: det saknas tillräckliga klagomålsmekanismer för enskilda när kommuner och regioner brister.", "beskrivning": "Det allmänna har ansvar att systematiskt informera om vilka rättigheter till stöd, vägledning och alternativa kontaktvägar som finns. Rättigheter som inte är kända kan inte utövas. Se även 1.6.3 om respektive aktörs ansvar att kommunicera rättigheter.", "lankar": ["https://mrinstitutet.se/vara--publikationer/rapporter/rapporter/2023-11-23-kannedom-om-och-upplevelser-av-manskliga-rattigheter-i-sverige-2022-2023", "https://mrinstitutet.se/vara--publikationer/rapporter/rapporter/2024-12-09-exploring-human-rights-awareness-attitudes-and-perception-in-scandinavia", "https://mrinstitutet.se/vara--publikationer/rapporter/rapporter/2024-09-04-allt-ifragasatts", "https://www.riksrevisionen.se/granskningar/granskningsrapporter/2021/var-god-droj-myndigheterna-digitaliserar---service-till-enskilda-som-inte-kan-eller-vill-vara-digitala.html"], "tillsynsskydd_finns": "Nej – FL 6 § ger rätten men ingen systemtillsyn säkerställer att myndigheter aktivt informerar om den. Rättigheter som inte är kända kan inte utövas. FN:s funktionsrättskommitté (2024, CRPD/C/SWE/CO/2–3) konstaterar att det saknas tillräckliga klagomålsmekanismer för enskilda när kommuner och regioner brister."}, {"tax_huvusektion": "Bildning, egenmakt och delaktighet", "tax_huvudsektion_beskrivning": "Det allmännas ansvar att upprätthålla förutsättningarna för att den enskilde ska kunna förstå, agera och delta i en digitaliserad välfärdsstat.", "tax_kat": "3.3 Inflytande och demokratisk insyn", "taxonomi_id": "3.3.2", "kategori": "Inflytande över digitala samhällsfunktioner", "situation_exempel": "Nytt kommunalt system driftsattes utan att medborgare fick tycka till", "radgivning_enskild": "Kommunen (synpunktshantering); JO (om beslutet påverkar rättigheter)", "radgivning_utforare": "Saknas 2026-04-08", "tvist": "JO (bristande delaktighet vid myndighetsutövning); förvaltningsrätten (om beslutet kan överklagas)", "tillsynsmyndighet": "JO (enskilda fall). Ingen myndighet har systemtillsyn över att medborgare involveras i utformningen av digitala samhällsfunktioner. CRPD art. 4.3 kräver aktiv involvering av personer med funktionsnedsättning – men ingen svensk myndighet ansvarar för att det sker vid digitalisering.", "lagstod": "RF 1 kap. 1 § (all offentlig makt utgår från folket); RF 1 kap. 2 § (delaktighet och inflytande); Kommunallagen 5 kap.; CRPD art. 4.3; FL 6–7 §§", "lucka_status": "Nej", "empirisk_kalla": "RiR 2025:8 s. 26–50: 1 094 strategiska digitaliseringsprojekt – medborgarna har inget inflytande; nyttorealisering saknas systematiskt; kostnadsnyttoanalyser inkluderar sällan medborgarnyttor; 2/3 av myndigheter arbetar inte systematiskt med nyttorealisering. | Digg/PTS (2026) s. 35: Riksrevisionen bedömer att myndigheterna inte involverar användare i tillräcklig utsträckning vid utveckling av digitala tjänster – bara ett fåtal arbetar systematiskt med användarinvolvering. 88 % av statliga myndigheter involverar målgrupper i \"någon utsträckning\" men bara en dryg femtedel av kommuner följer regelbundet upp enkelheten i digitala tjänster. 15 % av kommuner saknar helt rutiner för att samla in eller använda återkoppling från användare. | Feenberg (1992): teknikens utformning kan demokratiseras men bara om berörda har inflytande. | Raymond (2024) s. 52–65: samhällets feedbackloop innehåller viktiga indikatorer på digitala samhällshinder som är upphov till fördyrande dubbelarbete. |", "beskrivning": "Den enskilde och civilsamhället behöver ha systematiska möjligheter att påverka hur digitala samhällsfunktioner utformas. Aktiv involvering i utformningen av digitala samhällsfunktioner är en konventionsförpliktelse, inte en kvalitetsambition.", "lankar": [], "tillsynsskydd_finns": "Nej –"}, {"tax_huvusektion": "Bildning, egenmakt och delaktighet", "tax_huvudsektion_beskrivning": "Det allmännas ansvar att upprätthålla förutsättningarna för att den enskilde ska kunna förstå, agera och delta i en digitaliserad välfärdsstat.", "tax_kat": "3.3 Inflytande och demokratisk insyn", "taxonomi_id": "3.3.3", "kategori": "Skydd mot otillbörlig informationspåverkan", "situation_exempel": "saknas 2026-04-28", "radgivning_enskild": "saknas 2026-04-28", "radgivning_utforare": "saknas 2026-04-28", "tvist": "saknas 2026-04-28", "tillsynsmyndighet": "saknas 2026-04-28", "lagstod": "saknas 2026-04-28", "lucka_status": "Nej", "empirisk_kalla": "saknas 2026-04-28", "beskrivning": "Otillbörlig informationspåverkan avser vilseledande och manipulativa kommunikationsoperationer från statliga eller icke-statliga aktörer som syftar till att påverka demokratiska processer eller den fria åsiktsbildningen. Det allmänna har ansvar att upprätthålla samordnad beredskap, kunskapsspridning och motståndskraft mot sådana påverkansoperationer. Skyddet förutsätter samverkan mellan beredskapsmyndigheter, valmyndighet, mediestöd och bildningsaktörer.", "lankar": [], "tillsynsskydd_finns": "saknas 2026-04-28"}, {"tax_huvusektion": "Bildning, egenmakt och delaktighet", "tax_huvudsektion_beskrivning": "Det allmännas ansvar att upprätthålla förutsättningarna för att den enskilde ska kunna förstå, agera och delta i en digitaliserad välfärdsstat.", "tax_kat": "3.3 Inflytande och demokratisk insyn", "taxonomi_id": "3.3.4", "kategori": "Institutionellt minne", "situation_exempel": "Jag vill hitta en rapport som producerades av Digitaliseringsrådet 2021 men deras webbplats är borta. På deras domännam ligger slaskreklam nu.", "radgivning_enskild": "Resp. myndighet (begära allmän handling, TF 2 kap.)", "radgivning_utforare": "Riksarkivet (digital informationshantering); Digg (ramverk för spårbarhet inom Ena); SKR", "tvist": "Förvaltningsrätten (överklagande vid bristande dokumentation); JO (bristande diarieföring eller dokumentationsplikt); kammarrätten (sekretessbeslut kring allmänna handlingar)", "tillsynsmyndighet": "Riksarkivet (arkivbildning, statliga myndigheter). JO (enskilda fall). Ingen myndighet har systemtillsyn över att digitala beslutsspår bevaras i versionerade och tillgängliga format.", "lagstod": "TF 2 kap. (offentlighetsprincipen); Arkivlagen (1990:782); FL (2017:900) 27 § (dokumentationsplikt vid handläggning), 32 § (motivering av beslut); RF 1 kap. 1 § (folkstyrelseprincipen)", "lucka_status": "Delvis", "empirisk_kalla": "Lemne, M. & Ilshammar, L. (2026) \"Sverige håller på att radera sitt demokratiska minne\", Dala-Demokraten, Opinionstext 8 april 2026: politisk kommunikation i mejl och SMS bevaras inte systematiskt | Riksarkivet (2024) Årsredovisning: det saknas tillräckligt skydd för samhällsviktig information | Johansson, M. (2026) \"Riksarkivet har dragit sig undan ansvaret för digitalt bevarande\", Magasin K: föreskrifter finns men implementeringen brister | RiR 2025:8 s. 72: myndigheter genomför likartade projekt inom digital arkivering och diarieföring men samverkan understiger 30 procent | Axbom, P. (2024) \"Myndigheters länkröta\", axbom.se: myndigheters domännamn, rapporter och utredningar försvinner från webben utan att informationen bevaras", "beskrivning": "När myndigheters webbsidor, rapporter, utredningar och beslutsspår inte bevaras raderas det institutionella minnet. Den enskilde förlorar möjligheten att följa beslut, granska utveckling och argumentera utifrån tidigare ställningstaganden. Bristande arkiveringspraktik urholkar samhällets förmåga att förvalta kunskap.", "lankar": [], "tillsynsskydd_finns": "Delvis – Riksarkivet har tillsynsansvar över arkivbildning men arkivlagen är från 1991 och täcker inte den digitala verkligheten; riksarkivarien har vid upprepade tillfällen efterlyst en moderniserad arkivlag utan resultat. Ingen tillsyn över att digitala beslutsspår, webbpublicerat material eller beslutsregler versioneras och bevaras."}, {"tax_huvusektion": "Bildning, egenmakt och delaktighet", "tax_huvudsektion_beskrivning": "Det allmännas ansvar att upprätthålla förutsättningarna för att den enskilde ska kunna förstå, agera och delta i en digitaliserad välfärdsstat.", "tax_kat": "3.3 Inflytande och demokratisk insyn", "taxonomi_id": "3.3.5", "kategori": "Öppen kunskap och demokratisk insyn", "situation_exempel": "Kommunens digitaliseringsprojekt kostade miljoner men det finns ingen slutrapport, ingen öppen källkod och ingen dokumentation av hur systemen fungerar. Jag som invånare kan inte granska vad jag betalat för.", "radgivning_enskild": "Resp. myndighet (begära allmän handling, TF 2 kap.); kommunens revisorer; JO (om insyn nekas)", "radgivning_utforare": "Saknas 2026-04-08", "tvist": "Kammarrätten (överklagande av sekretessbeslut); JO", "tillsynsmyndighet": "Ingen samlad. JO (offentlighetsprincipen, enskilda fall). Digg (öppna data – men vägledning, inte tillsyn). Ingen myndighet har tillsyn över att offentlig digitalisering dokumenteras, delas öppet eller görs granskningsbar.", "lagstod": "TF 2 kap. (offentlighetsprincipen); RF 1 kap. 1 § (all offentlig makt utgår från folket); EU AI Act kap. IV (transparens för högrisk-AI)", "lucka_status": "Nej", "empirisk_kalla": "Bara 32 % av statliga myndigheter har antagit principen \"öppet som standard\". Utan slutrapporter, öppen källkod och tillgänglig dokumentation kan varken invånare, forskare eller andra myndigheter granska eller lära av digitaliseringsprojekt. RiR 2025:8 s. 38–42: styrdokument upprättas inte systematiskt; utan slutrapporter sprids lärdomar ej; samverkan och erfarenhetsutbyte sker sällan. | Digg/PTS (2026) uppföljningsbilaga tabell 20: 23 400 datamängder på Sveriges dataportal varav 17 156 öppna – men bara 854 publicerade av kommuner. 32 % av myndigheter har antagit \"öppet som standard\". | Riksrevisionen (2025) Statliga strategiska digitaliseringsprojekt – stora gemensamma utmaningar. RiR 2025:8. s. 38–42: Samverkan och erfarenhetsutbyte sker sällan. Styrdokument (projektplaner, slutrapporter) upprättas inte systematiskt. Utan slutrapport: lärdomar sprids ej. Agila arbetssätt riskerar minskat helhetsperspektiv och att insikter stannar inom projektet. | Forbrukerrådet (2026) Breaking free: plattformar stänger API:er som forskare och journalister behöver för insyn.", "beskrivning": "Offentlig information och data behöver vara tillgängliga för granskning och vidareanvändning, fria från betalväggar och inlåsning i komplexa system. Europaparlamentets och rådets direktiv (EU) 2019/1024 om öppna data och vidareutnyttjande av information från den offentliga sektorn fastställer principer för att offentlig information ska vara tillgänglig i öppna och maskinläsbara format. Öppna licenser och tillgängliga format är förutsättning för att den enskilde ska kunna utöva insyn och bygga vidare på information som rätteligen är allmänt tillgänglig.", "lankar": [], "tillsynsskydd_finns": "Nej – offentlighetsprincipen gäller handlingar men inte kod, designval eller systemdokumentation."}];

var SECTION_TEXTS = {"Systembarriärer":{"ingress":"Strukturella hinder i teknikens utformning och infrastruktur som skapar ojämlika villkor.","text":"Systembarriärer uppstår när digitala lösningar och infrastrukturer är utformade på sätt som inte tar hänsyn till alla människors behov, förutsättningar eller rättigheter. Dessa hinder är inbyggda i själva systemen genom exempelvis otillräcklig teknisk interoperabilitet eller ensidigt fokus på effektivisering. Resultatet blir att vissa utestängs redan i design- och implementeringsfasen."},"Ojämlikhetsfaktorer":{"ingress":"Omständigheter som systemen inte är utformade att hantera.","text":"Systembarriärer drabbar inte alla lika. Vissa omständigheter, till exempel ekonomisk utsatthet, funktionsnedsättning, skyddsbehov, livskris, migrationsstatus eller att vara barn eller ung, gör att systemens brister får allvarligare konsekvenser. Dessa omständigheter uppträder sällan ensamma och förstärker varandra: en person med funktionsnedsättning som samtidigt lever i ekonomisk utsatthet möter fler och högre barriärer än vad varje omständighet hade skapat för sig. Det är inte omständigheterna i sig som skapar exkludering, utan att systemen inte är utformade för den variation som finns i befolkningen.\n\nExkludering är ofta situationsbunden. En person som brukar hantera digitala samhällsfunktioner kan få problem när livssituationen förändras, som vid sjukdom, arbetslöshet, separation eller sorg. Det är just i dessa lägen som behovet av kontakt med välfärdssystemet ökar, samtidigt som förmågan att navigera digitala processer minskar (Wihlborg, Kaharevic & Lindgren 2026). Upprepade negativa erfarenheter kan minska tilliten till myndigheter och leda till att den enskilde undviker kontakt även när rätten till stöd kvarstår.\n\nDenna sektion kartlägger olika omständigheter som faller utanför systemens designantaganden. Syftet är inte att kategorisera människor utan att synliggöra var det allmänna brister i att utforma system som fungerar för alla."},"Bildning, egenmakt och delaktighet":{"ingress":"Det allmännas ansvar att upprätthålla förutsättningarna för att den enskilde ska kunna förstå, agera och delta i en digitaliserad välfärdsstat.","text":"Rätten att förstå sin situation, utöva inflytande och delta i samhället är en demokratisk grundförutsättning. Förvaltningen har alltid haft ansvar för att den enskilde kan orientera sig i samhället, förstå ett beslut, överklaga, söka information, bilda sig en uppfattning och delta i demokratiska processer. Det ansvaret består när samhällsfunktioner digitaliseras.\n\nI svensk digitaliseringspolicy är svaret på digital exkludering i huvudsak att stärka den enskildes kompetens. Men kompetens är inte en statisk egenskap hos individen. Enligt Ellström (1992) kan kompetens förstås som den potentiella handlingsförmågan i relation till en specifik situation, uppgift eller kontext. Förmågan uppstår i mötet mellan individens resurser och de krav och handlingsutrymmen som omgivningen skapar. I digitala system är handlingsutrymmet inte öppet utan inskrivet i teknikens utformning. De antaganden som designers byggt in avgör vilka handlingar som är möjliga och vilka som inte är det (Akrich 1992). Om systemen inte skapar handlingsutrymme är det inte säkert att ökad individuell digital kompetens kan kompensera för strukturella hinder.\n\nDet finns en avgörande skillnad mellan att utföra en uppgift och att förstå sin situation. Att delegera utförande är inte detsamma som att ha kontroll. Kontroll förutsätter förståelse: förmågan att bedöma om ett beslut är rimligt, att veta vilka rättigheter som finns och/eller att kunna avgöra om den information man möter är trovärdig. Bildning kan inte ersättas av teknik som agerar i den enskildes ställe."}};
var ABOUT_SECTIONS = [{"title":"Om ramverket för rättighetsefterlevnad","text":"Digitalisering av samhällsfunktioner förändrar villkoren för hur rättigheter utövas och skyldigheter fullgörs. Ramverket kartlägger var det allmänna brister i att säkerställa att detta kan ske på jämlika villkor. Här granskas systembarriärer i teknikens utformning, livsomständigheter som systemen inte är utformade att hantera och det allmännas ansvar för digital delaktighet. Ramverket utgår från gällande lagstiftning och riktar sig till beslutsfattare och styrgrupper med ansvar för digitalisering i offentlig sektor.\n\nRamverket utgör grunden i reformprojektet DigidelGov – Samhällskontraktet i en digital tid."},{"title":"Bakgrund","text":"Ett legitimt välfärdssystem förutsätter att rättigheter och skyldigheter inte bara finns formellt utan kan utövas och fullgöras på jämlika villkor. Digitalisering av samhällsfunktioner sätter den förutsättningen på prov.\n\nI svensk digitaliseringspolicy behandlas digital exkludering huvudsakligen som en kompetensfråga. Begrepp som digitalt utanförskap klumpar ihop vitt skilda situationer – otillgänglig teknik, livskriser, funktionsnedsättningar, bristande infrastruktur – och sorterar dem som ett gemensamt avstånd till en digital norm. Insatser för att öka digital inkludering riktas i huvudsak mot individens förmåga i form av utbildning, stödfunktioner och informationskampanjer. Dessa insatser fyller en funktion, men de förbigår ansvaret: när systemen själva skapar barriärerna kan svaret inte vara att anpassa människor till systemen.\n\nNär socialpolitiska, utbildningspolitiska och arbetsmarknadspolitiska frågor omformuleras till digitaliseringsfrågor förskjuts ansvaret. Bredare välfärdspolitiska brister behandlas som tekniska problem. Resultatet blir att insatser riktas mot symptom och inte mot de strukturella orsaker som avgör om digitalt förmedlade samhällsfunktioner faktiskt fungerar för alla.\n\nDetta ramverk utgår från det allmännas ansvar och granskar hur system, ansvarsfördelning och styrning villkorar möjligheten att utöva sociala rättigheter och fullgöra sina skyldigheter. Ramverket förhåller sig till Sveriges digitaliseringsstrategi 2025–2030, Sveriges AI-strategi och tillhörande handlingsplan (Regeringskansliet 2025, 2026)."},{"title":"Digital exkludering – ett strukturellt perspektiv","text":"I detta ramverk avser digital exkludering situationer där digitala system, processer eller styrformer i praktiken försvårar eller omöjliggör möjligheten att använda, förstå eller få stöd i digitalt förmedlade samhällsfunktioner. Begreppet riktar sig mot systemets utformning, inte mot individens förmåga.\n\nRamverket identifierar och strukturerar systembarriärer samt synliggör hur livsvillkor och styrning påverkar möjligheten att delta på lika villkor."},{"title":"Rättslig och normativ grund","text":"Ramverket vilar på tre typer av normativa grunder som tillsammans anger det allmännas ansvar för att sociala rättigheter ska kunna utövas i praktiken, även i den digitala välfärdsstaten.\n\nBindande svensk rätt: Nationell lagstiftning som kan åberopas, prövas och sanktioneras. Hit hör Regeringsformen, Förvaltningslagen, Diskrimineringslagen, Socialtjänstlagen, Hälso- och sjukvårdslagen och Konsumentköplagen, liksom EU-förordningar och EU-direktiv med direkt eller harmoniserad verkan i svensk rätt.\n\nFolkrätt: Internationella konventioner som Sverige ratificerat och som gäller parallellt med den nationella lagstiftningen. CRC är inkorporerad i svensk lag sedan 2020 medan övriga gäller som folkrättsliga åtaganden som ska beaktas vid tolkning och tillämpning.\n\nVägledande politiska principer: Den europeiska förklaringen om digitala rättigheter och principer för det digitala decenniet (2023) uttrycker politisk vilja och kan vägleda tolkning men är inte rättsligt bindande. Förklaringen formulerar principer som konkretiserar hur EU:s medlemsstater avser att tillämpa grundläggande rättigheter i digitala sammanhang."},{"title":"Teoretisk utgångspunkt","text":"Digitala system är inte neutrala verktyg. De är resultatet av förhandlingar där vissa behov värderas, prioriteras och byggs in, medan andra faller bort. Designval avgör vilka som exkluderas, ofta utan att det synliggörs eller ifrågasätts. Denna insikt har teoretisk förankring.\n\nAkrich (1992) introducerar begreppet inskription för att beskriva hur designers skriver in antaganden i tekniska artefakter: föreställningar om vilka användarna är, vad de kan och hur de förväntas agera. Tekniken delegerar därigenom roller och handlingsutrymme till dem som möter den. Akrich visar att när den verkliga användaren inte motsvarar den föreställda uppstår förskjutning (displacement): artefaktens inbyggda scenario och den faktiska användningssituationen går isär. Rose och Blume (2003) fördjupar detta och visar att inskriptioner konfigurerar alla som möter tekniken. De val och prioriteringar som redan gjorts begränsar handlingsutrymmet, och den enskilde har inte alltid möjlighet att kompensera för det som byggts in.\n\nWinner (1980) visar att sådana designval kan ha politiska konsekvenser långt bortom den enskilda artefakten: tekniska system kan ordna mänskliga relationer på sätt som gynnar vissa grupper och utestänger andra. Feenberg (1992) argumenterar för att denna ordning inte är given. Teknikens utformning kan demokratiseras genom att de som berörs ges möjlighet att påverka designprocessen. Hedström (2004) bekräftar detta empiriskt i studier av datorisering i äldreomsorg, där hon visar hur värden som effektivitet och kontroll skrevs in i system medan omsorgspersonalens och de äldres behov fick stå tillbaka."},{"title":"Rättighetsbärare och skyldighetsbärare","text":"I människorättslig terminologi innebär denna förskjutning att ansvaret i praktiken flyttas från skyldighetsbäraren till rättighetsbäraren. Formell tillgång till teknik och digitala tjänster är inte tillräcklig. Avgörande är om systemen är utformade så att rättigheter och skyldigheter faktiskt kan utövas. En rättighet som inte kan utövas i praktiken, eller en skyldighet som inte rimligen kan fullgöras, är en systembrist.\n\nRamverket utgår från den distinktion som är grundläggande i internationell människorätt: den mellan rättighetsbärare och skyldighetsbärare. Rättighetsbärare är den enskilde – den som har rätt att utöva sina rättigheter och fullgöra sina skyldigheter. Skyldighetsbärare är det allmänna – staten, kommunen, regionen och i vissa fall privata aktörer med offentliga uppdrag – som ansvarar för att denna rätt kan utövas i praktiken.\n\nNär digitala samhällsfunktioner utformas utan att beakta den enskildes förutsättningar förskjuts ansvaret i praktiken från skyldighetsbäraren till rättighetsbäraren. Det är rättighetsbäraren som förväntas anpassa sig, skaffa teknik, lära sig systemet, hitta stöd. Ramverket synliggör var denna förskjutning sker och pekar tillbaka ansvaret dit det hör hemma."},{"title":"Globala leveranskedjor","text":"Digitala system bär också spår av de villkor under vilka de producerats. AI-modeller som används i offentlig sektor vilar till exempel på globala leveranskedjor vars arbetsförhållanden inte alltid motsvarar de rättighetskrav som systemen förväntas uppfylla. Denna version av ramverket hanterar emellertid inte den globala dimensionen."},{"title":"Ramverkets struktur","text":"Ramverket är uppdelat i tre huvudsektioner som tillsammans belyser hur systemutformning, livsvillkor och stödstrukturer samverkar.\n\n1. Systembarriärer – Strukturella hinder i teknikens utformning, organisation och infrastruktur som skapar ojämlika villkor.\n\n2. Ojämlikhetsfaktorer – Omständigheter som systemen inte är utformade att hantera och som gör att systembarriärer får allvarligare konsekvenser.\n\n3. Bildning, egenmakt och delaktighet – Det allmännas ansvar att upprätthålla förutsättningarna för att den enskilde ska kunna förstå, agera och delta i en digitaliserad välfärdsstat."}];
var CAT_TEXTS = {"1.1": "Bristande digital infrastruktur skapar ojämlika villkor och underminerar det allmännas ansvar för jämlik delaktighet.\n\nDenna kategori omfattar fysisk och teknisk infrastruktur, där brister i utbyggnad, interoperabilitet eller marknadstillgång försvårar för det allmännas ansvar att verka för delaktighet och jämlikhet. Ramverket identifierar de strukturella konsekvenser som uppstår när marknaden inte levererar och det offentliga inte kompenserar.\n\nDigital infrastruktur har också en energi- och resursdimension som påverkar förutsättningarna för samhällsfunktioner. Digg och PTS bedömer att det inom en snar framtid blir aktuellt att räkna på klimat- och miljöeffekter i alla nyetableringar och nya digitala projekt (Digg, PTS 2026).\n\nStöd i lag: Regeringsformen (RF 1 kap. 2 §) fastställer det allmännas ansvar för att främja jämlikhet, vilket förutsätter digital infrastruktur som omfattar alla. Förvaltningslagen (2017:900) 7 § kräver att myndigheter ska vara tillgängliga. Konsumentköplagen (2022:260) 1 kap. 7 § omfattar digitala tjänster, även när konsumenten betalar med sina personuppgifter.\n\nEuropeiska digitala rättigheter och principer: EU-förklaringen om digitala rättigheter och principer för det digitala decenniet (2023) fastställer att alla i EU ska ha tillgång till konnektivitet med hög hastighet och till rimligt pris, inklusive personer med låga inkomster (artikel 3). Den digitala omställningen ska gagna alla och i synnerhet innefatta människor i landsbygdsområden, personer med funktionsnedsättning och marginaliserade grupper (artikel 2c). Marknadsaktörer som drar nytta av den digitala omställningen ska bidra till kostnaderna för kollektiva nyttigheter och offentliga infrastrukturer (artikel 2c). Digitala produkter och tjänster ska utformas med hänsyn till miljöpåverkan och hållbarhet (artikel 23).\n\nPolitikområden: Infrastrukturpolitik, regionalpolitik och konsumentpolitik.", "1.2": "När digitala samhällsfunktioner kräver särskilda tekniska resurser riskerar tillgången att bli ojämlik.\n\nRättsliga, tekniska och administrativa barriärer – som krav på e-legitimation, kontokoppling eller teknisk utrustning – kan begränsa möjligheten att utöva rättigheter och fullgöra skyldigheter. Resultatet hindrar det allmänna från att uppfylla sitt ansvar för delaktighet och jämlikhet.\n\nStöd i lag: Regeringsformen (RF 1 kap. 2 §) fastställer det allmännas ansvar för delaktighet och jämlikhet. Förvaltningslagen (2017:900) 6 § kräver begriplig information, 7 § tillgänglighet och 8 § samverkan mellan myndigheter. Hälso- och sjukvårdslagen (2017:30) 13a kap. 1 § kräver att primärvården ska vara lätt tillgänglig. Diskrimineringslagen (2008:567) 1 kap. 4 § förbjuder indirekt diskriminering, vilket kan uppstå när teknikvillkor missgynnar vissa grupper. Lagen om tillgänglighet till digital offentlig service (2018:1937) ställer krav på att digital offentlig service ska vara möjlig att uppfatta, hantera, begripa och robust. Europaparlamentets och rådets förordning (EU) 2022/2065 om digitala tjänster ställer krav på transparens, ansvarsskyldighet och insyn i algoritmiska system för plattformar som förmedlar samhällsinformation.\n\nEuropeiska digitala rättigheter och principer: Alla bör erbjudas möjlighet att använda en tillgänglig, frivillig, säker och tillförlitlig digital identitet som ger tillgång till ett brett utbud av onlinetjänster (artikel 7a). Utformning, utveckling och användning av tekniska lösningar ska respektera de grundläggande rättigheterna och göra det möjligt att utöva dessa (artikel 2a). Den digitala omställningen ska i synnerhet innefatta äldre, personer med funktionsnedsättning och marginaliserade grupper, ingen ska lämnas utanför (artikel 2b). Digitala offentliga tjänster ska vara sömlösa, säkra och interoperabla, i synnerhet digitala hälso- och sjukvårdstjänster (artikel 7c).\n\nPolitikområden: Förvaltningspolitik och socialpolitik.", "1.3": "När samhällsfunktioner enbart erbjuds digitalt utan att beakta människors olika förutsättningar riskerar det digitala att bli ett filter snarare än en bro.\n\nStöd i lag: Regeringsformen (RF 1 kap. 2 §) fastställer det allmännas ansvar för delaktighet och jämlikhet. Förvaltningslagen (2017:900) 6 § kräver begriplig information, 7 § tillgänglighet och 8 § rätt till biträde när det behövs. Hälso- och sjukvårdslagen (2017:30) 3 kap. 1 § fastställer vård på lika villkor och behovsbaserad prioritering, 13a kap. 1 § kräver att primärvården ska vara lätt tillgänglig. Socialtjänstlagen (2025:400) 8 kap. 10 § fastställer att personer med funktionsnedsättning ska ges möjlighet att delta i samhällets gemenskap. Lagen om tillgänglighet till digital offentlig service (2018:1937) ställer krav på att digital offentlig service ska vara möjlig att uppfatta, hantera, begripa och robust.\n\nEuropeiska digitala rättigheter och principer: Den digitala omställningen bör inte innebära en tillbakagång vad gäller rättigheter, och förklaringen påverkar inte rätten till tillgång till viktiga offentliga samhällsfunktioner offline (ingressen, punkt 3). Alla bör ha tillgång online till viktiga offentliga tjänster i hela EU (artikel 7).\n\nPolitikområden: Förvaltningspolitik och socialpolitik.", "1.4": "Otransparenta tekniska miljöer underminerar den enskildes rätt till förståelse och självbestämmande.\n\nNär digitala system inte tydligt visar vad som händer med information, vem som har tillgång till uppgifter eller vilka konsekvenser ett val kan få, skapas en osäkerhet som det allmänna inte kan lämna åt individen att hantera ensam. Otrygghet är inte bara ett upplevt problem. Det är en systembrist när förutsättningarna för informerat handlande saknas. Bristerna tar sig olika uttryck beroende på arena – från välfärdsteknik och uppkopplade enheter i hemmet till appar som spårar rörelse – men grundproblemet är detsamma: den enskilde saknar insyn i vad som sker med deras uppgifter.\n\nStöd i lag: Regeringsformen (RF 1 kap. 2 §) fastställer det allmännas ansvar för delaktighet och jämlikhet. Regeringsformen (RF 2 kap. 6 §) skyddar mot betydande intrång i den personliga integriteten, om det sker utan samtycke och innebär övervakning eller kartläggning av den enskildes personliga förhållanden. Förvaltningslagen (2017:900) 6 § kräver begriplig information, 7 § tillgänglighet och 10 § fastställer rätten att ta del av uppgifter. Hälso- och sjukvårdslagen (2017:30) 3 kap. 1 § fastställer vård på lika villkor. Diskrimineringslagen (2008:567) 1 kap. 4 § förbjuder diskriminering genom bristande tillgänglighet. Europaparlamentets och rådets förordning (EU) 2022/2065 om digitala tjänster ställer krav på transparens, ansvarsskyldighet och insyn i algoritmiska system för plattformar som förmedlar samhällsinformation.\n\nEuropeiska digitala rättigheter och principer: Tekniska lösningar ska utformas så att de respekterar grundläggande rättigheter och möjliggör utövandet av dessa (artikel 2a). Alla ska ha kontroll över sina egna data (artikel 5). AI bör fungera som verktyg för människor med det slutliga målet att öka välbefinnande (artikel 8). Alla bör skyddas mot risker och negativa konsekvenser för hälsa, säkerhet och grundläggande rättigheter från algoritmiska system (artikel 9). Digitala offentliga tjänster, i synnerhet hälso- och sjukvårdstjänster, ska vara sömlösa, säkra och begripliga (artikel 7c). Alla har rätt till integritet och skydd av sina personuppgifter (artikel 17). Ingen ska utsättas för olaglig övervakning eller spårning online (artikel 18).\n\nPolitikområden: Förvaltningspolitik, rättspolitik, hälso- och sjukvårdspolitik.", "1.5": "Designbeslut som förbiser mångfald i behov och förutsättningar skapar strukturell exkludering.\n\nDigitala gränssnitt, språkval, navigationslogik eller funktioner som utgår från stereotypa antaganden kan systematiskt missgynna vissa grupper. Resultatet är inte bara ett funktionsproblem utan faktisk rättighetsförlust. Grupper utestängs, felbedöms eller osynliggörs – inte för att de saknar digital kompetens, utan för att systemen aldrig var designade med deras behov i åtanke.\n\nStöd i lag: Regeringsformen (RF 1 kap. 2 §) fastställer det allmännas ansvar för delaktighet och jämlikhet. Diskrimineringslagen (2008:567) 1 kap. 4 § fastställer att bristande tillgänglighet kan utgöra diskriminering. FN:s funktionsrättskonvention kräver universell utformning. Förvaltningslagen (2017:900) 6 § kräver begriplig information och 13 § kräver tillgänglighet för den som inte behärskar svenska eller har funktionsnedsättning. Lagen om tillgänglighet till digital offentlig service (2018:1937) ställer krav på att digital offentlig service ska vara möjlig att uppfatta, hantera, begripa och robust. Lagen om vissa produkters och tjänsters tillgänglighet (2023:254) ställer tillgänglighetskrav på digitala produkter och tjänster på marknaden, med sanktionsavgifter vid bristande efterlevnad.\n\nEuropeiska digitala rättigheter och principer: Tekniska lösningar ska utformas så att de respekterar grundläggande rättigheter och möjliggör utövandet av dessa (artikel 2a). Den digitala omställningen ska i synnerhet innefatta äldre, personer med funktionsnedsättning och marginaliserade grupper, och bör främja kulturell och språklig mångfald (artikel 2b). Alla bör skyddas mot risker och negativa konsekvenser för hälsa, säkerhet och grundläggande rättigheter från algoritmiska system (artikel 9).\n\nPolitikområden: Förvaltningspolitik, funktionsrättspolitik och demokratipolitik.", "1.6": "Den aktör som tillhandahåller en digital samhällsfunktion ansvarar för att den enskilde kan förstå och använda lösningen.\n\nTeknisk tillgänglighet är inte detsamma som användbarhet. En tjänst som finns men inte kan förstås, en process som förändras utan att användaren vägleds eller en rättighet som inte kommuniceras är brister i aktörens ansvar – inte brister hos användaren. När det som tidigare sköttes i ett möte med en handläggare ersätts av digital självbetjäning förskjuts utförandeansvaret till den enskilde. Den förskjutningen förutsätter att aktören tar ett motsvarande ansvar för att den enskilde klarar det som förväntas. Detta ansvar är inte en ambition om god service utan en rättslig skyldighet som följer av Förvaltningslagens krav på begriplighet, tillgänglighet och service i mötet med den enskilde.\n\nAnsvaret är odelbart. Det kan inte delegeras till folkbildning, bibliotek, anhöriga eller den enskilde själv. Det gäller även när tjänsten upphandlas från en extern leverantör. Den aktör som inför en digital samhällsfunktion äger hela kedjan – från utformning och lansering till löpande förvaltning och avveckling.\n\nStöd i lag: Förvaltningslagen (2017:900) 6 § kräver att kontakterna med enskilda blir smidiga och enkla, 7 § kräver tillgänglighet, 8 § kräver att myndigheten i rimlig utsträckning underlättar för den enskilde, 13 § kräver att information är begriplig även för den som inte behärskar svenska eller har funktionsnedsättning. Diskrimineringslagen (2008:567) 1 kap. 4 § fastställer att bristande tillgänglighet kan utgöra diskriminering. Lagen om tillgänglighet till digital offentlig service (2018:1937) ställer krav på att digital offentlig service ska vara möjlig att uppfatta, hantera, begripa och robust.\n\nEuropeiska digitala rättigheter och principer: Utformning, utveckling och användning av tekniska lösningar ska respektera de grundläggande rättigheterna och göra det möjligt att utöva dessa (artikel 2a). Digitala offentliga tjänster ska vara sömlösa, säkra och interoperabla (artikel 7c). Ingen ska lämnas utanför den digitala omställningen (artikel 2b).\n\nPolitikområden: Förvaltningspolitik, funktionsrättspolitik, konsumentpolitik.", "1.7": "Många digitala system är inte exkluderande i sig men blir det i mötet med andra system. Problemet är att ingen har ansvar för helheten.\n\nMyndigheter och leverantörer fokuserar ofta på sin del i kedjan, men inte på hur den samverkar med andra eller vilka barriärer det skapar för den enskilde. Resultatet är styrningsluckor där ingen fullt ut ansvarar för delaktighet, tillgång eller alternativ. Den enskilde skickas vidare utan att någon äger övergången.\n\nI praktiken faller ansvaret för övergångarna på aktörer som aldrig fick det. DIK:s biblioteksrapport (2025) visar att var tredje folkbibliotekarie uppskattar att mer än hälften av arbetstiden går åt till samhällsservice som myndighetskontakter och blanketter. Folkbibliotek, folkbildning, civilsamhälle och gatubyråkrater fungerar som samhällslotsar utan formellt uppdrag, resurser eller löpande kompetensutveckling (se vidare 3.1 Bildningens förutsättningar).\n\nStöd i lag: Regeringsformen (RF 1 kap. 2 §) fastställer det allmännas ansvar för delaktighet och jämlikhet. Förvaltningslagen (2017:900) 6 § kräver begriplig information, 7 § tillgänglighet och 8 § att myndigheter samverkar med varandra. Hälso- och sjukvårdslagen (2017:30) 13 kap. 8 § kräver individuell plan när den enskilde behöver insatser från både socialtjänsten och hälso- och sjukvården. Socialtjänstlagen (2025:400) 7 kap. 1–2 §§ kräver att kommunen planerar insatser och ingår samverkansöverenskommelser med regionen. Konsekvensutredningsförordningen (SFS 2024:183) 6–7 §§ kräver analys av kostnader och intäkter men inte av exkluderingseffekter eller tillgänglighetskonsekvenser. Statskontoret ansvarar för metodutveckling (SFS 2024:183) 15 §.\n\nEuropeiska digitala rättigheter och principer: Tekniska lösningar ska utformas så att de respekterar grundläggande rättigheter och möjliggör utövandet av dessa (artikel 2a). Digitala offentliga tjänster ska vara sömlösa, säkra och interoperabla (artikel 7c). Omfattande tillgång till och vidareutnyttjande av information från den offentliga sektorn ska säkerställas (artikel 7b). Marknadsaktörer som drar nytta av den digitala omställningen ska bidra till kostnaderna för kollektiva nyttigheter och offentliga infrastrukturer (artikel 2c).\n\nPolitikområden: Förvaltningspolitik och socialpolitik.", "2.1": "När digitala samhällsfunktioner förutsätter köpkraft blir tillgången villkorad av ekonomiska resurser.\n\nDigitala samhällsfunktioner förutsätter ofta att den enskilde har råd med utrustning, abonnemang, datatrafik och underhåll. Det allmänna kompenserar sällan för dessa kostnader. Ekonomisk utsatthet förvandlas till digital utestängning.\n\nStöd i lag: Regeringsformen (RF 1 kap. 2 §) fastställer det allmännas ansvar för att motverka ekonomisk och social utsatthet. Socialtjänstlagen (2025:400) 12 kap. reglerar rätten till ekonomiskt bistånd för en skälig levnadsnivå.\n\nEuropeiska digitala rättigheter och principer: Alla i EU ska ha tillgång till konnektivitet till rimligt pris, inklusive personer med låga inkomster (artikel 3). Ingen ska lämnas utanför den digitala omställningen (artikel 2b).\n\nPolitikområden: Socialpolitik, fördelningspolitik.", "2.2": "Digitala system som inte utformas för mänsklig mångfald förvandlar funktionsnedsättning till utestängning\n\nKognitiva, sensoriska, motoriska och psykosociala förutsättningar varierar i befolkningen. Det är känt, dokumenterat och rättsligt reglerat. Ändå utformas digitala samhällsfunktioner rutinmässigt utifrån en snäv uppsättning antaganden om hur människor ser, hör, tänker och rör sig. Exkluderingen uppstår inte hos personen utan i systemets designval.\n\nStöd i lag: Regeringsformen (RF 1 kap. 2 §) fastställer det allmännas ansvar för delaktighet och jämlikhet. Diskrimineringslagen (2008:567) 1 kap. 4 § fastställer att bristande tillgänglighet kan utgöra diskriminering. FN:s funktionsrättskonvention kräver universell utformning. Lagen om tillgänglighet till digital offentlig service (2018:1937) ställer krav på att digital offentlig service ska vara möjlig att uppfatta, hantera, begripa och robust. Lagen om vissa produkters och tjänsters tillgänglighet (2023:254) ställer tillgänglighetskrav på ett brett spektrum av digitala produkter och tjänster på marknaden, med sanktionsavgifter vid bristande efterlevnad.\n\nEuropeiska digitala rättigheter och principer: Den digitala omställningen ska i synnerhet innefatta personer med funktionsnedsättning (artikel 2b). Tekniska lösningar ska utformas så att de respekterar grundläggande rättigheter och möjliggör utövandet av dessa (artikel 2a).\n\nPolitikområden: Funktionsrättspolitik och socialpolitik.", "2.3": "Den som lever i en beroendeposition – gentemot en institution, en vårdgivare eller en partner – är särskilt utsatt för att digital tillgång begränsas eller att digital teknik används som kontrollverktyg.\n\nDet allmänna har ansvar för att digitala system varken underlåter att säkerställa tillgång eller möjliggör kontroll.\n\nStöd i lag: Regeringsformen (RF 1 kap. 2 §) fastställer det allmännas ansvar för alla människors frihet och värdighet. LSS (1993:387) 5–6 §§ fastställer rätten till självbestämmande, delaktighet och inflytande över insatsers utformning. Socialtjänstlagen (2025:400) 2 kap. 1 § fastställer att socialtjänsten ska främja jämlika levnadsvillkor och aktivt deltagande. CRPD artiklarna 14 (frihet och säkerhet), 19 (rätten att leva självständigt) och 22 (rätten till privatliv) ger konventionsgrund.\n\nEuropeiska digitala rättigheter och principer: Den digitala omställningen ska i synnerhet innefatta personer med funktionsnedsättning (artikel 2b). Alla har rätt till integritet och skydd av sina personuppgifter (artikel 17). Ingen ska utsättas för olaglig övervakning (artikel 18).\n\nPolitikområden: Funktionsrättspolitik, jämställdhetspolitik, socialpolitik, rättspolitik.", "2.4": "Digitala samhällsfunktioner förutsätter stabilitet, kontinuitet och förmåga att agera i rätt tid. Livskriser bryter alla tre.\n\nSjukdom, sorg, separation, våld eller plötslig ekonomisk förändring påverkar förmågan att hantera komplexa system. Det är förutsägbart och väldokumenterat. Ändå saknar digitala samhällsfunktioner rutinmässigt anpassning för tillfälligt förändrade förutsättningar.\n\nStöd i lag: Regeringsformen (RF 1 kap. 2 §) fastställer det allmännas ansvar för delaktighet och jämlikhet. Förvaltningslagen (2017:900) 6 § fastställer myndigheters skyldighet att hjälpa den enskilde att ta till vara sina intressen, 7 § kräver tillgänglighet. Socialtjänstlagen (2025:400) 2 kap. 4 § fastställer att socialtjänsten ska vara lätt tillgänglig.\n\nEuropeiska digitala rättigheter och principer: Ingen ska lämnas utanför den digitala omställningen, i synnerhet marginaliserade och utsatta människor (artikel 2b). Tekniska lösningar ska möjliggöra utövandet av grundläggande rättigheter (artikel 2a).\n\nPolitikområden: Socialpolitik och förvaltningspolitik.", "2.5": "Barn och unga under 18 år saknar rättshandlingsförmåga och är beroende av vuxna som ombud i digitala system.\n\nDigitala samhällsfunktioner är utformade för myndiga individer med egen identitet, eget konto och egen beslutsrätt. Barn och unga faller strukturellt utanför detta antagande, inte på grund av bristande förmåga utan på grund av hur systemen är konstruerade. Det allmännas ansvar för barns rättigheter och välbefinnande kvarstår oavsett om fungerande vuxet ombud finns, och kvarstår även när barn befinner sig i situationer där sådant ombud saknas eller är den som utgör hotet.\n\nStöd i lag: Regeringsformen (RF 1 kap. 2 §) fastställer det allmännas ansvar för barns uppväxtvillkor. Förvaltningslagen (2017:900) 6 § reglerar parts rättsliga handlingsförmåga. Socialtjänstlagen (2025:400) 18 kap. 1–7 §§ fastställer socialnämndens ansvar för barns uppväxtförhållanden. Patientlagen (2014:821) 3 kap. skapar ett otydligt gränsland för barn 13–18 år. Barnkonventionen (CRC) art. 3 och 12, inkorporerad i svensk rätt genom lag (2018:1197), fastställer barnets bästa och rätt att komma till tals i alla processer som rör dem.\n\nEuropeiska digitala rättigheter och principer: Barn och ungdomar ska kunna göra säkra och välgrundade val i den digitala miljön (punkt 20). Åldersanpassade tjänster ska förbättra barns erfarenheter och välbefinnande (punkt 21). Barn ska skyddas mot olaglig spårning, profilering och riktade åtgärder (punkt 22d).\n\nPolitikområden: Barnsrättspolitik, socialpolitik, förvaltningspolitik samt hälso- och sjukvårdspolitik.\n\nSe även: 2.6.4 (Barn och unga med migrationsstatus) och 2.2 (Funktionsrelaterad exkludering). En person kan befinna sig i flera av dessa kategorier samtidigt. Ett barn med funktionsnedsättning som är asylsökande möter hinder från samtliga.", "2.6": "Det svenska digitala välfärdssystemet är konstruerat kring förutsättningen att den enskilde har en registrerad identitet och ett etablerat administrativt förhållande till det offentliga.\n\nAsylsökande, papperslösa och statslösa faller utanför detta antagande. Deras behov av kontakt med vård, skola och myndigheter kvarstår.\n\nDigital exkludering blir i dessa fall inte enbart ojämlik tillgång till välfärd utan ett hinder mot rättigheter som Sverige är folkrättsligt förpliktat att skydda.\n\nStöd i lag: Regeringsformen (RF 1 kap. 2 §) fastställer det allmännas ansvar för delaktighet och jämlikhet. Socialtjänstlagen (2025:400) 1 kap. 1 § och Hälso- och sjukvårdslagen (2017:30) 3 kap. 1 § gäller som grundläggande värden oberoende av migrationsstatus.\n\nFN:s konvention om ekonomiska, sociala och kulturella rättigheter (ICESCR), artiklarna 12–13, fastslår att rätten till hälsa och utbildning gäller alla på ett lands territorium utan diskriminering – ESK-kommittén har specifikt uppmanat Sverige att säkerställa detta för asylsökande. FN:s konvention om rättigheter för personer med funktionsnedsättning (CRPD), artiklarna 5 och 19, tillämpas utan undantag för migrationsstatus – CRPD-kommittén har uttryckt oro över att migranter med funktionsnedsättning i Sverige systematiskt saknar tillgång till stöd och välfärdstjänster. FN:s barnkonvention (CRC), artiklarna 3, 22 och 37, kräver att barnets bästa beaktas i alla asylprocesser – barnrättskommittén har rekommenderat Sverige att förbjuda förvar av barn på grund av migrationsstatus. 1951 års flyktingkonvention och non-refoulement-principen ger folkrättslig grund åt rädsla för digital spårning.\n\nEuropeiska digitala rättigheter och principer: Ingen ska lämnas utanför den digitala omställningen, i synnerhet marginaliserade och utsatta grupper (artikel 2b). Tekniska lösningar ska möjliggöra utövandet av grundläggande rättigheter (artikel 2a).\n\nPolitikområden: Migrationspolitik, socialpolitik, funktionsrättspolitik, barnrättspolitik.", "2.7": "Digitala plattformar ersätter arbetsgivarfunktioner med algoritmisk styrning och förskjuter ansvaret för arbetsmiljö och social trygghet till den som utför arbetet.\n\nEn app förmedlar, styr och övervakar arbete utan att ta det arbetsgivaransvar som normalt följer med en anställning. Den som utför arbetet klassas som uppdragstagare och bär själv ansvar för arbetsmiljö, sjukfrånvaro, försäkringar och pension. Algoritmer fördelar uppdrag, sätter priser, mäter prestation och kan stänga av den som inte uppfyller systemets kriterier. Modellen sprider sig till offentlig verksamhet när myndigheter och kommuner upphandlar välfärdstjänster från plattformsföretag.\n\nStöd i lag: Socialförsäkringsbalken (2010:110) villkorar rätten till sjukpenning, föräldrapenning och pension mot anställningsförhållanden som plattformsmodellen kringgår. EU:s plattformsdirektiv (2024/2831) introducerar en presumtion om anställningsförhållande i syfte att förbättra arbetsvillkoren för plattformsarbetare.\n\nEuropeiska digitala rättigheter och principer: Alla har rätt till rättvisa, hälsosamma och säkra arbetsvillkor, också i den digitala miljön (punkt 12). Arbetstagare har rätt att inte bli föremål för övervakning eller algoritmisk styrning som undergräver deras värdighet (punkt 13).\n\nPolitikområden: Arbetsmarknadspolitik, arbetsmiljöpolitik, socialpolitik och upphandlingspolitik.\n\nSe även: 2.1 (Ekonomisk utsatthet) och 1.7 (Ansvarsluckor och bristande styrning).", "3.2": "Den enskilde behöver förstå samhället för att kunna delta i det. I en digitaliserad välfärdsstat förutsätter det en kombination av medborgerlig kompetens, informationskunnighet och digital kompetens. Det allmänna säkerställer inte att dessa förutsättningar finns – varken genom systemens utformning eller genom systematiskt stöd.\n\nEU:s ramverk för nyckelkompetenser för livslångt lärande (2018/C 189/01) identifierar medborgerlig kompetens och digital kompetens som två av åtta kompetenser av lika vikt. Unescos ramverk för medie- och informationskunnighet kompletterar dessa med den informationskritiska förmåga som krävs i en miljö där information medieras digitalt. I den enskildes vardag är dessa förmågor inte separerade utan utövas tillsammans i konkreta situationer. Att överklaga ett beslut förutsätter att alla tre samverkar: samhällskunskap för att förstå rättigheten, informationskunnighet för att hitta och värdera underlag, digital kompetens för att navigera systemet. Avsaknad av någon av delarna gör att möjligheten att utöva sin rätt fallerar.\n\nEnligt Ellström (1992) uppstår kompetens i mötet mellan individens resurser och de krav och handlingsutrymmen som omgivningen skapar. I digitala samhällsfunktioner är handlingsutrymmet inte öppet utan inskriberat i teknikens utformning (Akrich 1992). Förståelse är därför inte enbart en egenskap hos individen utan också en fråga om huruvida systemen är utformade så att de går att förstå. Rättigheter som inte kommuniceras kan inte utövas oavsett den enskildes kompetens. Administration som inte är utformad för att navigeras förblir obegriplig oavsett utbildningsnivå.\n\nStöd i lag: Regeringsformen (RF 1 kap. 2 §) fastställer det allmännas ansvar för delaktighet och jämlikhet, RF 2 kap. 1 § skyddar yttrandefrihet och informationsfrihet. Förvaltningslagen (2017:900) 6 § kräver att kontakterna med enskilda blir smidiga och enkla, 13 § kräver att information är begriplig. Europaparlamentets och rådets förordning (EU) 2022/2065 om digitala tjänster ställer krav på transparens i algoritmiska system.\n\nEuropeiska digitala rättigheter och principer: Alla bör ha möjlighet att förvärva grundläggande digitala färdigheter (artikel 4). Alla bör ha tillgång till tillförlitlig, mångsidig och flerspråkig information online (artikel 6a). Alla bör kunna göra välgrundade val och vara medvetna om hur algoritmer kan påverka dem (artikel 6a).\n\nPolitikområden: Demokratipolitik, utbildningspolitik, beredskapspolitik, socialpolitik och förvaltningspolitik.", "3.3": "Det allmänna har ansvar för att den enskilde kan påverka, granska och i efterhand förstå de strukturer och beslut som villkorar rättigheter och skyldigheter.\n\nDigitala system bär inbyggda maktstrukturer. Designval avgör vilka som inkluderas, vilken information som syns och hur beslut fattas. Den enskilde har rätt att förstå dessa val, ifrågasätta dem och delta i att förändra dem. Det förutsätter att beslutsspår bevaras, att offentlig information förblir tillgänglig och att det allmänna skapar förutsättningar för ett aktivt medborgarskap även i digitala miljöer.\n\nStöd i lag: Regeringsformen (RF 1 kap. 1 §) fastställer att all offentlig makt utgår från folket, RF 1 kap. 2 § fastställer det allmännas ansvar för delaktighet och möjlighet till inflytande. Tryckfrihetsförordningen (TF 2 kap.) fastställer offentlighetsprincipen: allmänna handlingar ska vara tillgängliga för var och en. Arkivlagen (1990:782) reglerar bevarande av allmänna handlingar. Förvaltningslagen (2017:900) 6 § kräver begriplig information, 7 § tillgänglighet, 27 § dokumentationsplikt vid handläggning, 32 § motivering av beslut. FN:s konvention om ekonomiska, sociala och kulturella rättigheter (ICESCR) fastslår att rätten till delaktighet gäller alla på ett lands territorium utan diskriminering. FN:s konvention om rättigheter för personer med funktionsnedsättning (CRPD) artikel 4.3 fastställer att konventionsstaterna aktivt ska involvera personer med funktionsnedsättning i beslutsprocesser som rör dem.\n\nEuropeiska digitala rättigheter och principer: Tekniska lösningar ska utformas så att de respekterar grundläggande rättigheter och möjliggör utövandet av dessa (artikel 2a). Alla bör kunna göra välgrundade val och vara medvetna om hur algoritmer kan påverka dem (artikel 6a). Omfattande tillgång till och vidareutnyttjande av information från den offentliga sektorn ska säkerställas (artikel 7b).\n\nPolitikområden: Demokratipolitik, förvaltningspolitik och beredskapspolitik.", "3.1": "Det allmänna har ansvar för att de professioner som bär det vardagsnära bildningsansvaret har förutsättningar att fullgöra det.\n\nBildningsuppdraget tillhör de institutioner och professioner som alltid burit det: bibliotekarier, pedagoger, folkbildare och gatubyråkrater (med flera). Med gatubyråkrater avses offentliganställda med direktkontakt med invånare. Deras professionella praktik behöver idag integrera förmågan att stödja den enskilde i förändrade informationsmiljöer. Detta bildningsansvar är skilt från den enskilda aktörens ansvar för sin tjänst (se 1.6). Det handlar inte om att kompensera för bristande tjänsteutformning utan om att stärka den enskildes självständiga förståelse av samhället.\n\nSystematiskt arbete förutsätter ett gemensamt språk. Unescos ramverk för medie- och informationskunnighet (MIK) beskriver den professionella kompetens som krävs för att stödja den enskildes förmåga att orientera sig i informationsmiljöer. För att MIK ska kunna fungera som professionell kärna behöver den vara organisatoriskt buren och ingå i ett sammanhållet ekosystem av aktörer.\n\nStöd i lag: Regeringsformen (RF 1 kap. 2 §) fastställer det allmännas ansvar för delaktighet och jämlikhet. Bibliotekslagen (2013:801) 2 § fastställer att biblioteken ska verka för det demokratiska samhällets utveckling genom kunskapsförmedling och fri åsiktsbildning, 4 § kräver särskild uppmärksamhet åt personer med funktionsnedsättning och 7 § fastställer att biblioteken ska öka kunskapen om hur informationsteknik kan användas för kunskapsinhämtning, lärande och delaktighet. Skollagen (2010:800) 1 kap. 4–5 §§ fastställer att utbildningen ska främja barns och elevers allsidiga personliga utveckling och förmedla kunskaper och värden.\n\nEuropeiska digitala rättigheter och principer: Utbildning och fortbildning bör anpassas för att säkerställa att alla kan dra nytta av den digitala omställningen (artikel 4). Insatser bör stödjas som gör det möjligt för alla studerande och lärare att förvärva och förmedla de digitala färdigheter och kompetenser som behövs, inbegripet mediekunnighet och kritiskt tänkande, för ett aktivt deltagande i ekonomin, samhällslivet och de demokratiska processerna (artikel 4b).\n\nPolitikområden: Kulturpolitik, utbildningspolitik och folkbildningspolitik.", "1.8": "Den enskildes integritet, trygghet och möjlighet att utöva rättigheter förutsätter att den digitala infrastrukturen fungerar säkert och kontinuerligt.\n\nI en digitaliserad välfärdsstat utgör personlig integritet och informationssäkerhet förutsättningar för andra rättigheter. Leverantörsberoenden, jurisdiktion och nationell handlingsförmåga blir samhällskritiska frågor i och med ökad digitalisering och förändrade geopolitiska förhållanden. Robusthet och kontinuitet är inte enbart tekniska kvalitetsfrågor utan förutsättningar för demokratisk delaktighet, rättssäkerhet och totalförsvar.\n\nStöd i lag: Regeringsformen (RF 1 kap. 2 §) fastställer det allmännas ansvar för delaktighet och jämlikhet och 2 kap. 6 § skyddar mot betydande intrång i den personliga integriteten. Förvaltningslagen (2017:900) 6–7 §§ ställer krav på service och tillgänglighet. Hälso- och sjukvårdslagen (2017:30) 3 kap. 1 § fastställer rätten till god vård på lika villkor. GDPR (förordning (EU) 2016/679) artiklarna 32–34 ställer krav på säkerhet i behandlingen och ger den enskilde rätt att informeras vid personuppgiftsincidenter. Robusthet, kontinuitet och informationssäkerhet regleras genom säkerhetsskyddslagen (2018:585), cybersäkerhetslagen (2025:1506) som genomför NIS2-direktivet (EU 2022/2555), förordningen (2022:524) om statliga myndigheters beredskap, lagen (2006:544) om kommuners och regioners åtgärder inför och vid extraordinära händelser, samt instruktionen för Myndigheten för civilt försvar (förordning 2008:1002). CER-direktivet (EU 2022/2557) om kritiska entiteters motståndskraft bereds (SOU 2024:26).\n\nEuropeiska digitala rättigheter och principer: Tekniska lösningar ska utformas så att de respekterar grundläggande rättigheter och möjliggör utövandet av dessa (artikel 2a). Digitala offentliga tjänster ska vara sömlösa, säkra och interoperabla (artikel 7c). Alla bör ha tillgång till hög konnektivitet, säkerhet och tillgänglig digital teknik (artikel 11).\n\nPolitikområden: Förvaltningspolitik, beredskapspolitik och informationssäkerhetspolitik."};
